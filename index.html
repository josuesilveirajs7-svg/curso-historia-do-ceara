fontes:`<ul>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/regiao/a-origem-do-conflito-entre-crato-e-juazeiro-do-norte-1.1993465','A origem do conflito entre Crato e Juazeiro do Norte')}.</li>
<li>Edianne dos Santos Nobre, ${lnk('https://revhistoria2.webhostusp.sti.usp.br/wp-content/uploads/revistas/169/14 - RH 169 - Edianne dos Santos Nobre.pdf','artigo na Revista de História')} (emancipação em 1911).</li>

aula('t3-a6',{
objetivo:`<p>Ao final, você vai entender como o Padre Cícero se tornou um dos líderes políticos mais poderosos do Ceará, sua aliança com Floro Bartolomeu e o Pacto dos Coronéis de 1911.</p>`,
explicacao:`
<h4>O porquê: o padre que não podia rezar missa, mas mandava na política</h4>
<p>Proibido pela Igreja de exercer plenamente o sacerdócio, Padre Cícero encontrou na política outro caminho de poder. Com milhares de seguidores, controlava votos e se tornou peça central do jogo político cearense.</p>

<h4>Floro Bartolomeu</h4>
<p>Em 1908, chegou a Juazeiro o médico e jornalista baiano <b>Floro Bartolomeu da Costa</b>. Ele ganhou a confiança do padre e se tornou seu braço político e militar. Floro organizou alianças, montou forças armadas e, mais tarde, foi deputado federal <span class="tag forte">forte</span>.</p>

<h4>O Pacto dos Coronéis (1911)</h4>
<p>Em 4 de outubro de 1911, por iniciativa de Padre Cícero e Floro, os principais chefes políticos do Cariri assinaram o chamado <b>Pacto dos Coronéis</b>. Eles se comprometiam a manter a paz entre si, não acolher criminosos uns dos outros e apoiar o governo de Accioly <span class="tag forte">forte</span>. Era uma tentativa de organizar o poder dos coronéis e de proteger a oligarquia contra a política das salvações.</p>

<h4>Prefeito e vice-presidente</h4>
<p>Além de prefeito de Juazeiro, Padre Cícero chegou a ocupar a vice-presidência do estado do Ceará. Seu prestígio entre os romeiros fazia dele um eleitor decisivo <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Padre Cícero é uma figura com muitas faces: para os romeiros, um santo, o “Padim Ciço”; para a Igreja, um padre desobediente; para a política, um chefe que fazia alianças com coronéis e até com cangaceiros. Os historiadores evitam reduzi-lo a uma só dessas faces.</p></div>

<div class="box hoje"><p>Em 2015, o Vaticano deu passos para a reconciliação da Igreja com a memória do Padre Cícero, e em 2022 foi aberto o processo para sua beatificação. A estátua do Horto, em Juazeiro, com 27 metros, é uma das maiores do Brasil.</p></div>
`,

explicacao:`
<h4>O porquê: o novo governador contra o velho sistema</h4>
<p>Franco Rabelo chegou ao governo em 1912 com o apoio da oposição urbana e do governo federal. Mas o interior continuava nas mãos dos coronéis ligados a Accioly. O choque era inevitável.</p>

<h4>Rabelo contra os coronéis</h4>
<p>Franco Rabelo recusou-se a negociar com a antiga oligarquia e com os coronéis do Cariri e tentou desmontar sua rede de poder. Rompeu o Pacto dos Coronéis e, em 1913, destituiu o Padre Cícero de seus cargos <span class="tag forte">forte</span>.</p>

<h4>A virada no Rio</h4>
<p>Ao mesmo tempo, no Rio de Janeiro, o equilíbrio mudou. O senador gaúcho Pinheiro Machado, muito influente no governo Hermes da Fonseca, apoiava as oligarquias tradicionais e passou a articular a derrubada de Rabelo, com Floro Bartolomeu como peça-chave <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>A Sedição de Juazeiro não foi uma revolta “popular” contra o governo, nem uma guerra religiosa pura. Foi uma <b>disputa entre grupos de elite</b>, articulada com o governo federal, que usou a força dos romeiros e jagunços de Juazeiro. Mas, para muitos dos combatentes, ela também tinha sentido religioso: defender o “Padim”.</p></div>

<div class="box cuidado"><p>Algumas fontes descrevem Franco Rabelo como “interventor” nomeado pelo governo federal. Ele foi, na verdade, eleito presidente do estado em 1912, embora com apoio federal. Atenção aos termos.</p></div>
`,

explicacao:`
<h4>O porquê: uma cidade santa em armas</h4>
<p>Entre 15 de dezembro de 1913 e 15 de março de 1914, Juazeiro passou de cidade sitiada a exército vitorioso.</p>

<h4>O valado</h4>
<p>Quando o governo de Rabelo mandou tropas contra Juazeiro, os moradores e romeiros cavaram em volta da cidade um grande fosso com muralha de terra, o <b>valado</b>, que serviu de defesa. A construção mobilizou milhares de pessoas, muitas convencidas de que lutavam numa guerra santa <span class="tag forte">forte</span>.</p>

<h4>A vitória e a marcha</h4>
<p>As tropas do governo não conseguiram tomar Juazeiro. Os combatentes de Juazeiro, sob o comando de Floro Bartolomeu, passaram ao ataque, ocuparam o Crato e outras cidades e marcharam em direção a Fortaleza. Houve saques e violência pelo caminho <span class="tag forte">forte</span>.</p>

<h4>A intervenção federal</h4>
<p>Em março de 1914, o governo federal decretou intervenção no Ceará e afastou Franco Rabelo. O grupo aliado a Accioly voltou ao poder, e Padre Cícero recuperou seus cargos <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>A Sedição mostrou que, na Primeira República, o poder federal podia derrubar governadores, e que os coronéis do interior, com seus exércitos particulares, tinham força para mudar o governo do estado.</p></div>

<div class="box hoje"><p>Vestígios do valado ainda podem ser identificados em Juazeiro do Norte, e a memória da “guerra de 1914” faz parte das narrativas dos romeiros e dos cordelistas.</p></div>
`,

aula('t3-a9',{
objetivo:`<p>Ao final, você vai avaliar as consequências da Sedição de Juazeiro e as diferentes interpretações que os historiadores deram a ela.</p>`,
explicacao:`
<h4>O porquê: o que 1914 significou</h4>
<p>A Sedição de Juazeiro foi interpretada de muitas formas: como fanatismo religioso, como golpe de coronéis, como resistência sertaneja, como episódio da política nacional. Cada leitura revela algo e esconde algo.</p>

<h4>Consequências</h4>
<ul>
<li>Volta do grupo aliado a Accioly ao poder estadual.</li>
<li>Fortalecimento do Padre Cícero e de Floro Bartolomeu, que se tornou deputado federal.</li>
<li>Derrota da oposição urbana de Fortaleza, que tinha derrubado Accioly em 1912.</li>
<li>Consolidação da imagem de Juazeiro como polo de poder no sertão.</li>
</ul>

<h4>As interpretações</h4>
<ul>
<li><b>Fanatismo</b>: a visão das elites da época e de parte da imprensa, que via os romeiros como “fanáticos”. Hoje é considerada preconceituosa.</li>
<li><b>Coronelismo</b>: a sedição como exemplo do poder dos coronéis aliados ao governo federal.</li>
<li><b>Religião e política</b>: a visão de Della Cava, que mostra Juazeiro integrado à política nacional, e não isolado num “fanatismo” arcaico.</li>
<li><b>Litoral contra sertão</b>: o choque entre a Fortaleza urbana e o interior.</li>
</ul>

<div class="box conceito"><p>É útil comparar Juazeiro com <b>Canudos</b>, na Bahia (1896–1897). Antônio Conselheiro desafiou a ordem e foi esmagado pelo Exército. Padre Cícero, ao contrário, aliou-se às elites e ao governo e saiu vitorioso. Dois líderes religiosos populares, dois destinos opostos.</p></div>

<div class="box cuidado"><p>Chamar os romeiros de “fanáticos” é repetir o olhar das elites de 1914. A fé dos sertanejos tinha lógica própria, ligada à vida difícil, à seca e à busca de proteção.</p></div>
`,

aula('t3-a10',{
objetivo:`<p>Ao final, você vai saber o que é coronelismo, segundo Victor Nunes Leal, e diferenciá-lo de mandonismo e clientelismo.</p>`,
explicacao:`
<h4>O porquê: dar nome ao sistema</h4>
<p>“Coronel” virou sinônimo de chefe político do interior. Mas coronelismo é mais que a existência de chefes locais: é um sistema de trocas entre o local, o estadual e o federal.</p>

<h4>A definição de Victor Nunes Leal</h4>
<p>No livro <i>Coronelismo, Enxada e Voto</i> (1949), Victor Nunes Leal definiu o <span class="g" data-t="coronelismo">coronelismo</span> como um <b>compromisso</b> entre o poder público, cada vez mais forte, e os chefes locais, proprietários de terra, cujo poder privado estava em declínio. O coronel entregava votos ao governo; o governo dava ao coronel cargos, verbas e liberdade de mando no município <span class="tag consenso">consenso</span>.</p>

<h4>Três conceitos</h4>
<div class="scroll"><table class="tbl">
<tr><th>Conceito</th><th>O que é</th><th>Época</th></tr>
<tr><td>Mandonismo</td><td>Poder pessoal de um chefe local sobre a população</td><td>Desde a colônia</td></tr>
<tr><td>Clientelismo</td><td>Troca de favores entre patrão e clientes</td><td>Desde a colônia até hoje</td></tr>
<tr><td>Coronelismo</td><td>Sistema de compromisso entre coronéis e governos estadual e federal</td><td>Sobretudo Primeira República (1889–1930)</td></tr>
</table></div>
<p class="caption">Distinção proposta por José Murilo de Carvalho.</p>

<div class="box conceito"><p>A base do poder do coronel era a terra e a dependência dos trabalhadores rurais. Num sertão de pobres sem terra, quem controlava a terra controlava quem morava nela, e quem trabalhava nela votava como o patrão mandava. Daí a expressão “enxada e voto”.</p></div>

<div class="box hoje"><p>O termo “coronel” ainda é usado no Ceará para chefes políticos tradicionais. Mas os historiadores alertam: o coronelismo como sistema acabou com a Revolução de 1930; o que persiste é o mandonismo e o clientelismo, em novas formas.</p></div>
`,

aula('t3-a11',{
objetivo:`<p>Ao final, você vai entender o Pacto dos Coronéis de 1911 como exemplo concreto do coronelismo no Ceará.</p>`,
explicacao:`
<h4>O porquê: um contrato entre chefes</h4>
<p>O Pacto dos Coronéis é um documento raro: um acordo escrito entre chefes políticos, que mostra como eles mesmos entendiam suas regras.</p>

<h4>O pacto</h4>
<p>Em 4 de outubro de 1911, sob a liderança do Padre Cícero e com a articulação de Floro Bartolomeu, chefes políticos dos municípios do Cariri se reuniram em Juazeiro e assinaram um pacto <span class="tag forte">forte</span>. Entre os compromissos:</p>
<ul>
<li>manter a paz e a amizade entre os chefes;</li>
<li>não tentar derrubar uns aos outros nos municípios;</li>
<li>não dar abrigo a criminosos fugidos de outro município;</li>
<li>apoiar o governo de Accioly.</li>
</ul>

<div class="box conceito"><p>O pacto revela duas coisas: a <b>violência</b> entre os coronéis era tão comum que precisou de um acordo para ser contida; e a <b>lealdade ao governo estadual</b> era a moeda que garantia a cada um o domínio do seu município.</p></div>

<h4>O fim do pacto</h4>
<p>O pacto foi rompido com a chegada de Franco Rabelo, que não quis negociar com os coronéis. A resposta veio na Sedição de 1914, que você estudou no módulo 3.</p>

<div class="box hoje"><p>O texto do Pacto dos Coronéis é citado em livros didáticos e é uma boa fonte para exercícios de análise documental.</p></div>
`,

aula('t3-a12',{
objetivo:`<p>Ao final, você vai entender como funcionava o coronelismo no dia a dia: o controle do voto, a troca de favores, a justiça privada e a violência.</p>`,
explicacao:`
<h4>O porquê: o sistema visto de perto</h4>
<p>Para o morador do sertão, o coronel era ao mesmo tempo patrão, protetor, juiz e ameaça.</p>

<h4>O voto</h4>
<p>O voto não era secreto. O eleitor recebia a cédula preenchida das mãos do cabo eleitoral e a depositava na urna sob vigilância. Quem votasse contra podia perder o emprego, a terra onde morava ou a proteção do patrão. Nas eleições, eleitores eram levados em grupos, alimentados e vigiados: o chamado “curral eleitoral” <span class="tag consenso">consenso</span>.</p>

<h4>Os favores</h4>
<p>Em troca, o coronel oferecia proteção: emprego, remédio, um lugar para morar, ajuda na seca, uma vaga na escola, a liberdade de um parente preso, a dispensa do recrutamento. Para os pobres, era muitas vezes a única rede de segurança.</p>

<h4>A justiça privada</h4>
<p>Juízes, delegados e promotores dependiam do coronel para seus cargos. Assim, a justiça funcionava a favor dos aliados e contra os adversários: “para os amigos, tudo; para os inimigos, a lei”, como diz uma frase célebre atribuída a políticos da época.</p>

<div class="box conceito"><p>O coronelismo funcionava porque havia <b>dependência</b>: sem terra, sem renda e sem Estado, o pobre dependia do coronel. Por isso, mudanças como o voto secreto (1932), a Justiça Eleitoral (1932) e, muito depois, políticas sociais universais enfraqueceram esse poder.</p></div>

<div class="box hoje"><p>A expressão “curral eleitoral” continua em uso para designar áreas onde um político tem votos garantidos por relações de dependência.</p></div>
`,
quiz:[
 {q:'O que era o “curral eleitoral”?',

  e:['Só a partir de 1932.','Correto.','Não.','Não.']},
 {q:'O que a frase “para os amigos, tudo; para os inimigos, a lei” revela?',
  o:['Justiça imparcial','Justiça usada a favor dos aliados e contra os adversários','Ausência de leis','Que não havia inimigos'],c:1,
  e:['Não.','Correto.','Havia leis.','Havia.']},
 {q:'O que enfraqueceu o coronelismo?',
  o:['O voto secreto e a Justiça Eleitoral de 1932, entre outras mudanças','A seca','O cangaço','A abolição'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Por que o coronelismo funcionava?',
  o:['Porque os pobres gostavam dos coronéis','Por causa da dependência: sem terra, renda e Estado, o pobre dependia do coronel','Porque era lei','Por acaso'],c:1,

],

aula('t3-a13',{
objetivo:`<p>Ao final, você vai entender o que foi o cangaço, quando existiu, como funcionavam os bandos e qual foi sua relação com o Ceará.</p>`,
explicacao:`
<h4>O porquê: o sertão em armas</h4>
<p>O cangaço é uma das imagens mais fortes do Nordeste: chapéus de couro em meia-lua, cartucheiras, punhais. Por trás da imagem, há uma história de violência, alianças e sobrevivência.</p>

<h4>O que foi</h4>
<p>O <span class="g" data-t="cangaco">cangaço</span> foi o banditismo armado do sertão nordestino, com auge entre o fim do século XIX e 1940. Os cangaceiros andavam em bandos móveis, atacavam fazendas, vilas e cidades, extorquiam dinheiro, sequestravam, matavam. Também faziam alianças com coronéis, que lhes davam abrigo e armas em troca de serviços ou de proteção para suas terras <span class="tag consenso">consenso</span>.</p>

<h4>As causas</h4>
<ul>
<li>Um Estado fraco no sertão, com polícia pouco presente.</li>
<li>A violência como forma de resolver conflitos e vinganças de família.</li>
<li>A pobreza, a concentração de terras e as secas.</li>
<li>A existência de coronéis dispostos a proteger e usar os bandos.</li>
</ul>

<h4>O Ceará e o cangaço</h4>
<p>O Ceará foi menos atacado por grandes bandos do que Pernambuco, Paraíba e Alagoas. Para Lampião, o Ceará, e especialmente o Cariri, funcionou como um refúgio relativamente seguro, graças às relações com chefes locais <span class="tag forte">forte</span>. Muitos parentes de Lampião foram morar em Juazeiro do Norte.</p>

<div class="box cuidado"><p>O cangaço é muitas vezes romantizado em filmes, músicas e moda. A estética é fascinante, mas a violência foi real: estupros, assassinatos, torturas e saques atingiram sobretudo os próprios sertanejos pobres. Romantizar sem lembrar as vítimas é contar a história pela metade.</p></div>

<div class="box hoje"><p>A estética do cangaço inspira o artesanato de couro, a moda, a música (o xaxado) e o turismo no sertão. O debate sobre heroísmo e violência continua vivo.</p></div>
`,

aula('t3-a14',{
objetivo:`<p>Ao final, você vai conhecer a passagem de Lampião por Juazeiro do Norte em março de 1926, a patente de capitão e o contexto da Coluna Prestes.</p>`,
explicacao:`
<h4>O porquê: o rei do cangaço na cidade santa</h4>
<p>Em março de 1926, Lampião entrou em Juazeiro e se encontrou com Padre Cícero. Foi a única vez que os dois maiores ícones do sertão se viram. O motivo foi a Coluna Prestes.</p>

<h4>A Coluna Prestes</h4>
<p>A Coluna Prestes, também chamada Coluna Miguel Costa-Prestes, era um movimento de militares rebeldes que percorreu o interior do Brasil entre 1924 e 1927, com cerca de 1.500 homens, contra o governo de Artur Bernardes. Em janeiro de 1926, a Coluna entrou no Ceará pelos Inhamuns <span class="tag forte">forte</span>.</p>

<h4>Os Batalhões Patrióticos</h4>
<p>Para combater a Coluna, o governo federal autorizou a formação de <b>Batalhões Patrióticos</b>, milícias de civis. Floro Bartolomeu, então deputado federal, organizou em Juazeiro uma tropa com mais de mil homens <span class="tag forte">forte</span>. E convidou Lampião a se juntar a ela.</p>

<h4>A chegada de Lampião</h4>
<p>Em 4 de março de 1926, Lampião e cerca de cinquenta cangaceiros chegaram ao Cariri e entraram em Juazeiro. Na ausência de Floro, foi o Padre Cícero quem recebeu o cangaceiro. Um funcionário federal do Ministério da Agricultura, Pedro de Albuquerque Uchôa, assinou um papel concedendo a Lampião a <b>patente de capitão</b> dos Batalhões Patrióticos. Lampião recebeu armas e munições <span class="tag forte">forte</span>.</p>
<p>Durante a estadia, Lampião deu uma entrevista ao médico Otacílio Macêdo, publicada no jornal <i>O Ceará</i> em 17 de março de 1926, um documento raro em que o cangaceiro fala de si <span class="tag forte">forte</span>.</p>

<h4>O que veio depois</h4>
<p>A patente não tinha validade legal. Os cangaceiros não chegaram a perseguir a Coluna, que já seguia para a Bahia. Ao voltar a Pernambuco, Lampião foi perseguido pela polícia como antes. Mas passou a se apresentar como “Capitão Virgulino” pelo resto da vida <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>O episódio mostra como o Estado, quando lhe convinha, se aliava a cangaceiros. A fronteira entre ordem e crime, no sertão dos anos 1920, era muito tênue.</p></div>
`,

  e:['Não foi o motivo principal.','Correto.','Não.','Não.']},

  o:['Uma ferrovia','Um movimento de militares rebeldes que percorreu o interior do Brasil (1924–1927)','Um grupo de cangaceiros','Uma romaria'],c:1,

aula('t3-a15',{
objetivo:`<p>Ao final, você vai conhecer as principais interpretações do cangaço e saber discutir se os cangaceiros foram heróis, bandidos ou produtos do sertão.</p>`,
explicacao:`
<h4>O porquê: como julgar o cangaço</h4>
<p>Lampião é herói para alguns, monstro para outros. Os historiadores propuseram várias formas de entender o cangaço, cada uma com pontos fortes e fracos.</p>

<h4>As interpretações</h4>
<ul>
<li><b>Bandido social</b>: Eric Hobsbawm propôs o conceito de <span class="g" data-t="banditismosocial">banditismo social</span> para bandidos rurais vistos pelo povo como vingadores de injustiças. Muitos aplicaram o conceito ao cangaço <span class="tag interpretacao">interpretação</span>.</li>
<li><b>Escudo ético</b>: Frederico Pernambucano de Mello, em <i>Guerreiros do Sol</i>, argumentou que a vingança era muitas vezes um “escudo ético”, uma justificativa para uma vida de crime que dava lucro e prestígio <span class="tag interpretacao">interpretação</span>.</li>
<li><b>Produto do sistema</b>: o cangaço como consequência do coronelismo, da pobreza e da ausência do Estado, e não como revolta contra eles.</li>
</ul>

<div class="box conceito"><p>A maioria dos estudiosos hoje concorda que os cangaceiros não eram revolucionários: não queriam mudar a estrutura social, faziam alianças com coronéis e vitimavam pobres. Mas também reconhece que surgiram de um sertão marcado por injustiça e violência, e que o povo criou em torno deles mitos de coragem e resistência <span class="tag forte">forte</span>.</p></div>

<h4>O fim</h4>
<p>Lampião, Maria Bonita e parte do bando foram mortos em 1938, em Angicos, Sergipe, por uma tropa policial. Suas cabeças foram cortadas e exibidas. Com a morte de Corisco, em 1940, o cangaço chegou ao fim. O Estado Novo de Vargas, com mais estradas, comunicações e polícia, tornou impossível a vida dos bandos <span class="tag consenso">consenso</span>.</p>

<div class="box hoje"><p>O cordel, a xilogravura, o cinema (como <i>Deus e o Diabo na Terra do Sol</i>, de Glauber Rocha) e a música transformaram o cangaço num dos grandes temas da cultura brasileira.</p></div>
`,

  o:['Eric Hobsbawm','Victor Nunes Leal','Capistrano de Abreu','Della Cava'],c:0,

 {q:'Os cangaceiros eram revolucionários que queriam mudar a estrutura social?',
  o:['Sim','Não; faziam alianças com coronéis e vitimavam pobres, segundo a maioria dos estudiosos','Sim, eram comunistas','Sim, defendiam a reforma agrária'],c:1,
  e:['Não.','Correto.','Não.','Não.']},

  o:['Juazeiro do Norte','Angicos, Sergipe, em 1938','Fortaleza','Recife'],c:1,

aula('t3-a16',{
objetivo:`<p>Ao final, você vai conhecer o beato José Lourenço, sua relação com o Padre Cícero e a formação da comunidade do Caldeirão.</p>`,
explicacao:`
<h4>O porquê: uma comunidade diferente</h4>
<p>No sertão dos coronéis, uma comunidade em que todos trabalhavam juntos e dividiam o que produziam chamava atenção. Para os pobres, era esperança; para as elites, ameaça.</p>

<h4>José Lourenço</h4>
<p>José Lourenço Gomes da Silva era um <span class="g" data-t="beato">beato</span> de origem paraibana, devoto do Padre Cícero. Antes do Caldeirão, liderou uma comunidade num sítio chamado Baixa Dantas. Ali aconteceu o famoso episódio do <b>boi Mansinho</b>, um boi dado ao padre que os seguidores passaram a tratar com reverência. O boi foi morto e José Lourenço chegou a ser preso por ordem de Floro Bartolomeu, sendo libertado por influência do Padre Cícero dias depois <span class="tag forte">forte</span>.</p>

<h4>O Caldeirão (1926)</h4>
<p>Em 1926, Padre Cícero cedeu a José Lourenço um sítio chamado Caldeirão, no sopé da Serra do Araripe, no município do Crato. Para lá foram centenas e depois milhares de romeiros e sertanejos pobres. Formou-se a comunidade de <b>Santa Cruz do Deserto</b> <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>O Caldeirão é muitas vezes chamado de movimento <span class="g" data-t="messianismo">messiânico</span>. Alguns estudiosos preferem falar em <b>comunidade sociorreligiosa</b> ou <b>comunidade intencional</b>, para destacar a organização do trabalho e da vida, e não só a dimensão religiosa.</p></div>

<div class="box hoje"><p>O Caldeirão está no Crato e é lugar de memória e de visitação. Em 2022, a área se tornou parque estadual, segundo informações divulgadas na época.</p></div>
`,

aula('t3-a17',{
objetivo:`<p>Ao final, você vai entender como era a vida no Caldeirão: o trabalho coletivo, a divisão da produção, a religiosidade e a acolhida aos flagelados da seca.</p>`,
explicacao:`
<h4>O porquê: um modelo que assustava</h4>
<p>O que mais incomodou as elites não foi a reza, mas o trabalho: no Caldeirão, a produção era dividida e todos tinham comida.</p>

<h4>Trabalho e fé</h4>
<p>A comunidade tinha como características principais o trabalho e a fé. Os moradores trabalhavam coletivamente na agricultura, criação de animais e artesanato, construíram casas, açudes e engenhos. O que era produzido era repartido, e o excedente vendido para comprar o que não se produzia, como remédios e querosene <span class="tag forte">forte</span>.</p>

<h4>Acolhida na seca de 1932</h4>
<p>Na seca de 1932, enquanto o governo prendia retirantes em campos de concentração, o Caldeirão acolheu muitos flagelados, que encontraram ali comida e trabalho. Isso aumentou a fama da comunidade e a preocupação das autoridades e dos fazendeiros, que perdiam mão de obra <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>O Caldeirão incomodava por três razões: atraía trabalhadores que deixavam as fazendas; organizava a produção de forma coletiva, fora do controle dos coronéis; e escapava da autoridade da Igreja oficial. Para as elites dos anos 1930, isso parecia “comunismo”.</p></div>

<div class="box conexao"><p>Compare o Caldeirão, que acolhia flagelados, com os campos de concentração de 1932 (módulo 7). As duas respostas à mesma seca revelam visões opostas sobre os pobres.</p></div>
`,

aula('t3-a18',{
objetivo:`<p>Ao final, você vai conhecer a destruição do Caldeirão em 1936, o massacre de 1937 e a luta pela memória do episódio.</p>`,
explicacao:`
<h4>O porquê: um massacre esquecido</h4>
<p>O massacre do Caldeirão é chamado por alguns de “o massacre que o Brasil não viu”. Durante décadas, foi pouco lembrado. Hoje é objeto de pesquisa e de luta por memória e reparação.</p>

<h4>A morte do protetor</h4>
<p>Padre Cícero morreu em 1934. As terras do Caldeirão pertenciam a ele e passaram, por testamento, à ordem dos salesianos, que reivindicaram a propriedade. Sem o protetor, a comunidade ficou vulnerável <span class="tag forte">forte</span>.</p>

<h4>A destruição (1936)</h4>
<p>Em setembro de 1936, forças policiais invadiram o Caldeirão, expulsaram os moradores e destruíram casas e plantações. As datas citadas pelas fontes variam entre 9 e 11 de setembro. A acusação: fanatismo e comunismo, num momento em que o governo Vargas perseguia comunistas depois do levante de 1935 <span class="tag forte">forte</span>.</p>

<h4>O massacre (1937)</h4>
<p>Parte dos moradores se refugiou na Mata dos Cavalos, na Serra do Araripe. Em maio de 1937, depois de um confronto em que morreram o capitão da polícia José Bezerra, seu filho e soldados, as forças do governo atacaram os refugiados com metralhadoras e granadas. Morreram o beato Severino Tavares e dezenas, talvez centenas, de camponeses <span class="tag forte">forte</span>. O número exato de mortos é desconhecido e disputado.</p>

<div class="box cuidado"><p>É comum ler que o Caldeirão sofreu o “primeiro bombardeio aéreo do Brasil”. A participação de aviões é debatida: alguns pesquisadores afirmam que houve sobrevoos e uso de granadas e metralhadoras, mas não um bombardeio aéreo no sentido estrito <span class="tag hipotese">debatido</span>. Também os números de mortos variam muito entre as fontes.</p></div>

<h4>A memória</h4>
<p>Por décadas, o massacre foi silenciado. Pesquisadores falam em “memória amordaçada”. Desde os anos 1980, o documentário de Rosemberg Cariry, livros, peças de teatro e movimentos sociais trouxeram o tema de volta. Houve uma ação civil pública pedindo indenização aos herdeiros das vítimas, que foi extinta sem julgamento do mérito <span class="tag forte">forte</span>.</p>

<div class="box hoje"><p>O Caldeirão é lembrado todos os anos por romeiros, movimentos sociais e pesquisadores, que refazem os caminhos do beato. José Lourenço morreu em 1946, longe do Caldeirão.</p></div>
`,

aula('t3-a19',{
objetivo:`<p>Ao final, você vai conhecer a seca de 1915, o primeiro campo de concentração do Alagadiço e o romance O Quinze, de Rachel de Queiroz.</p>`,
explicacao:`
<h4>O porquê: a seca que virou romance</h4>
<p>A seca de 1915 é lembrada por um livro: <i>O Quinze</i>, que Rachel de Queiroz publicou em 1930, aos vinte anos. O romance mostra a retirada de uma família sertaneja e o “campo de concentração” de Fortaleza.</p>

<h4>A seca e o medo de 1877</h4>
<p>Quando a seca de 1915 começou, as elites de Fortaleza lembraram de 1877: a cidade invadida por retirantes, a varíola, os saques. Dessa vez, decidiram impedir que os famintos ocupassem as ruas <span class="tag forte">forte</span>.</p>

<h4>O Campo do Alagadiço</h4>
<p>O governo criou, no Alagadiço, área do atual bairro São Gerardo, em Fortaleza, um espaço cercado para onde eram levados os retirantes que chegavam à capital. Segundo a historiadora Kênia Sousa Rios, foi em 1915 que o governo usou pela primeira vez o termo <span class="g" data-t="campoconcentracao">“campo de concentração”</span> para esse tipo de lugar <span class="tag forte">forte</span>. O campo foi desmontado em 1916, com o fim da seca.</p>

<h4>O Quinze</h4>
<p>No romance, Chico Bento e sua família deixam Quixadá a pé, enfrentam fome e morte no caminho e chegam ao campo de concentração. A professora Conceição, personagem central, visita o campo e vê a miséria dos flagelados. O livro é um dos marcos do chamado “romance de 30”, que levou a realidade do Nordeste à literatura brasileira <span class="tag consenso">consenso</span>.</p>

<div class="box conceito"><p>O nome “campo de concentração” assusta hoje por causa do nazismo, que veio depois. Os campos do Ceará não eram campos de extermínio. Mas partilhavam a lógica de <b>isolar e controlar</b> pessoas vistas como indesejáveis, e muitos morreram neles de fome e doença.</p></div>

<div class="box hoje"><p>Rachel de Queiroz foi a primeira mulher eleita para a Academia Brasileira de Letras, em 1977. <i>O Quinze</i> é leitura obrigatória em muitas escolas e vestibulares.</p></div>
`,

aula('t3-a20',{
objetivo:`<p>Ao final, você vai entender como funcionavam os campos de concentração da seca: quem os criou, quem era levado para lá, como era a vida dentro deles.</p>`,
explicacao:`
<h4>O porquê: o curral dos flagelados</h4>
<p>A historiadora Kênia Sousa Rios chamou os campos de “currais do governo”. A expressão diz muito: os retirantes eram tratados como gado a ser contido.</p>

<h4>Como funcionavam</h4>
<ul>
<li>Ficavam perto das <b>estações de trem</b>, onde os retirantes desembarcavam a caminho de Fortaleza.</li>
<li>Eram <b>cercados</b> e vigiados por soldados; quem estava dentro não podia sair livremente.</li>
<li>Havia distribuição de <b>comida</b> (ração) em troca de <b>trabalho</b> em obras públicas, muitas vezes sem pagamento.</li>
<li>As condições sanitárias eram péssimas, com surtos de doenças e muitas mortes.</li>
</ul>

<h4>Por que existiram</h4>
<p>Os campos respondiam a um medo das elites urbanas: o de ver Fortaleza tomada por multidões famintas, como em 1877. Também atendiam a outro interesse: manter a mão de obra perto do sertão, para que voltasse ao trabalho nas fazendas quando a chuva viesse <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Os campos combinavam <b>assistência</b> e <b>controle</b>: davam comida, mas tiravam a liberdade. A mesma lógica das frentes de trabalho de 1877 e dos abarracamentos, agora levada ao extremo.</p></div>

<div class="box cuidado"><p>Por muito tempo, os campos foram omitidos da história oficial do Ceará. Kênia Sousa Rios foi uma das pesquisadoras pioneiras a estudá-los. Hoje há consenso de que foram um dos episódios mais tristes da história do estado.</p></div>
`,

 {q:'O que os retirantes recebiam nos campos?',
  o:['Salário e casa','Ração em troca de trabalho, muitas vezes sem pagamento','Terra','Nada'],c:1,
  e:['Não.','Correto.','Não.','Recebiam ração.']},
 {q:'Que medo das elites os campos respondiam?',

 {q:'Que outro interesse os campos atendiam?',
  o:['Manter a mão de obra perto do sertão para voltar às fazendas','Exportar retirantes','Criar indústrias','Formar soldados'],c:0,

fontes:`<ul>
<li>Kênia Sousa Rios, ${lnk('https://revistas.uneb.br/index.php/canudos/article/download/6387/4043/17131','O curral dos flagelados')}.</li>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/opiniao/colunistas/pa-damasceno/os-monumentos-historicos-e-a-memoria-das-tragedias-humanitarias-no-ceara-1.3375235','Os monumentos históricos e a memória das tragédias humanitárias no Ceará')}.</li>
<li>Vermelho, ${lnk('https://vermelho.org.br/2019/07/21/a-tragica-historia-dos-campos-de-concentracao-do-ceara/','A trágica história dos campos de concentração do Ceará')} (2019).</li>

aula('t3-a21',{
objetivo:`<p>Ao final, você vai conhecer os sete campos de concentração de 1932, o Campo do Patu em Senador Pompeu e a luta pelo seu tombamento e pela memória.</p>`,
explicacao:`
<h4>O porquê: sete campos</h4>
<p>Na seca de 1932, o Campo do Alagadiço não seria suficiente. O governo decidiu montar uma rede de campos no interior, ao longo das ferrovias.</p>

<h4>Os sete campos</h4>
<p>Em abril de 1932, foram erguidos sete campos de concentração às margens das ferrovias <span class="tag forte">forte</span>:</p>
<ul>
<li><b>Ipu</b>, no norte;</li>
<li><b>Quixeramobim</b> e <b>Senador Pompeu</b> (o Patu), no sertão central;</li>
<li><b>Cariús</b>, no centro-sul;</li>
<li><b>Crato</b> (o Buriti), no Cariri;</li>
<li>dois em <b>Fortaleza</b>: o do Urubu e o do Otávio Bonfim.</li>
</ul>
<p>Planejados para cerca de 3 mil pessoas cada, alguns receberam muito mais. Estatísticas oficiais de poucas semanas depois registravam mais de 16 mil pessoas em Senador Pompeu, e o Patu chegou a abrigar até 18 mil retirantes <span class="tag forte">forte</span>.</p>

<h4>O fim</h4>
<p>Os campos funcionaram até 1933, quando as chuvas voltaram e os retirantes regressaram às suas terras, com passagens de trem pagas pelo governo. Não se encontraram registros oficiais detalhados sobre sua desativação <span class="tag forte">forte</span>.</p>

<h4>O Patu e a memória</h4>
<p>O <b>Campo do Patu</b>, em Senador Pompeu, é o único que ainda guarda ruínas da época, como casarões que abrigaram até 300 pessoas. Graças à articulação entre pesquisadores e movimentos sociais, o sítio foi tombado como patrimônio histórico do Ceará, em cerimônia realizada em 2019 <span class="tag forte">forte</span>. Em Senador Pompeu, a <b>Caminhada da Seca</b>, realizada todos os anos, lembra os mortos dos campos.</p>

<div class="box hoje"><p>Em 2022, aos 90 anos dos campos, jornais cearenses publicaram séries especiais sobre o tema. O debate sobre como lembrar esses lugares continua.</p></div>
`,

  o:['Um','Sete','Vinte','Cem'],c:1,

 {q:'Qual destes NÃO foi local de campo em 1932?',

aula('t3-a22',{
objetivo:`<p>Ao final, você vai conhecer a história dos órgãos federais de combate à seca: IOCS (1909), IFOCS (1919) e DNOCS (1945).</p>`,
explicacao:`
<h4>O porquê: o Estado contra a seca</h4>
<p>Depois de 1877, ficou claro que as secas eram um problema nacional. No início do século XX, o governo federal criou um órgão permanente para enfrentá-las.</p>

<h4>A sequência</h4>
<ul class="tl">
<li><b>1909</b>O presidente Nilo Peçanha cria a <b>Inspetoria de Obras Contra as Secas (IOCS)</b>, com sede em Fortaleza.</li>
<li><b>1919</b>A IOCS vira <b>Inspetoria Federal de Obras Contra as Secas (IFOCS)</b>. No governo do paraibano Epitácio Pessoa (1919–1922), há um grande impulso nas obras do Nordeste.</li>
<li><b>1945</b>A IFOCS vira <b>Departamento Nacional de Obras Contra as Secas (<span class="g" data-t="dnocs">DNOCS</span>)</b>.</li>
<li><b>1959</b>É criada a <b>Sudene</b>, com uma visão de desenvolvimento regional mais ampla, inspirada por Celso Furtado.</li>
</ul>

<h4>O que faziam</h4>
<p>Estudos de clima e solo, construção de açudes, poços, estradas e, mais tarde, perímetros de irrigação. Nas secas, organizavam as frentes de trabalho que empregavam milhares de flagelados <span class="tag consenso">consenso</span>.</p>

<div class="box conceito"><p>A estratégia dominante ficou conhecida como <b>solução hidráulica</b>: a ideia de que o problema do Nordeste era a falta de água, e de que bastava guardá-la em açudes. Críticos mostraram depois que o problema também era social: a água acumulada muitas vezes ficava em terras de grandes proprietários.</p></div>

<div class="box hoje"><p>O DNOCS continua existindo, com sede em Fortaleza, e administra açudes e perímetros irrigados. Seu papel e sua estrutura são discutidos periodicamente.</p></div>
`,
quiz:[
 {q:'Quando foi criada a IOCS?',
  o:['1877','1909','1945','1959'],c:1,
  e:['Foi a seca.','Correto, por Nilo Peçanha.','É o DNOCS.','É a Sudene.']},
 {q:'Quando a IFOCS virou DNOCS?',
  o:['1919','1945','1964','1988'],c:1,
  e:['É a criação da IFOCS.','Correto.','Não.','Não.']},
 {q:'O que era a “solução hidráulica”?',
  o:['A ideia de que o problema do Nordeste era a falta de água, a ser guardada em açudes','A dessalinização','A transposição','O fim da irrigação'],c:0,
  e:['Correto.','Não.','É posterior.','Não.']},
 {q:'Que crítica se faz à solução hidráulica?',
  o:['Que não fazia açudes','Que a água acumulada muitas vezes ficava em terras de grandes proprietários, sem resolver o problema social','Que os açudes eram pequenos demais','Que era cara demais para ser feita'],c:1,
  e:['Fazia muitos.','Correto.','Não é a crítica principal.','Foi feita.']},
 {q:'Qual órgão de 1959 trouxe uma visão de desenvolvimento regional mais ampla?',
  o:['DNOCS','Sudene','IOCS','Funceme'],c:1,
  e:['Não.','Correto, inspirada por Celso Furtado.','Não.','Não.']}
],
exercicio:`<p><b>Linha do tempo das políticas.</b> Complete a linha do tempo da aula com pelo menos três marcos posteriores (por exemplo: Funceme, Castanhão, transposição, cisternas).</p>`,
fontes:`<ul>
<li>${lnk('https://revistas.uece.br/index.php/bilros/article/download/7779/6535/30218','Artigo sobre o Cedro, a IOCS (1909) e o DNOCS (1945)')} (Bilros, UECE, 2019).</li>
<li>${lnk('https://static.even3.com/anais/1449654.pdf','A construção dos açudes Cedro e Orós e suas implicações territoriais (1888–1961)')}.</li>
</ul>`

aula('t3-a23',{
objetivo:`<p>Ao final, você vai conhecer a história dos açudes do Cedro e do Orós, incluindo o rompimento parcial do Orós em 1960.</p>`,
explicacao:`
<h4>O porquê: os monumentos do sertão</h4>
<p>O Cedro e o Orós foram, cada um em seu tempo, símbolos da esperança de vencer a seca. Suas histórias mostram promessas, atrasos e tragédias.</p>

<h4>O Cedro</h4>
<p>O açude do Cedro, em Quixadá, foi planejado depois da seca de 1877, por determinação de D. Pedro II. As obras começaram em 1884 e a parede principal só foi concluída em 1906, já na República. É considerado o primeiro grande açude público do Brasil <span class="tag forte">forte</span>. Cercado pelos monólitos de Quixadá, é belíssimo, mas sua utilidade foi sempre limitada pela evaporação e pelo tamanho da bacia.</p>

<h4>O Orós</h4>
<p>O açude Orós, no rio Jaguaribe, foi projetado ainda no início do século XX, com obras iniciadas no governo Epitácio Pessoa e retomadas no governo Juscelino Kubitschek <span class="tag forte">forte</span>. Em março de 1960, com a obra ainda incompleta, chuvas fortes encheram o reservatório. Na madrugada de <b>26 de março de 1960</b>, às 0h17, parte da barragem cedeu. A água devastou o Baixo Jaguaribe, inundando cidades e plantações <span class="tag forte">forte</span>. JK visitou o local. A obra foi retomada, e o Orós foi inaugurado em janeiro de 1961.</p>

<div class="box conceito"><p>Os grandes açudes também tiveram <b>custos sociais</b>: comunidades inteiras foram inundadas e deslocadas, muitas vezes sem indenização justa. Essa história se repetiu com o Castanhão, nos anos 2000.</p></div>

<div class="box hoje"><p>O Orós é o segundo maior açude do Ceará, depois do Castanhão, e um ponto turístico conhecido pelo “véu de noiva” formado pela válvula. Em 2026, o Cedro completou 120 anos, quase vazio.</p></div>
`,
quiz:[
 {q:'Onde fica o açude do Cedro?',
  o:['Quixadá','Orós','Fortaleza','Crato'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Quando foi concluída a parede principal do Cedro?',
  o:['1877','1906','1960','2002'],c:1,
  e:['Foi o planejamento.','Correto.','Não.','Não.']},
 {q:'Quando ocorreu o rompimento parcial do Orós?',
  o:['26 de março de 1960','15 de novembro de 1889','1932','2012'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Qual foi um custo social dos grandes açudes?',
  o:['Nenhum','Comunidades inundadas e deslocadas, muitas vezes sem indenização justa','Excesso de empregos','Falta de turismo'],c:1,
  e:['Houve.','Correto.','Não.','Não.']},
 {q:'Qual é o maior açude do Ceará hoje?',
  o:['Cedro','Orós','Castanhão','Banabuiú'],c:2,
  e:['Não.','É o segundo.','Correto.','Não.']}
],
exercicio:`<p><b>Antes e depois.</b> Pesquise imagens do rompimento do Orós em 1960 (a revista O Cruzeiro publicou reportagem famosa). Descreva o que as imagens mostram e o que elas não mostram.</p>`,
fontes:`<ul>
<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/cidades/2025/03/26/rompimento-da-barragem-do-acude-oros-completa-65-anos.html','Rompimento da barragem do Orós completa 65 anos')} (2025).</li>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/pontopoder/bau-da-politica-a-visita-de-juscelino-kubitschek-ao-ceara-no-estouro-da-barragem-do-oros-1.3335628','A visita de JK ao Ceará no estouro do Orós')}.</li>
<li>O Povo, ${lnk('https://mais.opovo.com.br/reportagens-especiais/acude-cedro/2026/11/05/acude-cedro-a-joia-no-meio-do-sertao-mais-exuberante-do-que-eficiente-completa-120-anos.html','Açude Cedro completa 120 anos')} (2026).</li>
<li>Renata Felipe Monteiro, ${lnk('https://repositorio.ufc.br/ri/bitstream/riufc/6146/1/2012-DIS-RFMONTEIRO.pdf','Um monumento ao sertão')} (UFC, 2012).</li>
</ul>`
});

aula('t3-a24',{
objetivo:`<p>Ao final, você vai entender a crítica à “indústria da seca”: como elites usaram as secas e as obras para benefício próprio.</p>`,
explicacao:`
<h4>O porquê: a seca como negócio</h4>
<p>Se as secas causavam tanta miséria, por que, depois de décadas de obras, o problema continuava? Uma resposta incômoda é que, para alguns, a seca era lucrativa.</p>

<h4>Como funcionava</h4>
<ul>
<li><b>Açudes em terras particulares</b>: obras públicas construídas em fazendas de chefes políticos, valorizando suas terras.</li>
<li><b>Frentes de trabalho</b> controladas por coronéis, que escolhiam quem trabalhava e usavam isso como moeda eleitoral.</li>
<li><b>Desvio de verbas</b> de socorro, como já se denunciava em 1877.</li>
<li><b>Comércio</b>: comerciantes que lucravam com a alta dos preços dos alimentos.</li>
</ul>

<h4>A denúncia</h4>
<p>O jornalista Antônio Callado popularizou a crítica no livro <i>Os Industriais da Seca e os “Galileus” de Pernambuco</i> (1960) <span class="tag forte">forte</span>. No mesmo período, o economista Celso Furtado defendeu que o problema do Nordeste não era só a água, mas a estrutura econômica e social, e inspirou a criação da Sudene (1959).</p>

<div class="box conceito"><p>A <span class="g" data-t="industriaseca">indústria da seca</span> não significa que toda obra contra a seca foi inútil ou desonesta. Significa que a forma como as políticas foram feitas, concentradas em obras e controladas por elites locais, muitas vezes reproduziu a desigualdade que tornava as secas mortais.</p></div>

<div class="box conexao"><p>A virada para a “convivência com o semiárido”, a partir dos anos 1990, que você viu na Trilha 1, foi em parte uma resposta a essa crítica. A Trilha 4 discute o presente.</p></div>
`,
quiz:[
 {q:'O que é a “indústria da seca”?',
  o:['Uma fábrica','O uso das secas e das obras por elites para benefício próprio','Uma lei','Um tipo de açude'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Quem popularizou a expressão em livro de 1960?',
  o:['Antônio Callado','Rachel de Queiroz','José de Alencar','Padre Cícero'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Qual destes era mecanismo da indústria da seca?',
  o:['Açudes construídos em terras particulares de chefes políticos','Reforma agrária','Voto secreto','Escola pública'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'O que Celso Furtado defendeu?',
  o:['Que bastava fazer açudes','Que o problema do Nordeste era também a estrutura econômica e social','Que não havia problema','Que o Nordeste devia ser abandonado'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'A crítica à indústria da seca significa que toda obra foi inútil?',
  o:['Sim','Não; significa que a forma das políticas muitas vezes reproduziu a desigualdade','Sim, eram todas fraudes','Não havia obras'],c:1,
  e:['Não.','Correto.','Exagero.','Havia muitas.']}
],
exercicio:`<p><b>Caso local.</b> Existe algum açude perto da sua cidade? Pesquise em que terras foi construído e quem se beneficiou. Escreva um parágrafo.</p>`,
fontes:`<ul>
<li>Antônio Callado, <i>Os Industriais da Seca</i> (1960).</li>
<li>Senado Federal, ${lnk('https://www12.senado.leg.br/noticias/especiais/arquivo-s/500-mil-mortes-doenca-fome-desvio-de-verbas-e-pedido-de-cpi-o-retrato-da-grande-seca-do-imperio','desvio de verbas na seca de 1877')}.</li>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/regiao/ascensao-e-declinio-do-feiticeiro-revelam-diferentes-lados-da-politica-de-acudagem-1.1989990','Ascensão e declínio do Feiticeiro: lados da política de açudagem')}.</li>
</ul>`
});

aula('t3-a25',{
objetivo:`<p>Ao final, você vai entender o que foi a Batalha da Borracha e por que o Brasil precisou mobilizar trabalhadores para a Amazônia durante a Segunda Guerra.</p>`,
explicacao:`
<h4>O porquê: borracha para a guerra</h4>
<p>Em 1942, o Japão ocupou as regiões do Sudeste Asiático que forneciam a maior parte da borracha do mundo. Os Estados Unidos e os Aliados precisavam de borracha para pneus, equipamentos e armas. A Amazônia brasileira voltou a ser estratégica.</p>

<h4>Os acordos</h4>
<p>Em 1942, Brasil e Estados Unidos assinaram acordos pelos quais o Brasil forneceria borracha, e em troca receberia investimentos, inclusive para modernizar o Exército e construir uma companhia siderúrgica <span class="tag forte">forte</span>. Começava a chamada <b>Batalha da Borracha</b>.</p>

<h4>Faltavam braços</h4>
<p>Os seringais da Amazônia estavam decadentes desde o fim do primeiro ciclo da borracha, nos anos 1910. Era preciso levar trabalhadores. O governo Vargas montou serviços especiais de recrutamento, como o <span class="g" data-t="semta">SEMTA</span>, e campanhas de propaganda <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>A Batalha da Borracha ligou o sertão do Ceará à geopolítica mundial. A seca de 1942 e a pobreza fizeram do Ceará o principal fornecedor de trabalhadores para essa “guerra” no meio da floresta.</p></div>

<div class="box conexao"><p>Essa migração continuou uma história iniciada no século XIX, com os retirantes de 1877 (Trilha 2, módulo 7).</p></div>
`,
quiz:[
 {q:'Por que os Aliados precisaram da borracha brasileira em 1942?',
  o:['Porque o Japão ocupou as regiões produtoras do Sudeste Asiático','Porque a borracha acabou no mundo','Por moda','Porque o Brasil exigiu'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'O que o Brasil recebeu nos acordos com os EUA?',
  o:['Nada','Investimentos, inclusive para o Exército e uma siderúrgica','Território','Petróleo'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'O que era o SEMTA?',
  o:['Uma empresa americana','Um serviço do governo para recrutar trabalhadores para a Amazônia','Um partido','Um açude'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Por que o Ceará foi o principal fornecedor de trabalhadores?',
  o:['Por causa da seca e da pobreza, além de uma tradição de migração para a Amazônia','Porque era obrigatório por lei','Porque não havia seca','Por sorteio'],c:0,
  e:['Correto.','Não.','Havia seca em 1942.','Não.']},
 {q:'Como se chamou essa mobilização?',
  o:['Batalha da Borracha','Marcha para o Oeste apenas','Revolução de 1930','Guerra do Paraguai'],c:0,
  e:['Correto.','Foi um projeto associado, mas o nome era Batalha da Borracha.','Não.','Não.']}
],
exercicio:`<p><b>Ligação global.</b> Escreva um parágrafo explicando como uma decisão militar japonesa no Sudeste Asiático mudou a vida de uma família do sertão do Ceará.</p>`,
fontes:`<ul>
<li>Edson Holanda Lima Barboza, ${lnk('https://tede2.pucsp.br/bitstream/handle/13022/1/Edson%20Holanda%20Lima%20Barboza.pdf','Ida ao Inferno Verde')} (2005).</li>
<li>${lnk('https://core.ac.uk/download/276617095.pdf','Os soldados da borracha: a migração de trabalhadores cearenses para a Amazônia')} (História Unicap, 2019).</li>
</ul>`

aula('t3-a26',{
objetivo:`<p>Ao final, você vai conhecer como foi o recrutamento de soldados da borracha no Ceará: a propaganda, o papel da Igreja e as promessas feitas.</p>`,
explicacao:`
<h4>O porquê: convencer a partir</h4>
<p>Para levar dezenas de milhares de pessoas à Amazônia, o governo precisou convencer. Usou propaganda, a Igreja e a linguagem da guerra.</p>

<h4>A propaganda</h4>
<p>Cartazes e campanhas chamavam os trabalhadores de <b>“soldados da borracha”</b> e prometiam uma Amazônia de fartura. Os recrutados recebiam roupas, alimentação e transporte, e eram reunidos em pousos em Fortaleza e no interior antes da viagem <span class="tag forte">forte</span>.</p>

<h4>A Igreja</h4>
<p>A Igreja Católica colaborou com o Estado no recrutamento, associando a migração a uma missão patriótica e cristã. Pesquisas falam em “soldados de Cristo” para a Batalha da Borracha <span class="tag forte">forte</span>.</p>

<h4>A escolha</h4>
<p>Para muitos sertanejos, numa nova seca, o recrutamento parecia uma chance de sobreviver à fome. Outros foram pressionados: havia a alternativa de ser convocado para o Exército e talvez para a guerra na Europa <span class="tag forte">forte</span>.</p>

<div class="box cuidado"><p>A palavra “soldado” era propaganda: os seringueiros não tinham os direitos de militares. Só muito depois, com a Constituição de 1988, os soldados da borracha sobreviventes passaram a ter direito a uma pensão.</p></div>

<div class="box hoje"><p>Pesquisas de memória em cidades como Tianguá recolhem depoimentos de famílias de soldados da borracha. Uma cantiga popular resume a despedida: “quem parte, parte chorando; quem fica, chora de dor”.</p></div>
`,
quiz:[
 {q:'Por que os trabalhadores eram chamados de “soldados da borracha”?',
  o:['Porque eram militares de verdade','Como propaganda, associando a migração ao esforço de guerra','Porque usavam fardas de borracha','Por acaso'],c:1,
  e:['Não tinham direitos de militares.','Correto.','Não.','Não.']},
 {q:'Que instituição colaborou com o Estado no recrutamento?',
  o:['A Igreja Católica','Os cangaceiros','A UNE','O Partido Comunista'],c:0,
  e:['Correto.','Não.','Não.','Não.']},

aula('t3-a27',{
objetivo:`<p>Ao final, você vai conhecer o destino dos soldados da borracha na Amazônia e a luta tardia por reconhecimento.</p>`,
explicacao:`
<h4>O porquê: os esquecidos da guerra</h4>
<p>Os pracinhas que lutaram na Itália voltaram como heróis. Os soldados da borracha, que também serviram ao esforço de guerra, foram em grande parte esquecidos.</p>

<h4>O que encontraram</h4>
<p>Nos seringais, os trabalhadores enfrentaram malária, febre amarela e outras doenças, isolamento, ataques de animais, conflitos e o sistema de aviamento, que os prendia em dívidas com os patrões. Muitos morreram; as estimativas variam muito entre as fontes <span class="tag hipotese">números debatidos</span>.</p>

<h4>A volta que não veio</h4>
<p>Com o fim da guerra, em 1945, a borracha asiática voltou ao mercado e o interesse pela Amazônia caiu. A promessa de retorno não foi cumprida para muitos, que ficaram na região sem meios de voltar. Historiadores escreveram que, terminada a batalha na Europa, os “patriotas da borracha” continuaram a tombar nos seringais, e que os sobreviventes não foram tratados como heróis <span class="tag forte">forte</span>.</p>

<h4>Reconhecimento</h4>
<p>A Constituição de 1988 reconheceu aos soldados da borracha o direito a uma pensão vitalícia. Organizações de sobreviventes e descendentes continuaram lutando por indenização e reconhecimento. O documentário <i>Soldados da Borracha</i>, do cearense Wolney Oliveira, ajudou a divulgar a história.</p>

<div class="box conceito"><p>A história dos soldados da borracha mostra como a guerra atinge também quem não pega em armas, e como o Estado pode recrutar os mais pobres e depois esquecê-los.</p></div>
`,

  e:['Não.','Correto.','Não.','Não.']},
 {q:'Como foram tratados os sobreviventes?',

 {q:'O que a Constituição de 1988 reconheceu?',

aula('t3-a28',{
objetivo:`<p>Ao final, você vai conhecer a Padaria Espiritual, o movimento literário e artístico mais irreverente do Ceará no fim do século XIX.</p>`,
explicacao:`
<h4>O porquê: rir da cidade</h4>
<p>Numa Fortaleza que copiava Paris, um grupo de jovens decidiu fazer literatura com humor, irreverência e orgulho do que era brasileiro. Chamaram-se “padeiros”.</p>

<h4>A fundação</h4>
<p>Em 30 de maio de 1892, no Café Java, na Praça do Ferreira, jovens escritores, pintores e músicos fundaram a <b>Padaria Espiritual</b>. O poeta <b>Antônio Sales</b> deu o nome ao grupo e redigiu o “Programa de Instalação”, com 48 artigos cheios de humor <span class="tag forte">forte</span>. Entre os “padeiros” estavam Lívio Barreto, Adolfo Caminha, Henrique Jorge, Antônio Bezerra e Rodolfo Teófilo.</p>

<h4>O Pão e as ideias</h4>
<p>O grupo publicou o jornal <i>O Pão</i>, entre 1892 e 1896. Seu programa defendia, com humor, os temas e valores nacionais, a língua portuguesa e a cultura brasileira, contra o exagero do afrancesamento das elites. Também zombava do pedantismo e da política local <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Alguns estudiosos veem na Padaria Espiritual uma antecipação de ideias do Modernismo de 1922, como a valorização da cultura nacional e o humor. Outros acham a comparação exagerada <span class="tag interpretacao">debate</span>.</p></div>

<div class="box hoje"><p>Em 2025, o Café Java, ponto histórico da Padaria Espiritual, foi reaberto na Praça do Ferreira pela Academia Cearense de Letras, que também lançou uma “Padaria Espiritual – Nova Geração” com estudantes da rede pública.</p></div>
`,

aula('t3-a29',{
objetivo:`<p>Ao final, você vai entender o lugar de Rachel de Queiroz e da literatura da seca na cultura brasileira.</p>`,
explicacao:`
<h4>O porquê: a seca na literatura</h4>
<p>A seca não é só tema de história: é um dos grandes temas da literatura brasileira. E o Ceará deu ao país alguns de seus principais autores sobre o assunto.</p>

<h4>Uma tradição</h4>
<ul>
<li><b>José de Alencar</b>, em <i>O Sertanejo</i> (1875), já trazia o sertão para o romance.</li>
<li><b>Rodolfo Teófilo</b> escreveu <i>A Fome</i> (1890) e <i>Os Brilhantes</i> (1895), sobre a seca de 1877.</li>
<li><b>Domingos Olímpio</b> publicou <i>Luzia-Homem</i> (1903), também ambientado na seca de 1877.</li>
<li><b>Rachel de Queiroz</b> publicou <i>O Quinze</i> (1930), sobre a seca de 1915.</li>
</ul>

<h4>Rachel de Queiroz</h4>
<p>Nascida em Fortaleza em 1910, Rachel de Queiroz publicou <i>O Quinze</i> aos vinte anos e foi reconhecida nacionalmente. O livro faz parte do “romance de 30”, ao lado de obras de Graciliano Ramos, José Lins do Rego e Jorge Amado, que levaram o Nordeste e seus problemas sociais para o centro da literatura brasileira <span class="tag consenso">consenso</span>. Ela também foi jornalista, cronista e, em 1977, a primeira mulher eleita para a Academia Brasileira de Letras.</p>

<div class="box conceito"><p>A literatura da seca ajudou a formar a imagem do Nordeste no Brasil: o sertão seco, os retirantes, a fome. O historiador Durval Muniz de Albuquerque Jr., em <i>A Invenção do Nordeste</i>, mostra como essa imagem, construída por literatura, política e imprensa, também simplificou a região e reforçou estereótipos <span class="tag interpretacao">interpretação</span>.</p></div>

<div class="box conexao"><p>Rachel de Queiroz aparece também na história da Segunda Guerra em Fortaleza: o terreno do sítio de seu pai, no Pici, foi parte da área usada pela base americana.</p></div>
`,

  o:['Um romance de 30 páginas','Obras dos anos 1930 que levaram o Nordeste e seus problemas sociais ao centro da literatura','Um movimento de 1830','Um tipo de cordel'],c:1,

aula('t3-a30',{
objetivo:`<p>Ao final, você vai conhecer a imprensa, o teatro e o rádio em Fortaleza na primeira metade do século XX, e como mudaram a vida urbana.</p>`,
explicacao:`
<h4>O porquê: a cidade se comunica</h4>
<p>Jornais, teatro e rádio transformaram o modo como os cearenses se informavam, se divertiam e faziam política.</p>

<h4>O Theatro José de Alencar (1910)</h4>
<p>Inaugurado em 1910, o Theatro José de Alencar, com estrutura metálica importada da Escócia e estilo art nouveau, tornou-se o símbolo da Belle Époque de Fortaleza <span class="tag consenso">consenso</span>.</p>

<h4>A imprensa</h4>
<p>Fortaleza teve muitos jornais, de vida curta ou longa, ligados a partidos e grupos. Em 1928, o jornalista e poeta Demócrito Rocha fundou <i>O Povo</i>, que se tornou um dos principais jornais do Ceará <span class="tag consenso">consenso</span>. A imprensa foi espaço de debate e também de disputa política.</p>

<h4>O rádio</h4>
<p>A partir dos anos 1930, o rádio chegou a Fortaleza, com a Ceará Rádio Clube como pioneira. Programas de auditório, novelas, notícias e música aproximaram a capital do interior e do resto do país. O rádio também foi usado pela política, especialmente na Era Vargas <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Os meios de comunicação mudaram a <b>esfera pública</b>: mais gente passou a ter acesso a informação e debate, mas também cresceu o poder de quem controlava jornais e rádios. No Ceará, como no Brasil, grupos políticos e econômicos muitas vezes foram donos dos veículos.</p></div>

<div class="box hoje"><p>O Theatro José de Alencar é patrimônio nacional e continua funcionando. O Povo completou 95 anos em 2023 e mantém um grande acervo histórico usado por pesquisadores.</p></div>
`,

 {q:'O que o rádio trouxe a partir dos anos 1930?',
  o:['Nada','Programas, notícias e música que aproximaram capital e interior, e um novo instrumento político','O fim dos jornais','A televisão'],c:1,
  e:['Não.','Correto.','Não.','É posterior.']},
 {q:'De onde veio a estrutura metálica do Theatro José de Alencar?',
  o:['Da França','Da Escócia','Do Japão','Do Rio de Janeiro'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Que problema acompanhou a expansão dos meios de comunicação?',
  o:['Nenhum','A concentração do poder de quem controlava jornais e rádios','O fim da política','A proibição de livros'],c:1,
  e:['Houve.','Correto.','Não.','Não.']}
],
exercicio:`<p><b>Acervo.</b> Procure na Hemeroteca Digital da Biblioteca Nacional uma edição de um jornal cearense da década de 1930. Descreva as manchetes, os anúncios e o que eles revelam sobre a cidade.</p>`,

</ul>`

aula('t3-a31',{
objetivo:`<p>Ao final, você vai entender por que o eclipse de 29 de maio de 1919, observado em Sobral, foi importante para a ciência mundial.</p>`,
explicacao:`
<h4>O porquê: o céu de Sobral e Einstein</h4>
<p>Em 1915, Albert Einstein publicou a teoria da relatividade geral. Uma de suas previsões era que a luz das estrelas se curvaria ao passar perto do Sol. Para testar, era preciso um eclipse total.</p>

<h4>O eclipse</h4>
<p>Em 29 de maio de 1919, um eclipse total do Sol foi observado em dois lugares: em <b>Sobral</b>, no Ceará, e na ilha do Príncipe, na costa da África. Duas equipes britânicas fotografaram as estrelas próximas ao Sol durante o eclipse. Em Sobral, também estiveram equipes organizadas pelo diretor do Observatório Nacional, Henrique Morize <span class="tag forte">forte</span>.</p>

<h4>O resultado</h4>
<p>Meses depois, os britânicos anunciaram que as medições davam razão a Einstein: a luz tinha se curvado no valor previsto pela relatividade, cerca do dobro do previsto pela teoria de Newton. As fotografias de Sobral foram decisivas. Einstein ficou mundialmente famoso <span class="tag forte">forte</span>. Uma frase atribuída a ele diz que a questão que sua mente formulou foi respondida pelo radiante céu do Brasil.</p>

<div class="box cuidado"><p>Durante décadas, físicos e historiadores debateram se os dados de 1919 eram suficientemente robustos. Hoje há consenso de que a relatividade prevê melhor a deflexão da luz, e a importância histórica do eclipse de Sobral é reconhecida <span class="tag consenso">consenso</span>.</p></div>

<div class="box hoje"><p>Sobral tem o Museu do Eclipse, no lugar das observações. Em 2019, o centenário foi celebrado com eventos científicos em todo o Brasil.</p></div>
`,
quiz:[

  o:['29 de maio de 1919','15 de novembro de 1889','1932','1964'],c:0,
  e:['Correto.','Não.','Não.','Não.']},

aula('t3-a32',{
objetivo:`<p>Ao final, você vai conhecer o impacto da Segunda Guerra Mundial em Fortaleza: as bases americanas, a mudança de costumes e as tensões da época.</p>`,
explicacao:`
<h4>O porquê: a guerra chega à praia</h4>
<p>Fortaleza ficava longe da Europa, mas a Segunda Guerra mudou a cidade. A posição estratégica do Nordeste, mais perto da África, fez da região um ponto de apoio dos Aliados.</p>

<h4>As bases</h4>
<p>Com a entrada do Brasil na guerra ao lado dos Aliados, em 1942, os Estados Unidos instalaram bases em Fortaleza: uma no <b>Pici</b>, onde hoje está um campus da UFC, e outra no <b>Cocorote</b>, atual Alto da Balança, nome que vem da expressão inglesa “coco route”, rota do Cocó. Dirigíveis e aviões patrulhavam a costa em busca de submarinos alemães <span class="tag forte">forte</span>. Estima-se que cerca de cinquenta mil soldados americanos tenham passado por Fortaleza no período <span class="tag forte">estimativa</span>.</p>

<h4>Mudança de costumes</h4>
<p>A cidade, até então influenciada pela França, passou a viver o “American way of life”: jazz, cuba-libre, cinema americano, nomes ingleses para crianças e lojas. Moças que namoravam soldados americanos eram chamadas, com preconceito, de “coca-colas” <span class="tag forte">forte</span>. Rachel de Queiroz retratou esse choque no conto “Tangerine-Girl”.</p>

<h4>Tensões</h4>
<p>Em agosto de 1942, depois do afundamento de navios brasileiros por submarinos alemães, houve em Fortaleza um quebra-quebra contra estabelecimentos de alemães, italianos e japoneses. O interventor Menezes Pimentel pediu ordem <span class="tag forte">forte</span>.</p>

<div class="box hoje"><p>Uma casamata (bunker) da época ainda existe na área da UFC no Pici. O Aeroporto Pinto Martins, que funcionou no Alto da Balança, tem origem nesse período.</p></div>
`,
quiz:[
 {q:'Onde ficavam as bases americanas em Fortaleza?',
  o:['No Pici e no Cocorote','Na Praia de Iracema e em Messejana','No Crato','Em Sobral'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'De onde vem o nome Cocorote?',
  o:['De um coqueiro','Da expressão inglesa “coco route”, rota do Cocó','De um nome indígena','De um general'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Que mudança cultural a guerra trouxe a Fortaleza?',
  o:['Mais influência francesa','O “American way of life”: jazz, cinema e costumes americanos','Fim da música','Volta a Portugal'],c:1,
  e:['Foi o contrário.','Correto.','Não.','Não.']},
 {q:'O que aconteceu em agosto de 1942 em Fortaleza?',
  o:['Uma festa','Um quebra-quebra contra estabelecimentos de alemães, italianos e japoneses','A chegada da Coluna Prestes','A abolição'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Quem governava o Ceará durante a guerra?',
  o:['O interventor Menezes Pimentel','Accioly','Tasso Jereissati','Padre Cícero'],c:0,
  e:['Correto.','Não.','Não.','Não.']}
],
exercicio:`<p><b>Memória da guerra.</b> Procure lugares de Fortaleza ligados à Segunda Guerra (Pici, Alto da Balança, Estoril). Escolha um e escreva o que aconteceu ali e o que existe hoje.</p>`,
fontes:`<ul>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/ceara/como-um-campus-da-ufc-em-fortaleza-serviu-de-base-na-ii-guerra-mundial-ha-mais-de-80-anos-1.3503003','Como um campus da UFC serviu de base na II Guerra')}.</li>
<li>Reverson Nascimento Paula, ${lnk('https://anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548875807_bd6d37b593248e4957f7499c2336c840.pdf','Fortaleza em cotidiano: a base militar norte-americana (1943–1945)')} (ANPUH).</li>
<li>O Povo, ${lnk('https://mais.opovo.com.br/reportagens-especiais/2022/08/18/ha-80-anos-fortalezenses-fizeram-quebra-quebra-em-protesto-contra-o-nazifascismo.html','Há 80 anos fortalezenses fizeram quebra-quebra contra o nazifascismo')} (2022).</li>
<li>O Povo, ${lnk('https://mais.opovo.com.br/reportagensexclusivas/2019/08/29/blimps--jazz-e-cuba-libre--ha-80-anos--segunda-guerra-mundial-mudou-o-ceara.html','Blimps, jazz e cuba-libre')} (2019).</li>

aula('t3-a33',{
objetivo:`<p>Ao final, você vai conhecer as grandes migrações de cearenses para outras regiões do Brasil no século XX e seus efeitos no Ceará e nos destinos.</p>`,
explicacao:`
<h4>O porquê: um povo que migra</h4>
<p>Poucos estados exportaram tanta gente quanto o Ceará. Cearenses estão em todo o Brasil: na Amazônia, em São Paulo, no Rio, em Brasília.</p>

<h4>Os grandes fluxos</h4>
<ul>
<li><b>Para a Amazônia</b>: desde o século XIX, intensificado na seca de 1877, no ciclo da borracha e na Batalha da Borracha (1942–1945). Cearenses tiveram grande presença no Acre.</li>
<li><b>Para o Sudeste</b>: a partir dos anos 1930 e sobretudo dos anos 1950, milhões de nordestinos migraram para São Paulo e Rio de Janeiro, atraídos pela industrialização e expulsos pelas secas e pela concentração de terras. Muitos viajavam em caminhões chamados de “pau de arara”.</li>
<li><b>Para Brasília</b>: nos anos 1950 e 1960, os “candangos” que construíram a nova capital incluíam muitos cearenses.</li>
<li><b>Para Fortaleza</b>: o êxodo rural encheu a capital de migrantes do interior, formando as periferias (Trilha 4).</li>
</ul>

<div class="box conceito"><p>A migração teve efeitos nos dois lados: no Ceará, o esvaziamento do campo e o envio de dinheiro às famílias; nos destinos, a formação de comunidades nordestinas, o trabalho na construção civil e na indústria, e também o preconceito contra “paraíbas” e “baianos”, como os nordestinos eram genericamente chamados.</p></div>

<div class="box hoje"><p>A Feira de São Cristóvão, no Rio, e o Centro de Tradições Nordestinas, em São Paulo, são marcas da presença nordestina no Sudeste. A música de Luiz Gonzaga, como “Asa Branca”, tornou-se trilha sonora da saudade do migrante.</p></div>
`,
quiz:[
 {q:'Para onde muitos cearenses migraram a partir dos anos 1950?',
  o:['Europa','São Paulo e Rio de Janeiro','Japão','Argentina'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'O que era o “pau de arara”?',
  o:['Um pássaro','Caminhão adaptado em que migrantes viajavam','Um tipo de casa','Uma dança'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Quem eram os “candangos”?',
  o:['Cangaceiros','Trabalhadores que construíram Brasília','Padres','Comerciantes'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Que estado amazônico teve grande presença de cearenses?',
  o:['Acre','Rio Grande do Sul','Santa Catarina','Bahia'],c:0,
  e:['Correto.','Não.','Não.','Não é amazônico.']},
 {q:'Qual foi um efeito da migração no Ceará?',
  o:['Esvaziamento do campo e envio de dinheiro às famílias','Fim da seca','Crescimento de indústrias pesadas no sertão','Fim de Fortaleza'],c:0,
  e:['Correto.','Não.','Não.','Não.']}
],
exercicio:`<p><b>História da família.</b> Faça uma pequena árvore genealógica da sua família (ou de alguém que você conheça) e marque quem migrou, para onde e por quê. O que ela revela sobre a história do Ceará?</p>`,
fontes:`<ul>
<li>${lnk('https://www.redalyc.org/pdf/263/26305110.pdf','Franciane Gama Lacerda, Migrantes cearenses na Amazônia (1889–1916)')} (RBH, 2006).</li>
<li>${lnk('https://periodicos.ufrn.br/espacialidades/article/download/38897/21014/147801','Artigo sobre migrações e secas')} (Espacialidades, UFRN).</li>
</ul>`
});

aula('t3-a34',{
objetivo:`<p>Ao final, você vai entender como a Revolução de 1930 e o Estado Novo afetaram a política cearense, com os interventores nomeados por Vargas.</p>`,
explicacao:`
<h4>O porquê: o fim da Primeira República</h4>
<p>A Revolução de 1930 levou Getúlio Vargas ao poder e encerrou a Primeira República. Os governos estaduais passaram a ser comandados por interventores nomeados pelo governo central.</p>

<h4>A Revolução de 1930 no Ceará</h4>
<p>Com a vitória de Vargas, o Ceará passou a ser governado por interventores. O primeiro foi o cearense Manuel do Nascimento Fernandes Távora, ligado aos “tenentes”. A família Távora teria grande peso na política cearense nas décadas seguintes <span class="tag forte">forte</span>.</p>

<h4>A Liga Eleitoral Católica</h4>
<p>Com o novo Código Eleitoral de 1932, que criou o voto secreto, a Justiça Eleitoral e o voto feminino, a Igreja Católica se organizou politicamente por meio da <b>Liga Eleitoral Católica (LEC)</b>, que no Ceará teve grande força e ajudou a eleger candidatos comprometidos com seus princípios <span class="tag forte">forte</span>.</p>

<h4>Menezes Pimentel e o Estado Novo</h4>
<p>Francisco de Menezes Pimentel, eleito governador em 1935 com apoio da LEC, permaneceu no poder como interventor depois do golpe do Estado Novo, em 1937, até 1945 <span class="tag forte">forte</span>. Nesse período, houve censura, repressão a comunistas e integralistas e a destruição do Caldeirão (1936–1937).</p>

<div class="box conceito"><p>A Era Vargas trouxe <b>centralização</b> (poder no governo federal), <b>direitos trabalhistas</b> (para trabalhadores urbanos, não para os rurais) e <b>autoritarismo</b> no Estado Novo. No Ceará, o peso da Igreja e das famílias tradicionais continuou grande.</p></div>

<div class="box hoje"><p>O voto feminino, conquistado em 1932, é uma das heranças mais duradouras desse período.</p></div>
`,

aula('t3-a35',{
objetivo:`<p>Ao final, você vai conhecer a política cearense entre 1945 e 1964: partidos, eleições e a disputa entre grupos.</p>`,
explicacao:`
<h4>O porquê: a experiência democrática</h4>
<p>Entre 1945 e 1964, o Brasil viveu um período democrático, com eleições regulares e partidos nacionais. No Ceará, a política continuou marcada por famílias e coronéis, mas com novos atores.</p>

<h4>Os partidos</h4>
<p>Os principais partidos nacionais eram o <b>PSD</b> (ligado aos interventores e às elites rurais), a <b>UDN</b> (oposição a Vargas, com forte base em setores médios e em algumas oligarquias) e o <b>PTB</b> (trabalhista, ligado a Vargas). No Ceará, PSD e UDN dominaram a disputa, e as alianças muitas vezes seguiam as rivalidades locais mais do que os programas nacionais <span class="tag forte">forte</span>.</p>

<h4>Os governadores</h4>
<p>O Ceará teve governadores eleitos como Faustino de Albuquerque, Raul Barbosa, Paulo Sarasate e Parsifal Barroso. Em 1962, foi eleito Virgílio Távora, que governaria até 1966 e voltaria ao poder nos anos 1970 <span class="tag forte">forte</span>.</p>

<h4>Novos atores</h4>
<p>Cresceram os sindicatos urbanos, o movimento estudantil e, no campo, as Ligas Camponesas e os sindicatos rurais, que reivindicavam reforma agrária. A Igreja também mudou: setores católicos passaram a apoiar a organização dos trabalhadores rurais <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>O período 1945–1964 é chamado de <b>República populista</b> ou <b>experiência democrática</b>. No Ceará, foi um tempo de modernização (Sudene, Universidade Federal do Ceará, criada em 1954, Banco do Nordeste, criado em 1952 com sede em Fortaleza) convivendo com estruturas tradicionais de poder.</p></div>
`,
quiz:[
 {q:'Quais eram os principais partidos do período 1945–1964?',
  o:['PSD, UDN e PTB','PT e PSDB','Liberal e Conservador','Arena e MDB'],c:0,
  e:['Correto.','São posteriores.','São do Império.','São da ditadura.']},
 {q:'Quem foi eleito governador do Ceará em 1962?',
  o:['Virgílio Távora','Tasso Jereissati','Menezes Pimentel','Accioly'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Quando foi criada a Universidade Federal do Ceará?',
  o:['1887','1954','1964','1988'],c:1,
  e:['É o Instituto do Ceará.','Correto.','Não.','Não.']},
 {q:'Onde fica a sede do Banco do Nordeste, criado em 1952?',
  o:['Recife','Fortaleza','Salvador','Rio de Janeiro'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Que novos atores cresceram no campo?',
  o:['Cangaceiros','Ligas Camponesas e sindicatos rurais','Holandeses','Bandeirantes'],c:1,
  e:['Não.','Correto.','Não.','Não.']}
],

fontes:`<ul>
<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/reportagem/2026/06/13/grandes-ciclos-politicos-do-ceara-republicano.html','Grandes ciclos políticos do Ceará republicano')} (2026).</li>
<li>Abelardo Montenegro, <i>História dos Partidos Políticos Cearenses</i>.</li>
</ul>`
});

aula('t3-a36',{
objetivo:`<p>Ao final, você vai entender o clima político do Ceará às vésperas do golpe de 1964: polarização, reformas de base e medo do comunismo.</p>`,
explicacao:`
<h4>O porquê: um país dividido</h4>
<p>No início dos anos 1960, o Brasil estava polarizado. O presidente João Goulart defendia as “reformas de base”, entre elas a reforma agrária. Setores conservadores, a maior parte da imprensa, parte da Igreja e as Forças Armadas viam nisso uma ameaça comunista.</p>

<h4>No Ceará</h4>
<p>No Ceará, a mobilização de trabalhadores rurais e estudantes cresceu, e também a reação de proprietários e conservadores. O governador Virgílio Távora, eleito em 1962, tinha base em forças conservadoras e militares <span class="tag forte">forte</span>.</p>

<h4>As reformas de base</h4>
<p>As reformas propostas incluíam reforma agrária, reforma urbana, educacional e eleitoral (com voto dos analfabetos). No Nordeste, a questão da terra era explosiva: a concentração fundiária herdada desde as sesmarias, que você estudou na Trilha 1, era o centro do conflito.</p>

<div class="box conceito"><p>O golpe de 1964 não veio do nada: resultou de uma disputa sobre o modelo de país, em que a questão da terra no Nordeste tinha grande peso. Entender o Ceará antes de 1964 ajuda a entender a ditadura que veio depois.</p></div>

<div class="box conexao"><p>A Trilha 4 começa exatamente aqui: com o golpe de 1964 no Ceará, as cassações, a repressão e a resistência.</p></div>
`,

  e:['Não.','Correto.','Não.','Não.']},

 {q:'Quem governava o Ceará às vésperas do golpe?',
  o:['Virgílio Távora','Menezes Pimentel','Tasso Jereissati','Cid Gomes'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Como setores conservadores viam as reformas de base?',
  o:['Como solução','Como ameaça comunista','Com indiferença','Como proposta religiosa'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'O golpe de 1964:',

],

aula('t4-a1',{
objetivo:`<p>Ao final, você vai saber como o golpe de 1964 chegou ao Ceará e por que o governador Virgílio Távora quase perdeu o cargo.</p>`,
explicacao:`
<h4>O porquê: um golpe visto do Ceará</h4>
<p>Em 31 de março e 1º de abril de 1964, militares, com apoio de setores civis, derrubaram o presidente João Goulart. Era o início de uma ditadura que duraria 21 anos. No Ceará, a notícia chegou pelo rádio e pelos jornais, e os efeitos políticos vieram em poucos dias.</p>

<h4>A situação de Virgílio Távora</h4>
<p>O governador era o coronel <b>Virgílio Távora</b>, eleito em 1962 pela “União pelo Ceará”, aliança de PSD e UDN. Apesar de conservador, tinha laços de amizade com Goulart: os dois haviam sido deputados juntos nos anos 1950. Por isso, militares do comando do Recife chegaram a pressionar por sua queda <span class="tag forte">forte</span>.</p>
<p>Távora sobreviveu. Pesou a seu favor ser sobrinho do general Juarez Távora, figura de prestígio entre os militares, que se tornaria ministro do governo Castelo Branco. O presidente da Assembleia, Mauro Benevides, também não deu respaldo à cassação <span class="tag forte">forte</span>.</p>

<h4>Um cearense na Presidência</h4>
<p>O primeiro presidente do regime foi o marechal <b>Humberto de Alencar Castelo Branco</b>, nascido em Fortaleza. Isso não significa que o Ceará tenha tido papel especial no golpe, mas mostra a presença de cearenses no alto comando militar.</p>

<div class="box conceito"><p>Os historiadores usam cada vez mais a expressão <b>golpe civil-militar</b>: os militares tomaram o poder, mas com apoio de empresários, parte da imprensa, parte da Igreja e políticos. Defensores do regime, na época e hoje, chamaram o episódio de “revolução” e o justificaram como reação a uma ameaça comunista. Os historiadores, em sua grande maioria, consideram que foi um golpe contra um governo constitucional <span class="tag consenso">consenso na historiografia</span>.</p></div>
`,

aula('t4-a2',{
objetivo:`<p>Ao final, você vai conhecer as cassações de 1964 no Ceará e os principais instrumentos de repressão da ditadura.</p>`,
explicacao:`
<h4>O porquê: calar adversários</h4>
<p>Para se consolidar, o regime afastou da política quem considerava “subversivo”. A arma mais usada nos primeiros anos foi a <span class="g" data-t="cassacao">cassação</span>.</p>

<h4>A sessão da meia-noite</h4>
<p>A Assembleia Legislativa do Ceará foi uma das primeiras atingidas. Em sessão iniciada à meia-noite de <b>10 de abril de 1964</b>, seis deputados estaduais acusados de ligação com forças “subversivas” tiveram os mandatos cassados, sem direito a defesa <span class="tag forte">forte</span>. Nos dias seguintes, deputados federais cearenses também foram cassados.</p>

<h4>Os instrumentos da repressão</h4>
<ul>
<li><b>Atos Institucionais</b>, que davam ao governo poderes acima da Constituição.</li>
<li>O <span class="g" data-t="bipartidarismo">bipartidarismo</span>, a partir de 1965, com Arena e MDB.</li>
<li>O <span class="g" data-t="ai5">AI-5</span>, de dezembro de 1968, que endureceu o regime.</li>
<li>Prisões, tortura e vigilância por órgãos como o DOPS e os serviços de informação militares.</li>
</ul>

<div class="box conceito"><p>A repressão não atingiu só políticos: professores, estudantes, sindicalistas, padres e jornalistas foram vigiados, presos ou afastados. No Ceará, pesquisas recentes reunidas pelo Inesp estudam a repressão na universidade, no movimento operário e até contra grupos como as travestis de Fortaleza.</p></div>

<div class="box hoje"><p>A antiga sede da Assembleia, onde ocorreu a sessão de 1964, abriga hoje o Museu do Ceará, no Centro de Fortaleza. Em 2025, um dos seis cassados, Amadeu Arrais, era o único ainda vivo.</p></div>
`,

aula('t4-a3',{
objetivo:`<p>Ao final, você vai entender o que foram os “governos dos coronéis” e como os governadores do Ceará eram escolhidos na ditadura.</p>`,
explicacao:`
<h4>O porquê: vinte anos sem votar para governador</h4>
<p>Quem votou para governador em 1962 só voltaria a fazê-lo vinte anos depois. Nesse intervalo, os governadores do Ceará foram escolhidos pelo regime militar e aprovados de forma indireta.</p>

<h4>Os governadores do período</h4>
<p>Sete políticos ocuparam o governo nesses vinte anos. Quatro chegaram ao poder por via indireta, escolhidos pelos deputados: Plácido Castelo, César Cals, Adauto Bezerra e Virgílio Távora (em seu segundo governo) <span class="tag forte">forte</span>.</p>

<h4>O “triunvirato”</h4>
<p>Três coronéis do Exército dominaram a política cearense nesse tempo e ficaram conhecidos como os “três coronéis”:</p>
<ul>
<li><b>César Cals</b>, governador de 1971 a 1975, indicado no governo Médici;</li>
<li><b>Adauto Bezerra</b>, governador de 1975 a 1978, indicado no governo Geisel;</li>
<li><b>Virgílio Távora</b>, que voltou ao governo de 1979 a 1982.</li>
</ul>
<p>Todos eram da Arena. Revezavam-se no poder, às vezes como aliados, às vezes como rivais, e controlavam extensas redes de prefeitos no interior <span class="tag forte">forte</span>.</p>

<div class="box cuidado"><p>Não confunda estes coronéis com os “coronéis” da Primeira República, chefes locais com títulos da Guarda Nacional (Trilha 3). Os de 1970 eram coronéis de verdade, do Exército. Mas críticos viam continuidades: o uso da máquina pública, o clientelismo e o assistencialismo. Defensores lembram obras de infraestrutura e de energia, e iniciativas como a vinda do método Paulo Freire ao Ceará no primeiro governo Virgílio.</p></div>
`,
