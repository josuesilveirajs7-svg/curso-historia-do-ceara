objetivo:`<p>Ao final, você vai conhecer o movimento estudantil cearense contra a ditadura e a repressão na universidade.</p>`,
explicacao:`
<h4>O porquê: os estudantes nas ruas</h4>
<p>Em 1968, estudantes de todo o mundo protestaram. No Brasil, eram a principal voz contra a ditadura. Em Fortaleza, também.</p>

<h4>1968 em Fortaleza</h4>
<p>Enquanto estudantes franceses saíam às ruas de Paris, os cearenses faziam passeatas do Benfica, bairro da Universidade Federal do Ceará, ao Centro. As praças do Ferreira e da Bandeira eram pontos de grandes manifestações <span class="tag forte">forte</span>. Secundaristas, organizados no Centro dos Estudantes Secundaristas Cearenses (CESC), tiveram papel importante.</p>

<h4>A reação</h4>
<p>Depois do AI-5, em fevereiro de 1969, o governo baixou o <b>Decreto 477</b>, que permitia expulsar e punir estudantes e professores por atividade política <span class="tag forte">forte</span>. Entidades estudantis foram fechadas. Na UFC, houve vigilância, intervenção e expulsões. Parte dos militantes passou à clandestinidade, e alguns aderiram à luta armada.</p>

<h4>Reinventar a militância</h4>
<p>Nos anos 1970, mesmo sem entidades legais, os estudantes criaram novos espaços: grupos culturais, jornais, chapas para diretórios. No fim da década, o movimento se reorganizou e participou da campanha pela anistia.</p>

<div class="box conceito"><p>A escolha pela luta armada, feita por uma minoria da esquerda, é debatida até hoje. Para alguns, foi resistência legítima a uma ditadura que fechara os caminhos legais; para outros, foi um erro político e moral. O curso registra o debate sem decidir por você <span class="tag interpretacao">debate</span>.</p></div>
`,

aula('t4-a5',{
objetivo:`<p>Ao final, você vai conhecer o papel de católicos, religiosos e sindicalistas na resistência, com destaque para a história de Frei Tito.</p>`,
explicacao:`
<h4>O porquê: a Igreja dividida</h4>
<p>Em 1964, parte da Igreja apoiou o golpe. Mas, ao longo da ditadura, setores católicos se tornaram críticos e passaram a denunciar a tortura e a defender os pobres.</p>

<h4>Frei Tito de Alencar Lima</h4>
<p>Tito nasceu em Fortaleza em <b>14 de setembro de 1945</b>, caçula de onze filhos. Estudou no Liceu do Ceará e militou na Juventude Estudantil Católica (JEC), chegando a vice-presidente da União Brasileira dos Estudantes Secundaristas <span class="tag forte">forte</span>. Entrou para a Ordem dos Dominicanos e foi estudar em São Paulo.</p>
<p>Em 1969, foi preso com outros dominicanos e brutalmente torturado. Escreveu um relato da tortura que circulou no mundo. Em dezembro de 1970, foi banido do país, trocado com outros presos pelo embaixador suíço sequestrado por um grupo guerrilheiro <span class="tag forte">forte</span>. Exilado na França, nunca se recuperou das sequelas. Foi encontrado morto em <b>10 de agosto de 1974</b>, perto de Lyon. Em 1983, seus restos voltaram a Fortaleza.</p>

<h4>Sindicatos e militância</h4>
<p>Sindicatos urbanos e rurais foram alvo de intervenção logo após o golpe. Nos anos 1970, organizações ligadas à Igreja, como as Comunidades Eclesiais de Base e a Comissão Pastoral da Terra, ajudaram a reorganizar trabalhadores do campo e das periferias.</p>

<div class="box hoje"><p>Em 2025, nos 80 anos de seu nascimento, o Ministério Público do Ceará e o Museu do Ceará organizaram a exposição “80 anos de Frei Tito: Memória e Justiça”.</p></div>
`,

aula('t4-a6',{
objetivo:`<p>Ao final, você vai entender como a censura funcionou e como a imprensa e a cultura cearenses lidaram com ela.</p>`,
explicacao:`
<h4>O porquê: o que não se podia dizer</h4>
<p>Na ditadura, jornais, músicas, peças e filmes passavam por censores. Sobretudo depois do AI-5, notícias sobre tortura, protestos ou críticas ao governo podiam ser cortadas.</p>

<h4>A imprensa</h4>
<p>Os jornais cearenses conviveram com a censura e com a autocensura: para evitar problemas, muitas vezes os próprios editores deixavam de publicar certos assuntos. Parte da imprensa apoiou o regime, sobretudo no início. Jornais alternativos e da Igreja, como o <i>Mutirão</i>, tornaram-se espaços de crítica no fim dos anos 1970 <span class="tag forte">forte</span>.</p>

<h4>A cultura</h4>
<p>Nos anos 1970, uma geração de músicos cearenses ganhou o Brasil: Fagner, Belchior, Ednardo, Amelinha e outros, que ficaram conhecidos como o <b>“Pessoal do Ceará”</b>. Suas canções falavam de juventude, migração e desencanto, muitas vezes em linguagem metafórica que escapava aos censores <span class="tag consenso">consenso</span>. Belchior, nascido em Sobral, tornou-se um dos maiores compositores brasileiros.</p>

<div class="box conceito"><p>A censura não foi só proibição: ela também estimulou a criatividade, com metáforas e duplos sentidos. Mas teve custos reais: obras proibidas, artistas presos ou exilados, e um público privado de informação.</p></div>

<div class="box conexao"><p>A cultura cearense já tinha tradição de crítica e humor, da Padaria Espiritual (Trilha 3) ao cordel. Os artistas dos anos 1970 herdaram parte dessa tradição.</p></div>
`,

aula('t4-a7',{
objetivo:`<p>Ao final, você vai entender a luta pela anistia no Ceará e o processo de abertura política.</p>`,
explicacao:`
<h4>O porquê: trazer de volta os exilados</h4>
<p>Em meados dos anos 1970, o “milagre econômico” acabou e a oposição cresceu. Nas eleições de 1974, o MDB teve grande vitória. Começava a campanha pela anistia.</p>

<h4>O movimento no Ceará</h4>
<p>No Ceará, a luta pela anistia teve forte participação feminina. O <b>Movimento Feminino pela Anistia</b> se organizou no estado a partir de 1976, reunindo mães, irmãs e companheiras de presos e exilados <span class="tag forte">forte</span>. Em 1979, foi instalado o Comitê Brasileiro pela Anistia no Ceará. A deputada estadual Maria Luiza Fontenele, eleita em 1978, participou de ações em defesa da anistia.</p>

<h4>A Lei da Anistia</h4>
<p>Em agosto de 1979, o governo Figueiredo aprovou a <span class="g" data-t="anistia">Lei da Anistia</span>. Exilados voltaram e presos políticos foram libertados. No mesmo ano, acabou o bipartidarismo e surgiram novos partidos, como PDS (sucessor da Arena), PMDB, PT e PDT.</p>

<div class="box conceito"><p>A anistia foi “ampla, geral e irrestrita”? Não como queriam os movimentos: alguns condenados por ações armadas não foram incluídos no início, e agentes do Estado acusados de tortura também foram beneficiados. A interpretação de que a lei protege os torturadores foi confirmada pelo STF em 2010, mas segue contestada por entidades de direitos humanos <span class="tag interpretacao">debate jurídico e político</span>.</p></div>
`,

aula('t4-a8',{
objetivo:`<p>Ao final, você vai entender as eleições de 1982 e 1986 no Ceará e por que a vitória de Tasso Jereissati marcou uma virada.</p>`,
explicacao:`
<h4>O porquê: voltar a votar</h4>
<p>Em 1982, os brasileiros voltaram a eleger governadores pelo voto direto. No Ceará, a escolha do candidato do governo foi resolvida longe do eleitor.</p>

<h4>1982: o “pacto dos coronéis”</h4>
<p>Em 24 de março de 1982, em Brasília, os três coronéis, Virgílio Távora, Adauto Bezerra e César Cals, fizeram um acordo sobre a eleição. O escolhido não foi nenhum deles, mas um técnico, o economista <b>Gonzaga Mota</b>, ex-secretário de Planejamento de Virgílio <span class="tag forte">forte</span>. O CIC, associação de jovens industriais, também influiu na escolha. Gonzaga foi eleito pelo PDS.</p>

<h4>A ruptura</h4>
<p>No governo, Gonzaga Mota rompeu com os padrinhos, apoiou Tancredo Neves na eleição indireta de 1985 e foi para o PMDB <span class="tag forte">forte</span>.</p>

<h4>1986: Tasso Jereissati</h4>
<p>Em 15 de novembro de 1986, o empresário <b>Tasso Jereissati</b>, ex-presidente do CIC, foi eleito governador pelo PMDB, com apoio de Gonzaga Mota e de partidos de esquerda como PCdoB e PCB. Derrotou Adauto Bezerra, apoiado pelos outros coronéis na “Aliança dos Coronéis” <span class="tag forte">forte</span>. Os coronéis tinham alianças com mais de 90% das prefeituras do interior e eram considerados imbatíveis.</p>

<div class="box conceito"><p>A eleição de 1986 é vista como o fim do ciclo dos coronéis e o início de um novo grupo no poder, que governaria o Ceará por cerca de vinte anos. Mas atenção: Tasso não era propriamente “oposição”; era o candidato do governador e tinha o apoio da máquina estadual. A ruptura foi com os coronéis, não com o governo.</p></div>

<div class="box hoje"><p>Em novembro de 2026, os jornais cearenses lembraram os 40 anos dessa eleição.</p></div>
`,

aula('t4-a9',{
objetivo:`<p>Ao final, você vai conhecer a Constituição de 1988, a Constituição do Ceará de 1989 e o que elas mudaram.</p>`,
explicacao:`
<h4>O porquê: as novas regras</h4>
<p>Com o fim da ditadura, era preciso uma nova Constituição. Entre 1987 e 1988, a Assembleia Nacional Constituinte escreveu a Constituição de 1988, chamada por Ulysses Guimarães de “Constituição Cidadã”.</p>

<h4>O que mudou</h4>
<ul>
<li><b>Direitos</b>: voto dos analfabetos e aos 16 anos, fim da censura, direitos sociais.</li>
<li><b>Saúde</b>: criação do Sistema Único de Saúde (SUS), que aproveitou experiências como a dos agentes de saúde do Ceará (Trilha 4, módulo 6).</li>
<li><b>Municípios</b>: mais autonomia e mais recursos para as prefeituras.</li>
<li><b>Povos indígenas e quilombolas</b>: reconhecimento dos direitos às terras que ocupam tradicionalmente (Trilha 4, módulo 11).</li>
<li><b>Soldados da borracha</b>: direito a pensão (Trilha 3, módulo 9).</li>
</ul>

<h4>A Constituição do Ceará</h4>
<p>Cada estado escreveu a sua Constituição. A do Ceará foi promulgada em 1989 pela Assembleia Legislativa, que funciona no Palácio Deputado Adauto Bezerra, com o Plenário 13 de Maio <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Os defensores da Constituição de 1988 destacam os direitos que garantiu; críticos apontam que é muito detalhada e difícil de cumprir. Nos dois casos, ela é a base da vida política atual.</p></div>
`,

aula('t4-a10',{
objetivo:`<p>Ao final, você vai entender o que era o CIC e como um grupo de jovens empresários chegou ao poder no Ceará.</p>`,
explicacao:`
<h4>O porquê: empresários na política</h4>
<p>Empresários sempre influenciaram a política. A novidade no Ceará dos anos 1980 foi um grupo de industriais que decidiu disputar e ocupar diretamente o governo, com um discurso de modernização.</p>

<h4>O CIC</h4>
<p>O <span class="g" data-t="cic">Centro Industrial do Ceará (CIC)</span> foi reativado em 1978 por jovens empresários. Entre 1978 e 1986, foi presidido por Beni Veras, Amarílio Macedo, Tasso Jereissati e Sérgio Machado <span class="tag forte">forte</span>. O grupo promovia debates sobre os problemas do estado e criticava o modelo dos coronéis, que via como atrasado e clientelista.</p>

<h4>Do debate ao governo</h4>
<p>Em 1982, o CIC influiu na escolha de Gonzaga Mota. Mas o grupo considerou que Gonzaga manteve o <span class="g" data-t="clientelismo">clientelismo</span> dos governos anteriores, e isso abriu espaço para que Tasso, “candidato natural do CIC”, se apresentasse como a mudança em 1986 <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Os sociólogos discutem o que esse grupo representou. Para uns, foi a ascensão de uma <b>nova elite empresarial</b> que substituiu a velha elite política. Para outros, foi uma mudança de estilo, com técnicos e discurso de eficiência, mas sem romper com a concentração de poder <span class="tag interpretacao">interpretação</span>.</p></div>

<div class="box hoje"><p>O grupo ficou conhecido como “geração Cambeba”, nome do bairro onde fica o antigo Palácio do Cambeba, sede do governo nesse período.</p></div>
`,

aula('t4-a11',{
objetivo:`<p>Ao final, você vai entender o ajuste fiscal do primeiro governo Tasso Jereissati e o ciclo político que ele iniciou.</p>`,
explicacao:`
<h4>O porquê: um estado quebrado</h4>
<p>Quando Tasso assumiu, em 15 de março de 1987, o governo estava em grave crise: a folha de pagamento atrasava três meses, recursos federais estavam bloqueados para pagar dívidas com bancos e não havia mais crédito com fornecedores <span class="tag forte">forte</span>.</p>

<h4>O ajuste</h4>
<p>O novo governo fez um <span class="g" data-t="ajustefiscal">ajuste fiscal</span> duro:</p>
<ul>
<li>revisão da folha de pagamento e corte de funcionários considerados irregulares;</li>
<li>aumento da arrecadação de impostos;</li>
<li>reforma administrativa e planejamento.</li>
</ul>
<p>O equilíbrio das contas recuperou a capacidade de investir do estado e atraiu a confiança de investidores e de organismos como o Banco Mundial <span class="tag forte">forte</span>.</p>

<h4>O ciclo de vinte anos</h4>
<p>A eleição de Tasso deu início a um ciclo político de cerca de duas décadas. Tasso governou três vezes (1987–1991, 1995–1998 e 1999–2002), e Ciro Gomes, seu aliado na época, governou de 1991 a 1994. Em 1989, ambos foram para o PSDB <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>O ajuste teve custos: servidores demitidos e greves. Também gerou o confronto com a prefeita de Fortaleza Maria Luiza Fontenele, de outro grupo político (módulo 5). Defensores dizem que sem o ajuste nada mais teria sido possível. Críticos dizem que ele priorizou as contas e os investidores sobre os trabalhadores.</p></div>
`,

  o:['Uma','Três','Cinco','Nenhuma'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Quem governou o Ceará entre 1991 e 1994?',
  o:['Ciro Gomes','Cid Gomes','Gonzaga Mota','Lúcio Alcântara'],c:0,
  e:['Correto.','Governou de 2007 a 2014.','Governou de 1983 a 1987.','Governou de 2003 a 2006.']},

<li>Ipea, ${lnk('https://repositorio.ipea.gov.br/bitstream/11058/2615/1/td_0627.pdf','texto para discussão nº 627')}.</li>
<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/politica/2022/07/16/pt-e-ferreira-gomes-como-inimigos-viraram-aliados-e-agora-podem-brigar-de-novo.html','PT e Ferreira Gomes')} (2022).</li>

aula('t4-a12',{
objetivo:`<p>Ao final, você vai conhecer o debate sobre os resultados do “Governo das Mudanças”: avanços reconhecidos e críticas.</p>`,
explicacao:`
<h4>O porquê: modelo ou mito?</h4>
<p>Nos anos 1990, o Ceará virou referência internacional. A cientista política americana Judith Tendler escreveu sobre o estado no livro <i>Bom Governo nos Trópicos</i>. Mas também surgiram críticas fortes.</p>

<h4>Os avanços apontados</h4>
<ul>
<li>Contas públicas equilibradas e capacidade de investimento.</li>
<li>Queda da mortalidade infantil, com o programa de agentes de saúde (módulo 6).</li>
<li>Atração de indústrias, obras de infraestrutura e turismo (módulos 7 e 8).</li>
<li>Planejamento e gestão mais técnicos.</li>
</ul>

<h4>As críticas</h4>
<ul>
<li>A desigualdade e a pobreza continuaram altas. Um relatório do Banco Mundial notou que o crescimento ficou acima da média nacional, mas o progresso social decepcionou <span class="tag forte">forte</span>.</li>
<li>A indústria atraída por incentivos se concentrou na Região Metropolitana de Fortaleza.</li>
<li>O grupo manteve hegemonia por vinte anos, com pouca alternância de poder.</li>
<li>O discurso de ruptura com o “atraso” teria escondido continuidades com a política tradicional.</li>
</ul>

<div class="box conceito"><p>Avaliar uma política pública exige perguntar: <b>melhorou em relação a quê?</b> Em relação ao Ceará de 1986, muitos indicadores melhoraram. Em relação a outros estados ou às promessas feitas, o resultado é mais discutível. Uma boa análise apresenta os dois lados com dados.</p></div>
`,
quiz:[
 {q:'Quem escreveu Bom Governo nos Trópicos, sobre o Ceará?',
  o:['Judith Tendler','Rachel de Queiroz','Celso Furtado','Durval Muniz'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Qual destes é um avanço apontado pelos defensores?',
  o:['Queda da mortalidade infantil','Aumento da seca','Fim das eleições','Fechamento de escolas'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'O que notou um relatório do Banco Mundial citado na imprensa?',
  o:['Que o Ceará não cresceu','Que o crescimento foi alto, mas o progresso social decepcionou','Que o Ceará era o mais rico','Que não havia pobreza'],c:1,
  e:['Cresceu.','Correto.','Não.','Havia.']},
 {q:'Qual é uma crítica sobre a indústria atraída?',
  o:['Concentrou-se na Região Metropolitana de Fortaleza','Foi toda para o Cariri','Não houve indústria','Era estatal'],c:0,
  e:['Correto.','Não.','Houve.','Não.']},

  o:['Quem é o governante mais simpático?','Melhorou em relação a quê?','Quanto custou o cartaz?','Qual é o partido?'],c:1,

fontes:`<ul>
<li>Judith Tendler, <i>Bom Governo nos Trópicos</i> (1998).</li>
<li>${lnk('https://www.bnb.gov.br/revista/ren/article/download/520/408/1090','Revista Econômica do Nordeste, sobre indústria e incentivos no Ceará')}.</li>
<li>${lnk('https://periodicos.fclar.unesp.br/estudos/article/download/347/211/882','Os modernos e os tradicionais')} (2007).</li>

aula('t4-a13',{
objetivo:`<p>Ao final, você vai conhecer a eleição de Maria Luiza Fontenele em 1985 e as dificuldades de sua gestão.</p>`,
explicacao:`
<h4>O porquê: a primeira</h4>
<p>Até 1985, nenhuma mulher tinha sido eleita para governar uma capital brasileira. Fortaleza mudou isso.</p>

<h4>A eleição</h4>
<p>Em <b>15 de novembro de 1985</b>, na primeira eleição direta para prefeito de capital depois da ditadura, a deputada estadual <b>Maria Luiza Fontenele</b>, do PT, venceu com 159.846 votos, cerca de 34% <span class="tag forte">forte</span>. Como não havia segundo turno, ela foi eleita. Junto com Gardênia Gonçalves, eleita em São Luís, foi a primeira mulher eleita prefeita de capital no Brasil. Foi também a primeira capital governada pelo PT.</p>
<p>Nascida em Quixadá em 1942, formada em Serviço Social pela UFC, Maria Luiza tinha sido deputada estadual de 1979 a 1985 e participado da luta pela anistia.</p>

<h4>A gestão</h4>
<p>Tomou posse em 1º de janeiro de 1986, com a presença de Lula. Prometeu combater a corrupção e melhorar a vida nas favelas, com participação popular. Mas enfrentou greve de servidores, contas no vermelho, falta de apoio do governador Tasso e do presidente Sarney, e conflitos internos que levaram à sua saída do PT <span class="tag forte">forte</span>. Em 1989, passou a prefeitura a Ciro Gomes.</p>

<div class="box conceito"><p>Como avaliar a gestão? Alguns apontam inexperiência administrativa. Outros destacam o machismo que ela enfrentou e um problema estrutural: antes da Constituição de 1988, os municípios tinham pouco dinheiro e pouca autonomia. As duas leituras não se excluem <span class="tag interpretacao">interpretação</span>.</p></div>

<div class="box hoje"><p>Fortaleza só voltaria a eleger uma mulher em 2004, com Luizianne Lins. Em 2025, a eleição de Maria Luiza completou 40 anos e ganhou documentário e livro.</p></div>
`,

 {q:'Quando Maria Luiza Fontenele foi eleita prefeita de Fortaleza?',
  o:['15 de novembro de 1985','1964','2004','1992'],c:0,
  e:['Correto.','Não.','Foi Luizianne Lins.','Não.']},
 {q:'Por que sua eleição foi histórica?',
  o:['Primeira mulher eleita prefeita de capital no Brasil (com Gardênia Gonçalves) e primeira capital do PT','Primeiro prefeito homem','Primeira eleição com segundo turno','Primeira governadora'],c:0,
  e:['Correto.','Não.','Não havia segundo turno.','Era prefeita.']},

  o:['Quixadá','Sobral','Recife','Crato'],c:0,
  e:['Correto.','Não.','Não.','Não.']},

  o:['Excesso de dinheiro','Greve de servidores, contas no vermelho e falta de apoio dos governos estadual e federal','Apoio total de todos','Nenhuma'],c:1,
  e:['Não.','Correto.','Não.','Houve muitas.']},

fontes:`<ul>

<li>Guilherme Gonsalves, ${lnk('https://mais.opovo.com.br/colunistas/guilherme-gonsalves/2025/11/14/ha-40-anos-da-eleicao-de-maria-luiza-o-fenomeno-e-rebeldia.html','Há 40 anos da eleição de Maria Luiza')} (O Povo, 2025).</li>

aula('t4-a14',{
objetivo:`<p>Ao final, você vai conhecer os principais grupos e lideranças que governaram Fortaleza depois de 1985.</p>`,
explicacao:`
<h4>O porquê: quem governa a capital</h4>
<p>Fortaleza concentra mais de um quarto da população do Ceará. Quem governa a capital tem enorme peso na política estadual.</p>

<h4>Os prefeitos</h4>
<ul class="tl">
<li><b>1986–1988</b>Maria Luiza Fontenele (então PT).</li>
<li><b>1989–1990</b>Ciro Gomes (PMDB), que deixou o cargo para disputar o governo do estado.</li>
<li><b>1990–1992</b>Juraci Magalhães, vice que assumiu. Voltaria a governar de 1997 a 2004, tornando-se o prefeito mais longevo da cidade.</li>
<li><b>2005–2012</b>Luizianne Lins (PT), segunda mulher prefeita, por dois mandatos.</li>
<li><b>2013–2020</b>Roberto Cláudio, por dois mandatos.</li>
<li><b>2021–2024</b>José Sarto.</li>
<li><b>2025–</b>Evandro Leitão (PT).</li>
</ul>
<p class="muted">Os mandatos foram reunidos de reportagens da imprensa cearense; para datas exatas de posse e saída, confira o site da Câmara Municipal de Fortaleza.</p>

<h4>Os grupos</h4>
<p>A política da capital oscilou entre os grupos de Tasso, dos irmãos Ferreira Gomes, o PT e lideranças próprias, como Juraci. Alianças se formaram e se desfizeram: grupos que foram inimigos viraram aliados, e o contrário. Em 2022 e 2024, as disputas também tiveram forte polarização entre candidatos de esquerda e de direita.</p>

<div class="box conceito"><p>Uma curiosidade: o PT elegeu prefeitos de Fortaleza em intervalos de cerca de vinte anos, com Maria Luiza (1985), Luizianne (2004) e Evandro (2024). Isso não é uma regra, mas mostra como as forças políticas sobem e descem ao longo do tempo.</p></div>
`,

  o:['Juraci Magalhães','Ciro Gomes','Maria Luiza','Evandro Leitão'],c:0,
  e:['Correto.','Ficou pouco mais de um ano.','Não.','Começou em 2025.']},
 {q:'Quem foi a segunda mulher prefeita de Fortaleza?',
  o:['Luizianne Lins','Izolda Cela','Rachel de Queiroz','Gardênia Gonçalves'],c:0,

  e:['Correto.','Não.','Não.','Não.']},
 {q:'Que fração da população do Ceará vive em Fortaleza?',
  o:['Mais de um quarto','Metade','Um décimo','Quase toda'],c:0,
  e:['Correto, cerca de 27%.','Não.','Não.','Não.']},

],

fontes:`<ul>
<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/politica/2025/03/25/gabriella-aguiar-e-a-terceira-mulher-a-assumir-a-prefeitura-de-fortaleza-entenda.html','Gabriella Aguiar é a terceira mulher a assumir a prefeitura')} (2025).</li>

objetivo:`<p>Ao final, você vai conhecer os movimentos sociais urbanos de Fortaleza: associações de bairro, lutas por moradia e participação popular.</p>`,
explicacao:`
<h4>O porquê: a cidade feita pelos moradores</h4>
<p>Boa parte de Fortaleza não foi planejada pelo governo: foi construída por migrantes que ocuparam terrenos e lutaram por água, luz, transporte e escola.</p>

<h4>As lutas</h4>
<ul>
<li><b>Moradia</b>: ocupações de terrenos vazios e resistência a remoções, em bairros como o Pirambu, o Lagamar e o Serviluz.</li>
<li><b>Serviços</b>: associações de moradores reivindicavam água, saneamento, ônibus e postos de saúde.</li>
<li><b>Participação</b>: conselhos populares, orçamento participativo e outras formas de ouvir os moradores, testadas em diferentes gestões.</li>
</ul>
<p>Nos anos 1970 e 1980, muitas dessas lutas tiveram apoio das Comunidades Eclesiais de Base da Igreja Católica e de partidos de oposição <span class="tag forte">forte</span>.</p>

<h4>Hoje</h4>
<p>Segundo o Censo 2022, cerca de um em cada cinco moradores de Fortaleza vive em favelas ou comunidades urbanas, e a maior delas fica no Pirambu <span class="tag forte">forte</span>. Movimentos de juventude, de cultura periférica, de mulheres e de comunidades atingidas por obras continuam ativos.</p>

<div class="box conceito"><p>Os movimentos sociais urbanos mostram que a cidade é disputada: o que para um investidor é terreno valorizado, para um morador é sua casa e sua história. Essa tensão aparece em todo o módulo 9.</p></div>
`,

aula('t4-a16',{
objetivo:`<p>Ao final, você vai conhecer a origem e o funcionamento do Programa de Agentes de Saúde do Ceará.</p>`,
explicacao:`
<h4>O porquê: crianças morrendo de coisas evitáveis</h4>
<p>Nos anos 1980, muitas crianças cearenses morriam antes de completar um ano, sobretudo de diarreia e desnutrição. Eram mortes evitáveis com medidas simples.</p>

<h4>A experiência de Jucás</h4>
<p>Durante a seca de 1979–1983, um médico sanitarista e uma assistente social iniciaram em Jucás uma experiência com agentes de saúde, partindo da ideia de que ações preventivas simples poderiam enfrentar a desnutrição infantil. A desnutrição e o número de mortes caíram <span class="tag forte">forte</span>.</p>

<h4>O programa estadual</h4>
<p>Em 1987, já no governo Tasso, o secretário de Saúde <b>Carlile Lavor</b> criou o <b>Programa de Agentes de Saúde</b>, com recursos do próprio estado. Uma ideia ousada: usar recursos que iriam para frentes de emergência da seca para contratar mulheres da comunidade como agentes <span class="tag forte">forte</span>.</p>

<h4>Como funcionava</h4>
<p>Cada <span class="g" data-t="agentesaude">agente de saúde</span> visitava as famílias de sua área e orientava sobre aleitamento materno, soro de reidratação oral, vacinação e pré-natal, encaminhando casos aos postos e hospitais. Os agentes eram supervisionados por enfermeiras.</p>

<div class="box hoje"><p>Carlile Lavor ficou conhecido como “pai dos agentes comunitários de saúde”. A experiência cearense deu origem ao programa nacional de Agentes Comunitários de Saúde e depois à Estratégia Saúde da Família, base da atenção primária do SUS.</p></div>
`,

aula('t4-a17',{
objetivo:`<p>Ao final, você vai entender o que mudou na mortalidade infantil do Ceará e como interpretar esse resultado.</p>`,
explicacao:`
<h4>O porquê: um número que diz muito</h4>
<p>A taxa de mortalidade infantil mede quantas crianças morrem antes de um ano para cada mil nascidas vivas. É um dos melhores indicadores das condições de vida de uma população.</p>

<h4>A queda</h4>
<p>No início dos anos 1990, a mortalidade infantil no Ceará caiu rapidamente. Em 1993, o programa de agentes de saúde se tornou o primeiro da América Latina a receber o <b>Prêmio Maurice Pate</b>, do UNICEF, pela contribuição ao bem-estar das crianças <span class="tag forte">forte</span>. Nas décadas seguintes, a queda continuou, e o Ceará chegou a ter taxa inferior à média do Nordeste <span class="tag forte">forte</span>.</p>

<h4>Por que caiu?</h4>
<p>Pesquisadores apontam vários fatores, que agiram juntos:</p>
<ul>
<li>os agentes de saúde e o soro de reidratação oral;</li>
<li>a vacinação e o aleitamento materno;</li>
<li>a expansão do saneamento e da água tratada;</li>
<li>a queda da fecundidade e o aumento da escolaridade das mães.</li>
</ul>

<div class="box cuidado"><p>Um pesquisador da área observou que o prêmio do UNICEF rendeu frutos políticos ao governo, mas pouco benefício concreto aos próprios agentes, que tinham salários baixos e vínculos precários <span class="tag interpretacao">interpretação</span>. Isso mostra que um sucesso de política pública pode esconder problemas para quem a executa.</p></div>
`,

aula('t4-a18',{
objetivo:`<p>Ao final, você vai conhecer as políticas de combate à pobreza no Ceará e discutir seus limites.</p>`,
explicacao:`
<h4>O porquê: a pobreza persistente</h4>
<p>Mesmo com crescimento e com programas bem-sucedidos, o Ceará continuou entre os estados mais pobres do país. Por quê?</p>

<h4>As políticas</h4>
<ul>
<li><b>Fecop</b>: em 26 de novembro de 2003, o Ceará criou o Fundo Estadual de Combate à Pobreza, o terceiro do tipo no país, depois de Bahia e Rio de Janeiro <span class="tag forte">forte</span>.</li>
<li><b>Programas federais</b> de transferência de renda, como o Bolsa Família, a partir de 2003, que tiveram grande alcance no Ceará.</li>
<li><b>Convivência com o semiárido</b>: cisternas, crédito para agricultura familiar e tecnologias sociais (Trilha 1).</li>
<li><b>Educação</b>, vista como saída de longo prazo (módulo 10).</li>
</ul>

<h4>Os limites</h4>
<p>A extrema pobreza caiu muito nos anos 2000, mas voltou a crescer em crises econômicas. A desigualdade de renda segue alta, e as diferenças entre capital e interior, entre bairros ricos e periferias, e entre brancos, negros e indígenas continuam grandes <span class="tag consenso">consenso</span>.</p>

<div class="box conceito"><p>Os especialistas discordam sobre o caminho. Uns defendem priorizar o crescimento econômico e a atração de empresas. Outros, a transferência de renda e os serviços públicos. Outros ainda, mudanças estruturais, como acesso à terra e à água. Na prática, os governos combinaram essas estratégias em doses diferentes.</p></div>

<div class="box conexao"><p>As raízes da pobreza no Ceará estão em processos que você estudou: a concentração de terras desde as sesmarias, a vulnerabilidade às secas e a política dos coronéis.</p></div>
`,

aula('t4-a19',{
objetivo:`<p>Ao final, você vai entender a política de incentivos fiscais do Ceará para atrair fábricas, seus resultados e críticas.</p>`,
explicacao:`
<h4>O porquê: empregos para quem sai do campo</h4>
<p>O Ceará tinha muita gente saindo do campo e pouca indústria. A partir dos anos 1990, o governo decidiu atrair fábricas de outros estados e países, oferecendo vantagens.</p>

<h4>O FDI</h4>
<p>O principal instrumento foi o <b>Fundo de Desenvolvimento Industrial (FDI)</b>, que financiava parte do imposto devido pelas empresas, com descontos no pagamento. Entre 1996 e 2003, 306 empresas investiram com benefícios do FDI; as que mais se destacaram foram as de alimentos e bebidas (22%) e as de couros e calçados (18%) <span class="tag forte">forte</span>.</p>

<h4>Os calçados</h4>
<p>As maiores empresas de calçados do país, como Grendene, Paquetá, Dakota e Vulcabrás/Azaleia, vieram para o Ceará atraídas por incentivos, mão de obra abundante e salários mais baixos <span class="tag forte">forte</span>. Cidades como Sobral, Horizonte e Maranguape receberam grandes fábricas.</p>

<h4>O debate</h4>
<p>Defensores apontam a geração de dezenas de milhares de empregos formais e a projeção internacional do setor. Críticos apontam que a <span class="g" data-t="guerrafiscal">guerra fiscal</span> faz os estados abrirem mão de impostos, que muitos empregos são de baixos salários e que a política não conseguiu desconcentrar a indústria: a maior parte dos investimentos ficou na Região Metropolitana de Fortaleza <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>A guerra fiscal é um dilema: para um estado, atrair a fábrica é vantajoso; para o país como um todo, a disputa pode apenas trocar a fábrica de lugar, com menos impostos para todos. A reforma tributária aprovada em 2023 prevê reduzir esse tipo de disputa nos próximos anos.</p></div>
`,
quiz:[
 {q:'O que era o FDI?',
  o:['Um time de futebol','O Fundo de Desenvolvimento Industrial, que financiava parte dos impostos das empresas','Um porto','Uma universidade'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Que setores mais usaram o FDI entre 1996 e 2003?',
  o:['Alimentos e bebidas; couros e calçados','Aviões','Petróleo','Bancos'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Por que as fábricas de calçados vieram para o Ceará?',
  o:['Incentivos, mão de obra abundante e salários mais baixos','Por causa da neve','Por ordem federal','Por acaso'],c:0,

aula('t4-a20',{
objetivo:`<p>Ao final, você vai conhecer a história do Complexo Industrial e Portuário do Pecém e seus impactos.</p>`,
explicacao:`
<h4>O porquê: um porto para a indústria</h4>
<p>O velho porto do Mucuripe, em Fortaleza, não comportava grandes navios nem tinha espaço para indústrias pesadas. O governo decidiu construir um novo porto em águas profundas, longe da capital.</p>

<h4>A construção</h4>
<p>As obras do Porto do Pecém, em São Gonçalo do Amarante, duraram de 1996 a março de 2002, quando o porto foi inaugurado <span class="tag forte">forte</span>. O projeto previa uma siderúrgica e uma refinaria. A siderúrgica demorou: a <b>Companhia Siderúrgica do Pecém (CSP)</b>, hoje ArcelorMittal Pecém, começou a operar em 2016. A refinaria não se concretizou <span class="tag forte">forte</span>.</p>

<h4>O complexo hoje</h4>
<ul>
<li>Porto, área industrial e a <span class="g" data-t="zpe">ZPE</span>.</li>
<li>Desde 2018, sociedade entre o Governo do Ceará e o Porto de Roterdã, na Holanda.</li>
<li>Usinas termelétricas e indústrias de vários setores.</li>
<li>Projeto de um polo de <b>hidrogênio verde</b>, produzido com energia renovável, para exportação.</li>
</ul>

<h4>Impactos</h4>
<p>Pesquisas mostram que o complexo transformou radicalmente o distrito do Pecém, antes lugar de pesca e agricultura: chegaram trabalhadores de fora, o preço da terra subiu e comunidades tradicionais, incluindo indígenas Anacé, foram afetadas por desapropriações <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>O Pecém é um bom exemplo de <b>grande projeto</b>: traz investimentos, empregos e exportações, mas também mudanças bruscas na vida local. Avaliá-lo exige olhar a escala do estado e a escala da comunidade.</p></div>
`,
quiz:[
 {q:'Quando foi inaugurado o Porto do Pecém?',
  o:['1996','2002','2016','1877'],c:1,
  e:['Foi o início das obras.','Correto.','Foi o início da CSP.','Não.']},
 {q:'Em que município fica o Pecém?',
  o:['São Gonçalo do Amarante','Sobral','Crato','Aracati'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'O que o projeto original previa e não se concretizou?',
  o:['A siderúrgica','A refinaria','O porto','A ZPE'],c:1,
  e:['Começou em 2016.','Correto.','Foi feito.','Foi feita.']},
 {q:'Com que porto estrangeiro o Ceará se associou em 2018?',
  o:['Roterdã','Lisboa','Xangai','Nova York'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Que impacto local as pesquisas apontam?',
  o:['Nenhum','Transformação radical do distrito, alta da terra e desapropriações que afetaram comunidades','Fim da indústria','Mais pesca'],c:1,

],

<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/ceara/da-colonizacao-ao-pecem-verde-portos-ajudam-a-desenvolver-o-ceara-ha-mais-de-400-anos-1.3565744','Da colonização ao Pecém verde')}.</li>
<li>Movimento Econômico, ${lnk('https://movimentoeconomico.com.br/economia/portos/2023/02/12/hidrogenio-verde-atrai-a-atencao-de-europeus-para-o-porto-de-pecem/','Hidrogênio verde atrai europeus para o Pecém')} (2023).</li>

aula('t4-a21',{
objetivo:`<p>Ao final, você vai conhecer a história da ferrovia Transnordestina e o debate sobre logística no Ceará.</p>`,
explicacao:`
<h4>O porquê: escoar a produção</h4>
<p>Para levar grãos e minérios do interior do Nordeste ao porto, é preciso transporte barato e em grande volume. Ferrovias fazem isso melhor do que caminhões.</p>

<h4>Uma obra de vinte anos</h4>
<p>A construção da nova <b>Transnordestina</b> completou oficialmente vinte anos em junho de 2026, entre rescisões de contrato e paralisações <span class="tag forte">forte</span>. A ferrovia ligará Eliseu Martins, no Piauí, ao Complexo do Pecém. No Ceará, são 527 quilômetros, com terminais de carga previstos em Missão Velha, Iguatu e Quixeramobim <span class="tag forte">forte</span>.</p>

<h4>Onde está</h4>
<p>Em setembro de 2026, com a entrega do trecho entre Quixadá e Quixeramobim, a primeira fase somava 832 km executados de 1.053 km previstos entre Paes Landim (PI) e o Pecém, cerca de 84% <span class="tag forte">forte</span>. A previsão das empresas é concluir as obras no Ceará entre 2027 e 2028.</p>

<div class="box conexao"><p>O Ceará já teve ferrovias: a de Baturité, iniciada no Império, e a de Sobral (Trilha 2). Muitas linhas antigas foram abandonadas. Uma malha de quase 600 km da antiga Transnordestina, sem operar há anos, voltou à União em 2026.</p></div>

<div class="box conceito"><p>A demora da Transnordestina é um caso estudado de <b>obra pública que atravessa governos</b>: mudanças de projeto, de empresas e de prioridades fizeram o prazo ser adiado várias vezes. Governos de diferentes partidos prometeram concluí-la.</p></div>
`,

  o:['Dois','Vinte','Cem','Cinco'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Que dois pontos a ferrovia vai ligar?',
  o:['Eliseu Martins (PI) e o Pecém (CE)','Fortaleza e Rio de Janeiro','Crato e Recife','Sobral e Belém'],c:0,
  e:['Correto.','Não.','Não.','Não.']},

  e:['Correto.','Não.','Não.','Há.']},
 {q:'Por que ferrovias são vantajosas para grãos?',
  o:['Transportam grandes volumes com custo menor','São mais rápidas que aviões','Não precisam de trilhos','São gratuitas'],c:0,
  e:['Correto.','Não.','Precisam.','Não.']},

<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/economia/2026/09/19/transnordestina-conclui-trecho-entre-quixada-e-quixeramobim-e-chega-a-84-de-conclusao.html','Transnordestina chega a 84% de conclusão')} (2026).</li>
<li>O Povo, ${lnk('https://www.opovo.com.br/noticias/economia/2026/03/10/transnordestina-no-ceara-obras-entram-em-fases-finais.html','Obras entram em fases finais')} (2026).</li>

aula('t4-a22',{
objetivo:`<p>Ao final, você vai entender como o litoral cearense passou do veraneio ao turismo de massa.</p>`,
explicacao:`
<h4>O porquê: o mar descoberto</h4>
<p>Por muito tempo, as elites de Fortaleza viraram as costas para o mar: a praia era lugar de pescadores, do porto e dos pobres. Ao longo do século XX, isso mudou.</p>

<h4>Etapas</h4>
<ul class="tl">
<li><b>Início do século XX</b>A Praia de Iracema e outras praias passam a atrair banhistas e casas de veraneio.</li>
<li><b>Meados do século</b>A Avenida Beira-Mar e os bairros à beira-mar se valorizam; famílias de classe média e alta constroem casas de praia em municípios vizinhos.</li>
<li><b>Anos 1970 e 1980</b>Mochileiros “descobrem” praias distantes, como Jericoacoara e Canoa Quebrada.</li>
<li><b>Anos 1990 em diante</b>O governo estadual elege o turismo como estratégia econômica. Programas como o Prodetur financiam estradas, saneamento e aeroportos. Chegam hotéis, resorts e voos internacionais.</li>
</ul>

<h4>Os efeitos</h4>
<p>O turismo gera empregos e renda, mas também traz <span class="g" data-t="especulacao">especulação imobiliária</span>, segundas residências que ficam vazias boa parte do ano, pressão sobre dunas e mangues e conflitos com comunidades tradicionais <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Geógrafos falam em <b>maritimidade</b> para descrever como a sociedade passou a valorizar o mar. No Ceará, essa valorização foi rápida e transformou a imagem do estado: de “terra da seca” a “terra do sol e do mar”.</p></div>
`,
quiz:[
 {q:'Como as elites de Fortaleza viam o mar até o início do século XX?',
  o:['Como lugar de lazer chique','Como lugar de pescadores, porto e pobres','Como lugar proibido','Não conheciam o mar'],c:1,
  e:['Isso veio depois.','Correto.','Não.','Conheciam.']},
 {q:'Quem “descobriu” Jericoacoara e Canoa Quebrada nos anos 1970?',
  o:['Mochileiros','Holandeses','Bandeirantes','Cangaceiros'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'O que financiou o Prodetur?',
  o:['Estradas, saneamento e aeroportos para o turismo','Açudes no sertão','Escolas militares','Navios de guerra'],c:0,
  e:['Correto.','Não é o foco.','Não.','Não.']},
 {q:'Qual é um efeito negativo do turismo apontado por pesquisadores?',
  o:['Especulação imobiliária e conflitos com comunidades','Fim do sol','Excesso de pesca artesanal','Nenhum'],c:0,
  e:['Correto.','Não.','Não.','Há.']},
 {q:'O que significa “maritimidade”?',
  o:['A valorização social do mar','Um tipo de navio','Uma doença','Uma lei'],c:0,
  e:['Correto.','Não.','Não.','Não.']}
],

fontes:`<ul>
<li>${lnk('https://repositorio.ufc.br/ri/bitstream/riufc/7909/1/2007_dis_iclima.pdf','Ingrid Carneiro de Lima, Os ventos da maritimidade no litoral do Ceará')} (UFC, 2007).</li>
<li>${lnk('https://periodicos.ufc.br/mercator/article/download/99870/255156/388815','Revista Mercator')}.</li>
</ul>`

aula('t4-a23',{
objetivo:`<p>Ao final, você vai conhecer as histórias de Jericoacoara e Canoa Quebrada e os desafios de proteger lugares que viraram destinos famosos.</p>`,
explicacao:`
<h4>O porquê: o paraíso tem limite?</h4>
<p>Jericoacoara e Canoa Quebrada eram vilas de pescadores. Hoje recebem visitantes do mundo todo. Como preservar o que atrai os turistas?</p>

<h4>Jericoacoara</h4>
<p>Até os anos 1970, Jeri era habitada por poucas famílias de pescadores. No fim da década, foi “descoberta” por mochileiros que buscavam lugares isolados <span class="tag forte">forte</span>. Em 1984, a região virou Área de Proteção Ambiental e, em <b>4 de fevereiro de 2002</b>, parte dela se tornou o <b>Parque Nacional de Jericoacoara</b>, hoje administrado pelo ICMBio <span class="tag forte">forte</span>. A construção de um aeroporto regional e programas de turismo aceleraram o crescimento.</p>

<h4>Canoa Quebrada</h4>
<p>Em Aracati, Canoa Quebrada também atraiu, nos anos 1970, jovens alternativos e artistas, que se misturaram aos pescadores. Com o tempo, a vila ganhou pousadas, bares e um fluxo constante de turistas.</p>

<h4>Os desafios</h4>
<ul>
<li>Pressão de construções sobre dunas e lagoas.</li>
<li>Disputa pela terra: moradores antigos vendem casas ou são pressionados a sair.</li>
<li>Lixo, esgoto e água em lugares sem infraestrutura planejada.</li>
<li>Debates sobre concessões a empresas e regras de acesso.</li>
</ul>

<div class="box conceito"><p>Pesquisadores falam de um <b>turismo contra-hegemônico</b> ou comunitário, em que os próprios moradores controlam os serviços e os benefícios ficam na comunidade. É uma alternativa ao modelo de grandes resorts.</p></div>
`,
quiz:[
 {q:'Quando Jericoacoara virou Parque Nacional?',
  o:['1984','2002','1970','2020'],c:1,
  e:['Foi a APA.','Correto.','Não.','Não.']},
 {q:'Quem administra o Parque Nacional de Jericoacoara?',
  o:['ICMBio','Prefeitura de Fortaleza','UNESCO','Exército'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Em que município fica Canoa Quebrada?',
  o:['Aracati','Jijoca','Caucaia','Sobral'],c:0,
  e:['Correto.','É onde fica Jeri.','Não.','Não.']},
 {q:'Qual destes é um desafio desses destinos?',
  o:['Pressão de construções sobre dunas e lagoas','Falta de sol','Excesso de neve','Nenhum'],c:0,
  e:['Correto.','Não.','Não.','Há vários.']},
 {q:'O que é turismo comunitário?',
  o:['Turismo em que os moradores controlam os serviços e os benefícios ficam na comunidade','Turismo só para ricos','Turismo proibido','Turismo de navios'],c:0,
  e:['Correto.','Não.','Não.','Não.']}
],
exercicio:`<p><b>Regras para um paraíso.</b> Imagine que você é conselheiro do Parque Nacional de Jericoacoara. Proponha cinco regras para conciliar turismo e preservação, explicando cada uma.</p>`,
fontes:`<ul>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/ceara/de-vila-de-pescadores-a-paraiso-turistico-como-jericoacoara-se-tornou-um-destino-internacional-1.3585685','De vila de pescadores a paraíso turístico')}.</li>
<li>Decreto de ${lnk('https://faolex.fao.org/docs/pdf/bra48665.pdf','4 de fevereiro de 2002')}, que cria o Parque Nacional de Jericoacoara.</li>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/ceara/como-a-especulacao-em-jericoacoara-tem-ajudado-a-desconstruir-um-paraiso-turistico-no-ceara-1.3656996','Como a especulação tem ajudado a desconstruir um paraíso')}.</li>
</ul>`

aula('t4-a24',{
objetivo:`<p>Ao final, você vai conhecer os conflitos entre comunidades pesqueiras, empresários e o Estado no litoral cearense, com o exemplo da Prainha do Canto Verde.</p>`,
explicacao:`
<h4>O porquê: de quem é a praia?</h4>
<p>As comunidades de pescadores vivem há gerações no litoral, muitas vezes sem documento da terra. Quando a praia se valoriza, surgem compradores, grileiros e projetos que ameaçam expulsá-las.</p>

<h4>A Prainha do Canto Verde</h4>
<p>Em Beberibe, a comunidade da Prainha do Canto Verde tornou-se referência na luta contra a especulação imobiliária e pela pesca artesanal. Depois de anos de mobilização, foi criada por decreto, em <b>5 de junho de 2009</b>, a <span class="g" data-t="resex">Reserva Extrativista</span> Prainha do Canto Verde, com cerca de 29,8 mil hectares de terra e mar <span class="tag forte">forte</span>.</p>
<p>A criação da reserva não encerrou os conflitos: parte dos moradores, apoiada por um empresário, passou a contestá-la, e o ICMBio continua fazendo fiscalizações contra ocupações irregulares <span class="tag forte">forte</span>.</p>

<h4>Outros conflitos</h4>
<p>Comunidades como o Quilombo do Cumbe, em Aracati, e os Tremembé da Barra do Mundaú, em Itapipoca, também enfrentaram conflitos com empresas de turismo e de energia, como parques eólicos e fazendas de camarão <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Nesses conflitos, há interesses legítimos dos dois lados: empregos e energia limpa, de um lado; território, modo de vida e direitos, do outro. A Constituição e as leis ambientais oferecem instrumentos, como reservas e terras indígenas, mas sua aplicação é lenta e disputada.</p></div>
`,
quiz:[
 {q:'Onde fica a Prainha do Canto Verde?',
  o:['Beberibe','Fortaleza','Sobral','Crato'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Quando foi criada a Resex da Prainha do Canto Verde?',
  o:['5 de junho de 2009','1984','2002','1877'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'O que é uma Reserva Extrativista?',
  o:['Uma mina','Unidade de conservação onde populações tradicionais usam os recursos de forma sustentável','Um resort','Uma base militar'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'A criação da reserva encerrou os conflitos?',
  o:['Sim','Não; parte dos moradores a contesta e há ocupações irregulares','Não havia conflito','A reserva foi extinta'],c:1,
  e:['Não.','Correto.','Havia.','Não.']},
 {q:'Que outras atividades geram conflitos no litoral?',
  o:['Parques eólicos e fazendas de camarão','Plantações de café','Mineração de ouro','Nenhuma'],c:0,
  e:['Correto.','Não.','Não.','Há.']}
],
exercicio:`<p><b>Conflito em pauta.</b> Escolha um conflito no litoral cearense. Identifique os atores, o que cada um quer e que instrumentos legais existem. Este é o início do projeto do nível.</p>`,
fontes:`<ul>
<li>Decreto de ${lnk('https://faolex.fao.org/docs/pdf/bra93838.pdf','5 de junho de 2009')}, que cria a Resex Prainha do Canto Verde.</li>

<li>Brasil de Fato, ${lnk('https://www.brasildefato.com.br/2016/12/26/comunidades-tradicionais-no-ceara-sofrem-perseguicao-em-conflito-pela-terra/','Comunidades tradicionais no Ceará sofrem perseguição')} (2016).</li>
</ul>`

objetivo:`<p>Ao final, você vai entender como Fortaleza cresceu no século XX e por que formou extensas periferias.</p>`,
explicacao:`
<h4>O porquê: a cidade que recebe o sertão</h4>
<p>A cada seca, milhares de sertanejos vinham para Fortaleza. Muitos ficavam. Com o êxodo rural da segunda metade do século XX, a cidade explodiu.</p>

<h4>Os números</h4>
<p>No Censo de 2022, Fortaleza tinha 2.428.708 habitantes e passou a ser a quarta cidade mais populosa do Brasil, à frente de Salvador. É também a capital com maior densidade demográfica do país <span class="tag forte">forte</span>. A Região Metropolitana tinha cerca de 3,4 milhões de pessoas.</p>

<h4>Como cresceram as periferias</h4>
<ul>
<li>Migrantes ocuparam áreas desvalorizadas: margens de rios e lagoas, dunas, beira de trilhos.</li>
<li>O poder público construiu conjuntos habitacionais longe do centro, muitas vezes sem serviços.</li>
<li>Os bairros mais ricos se concentraram a leste, na Aldeota, no Meireles e arredores.</li>
<li>Nas últimas décadas, a cidade “transbordou” para municípios vizinhos, como Caucaia, Maracanaú e Itaitinga.</li>
</ul>

<div class="box conceito"><p>O bairro mais populoso de Fortaleza é o Jangurussu, com cerca de 70 mil moradores, mais do que muitas cidades do interior. Mais de 140 municípios cearenses perderam população entre 2010 e 2022, enquanto a capital e seu entorno cresceram <span class="tag forte">forte</span>.</p></div>

<div class="box conexao"><p>Esse crescimento continua a história das migrações (Trilha 3, módulo 11) e dos retirantes da seca (Trilhas 2 e 3).</p></div>
`,

aula('t4-a26',{
objetivo:`<p>Ao final, você vai entender os problemas de moradia, transporte e desigualdade em Fortaleza e algumas respostas tentadas.</p>`,
explicacao:`
<h4>O porquê: a cidade partida</h4>
<p>Em poucos quilômetros, Fortaleza vai de bairros com prédios altos de frente para o mar a comunidades sem esgoto. Essa desigualdade organiza a vida de quem mora na cidade.</p>

<h4>Moradia</h4>
<p>Segundo o Censo 2022, 578 mil pessoas viviam em favelas ou comunidades urbanas, cerca de um quinto da população. A maior favela do Ceará, Santa Elisa, fica no Pirambu <span class="tag forte">forte</span>. Ao mesmo tempo, a cidade se verticaliza: mais de meio milhão de pessoas vivem em apartamentos.</p>

<h4>Transporte</h4>
<p>A maior parte da população depende de ônibus. Nas últimas décadas, foram implantadas linhas de metrô e VLT, corredores exclusivos de ônibus e ciclofaixas. Mas as viagens entre periferia e centro continuam longas para muitos trabalhadores.</p>

<h4>Desigualdade</h4>
<p>Estudos do Ipece com dados do Censo 2022 mostram grandes diferenças de renda entre as regionais administrativas e entre os bairros de Fortaleza <span class="tag forte">forte</span>. Bairros com menor renda concentram também piores indicadores de saneamento, violência e escolaridade.</p>

<div class="box conceito"><p>Urbanistas falam em <b>direito à cidade</b>: o direito de todos os moradores ao espaço urbano, aos serviços e às decisões sobre a cidade. O conceito ajuda a entender as lutas por moradia e transporte.</p></div>
`,

aula('t4-a27',{
objetivo:`<p>Ao final, você vai conhecer a cultura urbana de Fortaleza e o debate sobre a identidade cearense hoje.</p>`,
explicacao:`
<h4>O porquê: o que é ser cearense hoje?</h4>
<p>A imagem tradicional do Ceará era o sertão, a seca, o vaqueiro e a jangada. Uma metrópole de milhões de pessoas produziu novas identidades.</p>

<h4>Expressões da cultura urbana</h4>
<ul>
<li><b>Humor</b>: o Ceará ficou conhecido nacionalmente por seus humoristas, e o “Ceará moleque” virou parte da identidade.</li>
<li><b>Música</b>: do forró, que ganhou versões eletrônicas de grande sucesso a partir dos anos 1990, ao rap e ao hip hop das periferias.</li>
<li><b>Festas</b>: quadrilhas juninas, que se tornaram grandes espetáculos, e o pré-carnaval de Fortaleza.</li>
<li><b>Equipamentos culturais</b>: o Centro Dragão do Mar de Arte e Cultura, inaugurado em 1999 na Praia de Iracema, e os Cucas, centros culturais nas periferias.</li>
</ul>

<h4>Identidade em debate</h4>
<p>Alguns valorizam a mistura de tradição e modernidade. Outros criticam o uso da cultura como produto turístico. E grupos antes invisíveis, como indígenas, quilombolas, negros e LGBTQIA+, reivindicam seu lugar na história e na identidade do estado (módulo 11).</p>

<div class="box conexao"><p>A ideia de um povo cearense “moleque”, irreverente, tem raízes antigas, como a Padaria Espiritual (Trilha 3) e a famosa vaia ao Sol na Praça do Ferreira, em 1942. Mas toda identidade é uma construção, e nenhuma resume todos.</p></div>
`,

aula('t4-a28',{
objetivo:`<p>Ao final, você vai conhecer a reforma educacional de Sobral a partir de 1997 e por que ela ficou famosa.</p>`,
explicacao:`
<h4>O porquê: crianças que não sabiam ler</h4>
<p>No fim dos anos 1990, Sobral tinha escolas precárias, muitos alunos atrasados em relação à idade e um problema grave: crianças passavam anos na escola sem aprender a ler.</p>

<h4>O diagnóstico</h4>
<p>Com uma nova gestão municipal, iniciada em 1997, a prefeitura reorganizou a rede. Um diagnóstico feito em 2000 revelou que quase metade dos alunos da segunda série não sabia ler. Em 2001, o município estabeleceu a meta de alfabetizar 100% das crianças ao final do 2º ano <span class="tag forte">forte</span>.</p>

<h4>O que foi feito</h4>
<ul>
<li>Foco absoluto na alfabetização nos primeiros anos.</li>
<li>Avaliações externas frequentes para saber quem estava aprendendo.</li>
<li>Formação e acompanhamento dos professores, com material estruturado.</li>
<li>Escolha de diretores por critérios técnicos e metas por escola.</li>
<li>Reconhecimento das escolas com melhores resultados.</li>
</ul>

<h4>Os resultados</h4>
<p>No <span class="g" data-t="ideb">Ideb</span> dos anos iniciais, Sobral passou de 4,0 em 2005 para 8,8 em 2015, e passou a ocupar as primeiras colocações do país entre os municípios de mais de 100 mil habitantes <span class="tag forte">forte</span>.</p>

<div class="box hoje"><p>Pessoas que trabalharam na educação de Sobral, como Izolda Cela, depois ocuparam a Secretaria de Educação do estado e levaram o modelo para todo o Ceará. Izolda viria a ser a primeira mulher governadora do Ceará, em 2022.</p></div>
`,

aula('t4-a29',{
objetivo:`<p>Ao final, você vai conhecer o PAIC, a expansão da política de alfabetização para todo o Ceará e para o Brasil.</p>`,
explicacao:`
<h4>O porquê: de uma cidade para o estado</h4>
<p>Se funcionou em Sobral, poderia funcionar no Ceará inteiro? Em 2007, o governo estadual decidiu tentar.</p>

<h4>O PAIC</h4>
<p>Em 2007, no governo Cid Gomes, a Secretaria de Educação criou o <span class="g" data-t="paic">Programa Alfabetização na Idade Certa (PAIC)</span>, um amplo programa de apoio à gestão municipal e escolar, com adesão de todos os municípios <span class="tag forte">forte</span>. O estado oferecia avaliações, material didático, formação de professores e acompanhamento.</p>

<h4>O incentivo</h4>
<p>Uma inovação foi ligar parte da cota do ICMS (imposto estadual repassado aos municípios) aos resultados da educação. Quanto melhor o desempenho, mais recursos para a prefeitura <span class="tag forte">forte</span>.</p>

<h4>Os resultados</h4>
<p>Segundo a avaliação estadual (Spaece), o percentual de crianças alfabetizadas ao final do 2º ano saltou de 39,9% para 87% entre 2007 e 2016. O Ceará passou a ter o melhor Ideb do Nordeste e muitas das melhores escolas públicas do país nos anos iniciais <span class="tag forte">forte</span>.</p>

<h4>Para o Brasil</h4>
<p>Cinco anos depois da criação do PAIC, o programa inspirou uma política nacional, que durou até 2018. Em 2023, o ex-governador Camilo Santana, como ministro da Educação, lançou uma nova política nacional de alfabetização com base na experiência cearense.</p>
`,

aula('t4-a30',{
objetivo:`<p>Ao final, você vai conhecer as críticas e os debates sobre os resultados educacionais do Ceará.</p>`,
explicacao:`
<h4>O porquê: números e aprendizado</h4>
<p>Os resultados do Ceará são reconhecidos por organismos nacionais e internacionais. Mas pesquisadores e professores também levantam questões importantes.</p>

<h4>As críticas</h4>
<ul>
<li><b>Ensinar para a prova</b>: a pressão por resultados pode reduzir o currículo ao que cai nas avaliações.</li>
<li><b>Um só indicador</b>: o Ideb virou “o norte” de municípios e escolas, deixando de lado outras dimensões da educação <span class="tag forte">forte</span>.</li>
<li><b>Adultos esquecidos</b>: Sobral, como o Brasil em geral, deu pouca atenção à educação de jovens e adultos, e há muitos adultos analfabetos <span class="tag forte">forte</span>.</li>
<li><b>Anos finais e ensino médio</b>: os ganhos nos anos iniciais não se repetiram com a mesma força nas etapas seguintes.</li>
<li><b>Pressão sobre professores</b>: metas e bônus podem gerar estresse e competição.</li>
</ul>

<h4>As respostas</h4>
<p>Defensores respondem que avaliar é necessário para saber quem não está aprendendo, que a alfabetização é a base de todo o resto e que os ganhos foram confirmados por avaliações nacionais independentes, não só pelas estaduais.</p>

<div class="box conceito"><p>O debate mostra uma questão central das políticas públicas: <b>o que medimos acaba guiando o que fazemos</b>. Bons indicadores ajudam; mas nenhum indicador captura tudo o que importa na educação.</p></div>
`,
quiz:[
 {q:'O que significa “ensinar para a prova”?',
  o:['Reduzir o currículo ao que cai nas avaliações','Não fazer provas','Dar provas fáceis','Ensinar a colar'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Que grupo foi pouco atendido, segundo críticos?',
  o:['Jovens e adultos analfabetos','Crianças do 2º ano','Professores de matemática','Diretores'],c:0,
  e:['Correto.','Foram o foco.','Não.','Não.']},
 {q:'Os ganhos se repetiram com a mesma força no ensino médio?',
  o:['Sim, iguais','Não com a mesma força','O ensino médio piorou muito','Não há ensino médio'],c:1,
  e:['Não.','Correto.','Não é isso.','Há.']},
 {q:'Qual é um argumento dos defensores?',
  o:['Que avaliar é necessário para saber quem não está aprendendo','Que provas são inúteis','Que não houve resultados','Que só Sobral importa'],c:0,
  e:['Correto.','Não.','Houve.','Não.']},
 {q:'Que lição geral o debate mostra?',
  o:['O que medimos acaba guiando o que fazemos','Que não se deve medir nada','Que só números importam','Que educação não muda'],c:0,
  e:['Correto.','Não.','Não.','Não.']}
],

fontes:`<ul>
<li>CartaCapital, ${lnk('https://www.cartacapital.com.br/?p=59216','A verdade sobre o Ideb de Sobral')}.</li>
<li>Banco Mundial, ${lnk('https://documents1.worldbank.org/curated/en/416541593599290439/pdf/From-Bad-to-Best-How-One-State-and-One-Municipality-in-Brazil-are-Eradicating-Illiteracy-and-Innumeracy.pdf','De mal a melhor')} (2020).</li>
<li>O Povo, ${lnk('https://mais.opovo.com.br/reportagens-especiais/ceara-educacao-referencia-nacional/2024/11/25/como-o-ceara-mudou-o-rumo-das-politicas-educacionais.html','Como o Ceará mudou o rumo das políticas educacionais')} (2024).</li>
</ul>`

aula('t4-a31',{
objetivo:`<p>Ao final, você vai entender a ressurgência indígena no Ceará e a luta pela demarcação de terras.</p>`,
explicacao:`
<h4>O porquê: os “extintos” que voltaram</h4>
<p>No século XIX, autoridades declararam que os indígenas do Ceará estavam “misturados” ou extintos, e suas terras foram tomadas (Trilha 2). Mas as famílias e as memórias continuaram.</p>

<h4>A ressurgência</h4>
<p>A partir dos anos 1980, com apoio de setores da Igreja, de pesquisadores e de movimentos indígenas nacionais, povos como os <b>Tapeba</b>, os <b>Tremembé</b>, os <b>Pitaguary</b>, os <b>Jenipapo-Kanindé</b> e os <b>Anacé</b> passaram a se afirmar publicamente e a reivindicar terras. Os antropólogos chamam isso de <span class="g" data-t="ressurgencia">ressurgência</span> ou emergência étnica <span class="tag consenso">consenso</span>.</p>

<h4>Os números</h4>
<p>O Censo 2022 registrou <b>56.353 pessoas indígenas</b> no Ceará, quase o triplo de 2010. Foram identificadas cerca de 200 localidades indígenas em mais de 30 municípios, mas a maioria fora de terras oficialmente delimitadas <span class="tag forte">forte</span>.</p>

<h4>A demarcação</h4>
<p>Em 2003, a Terra Indígena Tremembé do Córrego do João Pereira foi a primeira homologada no Ceará. A segunda, Tremembé da Barra do Mundaú, só foi oficializada em 2023 <span class="tag forte">forte</span>. A terra Tapeba, em Caucaia, é uma das mais populosas e teve sua demarcação anunciada como prioridade, num processo que se arrasta há décadas.</p>

<div class="box conceito"><p>Por que a demarcação é tão lenta? Há conflitos com proprietários, empresas e ocupantes não indígenas, disputas judiciais e falta de estrutura dos órgãos. Na terra Tapeba, por exemplo, milhares de moradores não se declaram indígenas. Cada caso envolve direitos e interesses em choque.</p></div>
`,
quiz:[
 {q:'O que é ressurgência indígena?',
  o:['O fim dos indígenas','Povos considerados extintos voltando a se afirmar e a reivindicar direitos','Uma doença','Uma lei de 1850'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Quantos indígenas o Censo 2022 registrou no Ceará?',
  o:['Cerca de 56 mil','Nenhum','Cerca de 500','Cerca de 5 milhões'],c:0,

 {q:'Onde fica a terra Tapeba?',
  o:['Caucaia','Crato','Sobral','Iguatu'],c:0,

],

aula('t4-a32',{
objetivo:`<p>Ao final, você vai conhecer os quilombos do Ceará e a luta pelo reconhecimento de seus territórios.</p>`,
explicacao:`
<h4>O porquê: “no Ceará tem quilombo, sim”</h4>
<p>Por muito tempo, repetiu-se que no Ceará quase não houve escravidão negra e, portanto, não haveria quilombos. A pesquisa histórica e os próprios quilombolas mostraram o contrário (Trilha 2).</p>

<h4>Os números</h4>
<p>O Censo 2022, o primeiro a contar a população quilombola, registrou <b>23.955 quilombolas</b> no Ceará, a 10ª maior população do país, em cerca de 67 municípios. Só cerca de 19% vivem em territórios quilombolas oficialmente delimitados <span class="tag forte">forte</span>.</p>

<h4>O reconhecimento</h4>
<p>O caminho tem etapas: a comunidade se autodefine quilombola; a Fundação Cultural Palmares emite a certidão; o Incra faz os estudos e a <span class="g" data-t="titulacao">titulação</span>. Em dezembro de 2022, 57 comunidades cearenses eram certificadas pela Palmares. Cinco tinham o processo de titulação mais avançado, mas aguardavam o título havia quase dez anos <span class="tag forte">forte</span>.</p>

<h4>Desigualdades</h4>
<p>A taxa de analfabetismo entre quilombolas cearenses era de 26,4% no Censo 2022, quase o dobro da população geral do estado (14,1%) <span class="tag forte">forte</span>. Saneamento e acesso à saúde também são desafios.</p>

<div class="box conceito"><p>A lentidão na titulação é atribuída por pesquisadores e lideranças à negação histórica da população negra no Ceará, além dos conflitos fundiários e da falta de estrutura dos órgãos <span class="tag interpretacao">interpretação</span>.</p></div>
`,

  o:['23.955','Nenhum','500','2 milhões'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Que posição o Ceará ocupa em população quilombola?',
  o:['10ª','1ª','27ª','Não tem'],c:0,
  e:['Correto.','Não.','Não.','Tem.']},

  o:['Fundação Cultural Palmares','DNOCS','Sudene','IBGE'],c:0,

  o:['Incra','Palmares','Funai','Ibama'],c:0,

<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/etc/2024/08/04/o-que-sao-as-comunidades-quilombolas.html','O que são as comunidades quilombolas')} (2024).</li>
<li>Zelma Madeira, ${lnk('https://diariodonordeste.verdesmares.com.br/opiniao/colunistas/zelma-madeira/no-ceara-tem-quilombo-sim-1.3403047','No Ceará tem quilombo sim')} (Diário do Nordeste).</li>

aula('t4-a33',{
objetivo:`<p>Ao final, você vai entender por que identidade, censo e direitos estão ligados, e o que os números recentes revelam.</p>`,
explicacao:`
<h4>O porquê: contar é reconhecer</h4>
<p>Durante muito tempo, os censos não contavam indígenas fora das terras demarcadas, nem quilombolas. Quem não é contado tende a ser esquecido pelas políticas públicas.</p>

<h4>O que o Censo 2022 mudou</h4>
<ul>
<li>Pela primeira vez, contou a população <b>quilombola</b>.</li>
<li>Melhorou a captura do pertencimento <b>indígena</b>, inclusive fora das terras delimitadas, com participação de lideranças.</li>
<li>Registrou aumento nas autodeclarações de pretos, pardos e indígenas no Ceará <span class="tag forte">forte</span>.</li>
</ul>

<h4>Por que os números cresceram</h4>
<p>O aumento não significa que surgiram pessoas novas, mas que mais pessoas se sentiram seguras para se declarar e que o método de contagem melhorou. Os números refletem também a força dos movimentos e a redução do preconceito <span class="tag interpretacao">interpretação</span>.</p>

<h4>Direitos</h4>
<p>A Constituição de 1988 garante aos indígenas o direito às terras que ocupam tradicionalmente e aos quilombolas o direito à propriedade de seus territórios. Há também políticas específicas de saúde, educação e cotas. Em 2023, o Ceará criou uma Secretaria dos Povos Indígenas.</p>

<div class="box conceito"><p>A autodeclaração é o critério usado pelo IBGE e reconhecido internacionalmente. Críticos às vezes questionam “quem é de verdade” indígena ou quilombola; mas a identidade étnica não depende de aparência, e sim de pertencimento a uma comunidade e de sua história.</p></div>
`,
quiz:[
 {q:'O que o Censo 2022 fez pela primeira vez?',
  o:['Contou a população quilombola','Contou a população total','Contou os carros','Contou os indígenas pela primeira vez na história'],c:0,
  e:['Correto.','Já era contada.','Não.','Já havia contagens de indígenas.']},
 {q:'Por que os números indígenas cresceram tanto?',
  o:['Mais pessoas se sentiram seguras para se declarar e o método melhorou','Imigração do exterior','Erro do IBGE','Não cresceram'],c:0,
  e:['Correto.','Não.','Não.','Cresceram.']},
 {q:'Que critério o IBGE usa para identificar indígenas e quilombolas?',
  o:['Autodeclaração','Exame de sangue','Aparência','Sobrenome'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Que direito a Constituição garante aos quilombolas?',
  o:['Propriedade de seus territórios','Isenção de todos os impostos','Voto duplo','Nenhum'],c:0,
  e:['Correto.','Não.','Não.','Garante.']},
 {q:'Que órgão o Ceará criou em 2023?',
  o:['Secretaria dos Povos Indígenas','Ministério da Seca','DNOCS','Sudene'],c:0,
  e:['Correto.','Não existe.','É federal, de 1945.','É federal, de 1959.']}
],

fontes:`<ul>

aula('t4-a34',{
objetivo:`<p>Ao final, você vai conhecer as grandes obras hídricas recentes do Ceará e o debate sobre o futuro da água.</p>`,
explicacao:`
<h4>O porquê: a velha pergunta</h4>
<p>Desde 1877, o Ceará pergunta como garantir água nas secas. Nos anos 2000, a resposta incluiu obras gigantes.</p>

<h4>O Castanhão</h4>
<p>O açude Castanhão, no rio Jaguaribe, planejado há mais de cem anos, foi concluído no início dos anos 2000 e é o maior do Ceará. Para construí-lo, a antiga cidade de Jaguaribara foi inundada e uma nova cidade foi construída. A partir de 2003, o governo estruturou o Eixão das Águas para levar sua água até Fortaleza <span class="tag forte">forte</span>.</p>

<h4>A seca de 2012–2017</h4>
<p>A seca mais longa registrada pelos dados de chuva do estado esvaziou os reservatórios. Em 2017, o Castanhão chegou a 4,34% de sua capacidade, o menor volume desde a inauguração <span class="tag forte">forte</span>.</p>

<h4>A transposição</h4>
<p>As águas do rio São Francisco, pelo Eixo Norte da transposição, chegaram ao Ceará em junho de 2020, pela barragem de Jati, no Cariri. Em agosto, seguiram pelo Cinturão das Águas. Em <b>10 de março de 2021</b>, chegaram ao Castanhão <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>A transposição reforçou a segurança hídrica, mas especialistas lembram que a água acumulada nem sempre chega a quem mais precisa no sertão difuso. Em 2026, com boas chuvas, o Castanhão não precisou receber água da transposição. O debate sobre o futuro combina obras grandes, cisternas, reúso, dessalinização e gestão da demanda.</p></div>

<div class="box conexao"><p>Compare com a “solução hidráulica” do DNOCS (Trilha 3, módulo 8) e com a convivência com o semiárido (Trilha 1). O que mudou? O que continua?</p></div>
`,

  o:['Castanhão','Cedro','Orós','Banabuiú'],c:0,
  e:['Correto.','Não.','É o segundo.','Não.']},
 {q:'Que cidade foi inundada para construir o Castanhão?',
  o:['A antiga Jaguaribara','Fortaleza','Sobral','Crato'],c:0,
  e:['Correto.','Não.','Não.','Não.']},

 {q:'Quando as águas da transposição chegaram ao Castanhão?',
  o:['10 de março de 2021','1877','2002','Nunca chegaram'],c:0,
  e:['Correto.','Não.','Não.','Chegaram.']},
 {q:'Por onde a água da transposição entra no Ceará?',
  o:['Pela barragem de Jati, no Cariri','Pelo Porto do Pecém','Por Jericoacoara','Pelo rio Amazonas'],c:0,

aula('t4-a35',{
objetivo:`<p>Ao final, você vai entender a escalada da violência no Ceará na última década e os debates sobre segurança pública.</p>`,
explicacao:`
<h4>O porquê: um tema que afeta a vida de todos</h4>
<p>A violência é uma das maiores preocupações dos cearenses. Entender sua história ajuda a sair das explicações simples.</p>

<h4>O crescimento</h4>
<p>Entre 2000 e 2015, a taxa de homicídios no Nordeste mais do que dobrou, enquanto caía no Sudeste. Em 2017, o Ceará bateu seu recorde, com <b>5.134 homicídios</b>, e 2018 teve o segundo maior número, 4.518 <span class="tag forte">forte</span>.</p>

<h4>As facções</h4>
<p>A partir de 2015, <span class="g" data-t="faccao">facções criminosas</span> do Sudeste, como o PCC e o Comando Vermelho, avançaram no Ceará, e surgiu uma facção local, a GDE. O fim de uma trégua entre elas, no fim de 2016, levou a uma guerra por territórios <span class="tag forte">forte</span>. Começou a chamada “era das chacinas”: em 27 de janeiro de 2018, a <b>Chacina das Cajazeiras</b> deixou 14 mortos, a maior da história do estado.</p>

<h4>A violência do Estado</h4>
<p>Em novembro de 2015, a <b>Chacina da Messejana</b> deixou 11 mortos em Fortaleza, a maioria jovens sem antecedentes. Policiais militares foram acusados e o caso se tornou símbolo da cobrança por controle da atividade policial <span class="tag forte">forte</span>.</p>

<h4>Depois</h4>
<p>Os homicídios caíram depois de 2018, com oscilações; em 2023 foram cerca de 3 mil no Ceará. Mas a presença das facções nos territórios tornou a violência mais complexa, com expulsões de moradores e controle de bairros <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Há visões diferentes sobre o que fazer. Uns defendem mais polícia, presídios mais duros e repressão ao crime organizado. Outros, prevenção, oportunidades para jovens das periferias e controle da violência policial. Pesquisadores costumam apontar que as duas dimensões são necessárias e que as principais vítimas são jovens, negros e pobres.</p></div>
`,
quiz:[
 {q:'Em que ano o Ceará bateu o recorde de homicídios?',
  o:['2017','1990','2023','1964'],c:0,
  e:['Correto, com 5.134.','Não.','Houve queda.','Não.']},
 {q:'Que facção cearense surgiu nesse período?',

aula('t4-a36',{
objetivo:`<p>Ao final, você vai ligar o que estudou nas quatro trilhas e refletir sobre o que o passado explica, e o que não explica, sobre o Ceará de hoje.</p>`,
explicacao:`
<h4>O porquê: a história serve para quê?</h4>
<p>A história não prevê o futuro nem justifica o presente. Mas ajuda a entender por que as coisas são como são, e que poderiam ter sido diferentes.</p>

<h4>Fios longos</h4>
<ul>
<li><b>Terra</b>: as sesmarias e as fazendas de gado concentraram a terra (Trilha 1). Essa concentração aparece na pobreza rural, nos conflitos por terra e na luta indígena e quilombola de hoje.</li>
<li><b>Seca</b>: de 1877 aos campos de concentração e à transposição, a seca foi natural e social (Trilhas 1 a 4). Morre-se menos de seca hoje, graças a políticas e tecnologias, mas a vulnerabilidade continua.</li>
<li><b>Migração</b>: retirantes, soldados da borracha, candangos, moradores das periferias: o Ceará é um povo em movimento.</li>
<li><b>Poder</b>: de Accioly aos coronéis da ditadura e aos grupos atuais, o estado conviveu com longos ciclos de hegemonia e com clientelismo, mas também com rupturas pelo voto.</li>
<li><b>Povos e apagamentos</b>: indígenas e negros foram declarados inexistentes e hoje se afirmam.</li>
<li><b>Invenção</b>: a abolição de 1884, os agentes de saúde, a alfabetização mostram que o Ceará também inventou soluções que o Brasil copiou.</li>
</ul>

<h4>Cuidados</h4>
<p>Explicar não é determinar: o passado limita, mas não decide o futuro. E nenhuma explicação única dá conta de tudo: economia, política, cultura e escolhas pessoais se combinam.</p>

<div class="box conceito"><p>O historiador trabalha com <b>continuidades e rupturas</b>. Uma boa análise mostra o que permaneceu e o que mudou, sem cair na ideia de que “sempre foi assim” nem na de que “tudo mudou”.</p></div>

<div class="box hoje"><p>Você terminou as quatro trilhas. O projeto final do Especialista pede exatamente isto: um ensaio sobre o que o passado explica sobre o Ceará de hoje.</p></div>
`,
quiz:[
 {q:'Para que serve a história, segundo a aula?',
  o:['Para prever o futuro com certeza','Para entender por que as coisas são como são e que poderiam ser diferentes','Para justificar o presente','Para nada'],c:1,
  e:['Não prevê.','Correto.','Não justifica.','Serve.']},
 {q:'Que fio longo liga as sesmarias aos conflitos atuais?',
  o:['A concentração de terra','A música','O clima de neve','O futebol'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'O que significa dizer que a seca é “natural e social”?',
  o:['Que a falta de chuva é natural, mas seus efeitos dependem da sociedade','Que não existe seca','Que a seca é só invenção','Que é só natural'],c:0,
  e:['Correto.','Existe.','Não.','Não.']},
 {q:'Qual destes é um exemplo de solução cearense copiada pelo Brasil?',
  o:['Agentes de saúde','Campos de concentração','Coronelismo','Guerra fiscal'],c:0,

  e:['Correto.','Não.','Não.','Não.']}
],
