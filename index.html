aula('t1-a8',{
objetivo:`<p>Ao final, você vai conhecer a expedição de Pero Coelho de Sousa (1603–1607): seus objetivos, o caminho até a Ibiapaba, a guerra contra franceses e Tabajara, a escravização de indígenas e o fracasso final, marcado pela seca e pela retirada. Vai também entender por que essa expedição foi seguida por uma tentativa missionária, a dos jesuítas Francisco Pinto e Luís Figueira.</p>`,
explicacao:`
<h4>O porquê: a primeira conquista foi uma guerra</h4>
<p>Durante muito tempo, Pero Coelho foi celebrado como o “primeiro colonizador” do Ceará. Em 1903, as comemorações do tricentenário exaltaram sua chegada como marco inicial da história cearense. Hoje os historiadores olham essa expedição de outro jeito: como uma operação militar e escravista, que fracassou e deixou os povos da Ibiapaba como inimigos dos portugueses <span class="tag forte">forte</span>.</p>

<h4>A partida</h4>
<p>Em junho de 1603, o capitão-mor Pero Coelho de Sousa, um fidalgo estabelecido na Paraíba, partiu de lá com autorização do governador-geral. Os objetivos eram explorar a costa, expulsar os franceses do norte e abrir caminho para o Maranhão. Levava soldados portugueses e um grande número de indígenas aliados. Os números variam muito entre as fontes: há quem fale em 65 soldados e 200 indígenas, e há quem fale em 80 colonos e 800 indígenas <span class="tag hipotese">números divergentes</span>. Entre os soldados estava um jovem chamado Martim Soares Moreno, que teria sido enviado para aprender a língua e os costumes dos indígenas.</p>

<h4>A guerra na Ibiapaba</h4>
<p>A expedição seguiu pelo litoral, passou pela região do Camocim e chegou à Serra da Ibiapaba em janeiro de 1604. Ali enfrentou os Tabajara, chefiados por um principal que os portugueses chamavam de <b>Mel Redondo</b>, e seus aliados franceses. Os portugueses venceram, expulsaram os franceses para o Maranhão e forçaram os Tabajara a se submeter <span class="tag forte">forte</span>.</p>
<p>Mas a vitória teve um preço político. Pero Coelho capturou e escravizou dezenas de indígenas, inclusive de grupos que não eram seus inimigos, e houve muitas mortes em combate. A expedição deixou os povos da Ibiapaba hostis aos portugueses por muitos anos <span class="tag forte">forte</span>.</p>

<div class="box historia"><p>No início do século XVII, a lei portuguesa permitia escravizar indígenas em algumas situações, como a chamada “guerra justa”. Na prática, capitães usavam esse argumento para capturar pessoas e vendê-las ou usá-las como trabalhadores. A escravização indígena é tema do nível Especialista desta trilha.</p></div>

<h4>Fortes, Nova Lisboa e o recuo</h4>
<p>Pero Coelho não conseguiu seguir até o Maranhão: faltavam reforços, as relações com os chefes indígenas se deterioraram e os aliados abandonaram a expedição. Ele recuou para o litoral e se instalou na foz de um rio, na área da atual Barra do Ceará, onde ergueu um pequeno forte chamado <b>São Tiago</b>. A povoação ao redor foi chamada de <b>Nova Lisboa</b>. Depois, mais a leste, levantou outro fortim às margens do Jaguaribe, o <b>São Lourenço</b> <span class="tag forte">forte</span>.</p>
<p>Pero Coelho trouxe sua família, mulher e filhos, para o Ceará. Os reforços prometidos pelo governo não vieram, ou chegaram insuficientes.</p>

<h4>A seca e a retirada</h4>
<p>Uma seca atingiu a região nos anos seguintes. Sem comida, sem reforços e cercado por povos hostis, Pero Coelho abandonou o Ceará e voltou a pé, pelo litoral, em direção ao Rio Grande do Norte, com a família e os poucos homens que restavam. As crônicas descrevem a marcha como um calvário de fome e sede, em que vários morreram, entre eles filhos do capitão <span class="tag forte">forte</span>. As datas do abandono variam conforme a fonte, entre 1605 e 1607.</p>

<div class="box cuidado"><p>A retirada de Pero Coelho é às vezes chamada de “a primeira retirada da seca” e romantizada como sofrimento heroico. Lembre-se de quem estava naquela marcha e de quem ficou para trás: a expedição tinha escravizado indígenas e deixado um rastro de mortes. O sofrimento dos portugueses foi real, mas não apaga a violência que causaram. Um bom historiador mantém as duas coisas à vista.</p></div>

<h4>A tentativa missionária: Francisco Pinto e Luís Figueira</h4>
<p>Depois do fracasso militar, a Coroa tentou outro caminho. Em 1607, dois jesuítas, <b>Francisco Pinto</b> e <b>Luís Figueira</b>, partiram para a Ibiapaba sem escolta militar, levando de volta indígenas que haviam sido escravizados por Pero Coelho e libertados por ordem real. O objetivo era fazer a paz com os povos da serra e abrir o caminho do Maranhão pela catequese <span class="tag forte">forte</span>.</p>
<p>A missão terminou em tragédia. Em 1608, na Ibiapaba, o padre Francisco Pinto foi morto por um grupo indígena hostil. Luís Figueira sobreviveu, voltou e escreveu um relato da viagem, a <i>Relação do Maranhão</i>, uma das fontes mais importantes sobre o Ceará do início do século XVII <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Note o padrão que vai se repetir por todo o período colonial: <b>a espada e a cruz</b>. Quando a força militar falhava, tentava-se a catequese; quando a catequese não bastava, voltava-se à força. Os indígenas, por sua vez, avaliavam cada chegada europeia e decidiam entre aliança, negociação, fuga ou guerra.</p></div>

<div class="box hoje"><p>Em Viçosa do Ceará, na Ibiapaba, a memória das missões jesuítas é parte da identidade da cidade. A Pedra do Itagurussu, em Viçosa, é apontada por pesquisadores como possível local de embates da expedição de 1603–1604 <span class="tag hipotese">em discussão</span>.</p></div>
`,

aula('t1-a9',{
objetivo:`<p>Ao final, você vai saber quem foi Martim Soares Moreno, como ele conseguiu manter um forte na barra do rio Ceará a partir de 1612 graças às alianças com os Potiguara, o que aconteceu com esse posto até a chegada dos holandeses em 1637, e por que a ideia de que ele foi “o fundador do Ceará” é discutida pelos historiadores.</p>`,
explicacao:`
<h4>O porquê: o soldado que aprendeu a língua</h4>
<p>Martim Soares Moreno é talvez o personagem mais famoso da história colonial do Ceará, em grande parte graças à literatura: ele é o “guerreiro branco” do romance <i>Iracema</i>, de José de Alencar. Mas por trás do mito há uma história documentada interessante, que mostra que, no Ceará do século XVII, a conquista dependia menos de armas e mais de alianças com os indígenas.</p>

<h4>Quem era</h4>
<p>Martim Soares Moreno nasceu em Portugal, por volta de 1586, em Santiago do Cacém. Muito jovem, participou da expedição de Pero Coelho. Seu tio, o militar Diogo de Campos Moreno, escreveu que o rapaz foi enviado justamente para aprender a língua e os costumes dos indígenas, fazendo-se “parente ou amigo” deles <span class="tag forte">forte</span>. Foi essa aprendizagem que fez a diferença.</p>

<h4>O forte de São Sebastião (1612)</h4>
<p>Com a ameaça francesa no Maranhão cada vez maior, Martim Soares Moreno foi enviado ao Ceará como capitão. Com a ajuda do chefe potiguara <b>Jacaúna</b>, que vivia na região do Acaraú e se mudou com seu povo para perto do forte, ergueu na barra do rio Ceará, no mesmo lugar do antigo forte de Pero Coelho, um fortim chamado <b>São Sebastião</b>, e uma capela dedicada a Nossa Senhora do Amparo. A data tradicional é <b>20 de janeiro de 1612</b>, dia de São Sebastião; alguns autores falam em 1611 <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>O forte de São Sebastião não era uma fortaleza imponente: era um posto pequeno, de madeira e terra, com poucos soldados. Ele sobreviveu porque os Potiguara de Jacaúna o protegiam, lutando ao lado dos portugueses contra os ataques de outros grupos indígenas e de navios estrangeiros. Sem essa aliança, o posto não teria durado. É a conclusão de vários historiadores a partir dos próprios documentos portugueses <span class="tag forte">forte</span>.</p></div>

<h4>Idas e vindas: Maranhão, Ceará, Pernambuco</h4>
<ul class="tl">
<li><b>1613</b>Jerônimo de Albuquerque, a caminho do Maranhão, passa pelo forte e convoca Martim Soares Moreno para a campanha contra os franceses.</li>
<li><b>1614–1615</b>A campanha portuguesa contra a França Equinocial termina com a expulsão dos franceses de São Luís, em 1615.</li>
<li><b>1621</b>Depois de anos fora, Martim Soares Moreno volta ao Ceará como capitão-mor, com a missão de reerguer e guarnecer o forte.</li>
<li><b>1631</b>Recebe ordem de ir para Pernambuco, invadido pelos holandeses em 1630. Deixa o Ceará.</li>
<li><b>1637</b>Já pouco guarnecido, o forte de São Sebastião é tomado pelos holandeses, com apoio de indígenas.</li>
</ul>
<p>Os documentos guardados no Arquivo Histórico Ultramarino, em Lisboa, mostram Martim Soares Moreno pedindo repetidamente ao rei soldados, armas, pólvora, ornamentos para a capela e aumento de salário. O retrato que sai dessas cartas é o de um posto pobre e esquecido, mantido com muito esforço <span class="tag forte">forte</span>.</p>

<div class="box historia"><p>Martim Soares Moreno teve longa carreira militar. Lutou contra os holandeses em Pernambuco e, em 1645, participou do movimento que levaria à expulsão deles do Brasil. Chegou a altos postos militares <span class="tag forte">forte</span>.</p></div>

<h4>Iracema: o mito literário</h4>
<p>Em 1865, o escritor cearense José de Alencar publicou <i>Iracema</i>, um romance que transforma a chegada de Martim Soares Moreno numa história de amor entre o guerreiro português e a “virgem dos lábios de mel”, uma indígena tabajara. O filho dos dois, Moacir, seria “o primeiro cearense”. Poti, o amigo potiguara de Martim, é o futuro Antônio Felipe Camarão.</p>
<p>O romance é uma obra-prima da literatura brasileira e um mito de origem: ele imagina o Ceará e o Brasil como fruto do encontro amoroso entre europeus e indígenas. Mas é ficção. Não há documento sobre Iracema. E o mito tem um lado que hoje se discute muito: no final do livro, Iracema morre e o filho segue com o pai. A mistura acontece, mas o mundo indígena desaparece <span class="tag interpretacao">leitura crítica</span>.</p>

<div class="box cuidado"><p><b>“Fundador do Ceará”?</b> Martim Soares Moreno é chamado assim em muitas obras. Os historiadores de hoje questionam a própria ideia de “fundação”: ela supõe um dia exato em que a história começa, apaga os milhares de anos de ocupação indígena e esquece que o posto de 1612 foi frágil, interrompido e dependente dos Potiguara. Há também o debate sobre a data de origem de Fortaleza: 1612 (o forte de Soares Moreno), 1649 (o forte holandês de Matias Beck) ou 1726 (a elevação a vila, a data oficial da cidade) <span class="tag interpretacao">debate</span>.</p></div>

<div class="box hoje"><p>A Barra do Ceará, onde ficavam os fortes de Pero Coelho e Martim Soares Moreno, é hoje um bairro de Fortaleza, na divisa com Caucaia. Um marco lembra o local dos primeiros fortes. A estátua de Iracema, na Lagoa de Messejana, e a de Iracema Guardiã, na Praia de Iracema, mostram como o mito de Alencar virou parte da paisagem da capital.</p></div>

<div class="box conexao"><p>No próximo nível, o Intermediário, você verá o que aconteceu depois de 1637: os holandeses no Ceará, a fundação do Forte Schoonenborch por Matias Beck em 1649 e a volta dos portugueses em 1654.</p></div>
`,

aula('t1-a10',{
objetivo:`<p>Ao final, você vai entender o que foi o Brasil holandês, por que os holandeses tomaram o forte do Ceará em 1637, o que buscavam numa capitania tão pobre e como essa primeira ocupação terminou, em 1644, com a morte da guarnição pelas mãos dos indígenas.</p>`,
explicacao:`
<h4>O porquê: o Ceará entra numa guerra mundial</h4>
<p>No século XVII, a guerra entre a monarquia ibérica e as Províncias Unidas dos Países Baixos se espalhou pelos oceanos. O açúcar do Nordeste brasileiro era um dos prêmios. O pequeno forte da barra do rio Ceará acabou envolvido nesse conflito por estar no caminho entre Pernambuco, tomado pelos holandeses, e o Maranhão.</p>

<h4>O Brasil holandês em poucas linhas</h4>
<p>A <b>Companhia das Índias Ocidentais</b> (WIC, na sigla em holandês) era uma empresa com poderes de Estado: podia fazer guerra, governar territórios e comerciar. Depois de uma tentativa fracassada na Bahia (1624–1625), ela conquistou Pernambuco em 1630. De 1637 a 1644, o conde <b>João Maurício de Nassau</b> governou o chamado Brasil holandês, que chegou a ir de Sergipe ao Maranhão <span class="tag consenso">consenso</span>.</p>
<p>Em 1640, Portugal se separou da Espanha. Em 1645, os senhores de engenho de Pernambuco se rebelaram contra os holandeses, na chamada Insurreição Pernambucana. Depois das batalhas dos Guararapes (1648 e 1649), os holandeses perderam terreno e, em janeiro de 1654, capitularam no Recife.</p>

<h4>A primeira ocupação do Ceará (1637–1644)</h4>
<p>Em outubro de 1637, uma expedição enviada por Nassau, comandada por Joris Garstman, tomou o forte de São Sebastião, então pouco guarnecido. Os holandeses contaram com o apoio de indígenas da região, insatisfeitos com os portugueses <span class="tag forte">forte</span>.</p>
<p>O que interessava aos holandeses no Ceará? Três coisas, segundo as fontes:</p>
<ul>
<li><b>Sal</b>: o litoral cearense tinha salinas naturais, e o sal era essencial para conservar alimentos <span class="tag forte">forte</span>.</li>
<li><b>Posição</b>: o Ceará era ponto de apoio para a conquista do Maranhão, que os holandeses tomaram em 1641.</li>
<li><b>Aliados</b>: os povos indígenas do litoral e da serra eram guerreiros valiosos.</li>
</ul>

<h4>O fim: a guarnição morta pelos indígenas</h4>
<p>A aliança não durou. No fim de 1643 e começo de 1644, a guarnição holandesa do Ceará foi morta por indígenas. As razões ainda são estudadas, mas os pesquisadores apontam o contexto: os holandeses tinham perdido o Maranhão numa revolta luso-maranhense, a exigência de trabalho e os maus-tratos pesavam, e os indígenas tinham sua própria política, aproximando-se de quem lhes parecia mais vantajoso <span class="tag hipotese">causas debatidas</span>.</p>

<div class="box conceito"><p>A lição mais importante deste episódio é que os indígenas do Ceará <b>não eram peças</b> num tabuleiro europeu. Eles escolheram aliados, mudaram de lado quando acharam necessário e, em 1644, acabaram com a presença holandesa por decisão própria. Historiadores chamam isso de <b>agência indígena</b>: a capacidade de agir e decidir dentro de um contexto difícil.</p></div>

<div class="box cuidado"><p>É comum dizer que os indígenas “traíram” portugueses ou holandeses. A palavra é do ponto de vista europeu. Do ponto de vista indígena, era política: avaliar alianças conforme seus interesses, como qualquer outro grupo fazia.</p></div>

<div class="box hoje"><p>O período holandês deixou poucas marcas materiais no Ceará, mas deixou muitos documentos, hoje guardados em arquivos dos Países Baixos. Parte deles foi traduzida e publicada pela <i>Revista do Instituto do Ceará</i>, e pesquisadores continuam a descobrir informações novas nesse material.</p></div>
`,

  o:['Uma ordem religiosa holandesa','Uma empresa com poderes de Estado, que fazia guerra, governava territórios e comerciava','O exército espanhol no Brasil','Uma associação de indígenas do Ceará'],c:1,
  e:['Não era religiosa.','Correto. Ela conquistou Pernambuco em 1630 e administrou o Brasil holandês.','Os espanhóis eram os inimigos da WIC.','Não tinha relação com os indígenas como associação.']},

<li>${lnk('https://fundaj.emnuvens.com.br/CAD/article/download/1361/1081/1425','Os holandeses e os índios no Ceará')} (Cadernos de Estudos Sociais, Fundaj).</li>
<li>Charles Boxer, <i>Os Holandeses no Brasil</i> (1957); Evaldo Cabral de Mello, <i>O Negócio do Brasil</i> (1998).</li>

});

aula('t1-a11',{
objetivo:`<p>Ao final, você vai entender como os povos indígenas do Ceará se posicionaram entre holandeses e portugueses, por que as alianças mudavam e o que esse período revela sobre a política indígena no século XVII.</p>`,
explicacao:`
<h4>O porquê: a guerra dos europeus era também uma guerra entre indígenas</h4>
<p>Na guerra entre holandeses e portugueses, os soldados europeus eram poucos. Quem fazia a maior parte da luta eram os indígenas. No Nordeste, os Potiguara chegaram a se dividir: parte lutou com os portugueses, sob o comando de Antônio Felipe Camarão, o antigo Poti, e parte com os holandeses, sob lideranças como Pedro Poti, que tinha estudado nos Países Baixos <span class="tag forte">forte</span>.</p>

<h4>Por que lutar ao lado dos holandeses?</h4>
<p>Para muitos povos, os holandeses pareciam uma alternativa aos portugueses, que já os escravizavam e tomavam suas terras. Os holandeses, calvinistas, prometiam liberdade aos indígenas aliados e tinham uma política diferente da dos jesuítas portugueses. Na prática, também exploraram o trabalho indígena, mas no começo a aliança parecia vantajosa <span class="tag forte">forte</span>.</p>

<h4>Por que mudar de lado?</h4>
<p>As alianças mudavam conforme a guerra. Quando os holandeses perderam o Maranhão, em 1642–1644, e enfraqueceram no Nordeste depois de 1645, ficar ao lado deles ficou arriscado. Ao mesmo tempo, abusos cometidos pelas guarnições e disputas entre grupos indígenas pesavam. Documentos mostram até indígenas propondo aos holandeses uma aliança para atacar os portugueses do forte de São Sebastião, e depois agindo contra os próprios holandeses <span class="tag forte">forte</span>.</p>

<div class="box exemplo"><p>Depois da guerra, os portugueses passaram a desconfiar de quem tinha colaborado com os holandeses. Em 1650, o governador do Maranhão mudou totalmente de opinião sobre um líder indígena chamado Marcos da Costa, que antes elogiava, e passou a chamá-lo de um dos maiores traidores do tempo dos holandeses. A mesma pessoa podia ser aliada ou traidora conforme o momento e quem escrevia <span class="tag forte">forte</span>.</p></div>

<div class="box conceito"><p>Os historiadores falam hoje em <b>política indígena</b>, e não só em política indigenista. A política indigenista é o que os europeus decidiam sobre os indígenas. A política indígena é o que os próprios indígenas decidiam: com quem se aliar, quando negociar, quando fugir, quando lutar.</p></div>

<div class="box conexao"><p>A figura de Felipe Camarão aparece no romance <i>Iracema</i> como Poti, amigo de Martim. Na Trilha 2, você verá como o século XIX transformou esses personagens em heróis nacionais.</p></div>

<div class="box hoje"><p>Os Potiguara existem até hoje, sobretudo na Paraíba e também no Ceará, onde são um dos povos mais numerosos, com mais de 5 mil pessoas no Censo de 2022.</p></div>
`,

  o:['Soldados vindos da Europa','Guerreiros indígenas aliados de um lado e de outro','Mercenários africanos','Marinheiros franceses'],c:1,

  e:['Alguns holandeses aprenderam tupi, mas não era a razão principal.','Correto. A aliança parecia vantajosa diante da experiência com os portugueses.','Os holandeses eram calvinistas.','Não havia essa oferta.']},

  o:['São a mesma coisa','A indigenista é o que os europeus decidiam sobre os indígenas; a indígena é o que os indígenas decidiam','A indígena é feita só pelos jesuítas','A indigenista é feita só pelos holandeses'],c:1,
  e:['Os historiadores distinguem as duas.','Correto.','Os jesuítas faziam política indigenista.','Portugueses e holandeses faziam política indigenista.']},
 {q:'Antônio Felipe Camarão era:',

],

<li>Fernando Roque Fernandes, ${lnk('https://periodicos.ufam.edu.br/index.php/manduarisawa/article/view/5272/4314','Políticas indígenas e indigenistas nos domínios do Norte (1637–1644)')}.</li>

</ul>`

aula('t1-a12',{
objetivo:`<p>Ao final, você vai conhecer a segunda ocupação holandesa (1649–1654), entender por que Matias Beck ergueu o Forte Schoonenborch no alto do Marajaitiba, à beira do riacho Pajeú, o que ele procurava (prata!) e como o forte, retomado pelos portugueses em 1654, virou o núcleo da futura cidade de Fortaleza.</p>`,
explicacao:`
<h4>O porquê: o forte que virou cidade</h4>
<p>O centro de Fortaleza nasceu ao redor de um forte holandês. Essa frase surpreende muita gente. Ela é verdadeira, mas pede nuances: entre o forte de 1649 e a cidade que conhecemos, houve a retomada portuguesa, mais de setenta anos de povoado modesto e a elevação a vila em 1726.</p>

<h4>A expedição de Matias Beck</h4>
<p>Em 1649, mesmo depois da derrota nos Guararapes, a Companhia das Índias Ocidentais enviou uma nova expedição ao Ceará. O comando foi recusado por um membro da elite holandesa do Recife e acabou aceito por <b>Matias Beck</b>, comerciante da comunidade holandesa da cidade. Ele partiu do Recife em março e chegou à enseada do Mucuripe em 3 de abril de 1649 <span class="tag forte">forte</span>.</p>
<p>Beck não reconstruiu o forte da Barra do Ceará. Escolheu um lugar novo, uma colina chamada pelos indígenas de <b>Marajaitiba</b>, à beira do riacho <b>Pajeú</b>, com água doce e boa visão do mar. Ali ergueu, primeiro com paliçada de madeira e depois aproveitando materiais do antigo São Sebastião, o <b>Forte Schoonenborch</b>, nome em homenagem a um dirigente holandês do Recife <span class="tag forte">forte</span>.</p>

<h4>A obsessão pela prata</h4>
<p>O diário de Matias Beck, que sobreviveu e foi traduzido, mostra algo curioso: a construção do forte aparece quase como um detalhe. O assunto principal é a busca por <b>minas de prata</b> que indígenas e aventureiros diziam existir nas serras próximas. Beck mandou expedições, colheu amostras, gastou recursos. A prata nunca apareceu em quantidade que justificasse exploração <span class="tag forte">forte</span>.</p>

<div class="box analogia"><p>Pense numa empresa em crise que aposta tudo num último projeto milagroso. Em 1649, a WIC estava perdendo o Brasil. A prata do Ceará era a esperança de salvar o negócio. Não deu certo, mas o forte construído como base para essa busca acabou sendo o embrião de uma capital.</p></div>

<h4>A rendição e a mudança de nome</h4>
<p>Em janeiro de 1654, os holandeses capitularam no Recife. O acordo incluía a entrega de todas as suas praças no Brasil. Pouco depois, o Forte Schoonenborch foi entregue aos portugueses, que o rebatizaram de <b>Fortaleza de Nossa Senhora da Assunção</b>. O capitão-mor português Álvaro de Azevedo Barreto assumiu o comando <span class="tag forte">forte</span>. O nome “Fortaleza” vem daí.</p>
<p>Ao redor da fortaleza formou-se um pequeno povoado de soldados, indígenas aldeados e alguns moradores. Por décadas, foi um lugar pobre e isolado. A vila de Fortaleza só foi criada em <b>13 de abril de 1726</b>, data oficial do aniversário da cidade.</p>

<div class="box cuidado"><p><b>Quem fundou Fortaleza?</b> Há quem defenda Martim Soares Moreno (1612), quem defenda Matias Beck (1649) e quem fique com a criação da vila (1726). A tese de Beck como fundador foi defendida claramente pela primeira vez em 1935, num boletim do Museu Histórico do Ceará. Os historiadores atuais tendem a questionar a própria busca por um “ponto zero”: cidades nascem de processos, não de um único dia <span class="tag interpretacao">debate</span>.</p></div>

<div class="box hoje"><p>No alto do Marajaitiba, onde ficava o Schoonenborch, está hoje a sede da 10ª Região Militar do Exército, no centro de Fortaleza, ao lado da Catedral. A atual Fortaleza de Nossa Senhora da Assunção foi reconstruída em alvenaria no século XIX. O riacho Pajeú ainda corre, em grande parte canalizado, sob as ruas do centro.</p></div>
`,
quiz:[
 {q:'Onde Matias Beck construiu o Forte Schoonenborch?',
  o:['Na Barra do Ceará, sobre o antigo forte de São Sebastião','Na colina do Marajaitiba, à beira do riacho Pajeú','Na Serra da Ibiapaba','Em Aracati'],c:1,
  e:['Beck preferiu um lugar novo, embora aproveitasse materiais do antigo forte.','Correto. Hoje ali fica a 10ª Região Militar, no centro de Fortaleza.','Fica muito longe do litoral de Fortaleza.','Aracati fica no litoral leste, na foz do Jaguaribe.']},
 {q:'Qual era a principal preocupação de Matias Beck, segundo seu diário?',
  o:['Plantar cana-de-açúcar','Encontrar minas de prata nas serras próximas','Catequizar os indígenas','Criar gado no sertão'],c:1,
  e:['Não havia esse projeto.','Correto. A prata nunca apareceu em quantidade explorável.','A catequese era projeto português, não de Beck.','O gado só se espalharia décadas depois.']},
 {q:'Que nome os portugueses deram ao forte depois de 1654?',
  o:['São Sebastião','São Tiago','Fortaleza de Nossa Senhora da Assunção','Forte dos Reis Magos'],c:2,
  e:['Esse era o forte de Martim Soares Moreno.','Esse era o forte de Pero Coelho.','Correto. Daí vem o nome da cidade.','O Forte dos Reis Magos fica em Natal.']},
 {q:'Qual é a data oficial do aniversário de Fortaleza?',
  o:['20 de janeiro de 1612','3 de abril de 1649','13 de abril de 1726','25 de março de 1884'],c:2,
  e:['É a data tradicional do forte de São Sebastião.','É a chegada de Beck ao Mucuripe.','Correto: a criação da vila.','É a data da abolição no Ceará.']},
 {q:'Qual é a posição mais aceita hoje sobre a “fundação” de Fortaleza?',
  o:['Foi fundada só por Matias Beck','Foi fundada só por Martim Soares Moreno','Cidades nascem de processos; a busca de um único fundador e de um único dia é questionada','Fortaleza não tem história colonial'],c:2,
  e:['É uma das teses, defendida desde 1935, mas não é consenso.','Também é uma tese, não consenso.','Correto. O debate é sobre como contamos as origens.','Tem uma longa história colonial.']}
],
exercicio:`<p><b>Caminhada pelo centro.</b> Se você mora em Fortaleza ou vai à cidade, visite (ou procure no Google Maps) a área da 10ª Região Militar, a Catedral e o Passeio Público. Procure onde o riacho Pajeú aparece. Escreva um roteiro curto, de cinco paradas, contando a história do forte para um visitante. Se não puder ir, faça o roteiro pelo mapa.</p>`,

aula('t1-a13',{
objetivo:`<p>Ao final, você vai saber o que foi a Guerra dos Bárbaros, quando e onde aconteceu, quais eram suas causas e por que os historiadores a consideram um dos episódios mais violentos da história colonial brasileira.</p>`,
explicacao:`
<h4>O porquê: o boi e a guerra</h4>
<p>No módulo 1 você viu que o gado subiu os rios do sertão. Agora vem o lado que costuma ficar fora da história do “ciclo do couro”: o gado avançou sobre terras e fontes de água que já tinham dono. Os povos do sertão resistiram, e a resposta colonial foi uma guerra longa e brutal.</p>

<h4>O nome e as datas</h4>
<p>“Guerra dos Bárbaros” é o nome dado pelos próprios colonizadores, que chamavam os indígenas do sertão de “bárbaros”. Não foi uma única guerra, mas uma série de conflitos em várias capitanias, do Recôncavo baiano ao Ceará. Pedro Puntoni, que escreveu o estudo de referência, situa o período entre 1650 e 1720. O núcleo mais intenso, no Rio Grande do Norte e no Ceará, costuma ser datado entre 1680 e 1713, aproximadamente <span class="tag forte">forte</span>.</p>
<p>Os principais palcos foram as ribeiras do <b>Açu</b>, no Rio Grande do Norte, e do <b>Jaguaribe</b>, no Ceará. Puntoni descreveu o conflito como um dos episódios mais violentos da história do Brasil.</p>

<h4>As causas</h4>
<ul>
<li><b>A expansão do gado</b>: depois da expulsão dos holandeses, a demanda por carne e couro e a doação de sesmarias empurraram as fazendas para o interior.</li>
<li><b>A disputa pela água</b>: no semiárido, quem controlava os poços, lagoas e trechos de rio que não secavam controlava a sobrevivência. Fazendas e povos indígenas queriam os mesmos lugares.</li>
<li><b>A escravização</b>: a guerra rendia cativos. A lei permitia escravizar indígenas capturados em “guerra justa”, e muitos colonos tinham interesse direto nisso.</li>
<li><b>As secas</b>: anos de estiagem aumentavam a disputa por água e alimento, e o gado dos colonos virava, para os indígenas, uma presa ou uma ameaça.</li>
</ul>

<div class="box conceito"><p><b>Guerra justa</b> era um conceito jurídico da época: uma guerra considerada legítima pela Coroa, por exemplo contra povos acusados de atacar colonos ou de recusar a fé. Os indígenas capturados numa guerra justa podiam ser escravizados legalmente. Na prática, era fácil “declarar” uma guerra justa, e o conceito serviu para legalizar a captura em massa <span class="tag consenso">consenso</span>.</p></div>

<h4>Os povos envolvidos</h4>
<p>Os colonizadores falavam em “tapuias” e em “bárbaros”, mas os documentos mencionam muitos povos: Janduí, Paiacu, Kariri, Icó, Quixelô, Jaguaribara, Canindé e outros. No Ceará, os <b>Paiacu</b>, que viviam nas ribeiras do Jaguaribe e do Apodi, aparecem como um dos povos mais combativos <span class="tag forte">forte</span>.</p>

<div class="box cuidado"><p>Alguns livros antigos falam numa “Confederação dos Cariris”, como se os povos do sertão tivessem formado uma aliança unificada contra os portugueses. Os historiadores de hoje questionam essa ideia: houve alianças, mas também rivalidades, acordos separados e grupos lutando ao lado dos colonos <span class="tag hipotese">conceito revisto</span>. A resistência foi real; a “confederação” unificada é provavelmente uma simplificação.</p></div>

<div class="box hoje"><p>Vários nomes de povos dessa época viraram nomes de cidades cearenses: Icó, Quixelô, Jaguaribara, Canindé, Quixeramobim. É uma presença que ficou no mapa enquanto as pessoas eram expulsas ou mortas.</p></div>
`,

<li>${lnk('https://seer.assis.unesp.br/index.php/facesdahistoria/article/download/1938/1794/','Paulo Robério Ferreira Silva, A guerra esquecida')} (Faces da História, Unesp).</li>

aula('t1-a14',{
objetivo:`<p>Ao final, você vai entender quem lutou do lado colonial na Guerra dos Bárbaros (moradores, tropas indígenas aliadas e os terços de paulistas), como funcionavam os arraiais militares e por que essas tropas tinham interesse em prolongar a guerra.</p>`,
explicacao:`
<h4>O porquê: quem fazia a guerra e quem lucrava com ela</h4>
<p>A Guerra dos Bárbaros não foi travada por um exército regular. Foi feita por grupos com interesses próprios: fazendeiros que queriam terra, capitães que queriam cativos e recompensas da Coroa, e tropas profissionais de caçadores de gente vindas de São Paulo. Entender esses interesses ajuda a explicar por que a guerra foi tão longa e violenta.</p>

<h4>Os moradores e as tropas indígenas aliadas</h4>
<p>No início, a luta era feita pelos próprios moradores das fazendas, com seus vaqueiros e agregados, e por <b>tropas de indígenas aldeados</b>, aliados dos portugueses. Os documentos mostram que muitos combates opunham indígenas a indígenas, como já acontecera na guerra contra os holandeses <span class="tag forte">forte</span>.</p>

<h4>Os paulistas</h4>
<p>Quando os conflitos se agravaram, governadores recorreram a tropas paulistas, experientes em guerras no interior e na captura de indígenas: os <b>bandeirantes</b>. Domingos Jorge Velho, que depois atacaria o quilombo de Palmares, lutou no vale do Açu no fim da década de 1680. Em 1698, foi organizado o <b>Terço dos Paulistas</b>, sob o comando do mestre de campo Manuel Álvares de Morais Navarro, para a guerra no Rio Grande e no Ceará <span class="tag forte">forte</span>.</p>

<div class="box cuidado"><p>Os bandeirantes foram tratados durante muito tempo como heróis da expansão territorial, com estátuas e nomes de rodovias. A pesquisa histórica mostra que eles foram, antes de tudo, caçadores e vendedores de indígenas escravizados. Reconhecer seu papel na formação do território não exige celebrá-los <span class="tag consenso">consenso na historiografia atual</span>.</p></div>

<h4>Os arraiais</h4>
<p>Para controlar as ribeiras, as tropas montavam <b>arraiais</b>: acampamentos militares fixos em pontos estratégicos, perto da água e dos caminhos. Vários arraiais deram origem a povoados e, depois, a vilas, nos sertões do Seridó, do Açu, do Piancó e do Jaguaribe <span class="tag forte">forte</span>. É mais um exemplo de como a geografia das cidades do sertão nasceu da guerra.</p>

<h4>Uma guerra que interessava prolongar</h4>
<p>Os paulistas recebiam soldo, mas também esperavam <b>terras</b> (sesmarias nas áreas conquistadas), <b>cativos</b> para vender e <b>mercês</b> da Coroa: títulos e cargos. Isso criava um incentivo perverso: quanto mais “bárbaros” houvesse para combater, mais havia a ganhar. Autoridades locais e religiosos chegaram a denunciar ataques a grupos que já estavam em paz <span class="tag forte">forte</span>. A próxima aula mostra o caso mais famoso.</p>

<div class="box conexao"><p>Os terços paulistas e as sesmarias de guerra se ligam diretamente ao nível Avançado desta trilha, sobre o ciclo do gado e as sesmarias. Muitas fazendas do sertão cearense começaram como recompensa de guerra.</p></div>
`,

aula('t1-a15',{
objetivo:`<p>Ao final, você vai conhecer as formas de resistência indígena no sertão, o massacre dos Paiacu na ribeira do Jaguaribe em 1699, os acordos de paz que puseram fim aos conflitos e o resultado da guerra para os povos do sertão cearense.</p>`,
explicacao:`
<h4>O porquê: resistir, negociar, sobreviver</h4>
<p>Os povos do sertão não apenas sofreram a guerra. Resistiram por décadas, com táticas adaptadas ao terreno, fizeram acordos, mudaram de lugar e, quando não havia mais saída, entraram em aldeamentos para sobreviver. Entender essas escolhas é dar a eles o papel de sujeitos.</p>

<h4>Como resistiam</h4>
<p>Os grupos do sertão conheciam cada poço, cada serra e cada caminho. Atacavam fazendas e rebanhos, recuavam para áreas de difícil acesso e se moviam conforme as estações. Para os colonos, essa mobilidade era vista como “selvageria”; na verdade, era estratégia <span class="tag forte">forte</span>. Também houve negociação: alguns chefes fizeram tratados com governadores, e há registro de um acordo de paz com os Janduí no início da década de 1690 <span class="tag forte">forte</span>.</p>

<h4>O massacre dos Paiacu (1699)</h4>
<p>Em 1699, o mestre de campo Manuel Álvares de Morais Navarro, que estava em campanha no Açu, atacou os <b>Paiacu que já viviam aldeados</b> na ribeira do Jaguaribe, isto é, que estavam em paz e sob a responsabilidade de missionários. Muitos foram mortos e outros tantos escravizados <span class="tag forte">forte</span>.</p>
<p>O episódio provocou protestos de religiosos e uma disputa entre autoridades, porque mostrava que a “guerra justa” estava sendo usada contra grupos pacificados para obter cativos. É um dos casos mais estudados da Guerra dos Bárbaros, justamente por ter deixado muita documentação.</p>

<div class="box fonte"><p>O que sabemos sobre o massacre de 1699 vem, em boa parte, das queixas e investigações da época: cartas de missionários, de governadores e do próprio Morais Navarro, que se defendia. Os números de mortos e cativos variam conforme quem escreve. Trabalhos recentes, como a monografia de Marcos Felipe Vicente (UFC, 2021) e o artigo de Rafael Ricarte da Silva sobre os Paiacu, analisam essa documentação.</p></div>

<h4>O fim da guerra e a “aquietação”</h4>
<p>No começo do século XVIII, com os povos dizimados e as ribeiras ocupadas por fazendas, os conflitos diminuíram. As autoridades falavam em “aquietação” do sertão. Os sobreviventes foram, em grande parte, reunidos em aldeamentos missionários, onde deviam trabalhar para colonos e para a Coroa. Alguns grupos resistiram aos acordos e continuaram a se mover pelo sertão por muitos anos <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>O resultado da Guerra dos Bárbaros foi a <b>conquista do sertão</b>: as terras indígenas viraram sesmarias e fazendas de gado. Muitos historiadores usam hoje a palavra <b>genocídio</b> para descrever o que aconteceu com vários povos do sertão nordestino nesse período <span class="tag interpretacao">interpretação forte na historiografia</span>.</p></div>

<div class="box hoje"><p>Os Jenipapo-Kanindé, de Aquiraz, reconhecem os Paiacu entre seus antepassados. A memória da guerra, que os documentos coloniais tratavam como vitória sobre “bárbaros”, é lembrada por esses povos como história de resistência e de sobrevivência.</p></div>
`,

  o:['Porque eles não tinham casas','Porque conheciam o terreno e se moviam conforme as estações e a guerra, o que dificultava a vitória colonial','Porque fugiam de tudo','Porque não sabiam plantar'],c:1,

aula('t1-a16',{
objetivo:`<p>Ao final, você vai conhecer a história da missão jesuíta da Serra da Ibiapaba, da tragédia de 1608 à grande aldeia do século XVIII, e entender o papel dos jesuítas e de lideranças indígenas como D. Felipe de Sousa e Castro.</p>`,
explicacao:`
<h4>O porquê: a maior aldeia do Ceará</h4>
<p>A Ibiapaba foi o lugar onde a conquista portuguesa mais tentou o caminho da catequese. A aldeia jesuíta da serra tornou-se uma das maiores do Nordeste e deu origem a Viçosa do Ceará. Sua história mostra como missionários e lideranças indígenas negociaram poder durante mais de um século.</p>

<h4>Da tragédia ao retorno</h4>
<p>Você já viu que a primeira missão, de Francisco Pinto e Luís Figueira, terminou com a morte de Pinto, em 1608. Nas décadas seguintes, a Ibiapaba foi palco das guerras com holandeses e de fugas de grupos indígenas vindos de outras regiões. Os jesuítas voltaram à serra a partir da década de 1650. O padre Antônio Vieira, o grande pregador, esteve envolvido com essa missão e escreveu sobre ela por volta de 1660 <span class="tag forte">forte</span>.</p>

<h4>A grande aldeia (c. 1700–1759)</h4>
<p>A partir de 1700, a aldeia da Ibiapaba foi governada pelos jesuítas de forma estável, até 1759. Reunia milhares de indígenas, sobretudo Tabajara, mas também outros grupos. Os jesuítas organizavam o trabalho, a catequese, a escola e o calendário de festas. Mas o poder não era só deles: as lideranças indígenas, com títulos militares portugueses, mandavam em seus grupos e negociavam com missionários e governadores <span class="tag forte">forte</span>.</p>

<div class="box exemplo"><p><b>D. Felipe de Sousa e Castro</b> foi um líder indígena da Ibiapaba no século XVIII, com o título de mestre de campo. Um governador escreveu que o convidou para jantar por ser o principal chefe, a quem 7 ou 8 mil pessoas obedeciam. A cena mostra que as autoridades coloniais precisavam das lideranças indígenas para governar <span class="tag forte">forte</span>.</p></div>

<div class="box conceito"><p>O <b>aldeamento</b> era ao mesmo tempo três coisas: <b>refúgio</b>, porque oferecia proteção contra a escravização direta e as guerras; <b>controle</b>, porque impunha religião, regras e trabalho; e <b>espaço de negociação</b>, porque os indígenas usavam as leis e os títulos portugueses para defender terras e direitos. Ver só um desses lados é ver pela metade <span class="tag consenso">consenso na historiografia atual</span>.</p></div>

<h4>O Hospício de Aquiraz</h4>
<p>Os jesuítas também mantinham em Aquiraz uma casa, o Real Hospício, que funcionou como centro de apoio às missões e teve um dos primeiros estabelecimentos de ensino de latim da capitania. O prédio foi destruído no século XIX <span class="tag forte">forte</span>.</p>

<div class="box hoje"><p>Viçosa do Ceará preserva a Igreja de Nossa Senhora da Assunção, ligada à antiga missão, e um centro histórico tombado. Os Tabajara e outros povos da Ibiapaba, hoje, reivindicam essa história como sua.</p></div>
`,

aula('t1-a17',{
objetivo:`<p>Ao final, você vai entender como funcionava o dia a dia de um aldeamento, que trabalho os indígenas aldeados faziam, como eram repartidos entre colonos e Coroa, e quais estratégias usavam para defender suas terras.</p>`,
explicacao:`
<h4>O porquê: a vida depois da guerra</h4>
<p>Para a maior parte dos indígenas do Ceará no século XVIII, a vida não se passava mais em aldeias autônomas, mas em aldeamentos. Ali nasciam, trabalhavam, casavam e morriam. Entender esse cotidiano é entender a experiência da maioria.</p>

<h4>Onde ficavam</h4>
<p>Além da Ibiapaba, havia aldeamentos perto de Fortaleza (os que dariam origem a Parangaba, Caucaia e Messejana), no Maciço de Baturité, na ribeira do Jaguaribe, no litoral oeste (Almofala, dos Tremembé) e no Cariri, onde a missão do Miranda deu origem ao Crato <span class="tag forte">forte</span>. Cada um reunia grupos diferentes, às vezes rivais, trazidos de lugares distintos.</p>

<h4>Trabalho e “repartição”</h4>
<p>Os indígenas aldeados eram considerados livres, mas deviam trabalhar. Parte do tempo plantavam suas roças. Outra parte eram <b>repartidos</b>: alugados a colonos por períodos, em troca de salário, ou chamados para obras públicas e para a guerra. Na prática, o salário muitas vezes não era pago, e os abusos eram frequentes <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Uma diferença essencial: o indígena <b>escravizado</b> era propriedade de alguém. O indígena <b>aldeado</b> era legalmente livre, mas sujeito a trabalho obrigatório e à tutela de missionários e autoridades. Os dois sofriam exploração, mas o aldeado tinha meios legais para reclamar, e muitos usaram esses meios.</p></div>

<h4>A terra da aldeia</h4>
<p>Cada aldeamento tinha uma <b>légua de terra</b> reconhecida, em princípio, para uso dos indígenas. Essas terras foram cobiçadas por fazendeiros desde o início. Os aldeados recorreram a petições ao rei, a advogados e a autoridades para defendê-las, com resultados variados <span class="tag forte">forte</span>. Essa luta pela terra da aldeia atravessa o século XIX e chega aos povos indígenas de hoje.</p>

<div class="box exemplo"><p>Os Paiacu do aldeamento de Montemor (atual Baturité) foram transferidos para a vila de Portalegre, no Rio Grande do Norte, e depois voltaram por conta própria ao Ceará. Deslocar povos inteiros era comum; voltar, contra a vontade das autoridades, era uma forma de resistência <span class="tag forte">forte</span>.</p></div>

<div class="box hoje"><p>Parangaba e Messejana são hoje bairros de Fortaleza; Caucaia é um município da Região Metropolitana. Os Tapeba de Caucaia descendem, em parte, dos indígenas da antiga aldeia de Soure. A antiga légua das aldeias é uma das bases históricas das reivindicações de terra atuais.</p></div>
`,

aula('t1-a18',{
objetivo:`<p>Ao final, você vai saber o que foi o Diretório dos Índios, criado pela política do Marquês de Pombal, como ele transformou os aldeamentos do Ceará em vilas de índios a partir de 1759 e quais foram suas consequências para as línguas, as terras e a identidade dos povos indígenas.</p>`,
explicacao:`
<h4>O porquê: transformar índios em “vassalos”</h4>
<p>Em meados do século XVIII, o governo português, sob o comando do Marquês de Pombal, decidiu mudar a política para os indígenas. O objetivo era tirar o poder dos missionários, especialmente dos jesuítas, e transformar os indígenas em súditos comuns do rei: agricultores cristãos, falantes de português e pagadores de impostos.</p>

<h4>O Diretório</h4>
<p>O <b>Diretório dos Índios</b> foi elaborado em 1757 por Francisco Xavier de Mendonça Furtado, irmão de Pombal, para o Pará e o Maranhão, e estendido ao resto do Brasil em 1758. Em 1759, os jesuítas foram expulsos dos domínios portugueses <span class="tag consenso">consenso</span>. As principais regras:</p>
<ul>
<li>Os aldeamentos viraram <b>vilas</b> ou <b>lugares de índios</b>, com nomes portugueses.</li>
<li>A administração passou a um <b>diretor leigo</b>, nomeado pelo governo, no lugar dos missionários.</li>
<li>Ficou obrigatório o uso da <b>língua portuguesa</b>, e proibida a língua geral e as línguas indígenas nas escolas e repartições.</li>
<li>Incentivavam-se casamentos entre indígenas e não indígenas e a vinda de moradores brancos para as vilas.</li>
<li>Os indígenas deviam produzir para o comércio e pagar o dízimo.</li>
</ul>

<h4>As vilas de índios do Ceará</h4>
<div class="scroll"><table class="tbl">
<tr><th>Vila de índios</th><th>Antigo aldeamento</th><th>Hoje</th></tr>
<tr><td>Viçosa Real</td><td>Ibiapaba</td><td>Viçosa do Ceará</td></tr>
<tr><td>Soure</td><td>Aldeia da Caucaia</td><td>Caucaia</td></tr>
<tr><td>Arronches</td><td>Aldeia de Parangaba</td><td>Bairro da Parangaba, em Fortaleza</td></tr>
<tr><td>Messejana</td><td>Aldeia da Paupina</td><td>Bairro de Messejana, em Fortaleza</td></tr>
<tr><td>Montemor-o-Novo</td><td>Aldeia dos Paiacu e outros, no Maciço</td><td>Baturité</td></tr>
</table></div>
<p class="caption">As cinco vilas de índios criadas no Ceará sob o Diretório. Havia também povoações menores, como Almofala, Baepina e Montemor Velho.</p>

<div class="box conceito"><p>Os nomes das vilas (Viçosa, Soure, Arronches, Montemor) eram de cidades de Portugal. Trocar o nome do lugar fazia parte do projeto: apagar a referência indígena e “aportuguesar” o território. É a mesma lógica da proibição das línguas.</p></div>

<h4>Câmaras com vereadores indígenas</h4>
<p>Uma novidade das vilas foi a <b>câmara municipal</b>, onde indígenas podiam ocupar cargos de vereador e juiz. Estudos recentes mostram que as lideranças indígenas usaram esses cargos para defender seus interesses, por exemplo contra diretores abusivos e invasores de terras <span class="tag forte">forte</span>. Ao mesmo tempo, as câmaras das vilas de índios chegaram ao século XIX sem recursos, e autoridades usaram essa fragilidade para questioná-las.</p>

<h4>Consequências</h4>
<ul>
<li><b>Línguas</b>: a proibição acelerou o desaparecimento das línguas indígenas do Ceará <span class="tag consenso">consenso</span>.</li>
<li><b>Terras</b>: a entrada de moradores brancos nas vilas abriu caminho para a ocupação das terras indígenas.</li>
<li><b>Identidade</b>: com a mistura incentivada e o fim das aldeias, ficou mais fácil, no século XIX, dizer que “não havia mais índios”, como você viu no módulo 2.</li>
</ul>
<p>O Diretório foi abolido em 1798, mas seus efeitos duraram muito mais.</p>

<div class="box cuidado"><p>Não se deve imaginar o Diretório como algo que funcionou exatamente como estava no papel. Nas vilas do Ceará, os indígenas negociaram, resistiram e adaptaram as regras. A lei mostra o projeto do governo; a prática mostra o que os povos fizeram com ele.</p></div>

<div class="box conexao"><p>Na Trilha 2 você verá o que aconteceu com essas vilas no século XIX, até a declaração de “extinção” dos aldeamentos em 1863. Na Trilha 4, como a memória das antigas vilas sustenta a luta de povos como os Tapeba e os Pitaguary.</p></div>
`,
quiz:[
 {q:'Qual era o objetivo central do Diretório dos Índios?',
  o:['Devolver as terras aos indígenas','Tirar o poder dos missionários e transformar os indígenas em súditos comuns, agricultores e falantes de português','Fortalecer os jesuítas','Criar escolas em línguas indígenas'],c:1,

 {q:'Qual vila de índios deu origem a Caucaia?',
  o:['Arronches','Soure','Messejana','Viçosa Real'],c:1,
  e:['Arronches é a Parangaba.','Correto.','Messejana é bairro de Fortaleza.','Viçosa Real é Viçosa do Ceará.']},
 {q:'Por que as vilas receberam nomes de cidades portuguesas?',
  o:['Por acaso','Para apagar a referência indígena e aportuguesar o território','Porque os moradores pediram','Porque eram colônias de Portugal na Europa'],c:1,
  e:['Fazia parte do projeto.','Correto.','Não há registro disso.','Ficavam no Brasil.']},
 {q:'Qual foi uma consequência duradoura do Diretório no Ceará?',
  o:['O fortalecimento das línguas indígenas','O desaparecimento acelerado das línguas indígenas e a facilitação da perda de terras','O fim da criação de gado','A independência das vilas'],c:1,
  e:['Foi o contrário.','Correto.','O gado seguiu.','Não houve independência.']}
],

aula('t1-a19',{
objetivo:`<p>Ao final, você vai entender como funcionava uma fazenda de gado do sertão cearense no século XVIII, quem era o vaqueiro e como ele era pago, e por que se fala em “civilização do couro”.</p>`,
explicacao:`
<h4>O porquê: a base da sociedade sertaneja</h4>
<p>Durante o século XVIII, o gado foi a principal riqueza do Ceará. A pecuária moldou a ocupação, as relações de trabalho, a alimentação, a cultura e até o jeito de falar do sertão. Muito do que se considera “tipicamente sertanejo” nasceu nas fazendas desse período.</p>

<h4>A fazenda de gado</h4>
<p>Uma fazenda típica era enorme e tinha pouca gente. O gado era criado solto, na caatinga, sem cercas. Na época da chuva, espalhava-se pelos pastos; na seca, concentrava-se perto dos poços, lagoas e trechos de rio com água. A sede era simples: casa de taipa ou alvenaria, curral, às vezes uma capela. Muitos donos de fazendas, os sesmeiros, nem moravam no sertão: viviam em Pernambuco, na Bahia ou nas vilas do litoral, e deixavam a fazenda nas mãos de um vaqueiro <span class="tag consenso">consenso</span>.</p>

<h4>O vaqueiro e a “quarta”</h4>
<p>O vaqueiro cuidava do rebanho: tangia o gado, marcava os bezerros com o ferro do dono, curava bicheiras, achava os animais perdidos na caatinga. Em geral, não recebia salário em dinheiro. Recebia pela chamada <b>quarta</b>: depois de alguns anos de trabalho, ficava com um em cada quatro bezerros nascidos. Assim, um vaqueiro podia formar seu próprio rebanho e, às vezes, virar fazendeiro <span class="tag consenso">consenso</span>.</p>

<div class="box conceito"><p>O sistema da quarta ajuda a explicar uma característica do sertão: a presença de <b>trabalho livre</b>, ao lado do trabalho escravo. Estudos como o de Maria Sylvia Porto Alegre mostram que a pecuária abria possibilidades de acumulação para vaqueiros contratados, o que diferenciava o sertão da zona açucareira <span class="tag forte">forte</span>. Isso não quer dizer que não houvesse escravidão nas fazendas: havia, como você verá no nível Especialista.</p></div>

<h4>A “civilização do couro”</h4>
<p>Capistrano de Abreu descreveu o sertão colonial como uma época em que quase tudo era feito de couro: portas, camas, cordas, roupas do vaqueiro, recipientes para água, bolsas, arreios. A expressão “civilização do couro”, que se popularizou depois, resume a ideia de que o boi fornecia não só comida, mas a matéria-prima do cotidiano <span class="tag interpretacao">imagem clássica</span>.</p>

<div class="box cuidado"><p>A imagem da “civilização do couro” é poderosa, mas pode esconder outras coisas: a roça de mandioca, milho e feijão, a pesca, o algodão para a roupa de todo dia, a contribuição indígena para técnicas e alimentos. O sertão não vivia só do boi.</p></div>

<div class="box hoje"><p>A vaquejada, a pega de boi no mato, os aboios (cantos usados para guiar o gado), a roupa de couro e a carne de sol são heranças diretas dessa época. A missa do vaqueiro, celebrada em várias cidades do sertão, homenageia esses trabalhadores.</p></div>
`,

  o:['Em estábulos fechados','Solto na caatinga, sem cercas, concentrando-se perto da água na seca','Em pequenos piquetes irrigados','Somente no litoral'],c:1,

aula('t1-a20',{
objetivo:`<p>Ao final, você vai saber como as sesmarias eram pedidas e concedidas no Ceará, quem as recebia, por que levaram à concentração de terras e como os pedidos de sesmaria servem hoje de fonte para os historiadores.</p>`,
explicacao:`
<h4>O porquê: a origem da concentração de terras</h4>
<p>A forma como a terra é distribuída no começo de uma sociedade tende a durar séculos. No Ceará, a terra foi dividida em sesmarias enormes, concedidas a poucos. Essa origem ajuda a explicar a concentração fundiária que você vai encontrar nas secas, nos conflitos e na política das próximas trilhas.</p>

<h4>Como funcionava</h4>
<p>Quem queria terra fazia um pedido ao capitão-mor ou ao governador, descrevendo o lugar: um trecho de rio, a partir de uma lagoa, um olho d’água, tantas léguas de comprimento por tantas de largura. Muitas vezes alegava ter “descoberto” as terras ou ter lutado contra os “bárbaros”. A autoridade concedia, e a concessão devia ser confirmada pelo rei. O sesmeiro tinha de ocupar e tornar produtiva a terra, sob pena de perdê-la <span class="tag consenso">consenso</span>.</p>

<h4>Quem recebia</h4>
<p>As doações se intensificaram nas duas últimas décadas do século XVII e na primeira metade do XVIII. Recebiam sesmarias militares que tinham lutado na Guerra dos Bárbaros, criadores vindos de Pernambuco, da Paraíba e da Bahia, religiosos e pessoas com influência junto às autoridades. Um mesmo nome aparece com frequência em vários pedidos, e famílias poderosas acumularam muitas léguas <span class="tag forte">forte</span>.</p>

<div class="box exemplo"><p>No início do século XVIII, o ouvidor Cristóvão Soares Reimão percorreu a capitania para medir e distribuir terras, do Pacoti ao Jaguaribe, e denunciou ao rei abusos de sesmeiros que tinham terras demais e não as ocupavam <span class="tag forte">forte</span>. As queixas mostram que a concentração já incomodava as próprias autoridades.</p></div>

<div class="box conceito"><p>Uma sesmaria era descrita a partir de elementos da natureza: rios, serrotes, lagoas. Como os limites eram imprecisos, eram comuns as <b>sobreposições</b> e os conflitos entre vizinhos. Os povos indígenas, por sua vez, quase nunca aparecem como donos: suas terras eram tratadas como “devolutas” ou “de bárbaros”.</p></div>

<h4>As sesmarias como fonte histórica</h4>
<p>Os pedidos de sesmaria do Ceará foram reunidos e publicados, e hoje estão também em bancos de dados digitais, como a plataforma SILB, da UFRN. Para o historiador, são uma mina: mostram quem ocupou cada ribeira, quando, com que justificativa, e quais povos indígenas viviam ali. Mas é preciso lembrar que foram escritos pelos interessados, que exageravam seus “serviços” para obter mais terra.</p>

<div class="box hoje"><p>O regime de sesmarias acabou em 1822, mas a concentração que ele criou permaneceu. A Lei de Terras de 1850, que você verá na Trilha 2, transformou a terra em mercadoria e dificultou ainda mais o acesso dos pobres. Conflitos fundiários no Ceará atual ainda esbarram em títulos que remontam a essa época.</p></div>
`,
quiz:[
 {q:'Como se descrevia uma sesmaria?',
  o:['Com coordenadas de GPS','A partir de elementos naturais, como rios, lagoas e serrotes, em léguas','Pelo número de bois','Pelo nome do vaqueiro'],c:1,
  e:['Não havia GPS.','Correto, o que gerava sobreposições.','Não.','Não.']},
 {q:'Que obrigação tinha o sesmeiro?',
  o:['Pagar aluguel aos indígenas','Ocupar e tornar produtiva a terra, sob pena de perdê-la','Construir uma igreja','Morar em Lisboa'],c:1,
  e:['Não.','Correto, embora muitas vezes não cumprida.','Não era obrigação.','Não.']},
 {q:'Quem costumava receber sesmarias no Ceará?',
  o:['Indígenas aldeados','Militares da guerra, criadores de outras capitanias, religiosos e pessoas influentes','Escravizados','Qualquer pessoa que pedisse'],c:1,
  e:['Os indígenas quase nunca aparecem como donos.','Correto.','Não.','Era preciso influência e justificativa.']},
 {q:'O que as queixas de Cristóvão Soares Reimão revelam?',
  o:['Que não havia sesmeiros','Que a concentração de terras e a falta de ocupação já incomodavam autoridades no início do século XVIII','Que ele era indígena','Que a Coroa proibiu o gado'],c:1,
  e:['Havia muitos.','Correto.','Era ouvidor.','Não.']},
 {q:'Que cuidado o historiador deve ter ao ler pedidos de sesmaria?',
  o:['Nenhum','Lembrar que foram escritos pelos interessados, que exageravam seus serviços para obter mais terra','Lembrar que são todos falsos','Ler só os do século XX'],c:1,
  e:['Toda fonte exige cuidado.','Correto.','Não são falsos; são interessados.','São coloniais.']}
],
exercicio:`<p><b>Procure uma sesmaria.</b> Acesse a plataforma SILB (Sesmarias do Império Luso-Brasileiro) e busque pelo nome de um rio ou lugar perto de você. Anote: o nome do sesmeiro, o ano, a extensão pedida e a justificativa. Se não encontrar, escolha qualquer sesmaria do Jaguaribe e faça o mesmo.</p>`,
fontes:`<ul>
<li>${lnk('https://anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548875179_dacdbcb1ed99fad23c83de7639bc9ed7.pdf','Artigo sobre sesmarias e guerra no Siará Grande')} (ANPUH), com a denúncia de 1708 de Cristóvão Soares Reimão.</li>
<li>${lnk('https://core.ac.uk/download/200879914.pdf','O processo migratório no Ceará')} (Geosul, 2016).</li>
<li>${lnk('https://www.redalyc.org/pdf/273/27322910006.pdf','Artigo sobre agentes econômicos e cartografia na capitania do Ceará')} (Anais do Museu Paulista, 2012).</li>
</ul>`

aula('t1-a21',{
objetivo:`<p>Ao final, você vai conseguir descrever a vida cotidiana no sertão pastoril do século XVIII: a casa, a comida, a religião, as festas, a violência e o papel das mulheres, dos escravizados e dos pobres livres.</p>`,
explicacao:`
<h4>O porquê: a história de quem não aparece nos documentos oficiais</h4>
<p>As aulas anteriores falaram de terras, rebanhos e autoridades. Mas como viviam as pessoas comuns do sertão? Reconstruir o cotidiano exige juntar pedaços: inventários de bens, testamentos, processos criminais, registros de batismo e casamento, relatos de viajantes e a memória oral.</p>

<h4>A casa e a comida</h4>
<p>A maioria morava em casas de taipa (barro e madeira), cobertas de palha ou telha, com pouca mobília: redes, baús, potes, objetos de couro. A dieta se baseava em carne seca ou fresca, leite e queijo quando havia chuva, farinha de mandioca, milho, feijão e o que a caatinga oferecia: frutas, mel, caça <span class="tag forte">forte</span>.</p>

<h4>Religião e festas</h4>
<p>A Igreja era o grande centro da vida social. As capelas das fazendas e as matrizes das povoações reuniam gente nas missas, batizados, casamentos e festas de padroeiro. Irmandades religiosas organizavam festas e ajudavam seus membros. O calendário de festas, ligado às chuvas e às colheitas, marcava o ano <span class="tag consenso">consenso</span>.</p>

<h4>Uma sociedade hierárquica e violenta</h4>
<p>No topo estavam os grandes sesmeiros e fazendeiros, que concentravam terra, gado e cargos militares. Abaixo, vaqueiros, agregados, pequenos criadores, artesãos. Na base, escravizados, indígenas e pobres livres sem terra. A justiça oficial ficava longe, e os conflitos se resolviam muitas vezes pela força. Rixas entre famílias, por terra, água ou honra, atravessavam gerações <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Os historiadores falam em <b>mandonismo</b> para descrever o poder pessoal dos grandes proprietários sobre as pessoas ao seu redor, misturando favores, proteção e ameaça. É uma raiz do coronelismo que você estudará na Trilha 3.</p></div>

<h4>As mulheres</h4>
<p>As mulheres aparecem pouco nos documentos oficiais, mas os inventários e testamentos mostram muitas delas administrando fazendas como viúvas, herdando gado e escravizados, e negociando. As mulheres pobres trabalhavam na roça, na fiação de algodão, na produção de alimentos e louça de barro. As mulheres indígenas e escravizadas sofriam as formas mais duras de violência <span class="tag forte">forte</span>.</p>

<div class="box cuidado"><p>Cuidado com a imagem romântica do sertão como lugar de “gente simples e feliz” ou, no extremo oposto, como lugar de “atraso” puro. Era uma sociedade complexa, desigual, com mobilidade para alguns e violência para muitos.</p></div>

<div class="box hoje"><p>Muitas tradições do sertão de hoje, como as festas de padroeiro, as novenas, as rezadeiras, a louça de barro e o artesanato de couro, têm raízes nesse período e na mistura de heranças indígenas, africanas e portuguesas.</p></div>
`,
quiz:[
 {q:'Que tipo de fonte ajuda a reconstruir o cotidiano do sertão colonial?',
  o:['Apenas leis do rei','Inventários, testamentos, processos criminais, registros paroquiais e relatos','Fotografias','Jornais diários'],c:1,
  e:['As leis mostram o projeto, não o cotidiano.','Correto.','Não havia fotografia.','Não havia jornais no Ceará colonial.']},
 {q:'Qual era o grande centro da vida social no sertão?',
  o:['O teatro','A Igreja, com missas, batizados, casamentos e festas','A escola pública','O quartel'],c:1,
  e:['Não havia.','Correto.','Quase não havia escolas.','Havia milícias, mas o centro social era a Igreja.']},
 {q:'O que é mandonismo?',
  o:['Um tipo de dança','O poder pessoal dos grandes proprietários sobre as pessoas ao redor, com favores, proteção e ameaça','Uma lei portuguesa','Uma doença do gado'],c:1,
  e:['Não.','Correto. Raiz do coronelismo.','Não.','Não.']},
 {q:'O que os inventários e testamentos mostram sobre as mulheres?',
  o:['Que não tinham nenhum papel econômico','Que muitas administravam fazendas como viúvas, herdavam e negociavam','Que eram todas escravizadas','Que viviam só nas cidades'],c:1,
  e:['Mostram o contrário.','Correto.','Não.','Não.']},
 {q:'Qual destas descrições do sertão colonial é mais adequada?',
  o:['Um lugar de gente simples e feliz','Um lugar só de atraso','Uma sociedade complexa e desigual, com mobilidade para alguns e violência para muitos','Um lugar sem conflitos'],c:2,
  e:['É romantização.','É preconceito.','Correto.','Havia muitos conflitos.']}
],
exercicio:`<p><b>Um dia no sertão de 1760.</b> Escreva um texto de uma página descrevendo um dia na vida de um vaqueiro, de uma viúva fazendeira ou de uma pessoa escravizada numa fazenda do Jaguaribe em 1760. Use apenas elementos que você aprendeu nas aulas e indique, no final, quais partes são baseadas em fontes e quais são imaginação.</p>`,
fontes:`<ul>
<li>Leonardo Cândido Rolim, ${lnk('https://periodicos.ufrn.br/mneme/article/view/377','O trabalho nas oficinas de carnes secas do Aracati: trabalhadores livres e escravos')} (Mneme, UFRN).</li>
<li>Maria Sylvia Porto Alegre, ${lnk('https://dialnet.unirioja.es/descarga/articulo/8667658.pdf','Origens do trabalho livre no Ceará colonial')}.</li>
<li>Diego Cavalcanti Araújo, ${lnk('https://repositorio.ufc.br/bitstream/riufc/57607/5/2021_dis_dcaraujo.pdf','Trajetórias e experiências de escravizados no Baixo Jaguaribe-Aracati no século XVIII')} (UFC, 2021).</li>
</ul>`
});

aula('t1-a22',{
objetivo:`<p>Ao final, você vai entender como funcionavam as oficinas de carne seca do Ceará, quem trabalhava nelas e por que essa atividade foi tão importante para a economia da capitania no século XVIII.</p>`,
explicacao:`
<h4>O porquê: transformar boi em mercadoria</h4>
<p>Levar bois vivos do Ceará até Pernambuco ou Bahia era uma viagem longa, e os animais chegavam magros. A solução foi abater o gado perto do litoral e transformar a carne em um produto que aguentasse a viagem de barco: a <b>carne seca</b>, salgada e seca ao sol. Isso criou a primeira “indústria” do Ceará.</p>

<h4>As oficinas</h4>
<p>Os locais de abate e salga eram chamados de <b>oficinas</b> ou salgadeiras. Ficavam perto dos portos, sobretudo no Aracati, na foz do Jaguaribe, mas também em outros pontos do litoral, como Acaraú e Camocim. O gado chegava em boiadas pelos caminhos do sertão. A carne era cortada em mantas, salgada e posta para secar; o couro, o sebo e outras partes também eram aproveitados e vendidos <span class="tag forte">forte</span>.</p>
<p>Pesquisas confirmam a existência de pelo menos 13 oficinas dentro da vila do Aracati entre 1757 e 1786, além de outras nas fazendas dos arredores <span class="tag forte">forte</span>.</p>

<h4>Quem trabalhava</h4>
<p>O trabalho nas oficinas era pesado e tinha uma divisão de tarefas: matar, esfolar, cortar, salgar, estender, recolher. Estudos de Leonardo Cândido Rolim e Diego Cavalcanti Araújo mostram que trabalhavam ali tanto <b>pessoas escravizadas</b> quanto <b>trabalhadores livres pobres</b>, muitos deles indígenas e mestiços, contratados na temporada <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>O período de abate e salga ficou conhecido como <b>“tempo das carnes”</b>: os meses do segundo semestre, depois das chuvas, quando o gado estava gordo e o sol forte ajudava a secar a carne. A cidade se enchia de gente, barcos e negócios.</p></div>

<h4>Para quem se vendia</h4>
<p>A carne seca abastecia sobretudo os engenhos e cidades de Pernambuco e da Bahia, onde alimentava trabalhadores escravizados, soldados e a população urbana. Era um elo do <b>comércio atlântico</b>: o açúcar exportado para a Europa dependia, em parte, da carne do sertão para alimentar quem o produzia <span class="tag forte">forte</span>.</p>

<div class="box hoje"><p>A carne de sol e a carne seca continuam sendo pratos centrais da cozinha cearense. A técnica de salga e secagem ao sol que você come hoje tem três séculos de história no Ceará.</p></div>
`,
quiz:[

  o:['Porque era proibido vender boi vivo','Porque levar bois vivos para longe era difícil, e a carne seca aguentava a viagem de barco','Porque os indígenas exigiram','Porque não havia sal'],c:1,
  e:['Não era proibido.','Correto.','Não.','Havia sal no litoral.']},
 {q:'Onde ficava o principal centro das oficinas de carne seca?',

 {q:'Quem trabalhava nas oficinas?',
  o:['Somente portugueses','Pessoas escravizadas e trabalhadores livres pobres, muitos indígenas e mestiços','Somente holandeses','Somente vaqueiros ricos'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'O que era o “tempo das carnes”?',
  o:['A quaresma','O período de abate e salga, no segundo semestre, depois das chuvas','Um imposto','Uma festa indígena'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Para onde ia a maior parte da carne seca cearense?',
  o:['Para a Europa','Para Pernambuco, Bahia e outros portos do Brasil','Para a África','Para a Amazônia'],c:1,
  e:['Não era o destino principal.','Correto, alimentando a economia do açúcar.','Não.','Não.']}
],
exercicio:`<p><b>Do pasto ao prato.</b> Desenhe um fluxograma com as etapas da carne seca no século XVIII: fazenda, caminho, oficina, porto, barco, destino. Em cada etapa, escreva quem trabalhava ali.</p>`,
fontes:`<ul>
<li>Leonardo Cândido Rolim, ${lnk('https://periodicos.ufpb.br/index.php/srh/article/view/19807','“Tempo das carnes” no Siará Grande')} (Saeculum, 2013).</li>

<li>Diego Cavalcanti Araújo, ${lnk('https://repositorio.ufc.br/bitstream/riufc/57607/5/2021_dis_dcaraujo.pdf','dissertação sobre escravizados no Baixo Jaguaribe')} (UFC, 2021).</li>
</ul>`

aula('t1-a23',{
objetivo:`<p>Ao final, você vai conhecer a história do Aracati, o “porto do sertão”, da povoação do início do século XVIII à vila de 1748, sua riqueza e sua decadência com as secas do fim do século.</p>`,
explicacao:`
<h4>O porquê: a cidade mais rica da capitania</h4>
<p>Hoje, quem passeia pelo centro histórico do Aracati vê casarões de azulejo e igrejas que não combinam com o tamanho atual da cidade. Eles são vestígios do tempo em que o Aracati era o lugar mais rico e movimentado do Ceará.</p>

<h4>De porto a vila</h4>
<p>Desde a década de 1720, o povoado na margem do Jaguaribe, perto da foz, já era uma importante praça comercial do litoral norte. Barcos subiam o rio até ali, e o lugar concentrava o comércio de carne seca e couro. Em <b>1748</b>, a Coroa criou a vila de <b>Santa Cruz do Aracati</b>, com o objetivo de cobrar impostos e impor controle sobre esse povoado rico e agitado <span class="tag forte">forte</span>.</p>

<h4>Comerciantes e conexões</h4>
<p>Durante o século XVIII, saiu do porto do Recife a maior parte das embarcações que chegavam ao Aracati. Os comerciantes do Aracati tinham ligações com Recife, Salvador e até Lisboa. Com o dinheiro da carne, construíram sobrados, igrejas e casas de comércio <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Como o Ceará era subordinado a Pernambuco, o comércio com Portugal tinha de passar pelo Recife. Os comerciantes recifenses controlavam o crédito e os preços. Essa dependência econômica, além da política, ajuda a explicar o desejo de autonomia que levou à separação de 1799.</p></div>

<h4>A queda: as secas de 1777 e 1790</h4>
<p>As grandes secas do fim do século XVIII, sobretudo a de 1777–1778 e a de 1790–1793, mataram rebanhos inteiros e arruinaram a produção de carne seca. Ao mesmo tempo, no sul do Brasil, crescia a produção de charque no Rio Grande do Sul. Segundo uma tradição bem difundida, o charqueador português José Pinto Martins, que atuava no Aracati, mudou-se para o Sul depois da seca de 1777 e levou a técnica, contribuindo para o surgimento das charqueadas de Pelotas <span class="tag forte">forte</span>. O charque gaúcho ocupou o mercado que o Ceará perdeu.</p>

<div class="box cuidado"><p>Diz-se às vezes que o “charque gaúcho é cearense”. É um exagero simpático. A técnica de salgar e secar carne era conhecida em vários lugares. O que se pode dizer, com base nas fontes, é que o Ceará e o Piauí já produziam carne seca em larga escala antes de Pelotas, e que as secas abriram espaço para o Sul.</p></div>

<div class="box hoje"><p>O conjunto urbano do Aracati é tombado pelo Iphan. A cidade vive hoje do turismo, sobretudo em Canoa Quebrada, e da produção de camarão e frutas no Baixo Jaguaribe.</p></div>
`,
quiz:[
 {q:'Em que ano foi criada a vila de Santa Cruz do Aracati?',

  e:['1699 é a ordem de criação da primeira vila do Ceará.','1726 é Fortaleza.','Correto.','1799 é a autonomia do Ceará.']},
 {q:'Por que a Coroa criou a vila do Aracati?',
  o:['Para homenagear os indígenas','Para cobrar impostos e controlar um povoado comercial rico','Para fundar um seminário','Para receber os holandeses'],c:1,

  e:['Havia ligação, mas o principal era Recife.','Correto.','Não.','Não.']},
 {q:'O que provocou a queda das oficinas de carne seca do Aracati?',
  o:['A chegada dos holandeses','As grandes secas do fim do século XVIII e a concorrência do charque do Sul','A abolição','A ferrovia'],c:1,

  e:['É exagero.','Correto.','Há base para parte da história.','Não.']}
],
exercicio:`<p><b>Patrimônio do Aracati.</b> Procure fotos do centro histórico do Aracati (Rua Grande, Igreja Matriz, Casa de Câmara e Cadeia). Escolha um prédio e pesquise quando foi construído e para que servia. Relacione com o que aprendeu sobre a riqueza da carne seca.</p>`,
fontes:`<ul>

<li>${lnk('https://periodicos.ufpb.br/index.php/srh/article/download/19807/10942/37150','Texto completo do artigo')} (Saeculum, 2013).</li>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/regiao/historia-das-charqueadas-1.279025','Uma das principais rotas do charque no Ceará')} (José Pinto Martins e a seca de 1777).</li>
<li>${lnk('https://www.redalyc.org/pdf/5740/574069136008.pdf','Artigo sobre carne seca no Atlântico Sul')} (secas de 1770 e 1790 e a produção no Ceará e Piauí).</li>
</ul>`

aula('t1-a24',{
objetivo:`<p>Ao final, você vai entender as rotas comerciais do Ceará colonial, por terra e por mar, o que se vendia e comprava, e como o algodão começou a substituir a carne seca no fim do século XVIII.</p>`,
explicacao:`
<h4>O porquê: o Ceará não vivia isolado</h4>
<p>Mesmo pobre e subordinado, o Ceará colonial estava ligado a uma rede de comércio que ia do sertão aos portos do Brasil e ao Atlântico. Entender essa rede ajuda a entender por que algumas vilas cresceram e outras não.</p>

<h4>Por terra</h4>
<p>Os caminhos do gado, que você viu no módulo 1, ligavam o sertão do Ceará ao Piauí, à Paraíba, a Pernambuco e à Bahia. Por eles passavam boiadas, mas também tropeiros com mercadorias: sal, ferramentas, tecidos, aguardente. Feiras de gado em Pernambuco e na Bahia recebiam boiadas cearenses <span class="tag forte">forte</span>.</p>

<h4>Por mar</h4>
<p>Pequenos barcos (sumacas, iates) faziam a cabotagem ao longo da costa, ligando Aracati, Fortaleza, Acaraú e Camocim a Recife e Salvador. Saíam carne seca, couro, sola, sebo e, mais tarde, algodão. Chegavam tecidos europeus, vinho, azeite, ferro, louça, sal e pessoas escravizadas <span class="tag forte">forte</span>.</p>

<div class="scroll"><table class="tbl">
<tr><th>O Ceará vendia</th><th>O Ceará comprava</th></tr>
<tr><td>Carne seca, couro, sola, sebo</td><td>Tecidos, ferro, ferramentas</td></tr>
<tr><td>Gado em pé (por terra)</td><td>Vinho, azeite, louça</td></tr>
<tr><td>Algodão (a partir do fim do século XVIII)</td><td>Pessoas escravizadas</td></tr>
</table></div>

<h4>A virada para o algodão</h4>
<p>No fim do século XVIII, enquanto as secas derrubavam a carne seca, outra mercadoria ganhava espaço: o <b>algodão</b>. A Revolução Industrial na Inglaterra criou uma demanda enorme por algodão para as fábricas de tecido, e o algodão do Nordeste, inclusive do Ceará, passou a ser exportado <span class="tag consenso">consenso</span>. O algodão se adaptava ao semiárido e podia ser plantado por pequenos produtores. Ele vai dominar a economia cearense no século XIX, tema da Trilha 2.</p>

<div class="box conexao"><p>O crescimento do algodão e o desejo de comerciar diretamente com Portugal, sem passar pelo Recife, estão entre as razões da separação de Pernambuco em 1799, tema do nível Especialista.</p></div>

<div class="box hoje"><p>As rotas de hoje repetem, em parte, as antigas: a BR-116 segue de perto o vale do Jaguaribe, e o porto do Pecém ocupa o papel que um dia foi do Aracati.</p></div>
`,
quiz:[
 {q:'O que circulava pelos caminhos terrestres do Ceará colonial?',
  o:['Só boiadas','Boiadas e tropeiros com sal, ferramentas, tecidos e aguardente','Trens','Carros de boi com café'],c:1,
  e:['Também mercadorias.','Correto.','Não havia trens.','O café era pouco relevante.']},
 {q:'Que tipo de navegação ligava os portos do Ceará a Recife e Salvador?',
  o:['Transatlântica direta','Cabotagem, com pequenos barcos ao longo da costa','Fluvial pelo São Francisco','Nenhuma'],c:1,
  e:['O comércio passava pelo Recife.','Correto.','Não.','Havia, e era importante.']},
 {q:'Qual produto começou a substituir a carne seca no fim do século XVIII?',
  o:['Café','Algodão','Cacau','Borracha'],c:1,
  e:['O café teve papel menor, nas serras.','Correto, puxado pela Revolução Industrial.','Não.','A borracha é amazônica e posterior.']},
 {q:'Por que o algodão se espalhou no Ceará?',

  e:['Ao contrário: adapta-se ao clima seco.','Correto.','Não.','Não.']},
 {q:'Qual destas mercadorias o Ceará comprava?',
  o:['Couro','Carne seca','Tecidos e ferro','Sola'],c:2,
  e:['Vendia.','Vendia.','Correto.','Vendia.']}
],
exercicio:`<p><b>Mapa das rotas.</b> Num mapa do Nordeste, trace as principais rotas do Ceará colonial: os caminhos do gado e as rotas de cabotagem. Marque Aracati, Icó, Fortaleza, Recife e Salvador. Escreva ao lado o que circulava em cada rota.</p>`,
fontes:`<ul>
<li>${lnk('https://periodicos.ufpb.br/index.php/srh/article/download/19807/10942/37150','Rolim, “Tempo das carnes” no Siará Grande')} (Saeculum, 2013).</li>
<li>Gabriel Parente Nogueira, ${lnk('https://periodicos.ufrn.br/porto/article/download/10921/7678/31149','Um porto do sertão, um centro regional')}.</li>
<li>O Povo, ${lnk('https://www.opovo.com.br/noticias/fortaleza/2019/01/o-ouro-branco-que-levou-a-europa-ceara-celebra-220-anos-de-emancipaca.html','O ouro branco que levou à Europa')} (2019).</li>
</ul>`

aula('t1-a25',{
objetivo:`<p>Ao final, você vai saber como foi criada a primeira vila do Ceará, por que sua localização demorou tanto a ser definida e por que Aquiraz é lembrada como a primeira capital.</p>`,
explicacao:`
<h4>O porquê: uma vila sem lugar</h4>
<p>Em 1699, o rei mandou criar uma vila no Ceará. Parece simples, mas levou catorze anos para decidir onde ela ficaria. Essa disputa mostra os conflitos entre os interesses dos militares do forte, dos fazendeiros e das autoridades.</p>

<h4>A ordem de 1699</h4>
<p>Por uma ordem régia de 13 de fevereiro de 1699, o rei D. Pedro II de Portugal determinou a criação de uma vila na capitania do Ceará. A ordem não dizia exatamente onde. Em janeiro de 1700 houve as primeiras eleições de juízes, e a sede começou a mudar de lugar <span class="tag forte">forte</span>.</p>

<h4>O vaivém</h4>
<p>Segundo a cronologia do IBGE, a sede da vila esteve no núcleo do forte, foi para a Barra do Ceará, voltou para o forte, foi de novo para a Barra e voltou outra vez, entre 1700 e 1711 <span class="tag forte">forte</span>. As autoridades militares queriam a vila perto do forte; os fazendeiros preferiam um lugar mais favorável aos seus interesses <span class="tag forte">forte</span>.</p>

<h4>Aquiraz (1713)</h4>
<p>Por fim, uma ordem régia de 1713 transferiu a sede para <b>Aquiraz</b>, onde a vila de São José de Ribamar foi instalada em <b>27 de junho de 1713</b>. Aquiraz oferecia planície, água permanente e ficava mais próxima das fazendas do leste. Foi a primeira sede oficial da capitania, e por isso é lembrada como a primeira capital do Ceará <span class="tag forte">forte</span>.</p>

<div class="box cuidado"><p>“Capital” é uma palavra moderna. No século XVIII, o que existia era a vila sede da câmara e o lugar onde residia o capitão-mor, que nem sempre coincidiam. Por isso há quem prefira dizer que Aquiraz foi a “primeira sede” da capitania. As duas formas aparecem nos textos.</p></div>

<div class="box hoje"><p>Aquiraz guarda igrejas do século XVIII e a casa onde teria vivido o capitão-mor Manoel da Fonseca Jaime, que governou de 1713 a 1716. Por lei estadual de 2004, o Dia do Ceará (17 de janeiro) é celebrado oficialmente em Aquiraz.</p></div>
`,
quiz:[
 {q:'Quando o rei ordenou a criação de uma vila no Ceará?',
  o:['1612','1699','1726','1799'],c:1,
  e:['1612 é o forte de Soares Moreno.','Correto: ordem régia de 13 de fevereiro de 1699.','1726 é a vila de Fortaleza.','1799 é a autonomia.']},
 {q:'Por que a localização da vila demorou a ser definida?',
  o:['Por falta de interesse','Por disputas entre militares, que queriam a vila perto do forte, e fazendeiros, com outros interesses','Porque o rei proibiu','Por causa dos holandeses'],c:1,

aula('t1-a26',{
objetivo:`<p>Ao final, você vai entender como Fortaleza se tornou vila em 1726, o papel do levante indígena de 1713 nessa história, e por que Fortaleza só se tornou o centro do Ceará no século XIX.</p>`,
explicacao:`
<h4>O porquê: o aniversário de uma cidade</h4>
<p>Todo 13 de abril, Fortaleza comemora seu aniversário. Em 2026, comemorou 300 anos. A data se refere ao ato de 1726 que criou a vila. Mas por que uma segunda vila, se Aquiraz já existia?</p>

<h4>O levante de 1713</h4>
<p>Pouco depois da instalação de Aquiraz, em 1713, um grande levante indígena, com participação de povos chamados nas fontes de Kariri, atingiu fazendas e chegou à vila. Moradores e vereadores fugiram e se refugiaram junto ao forte, no Pajeú <span class="tag forte">forte</span>. O episódio mostrou que a Guerra dos Bárbaros não tinha terminado e reforçou a importância do forte como lugar seguro.</p>

<h4>A vila de 1726</h4>
<p>Depois de anos de disputa, uma resolução régia de 1725 mandou criar uma nova vila junto ao forte. Em <b>13 de abril de 1726</b>, o capitão-mor <b>Manuel Francês</b> lavrou a ata de instalação da <b>Vila de Fortaleza de Nossa Senhora da Assunção</b>: reuniu os moradores, organizou a eleição da primeira câmara e mandou erguer o pelourinho <span class="tag forte">forte</span>. Manuel Francês também desenhou a primeira planta da vila, que, segundo estudiosos, embelezava a realidade para impressionar a Coroa <span class="tag interpretacao">interpretação</span>.</p>

<h4>“Um montão de areia”</h4>
<p>Durante o século XVIII, Fortaleza continuou pequena e pobre, à sombra do Aracati e de Aquiraz. Em 1799, o primeiro governador da capitania autônoma, Bernardo Manuel de Vasconcelos, descreveu o lugar como “um montão de areia” <span class="tag forte">forte</span>. Fortaleza só seria elevada a cidade em 1823 e só se tornaria o centro econômico do Ceará no século XIX, com o algodão, o porto e a ferrovia.</p>

<div class="box cuidado"><p>A escolha do 13 de abril como aniversário oficial só se firmou no século XX, depois de muito debate. Quando o historiador Raimundo Girão defendeu uma origem ligada ao forte holandês, houve forte contestação, e ele chegou a deixar o cargo que ocupava <span class="tag forte">forte</span>. Datas de aniversário de cidades também são escolhas políticas.</p></div>

<div class="box hoje"><p>Em 2026, os 300 anos de Fortaleza foram ocasião de muitas publicações e debates sobre a origem da cidade, inclusive sobre o papel dos indígenas, dos holandeses e das disputas com Aquiraz.</p></div>
`,
quiz:[
