<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ceará: Terra e Gente — Curso de História do Ceará</title>
<meta name="description" content="Curso completo de história do Ceará, dos povos originários aos dias de hoje, em 4 trilhas e 4 níveis.">
<meta name="theme-color" content="#1d6c86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Terra e Gente">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f8f4ec; --surface:#ffffff; --surface-2:#f2ece0; --text:#1f1d1a; --muted:#5f5a52; --faint:#8d877c;
  --line:#e4dccd; --accent:#b5521b; --accent-soft:#f8e7da; --sea:#1d6c86; --sea-soft:#e1f0f4;
  --ok:#1f7a4d; --ok-soft:#e4f3ea; --bad:#b3261e; --bad-soft:#fbe9e7;
  --c-conceito:#1d6c86; --c-historia:#8a5a14; --c-exemplo:#1f7a6d; --c-analogia:#7a4fb5; --c-cuidado:#b3401e; --c-hoje:#2f7a1f; --c-conexao:#a0336b; --c-fonte:#4b5563;
  --radius:12px; --sidebar:312px; --header:56px;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif: Charter,"Bitstream Charter","Iowan Old Style",Georgia,"Times New Roman",serif;
  color-scheme: light;
}
[data-theme="dark"]{
  --bg:#15130f; --surface:#1d1a16; --surface-2:#26221c; --text:#ece6dc; --muted:#b0a797; --faint:#857d70;
  --line:#353027; --accent:#f08a4b; --accent-soft:#3a2416; --sea:#6cc3dd; --sea-soft:#15303a;
  --ok:#5cc48d; --ok-soft:#173326; --bad:#ff8a80; --bad-soft:#3a1f1d;
  --c-conceito:#6cc3dd; --c-historia:#e0b060; --c-exemplo:#5cc4b4; --c-analogia:#b896f0; --c-cuidado:#f0a070; --c-hoje:#8fd17a; --c-conexao:#f08cc0; --c-fonte:#b0a797;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.7}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.topbar{position:fixed;inset:0 0 auto 0;height:var(--header);display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);z-index:30;padding-top:env(safe-area-inset-top)}
.topbar .brand{font-weight:700;text-decoration:none;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.topbar .brand svg{width:28px;height:28px;flex:0 0 28px;border-radius:7px}
.topbar .brand small{font-weight:500;color:var(--muted)}
.topbar .spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;min-width:38px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px}
.iconbtn:hover{background:var(--surface-2)}
#menuBtn{display:none}
.sidebar{position:fixed;top:var(--header);left:0;bottom:0;width:var(--sidebar);background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 40px;z-index:25;font-size:15px;line-height:1.45}
.sb-track{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sb-track b{font-size:16px}
.sb-track a{font-size:13px}
.prog{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.prog-label{font-size:13px;color:var(--muted);margin:4px 0 10px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:15px;margin-bottom:10px}
.toc details{border-top:1px solid var(--line);padding:6px 0}
.toc summary{cursor:pointer;font-weight:700;padding:4px 2px;list-style:none;display:flex;align-items:center;gap:6px}
.toc summary::-webkit-details-marker{display:none}
.toc summary::after{content:"▸";color:var(--faint);transition:transform .2s;margin-left:auto}
.toc details[open]>summary::after{transform:rotate(90deg)}
.toc .lvl-state{font-weight:500;font-size:12px;color:var(--faint)}
.toc .mod{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 4px 4px;font-weight:600;text-decoration:none}
.toc .mod:hover{color:var(--accent)}
.toc a.it{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:8px;text-decoration:none;color:var(--text)}
.toc a.it:hover{background:var(--surface-2)}
.toc a.it.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toc a.it.soon{color:var(--faint)}
.toc .ck{flex:0 0 18px;height:18px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px;font-size:11px;display:flex;align-items:center;justify-content:center}
.toc .done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.toc .special{font-style:italic}
.sb-links{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;display:flex;flex-direction:column;gap:6px}
.overlay{display:none;position:fixed;inset:var(--header) 0 0 0;background:rgba(0,0,0,.35);z-index:24}
main{margin-left:var(--sidebar);padding:calc(var(--header) + 28px) 28px 80px}
main.nosb{margin-left:0}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:2rem;line-height:1.2;margin:.2em 0 .4em}
h2{font-size:1.55rem;line-height:1.25;margin:0 0 .3em}
h3{font-size:1.15rem;margin:2em 0 .6em;padding-bottom:6px;border-bottom:1px solid var(--line)}
h4{font-size:1.05rem;margin:1.7em 0 .4em}
.prose p,.prose li{font-family:var(--serif);font-size:1.07rem}
.prose li{margin:.3em 0}
.muted{color:var(--muted)}
.crumb{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.crumb a{color:inherit;text-decoration:none}
.crumb a:hover{color:var(--accent)}
section.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 30px;margin:0 0 24px}
.objetivo{background:var(--accent-soft);border-radius:var(--radius);padding:14px 18px;margin-top:14px}
.objetivo b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
.objetivo p{margin:.3em 0}
.box{border:1px solid var(--line);border-left:5px solid var(--bc,var(--accent));background:var(--surface-2);border-radius:10px;padding:12px 16px;margin:1.2em 0}
.box::before{display:block;font-family:var(--font);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--bc);margin-bottom:4px}
.box>p:first-child{margin-top:0}.box>p:last-child{margin-bottom:0}
.box.conceito{--bc:var(--c-conceito)}.box.conceito::before{content:"◆ Conceito-chave"}
.box.historia{--bc:var(--c-historia)}.box.historia::before{content:"⌛ Contexto histórico"}
.box.exemplo{--bc:var(--c-exemplo)}.box.exemplo::before{content:"▶ Exemplo"}
.box.analogia{--bc:var(--c-analogia)}.box.analogia::before{content:"≈ Analogia"}
.box.cuidado{--bc:var(--c-cuidado)}.box.cuidado::before{content:"⚠ Cuidado"}
.box.hoje{--bc:var(--c-hoje)}.box.hoje::before{content:"✔ Hoje no Ceará"}
.box.conexao{--bc:var(--c-conexao)}.box.conexao::before{content:"⇄ Conexão com outra trilha"}
.box.fonte{--bc:var(--c-fonte)}.box.fonte::before{content:"§ Fonte e status da evidência"}
.tag{display:inline-block;font-family:var(--font);font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid currentColor;vertical-align:1px;white-space:nowrap}
.tag.consenso{color:var(--ok)}.tag.forte{color:var(--c-conceito)}.tag.hipotese{color:var(--c-cuidado)}.tag.interpretacao{color:var(--c-conexao)}
.tag.gratis{color:var(--ok)}.tag.pago{color:var(--c-cuidado)}
.tbl{width:100%;border-collapse:collapse;margin:1em 0;font-size:15.5px;background:var(--surface)}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.caption{text-align:center;font-size:13.5px;color:var(--muted);margin-top:-4px}
.fig{margin:1.4em 0;text-align:center}
.fig svg{max-width:100%;height:auto}
.fig svg text{fill:var(--text);font-family:var(--font)}
.tl{list-style:none;padding-left:0;margin:1em 0;border-left:3px solid var(--line)}
.tl li{position:relative;padding:4px 0 10px 18px;font-family:var(--serif)}
.tl li::before{content:"";position:absolute;left:-8px;top:12px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl b{font-family:var(--font);color:var(--accent);margin-right:6px}
.g{color:inherit;text-decoration:underline dotted;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px;cursor:help}
.pop{position:fixed;z-index:60;max-width:340px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5}
.pop b{display:block;margin-bottom:4px}
.pop a{font-size:13.5px}
.qq{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0;background:var(--surface)}
.qtext{margin:0 0 10px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;line-height:1.45;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .letter{flex:0 0 24px;height:24px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .letter{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{background:var(--bad);color:#fff}
.why{margin-top:12px;font-size:15px;line-height:1.55}
.why p{margin:.4em 0}
.why .ok{color:var(--ok);font-weight:700}.why .no{color:var(--bad);font-weight:700}
.score{font-weight:700;margin-top:10px}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.done{background:var(--ok);border-color:var(--ok)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}
.pager a{flex:1 1 220px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--text);font-size:15px;line-height:1.4}
.pager a small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.pager a.next{text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:20px 0}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;color:var(--text);border-top:6px solid var(--tc,var(--accent));transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.card .ic{font-size:28px;line-height:1;color:var(--tc)}
.card h3{border:none;margin:10px 0 2px;padding:0;font-size:1.2rem}
.card .per{font-size:13px;color:var(--muted);font-weight:600}
.card p{font-size:15px;color:var(--muted);margin:.6em 0 1em;line-height:1.5}
.hero{padding:10px 0 6px}
.hero p{font-family:var(--serif);font-size:1.1rem}
.lvlbox{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:16px 0;overflow:hidden}
.lvlbox>header{padding:14px 18px;background:var(--surface-2);display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.lvlbox>header b{font-size:1.1rem}
.lvlbox .body{padding:6px 18px 14px}
.lvlbox .modt{font-weight:700;margin:12px 0 4px}
.lvlbox .modt a{color:var(--text);text-decoration:none}
.lvlbox .modt a:hover{color:var(--accent)}
.lvlbox ol{margin:0;padding-left:22px}
.lvlbox li{font-size:15.5px}
.lvlbox li a{color:var(--text)}
.lvlbox li.soon{color:var(--faint)}
.lvlbox .proj{margin-top:12px;font-size:15px;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.soonbadge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);border:1px solid var(--line);border-radius:99px;padding:0 6px;margin-left:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.res{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;text-decoration:none;color:var(--text);background:var(--surface)}
.res small{display:block;color:var(--muted)}
.gl dt{font-weight:700;margin-top:14px}
.gl dd{margin:2px 0 0;font-family:var(--serif)}
footer.credit{text-align:center;font-size:13px;color:var(--faint);margin-top:50px}
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#1d6c86,#0f3f50);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .6s}
.splash.out{opacity:0;pointer-events:none}
.splash .sp-logo{width:132px;height:132px;animation:spPop .7s cubic-bezier(.2,1.4,.4,1) both}
.splash .sp-logo svg{width:100%;height:100%;border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.splash .sp-sail{transform-origin:256px 330px;animation:spSail 1.1s ease-out .3s both}
.splash .sp-wave{stroke-dasharray:420;stroke-dashoffset:420;animation:spDraw 1s ease-out .5s forwards}
.splash .sp-name{font-size:26px;font-weight:800;margin-top:22px;opacity:0;transform:translateY(8px);animation:spUp .6s ease-out .7s forwards;text-align:center;padding:0 20px}
.splash .sp-sub{font-size:13px;letter-spacing:2.5px;text-transform:uppercase;opacity:0;animation:spUp .6s ease-out .9s forwards;margin-top:6px}
.splash .sp-skip{position:absolute;bottom:28px;font-size:12px;opacity:0;animation:spUp .5s ease-out 1.3s forwards}
@keyframes spPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes spSail{from{transform:scaleY(0)}to{transform:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spUp{to{opacity:.95;transform:none}}
@media (prefers-reduced-motion:reduce){.splash,.splash *{animation:none!important;transition:none!important}.splash .sp-wave{stroke-dashoffset:0}.splash .sp-name,.splash .sp-sub,.splash .sp-skip{opacity:1;transform:none}}
@media (max-width:900px){
  #menuBtn{display:inline-flex}
  .sidebar{transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  .sidebar.open{transform:none}
  .overlay.open{display:block}
  main{margin-left:0;padding:calc(var(--header) + 18px) 14px 70px}
  section.item{padding:20px 18px;border-radius:14px}
  h1{font-size:1.65rem}
  .topbar .brand small{display:none}
}
@media print{.topbar,.sidebar,.overlay,.pager,.splash{display:none!important}main{margin:0;padding:0}}
section.item>:first-child{margin-top:0}
.hero p.crumb{font-family:var(--font);font-size:13px}
@media (max-width:900px){.sidebar{box-shadow:none}.sidebar.open{box-shadow:0 0 30px rgba(0,0,0,.2)}}
/* termos e privacidade */
.legal h2{font-size:19px;margin:22px 0 6px}
.legal .resumo{border-left:4px solid var(--ok);background:var(--card,transparent);padding:10px 14px;border-radius:8px;margin:10px 0 16px;outline:1px solid var(--line)}
.btn.warn{background:#b3261e;border-color:#b3261e}
.btn:disabled{opacity:.6;cursor:default}
.credit a{color:inherit;margin-left:10px}

</style>
<script>
/* ===== MOTOR DO CURSO — Ceará: Terra e Gente =====
   As entregas futuras só acrescentam dados com: trilha(), aula(), modulo(), projeto(), glossario(), linhaDoTempo() */
var COURSE={tracks:[]}, CONTENT={}, MODX={}, PROJX={}, GLOSS={}, TIMELINE=[];
function trilha(t){COURSE.tracks.push(t)}
function aula(id,o){CONTENT[id]=o}
function modulo(id,o){MODX[id]=o}
function projeto(id,o){PROJX[id]=o}
function glossario(o){for(var k in o)GLOSS[k]=o[k]}
function linhaDoTempo(arr){TIMELINE=TIMELINE.concat(arr)}
/* Links: busca no YouTube (nunca URL de vídeo inventada) e link externo */
function yt(q,label){return '<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(q)+'" target="_blank" rel="noopener">'+(label||q)+'</a>'}
function lnk(url,label){return '<a href="'+url+'" target="_blank" rel="noopener">'+label+'</a>'}

(function(){
var KEY='cearaTerraGente.v1', S={done:{},quiz:{},theme:null,last:null};
function load(){try{var p=JSON.parse(localStorage.getItem(KEY)||'null');if(p)S=Object.assign(S,p);}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
load();

var LV={};          // lookup: aulaId -> info
var MODS={};        // modId -> info
var ORDER={};       // trackId -> [aulaIds]
function index(){
  COURSE.tracks.forEach(function(t){
    var mn=0,an=0;ORDER[t.id]=[];
    t.niveis.forEach(function(l,li){
      l.modulos.forEach(function(m){
        mn++;var mid=t.id+'-m'+mn;m.id=mid;m.num=mn;MODS[mid]={t:t,l:l,m:m,li:li};
        m.ids=m.aulas.map(function(title){an++;var id=t.id+'-a'+an;
          LV[id]={id:id,n:an,title:title,t:t,l:l,m:m,li:li};ORDER[t.id].push(id);return id;});
      });
    });
  });
}
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function track(id){return COURSE.tracks.filter(function(t){return t.id===id})[0]}
function written(id){return !!CONTENT[id]}
function trackStats(t){var ids=ORDER[t.id],d=0,w=0;ids.forEach(function(i){if(S.done[i])d++;if(written(i))w++;});return {total:ids.length,done:d,written:w}}
function pct(a,b){return b?Math.round(a*100/b):0}

/* ---------- tema ---------- */
function applyTheme(){var t=S.theme;if(!t){try{t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){t='light'}}
  document.documentElement.setAttribute('data-theme',t);var b=$('#themeBtn');if(b)b.textContent=t==='dark'?'☀':'☾';
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#1d1a16':'#1d6c86');}

/* ---------- barra lateral ---------- */
var curTrack=null,searchQ='';
function goSearch(q){searchQ=(q||'').trim();if(location.hash==='#busca')route();else location.hash='#busca';}
function sidebar(activeId){
  var sb=$('#sidebar'),main=$('#main');
  if(!curTrack){sb.hidden=true;main.classList.add('nosb');$('#menuBtn').style.visibility='hidden';return;}
  sb.hidden=false;main.classList.remove('nosb');$('#menuBtn').style.visibility='visible';
  var t=curTrack,st=trackStats(t),h='';
  h+='<div class="sb-track"><b>'+esc(t.icone+' '+t.nome)+'</b><a href="#inicio">Trilhas</a></div>';
  h+='<div class="prog"><i style="width:'+pct(st.done,st.total)+'%"></i></div><div class="prog-label">'+st.done+' de '+st.total+' aulas concluídas · '+st.written+' publicadas</div>';
  h+='<input class="search" id="sbSearch" type="search" placeholder="Buscar no curso…" aria-label="Buscar no curso">';
  h+='<nav class="toc"><a class="it" href="#t-'+t.id+'"><span class="ck">⌂</span><span>Visão geral da trilha</span></a>';
  t.niveis.forEach(function(l,li){
    var ids=[];l.modulos.forEach(function(m){ids=ids.concat(m.ids)});
    var d=ids.filter(function(i){return S.done[i]}).length;
    var open=activeId&&(ids.indexOf(activeId)>=0||activeId===t.id+'-'+l.id||l.modulos.some(function(m){return m.id===activeId}));
    if(!activeId&&li===0)open=true;

function renderQuiz(box){
  var id=box.getAttribute('data-id'),qs=CONTENT[id].quiz,L='ABCDEF';S.quiz[id]=S.quiz[id]||{};var ans=S.quiz[id];
  function draw(){
    var h='';qs.forEach(function(q,qi){var a=ans[qi];
      h+='<div class="qq"><p class="qtext">'+(qi+1)+'. '+q.q+'</p><div class="opts">';
      q.o.forEach(function(o,oi){var cls='';if(a!=null){if(oi===q.c)cls=' right';else if(oi===a)cls=' wrong';}
        h+='<button class="opt'+cls+'" data-q="'+qi+'" data-o="'+oi+'"'+(a!=null?' disabled':'')+'><span class="letter">'+L[oi]+'</span><span>'+o+'</span></button>';});
      h+='</div>';
      if(a!=null){h+='<div class="why">';
        if(a===q.c)h+='<p><span class="ok">Correto.</span> '+q.e[a]+'</p>';
        else h+='<p><span class="no">Não é essa.</span> '+q.e[a]+'</p><p><span class="ok">Resposta certa: '+L[q.c]+'.</span> '+q.e[q.c]+'</p>';
        h+='</div>';}
      h+='</div>';});
    var n=Object.keys(ans).length;
    if(n===qs.length){var r=0;qs.forEach(function(q,i){if(ans[i]===q.c)r++});
      h+='<p class="score">Resultado: '+r+' de '+qs.length+'. '+(r===qs.length?'Excelente!':r>=qs.length*0.6?'Bom resultado. Releia as explicações das que errou.':'Vale reler a aula e tentar de novo.')+'</p><button class="btn ghost" id="qReset">Refazer o quiz</button>';}
    box.innerHTML=h;
    box.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){ans[+b.getAttribute('data-q')]=+b.getAttribute('data-o');save();draw();
      if(Object.keys(ans).length===qs.length&&!S.done[id]){S.done[id]=true;save();var d=$('#doneBtn');if(d){d.textContent='✓ Aula concluída';d.classList.add('done');}sidebar(id);}})});
    var rb=box.querySelector('#qReset');if(rb)rb.addEventListener('click',function(){S.quiz[id]={};ans=S.quiz[id];save();draw();});
  }
  draw();
}

glossario({
 semiarido:['Semiárido','Região de clima quente com chuvas baixas, concentradas em poucos meses e muito irregulares de um ano para outro. No Brasil, a delimitação oficial é feita pela Sudene com critérios de chuva, aridez e déficit hídrico.'],

 sertao:['Sertão','Na origem, palavra usada pelos portugueses para o interior distante do litoral e pouco controlado pela Coroa. No Ceará, designa sobretudo as terras baixas e secas do interior, cobertas de caatinga.'],

objetivo:`<p>Ao final, você vai reconhecer as quatro grandes paisagens do Ceará (litoral, <span class="g" data-t="sertao">sertão</span>, serras úmidas e <span class="g" data-t="cariri">Cariri</span>), saber o que cada uma oferecia aos seus moradores e explicar por que a geografia ajuda a entender a história sem decidir sozinha o destino de ninguém.</p>`,
explicacao:`
<h4>Por que um curso de história começa pela terra</h4>
<p>Imagine tentar entender a história do Egito sem falar do rio Nilo. Seria possível listar faraós e batalhas, mas faltaria a pergunta mais básica: por que as pessoas viviam ali, daquele jeito? Com o Ceará é parecido. A seca, os rios que somem no verão, as serras verdes no meio da caatinga e as fontes do Cariri aparecem o tempo todo na história do estado: nas guerras coloniais, no caminho do gado, nas migrações, na política dos açudes, na literatura.</p>
<p>Por isso, a primeira aula é um passeio pelo território. A pergunta que vai guiar todo o curso começa aqui: <b>o que a terra permitia, o que ela dificultava, e o que as pessoas fizeram com isso</b>.</p>

<div class="box cuidado"><p>Geografia não é destino. Durante muito tempo se escreveu que o clima “explicava” a pobreza do sertão ou o “caráter” do sertanejo. Essa ideia, o <span class="g" data-t="determinismo">determinismo geográfico</span>, foi abandonada pelos historiadores. A seca é um fato natural; a fome na seca depende de quem tem terra, água e poder. Guarde essa diferença: ela volta em quase todas as trilhas.</p></div>

<h4>O Ceará em números</h4>
<p>O Ceará tem cerca de 149 mil km², mais que Portugal inteiro, e 184 municípios. No Censo de 2022, tinha cerca de 8,8 milhões de habitantes, a maior parte concentrada na Região Metropolitana de Fortaleza. Fica no norte do Nordeste, com o litoral voltado para o norte e o nordeste, de frente para o Atlântico equatorial. Faz divisa com o Piauí (oeste), o Rio Grande do Norte e a Paraíba (leste) e Pernambuco (sul).</p>
<p>Essa posição explica duas coisas que você vai ver muitas vezes: o Ceará está <b>perto da linha do Equador</b>, o que faz o clima ser quente o ano inteiro, e está <b>entre Pernambuco e o Maranhão</b>, o que fez dele, no período colonial, uma terra de passagem que os portugueses precisavam controlar.</p>

<h4>1. O litoral: dunas, falésias, lagoas e mangues</h4>
<p>O litoral cearense tem por volta de 570 km. É uma costa de praias longas, <b>dunas</b> que o vento empurra para o interior, <b>falésias</b> coloridas (como as de Morro Branco, em Beberibe, e de Canoa Quebrada, em Aracati), <b>lagoas</b> entre as dunas e <b>mangues</b> na foz dos rios. Logo atrás da praia vem o <span class="g" data-t="tabuleiro">tabuleiro costeiro</span>, uma faixa plana e arenosa.</p>
<p>Os ventos alísios sopram forte e quase o ano todo. Para quem vivia ali, o mar e os mangues ofereciam peixe, mariscos e caranguejo o ano inteiro, mesmo nas secas. Povos indígenas como os Tremembé viviam dessa riqueza. Mais tarde, os pescadores de jangada fizeram do litoral um dos símbolos do Ceará.</p>
<p>Para os navegadores europeus, porém, essa costa era difícil: poucos portos naturais abrigados, bancos de areia e ventos e correntes que empurram os barcos para oeste. Foi uma das razões para o Ceará ter sido ocupado tarde pelos portugueses, como você verá no módulo 3.</p>

<div class="box hoje"><p>O vento que atrapalhava as caravelas hoje move as turbinas eólicas do litoral e da serra, e as dunas e falésias sustentam o turismo de Jericoacoara, Canoa Quebrada e Cumbuco. O litoral também é palco de conflitos por terra entre comunidades de pescadores, empresas de turismo e parques eólicos, tema da Trilha 4.</p></div>

<h4>2. O sertão: a caatinga e as terras baixas do interior</h4>
<p>A maior parte do Ceará é sertão: uma grande área de terras baixas e onduladas, a chamada depressão sertaneja, coberta pela <span class="g" data-t="caatinga">caatinga</span>. O solo costuma ser raso, assentado sobre rochas antigas e duras, e retém pouca água. Aqui e ali surgem morros de pedra isolados, como os famosos monólitos de Quixadá, que os geógrafos chamam de <span class="g" data-t="inselberg">inselbergues</span>.</p>
<p>Na estação seca, a caatinga perde as folhas e fica cinzenta. Com as primeiras chuvas, fica verde em poucos dias. Essa vegetação não é “pobre”: é adaptada. Muitas plantas guardam água nas raízes ou no caule, e há uma grande variedade de espécies que só existem ali.</p>
<p>O sertão foi o grande espaço da <b>criação de gado</b>, que precisava de muita terra e pouca gente, e que podia andar até a água e até os mercados. É no sertão que nascem as fazendas, os vaqueiros e boa parte das vilas coloniais.</p>

<div class="box conceito"><p><b>Sertão</b> é uma palavra antiga. Para os portugueses dos séculos XVI e XVII, sertão era qualquer interior distante, “desertão”, longe do litoral e do controle da Coroa. Só com o tempo a palavra passou a significar a paisagem seca do interior nordestino. Quando um documento colonial fala em “sertão”, ele pode estar falando de distância e de falta de controle, não de clima.</p></div>

<h4>3. As serras: ilhas verdes no meio do sertão</h4>
<p>Espalhadas pelo estado, há serras mais altas, frescas e chuvosas que o sertão em volta. O relevo obriga o ar úmido a subir, ele esfria e a umidade vira chuva. Essas áreas são chamadas de <span class="g" data-t="brejo">brejos de altitude</span> e guardam restos de Mata Atlântica. As principais são:</p>
<ul>
<li><b>Maciço de Baturité</b>: um <span class="g" data-t="macico">maciço residual</span> a pouco mais de 100 km de Fortaleza, com Guaramiranga, Pacoti e Mulungu. No século XIX, foi a principal área de café do Ceará.</li>
<li><b>Serra da Ibiapaba</b>: uma longa <span class="g" data-t="cuesta">cuesta</span> na divisa com o Piauí, com Tianguá, Ubajara e Viçosa do Ceará. Foi caminho para o Maranhão, centro de aldeamentos jesuítas e terra dos índios Tabajara.</li>
<li><b>Serras da Meruoca e de Uruburetama</b>, no norte, e outras serras menores pelo interior.</li>
</ul>
<p>Nas secas, as serras funcionavam como refúgio: tinham mais água e permitiam plantar quando o sertão não produzia nada. Não por acaso, foram ocupadas por indígenas e depois disputadas por colonos.</p>

<div class="box cuidado"><p><b>Qual é o ponto mais alto do Ceará?</b> Por décadas, livros e placas disseram que era o Pico Alto, em Guaramiranga, com cerca de 1.115 m. Medições mais recentes com dados de topografia global indicam que o Pico da Serra Branca, em Catunda, no sertão de Crateús, é um pouco mais alto, e a altitude exata varia conforme a fonte <span class="tag hipotese">em revisão</span>. É um bom exemplo de como até “fatos de livro” podem mudar quando aparecem dados melhores.</p></div>

<h4>4. O Cariri e as chapadas: água que brota do chão</h4>
<p>No extremo sul fica a <span class="g" data-t="chapada">Chapada</span> do Araripe, um planalto de topo plano na divisa com Pernambuco e o Piauí. Ela é formada por rochas sedimentares porosas, que funcionam como uma esponja: a chuva que cai no alto da chapada se infiltra e reaparece, mais abaixo, em <b>fontes</b> que correm o ano inteiro. No sopé da chapada fica o <b>Cariri</b>, com Crato, Juazeiro do Norte e Barbalha.</p>
<p>Com água permanente e terra fértil, o Cariri foi chamado de “oásis do sertão”. Ali se plantou cana e se fez rapadura em engenhos desde o período colonial, e ali a população cresceu mais do que no sertão em volta. Quando a seca castigava o resto da capitania, muita gente fugia para o Cariri.</p>
<p>A Bacia do Araripe guarda também um dos depósitos de fósseis mais importantes do mundo, a <span class="g" data-t="santana">Formação Santana</span>, com peixes, pterossauros, insetos e plantas de mais de 100 milhões de anos, muito bem preservados. Em 2006, a UNESCO reconheceu o <span class="g" data-t="geopark">Geopark Araripe</span>, o primeiro geoparque das Américas, que reúne seis municípios da região.</p>
<p>No leste, na divisa com o Rio Grande do Norte, fica a Chapada do Apodi, de rochas calcárias, hoje uma área de agricultura irrigada de frutas.</p>

<div class="box conexao"><p>O Cariri é o cenário de grandes capítulos das próximas trilhas: a revolução de 1817 no Crato (Trilha 2), Padre Cícero, Juazeiro e o Caldeirão (Trilha 3). Muito do que aconteceu ali só foi possível porque a região tinha água e gente quando o resto do sertão esvaziava.</p></div>

<h4>As quatro paisagens lado a lado</h4>
<div class="scroll"><table class="tbl">
<tr><th>Paisagem</th><th>Como é</th><th>O que oferecia</th><th>Na história</th></tr>
<tr><td>Litoral</td><td>Dunas, falésias, lagoas, mangues, vento forte</td><td>Pesca e coleta o ano todo</td><td>Povos Tremembé, fortes coloniais, jangadeiros, Fortaleza</td></tr>
<tr><td>Sertão</td><td>Terras baixas, caatinga, solo raso, rios temporários</td><td>Pastos extensos nas chuvas</td><td>Fazendas de gado, vaqueiros, vilas nas ribeiras, retirantes</td></tr>
<tr><td>Serras úmidas</td><td>Mais altas, frescas e chuvosas, restos de Mata Atlântica</td><td>Água e plantio mesmo nas secas</td><td>Refúgio indígena, aldeamentos, café em Baturité</td></tr>
<tr><td>Cariri e chapadas</td><td>Planalto sedimentar com fontes permanentes no sopé</td><td>Água o ano inteiro, terra fértil</td><td>Engenhos de rapadura, Crato, Juazeiro, centro religioso</td></tr>
</table></div>
<p class="caption">As quatro grandes paisagens do Ceará e seu peso histórico.</p>

<div class="box analogia"><p>Pense no Ceará como uma casa grande e quente, com muitos cômodos secos (o sertão), uma varanda ventilada de frente para o mar (o litoral), alguns quartos frescos no andar de cima (as serras) e uma cozinha com torneira que nunca seca (o Cariri). Quando falta água na casa, todo mundo corre para a cozinha e para os quartos frescos. Boa parte da história do Ceará é a história desse movimento.</p></div>

<h4>Uma terra com dono antes dos portugueses</h4>
<p>Uma última ideia, que é o ponto de partida do módulo 2: quando os europeus chegaram, nenhuma dessas paisagens estava vazia. Cada uma era habitada por povos indígenas que conheciam as estações, as fontes, os caminhos entre serra e sertão e os recursos do mar. Os colonizadores aprenderam muitos desses caminhos com eles, e depois os tomaram.</p>
<div class="box fonte"><p>Os dados de área, população e número de municípios vêm do IBGE <span class="tag consenso">consenso</span>. A extensão do litoral e as altitudes variam um pouco conforme o método de medição <span class="tag forte">forte</span>. A informação sobre o Geopark Araripe vem da própria UNESCO e da Universidade Regional do Cariri (URCA), que o administra <span class="tag consenso">consenso</span>.</p></div>
`,

aula('t1-a2',{
objetivo:`<p>Ao final, você vai saber o que é o <span class="g" data-t="semiarido">semiárido</span>, por que chove pouco e de forma tão irregular no Ceará, como funciona a <span class="g" data-t="quadra">quadra chuvosa</span> e quais foram as grandes secas da história do estado. Vai também distinguir a seca como fenômeno do clima da seca como tragédia social, uma diferença que organiza boa parte da história cearense.</p>`,
explicacao:`
<h4>O porquê: a seca é o personagem que nunca sai de cena</h4>
<p>Se a história do Ceará fosse um romance, a seca seria o personagem que aparece em quase todos os capítulos. Ela empurrou retirantes para Fortaleza e para a Amazônia, motivou obras públicas e campos de concentração, inspirou livros como <i>O Quinze</i>, de Rachel de Queiroz, e alimentou a política dos açudes por mais de um século. Para entender esses capítulos, é preciso primeiro entender o clima.</p>

<h4>O que é o semiárido</h4>
<p>Semiárido não é deserto. No deserto quase não chove. No semiárido chove, mas pouco, concentrado em poucos meses e de maneira muito irregular: um ano pode ser bom e o seguinte, péssimo. O problema central não é só a quantidade de chuva. É a <b>irregularidade</b> e a <b>evaporação</b>: o sol forte e o vento secam a água muito depressa.</p>
<p>No Brasil, quem define oficialmente quais municípios estão no Semiárido é a <span class="g" data-t="sudene">Sudene</span>. Na delimitação de 2017, os critérios eram três: chuva média anual de até 800 mm, um índice de aridez baixo e risco alto de déficit hídrico (falta de água no solo em pelo menos 60% dos dias). Bastava cumprir um deles. Por essa delimitação, <b>175 dos 184 municípios cearenses</b> estavam no Semiárido, quase todo o território do estado. Na revisão de 2021, alguns municípios do litoral, como Jijoca de Jericoacoara, Barroquinha, Chaval e Horizonte, deixaram de cumprir os critérios e ganharam uma regra de transição.</p>

<div class="box conceito"><p>Três números ajudam a entender o clima cearense <span class="tag forte">dados da Funceme</span>: a chuva média do estado fica em torno de <b>800 mm por ano</b>; cerca de <b>três quartos</b> dela caem nos quatro meses da quadra chuvosa, de fevereiro a maio; e a evaporação potencial em muitas áreas pode chegar perto de <b>2.000 mm por ano</b>, mais do que o dobro da chuva. É por isso que a água acumulada some tão rápido dos açudes.</p></div>

<h4>De onde vem a chuva: a ZCIT</h4>
<p>O principal “fabricante” de chuva do Ceará é a <span class="g" data-t="zcit">Zona de Convergência Intertropical</span>, a ZCIT. É uma faixa de nuvens que se forma perto da linha do Equador, onde se encontram os ventos alísios que vêm do hemisfério Norte e os que vêm do hemisfério Sul. Essa faixa se desloca ao longo do ano. Entre fevereiro e maio, ela desce até o norte do Nordeste e traz as chuvas principais. Depois, volta para o norte, e o Ceará entra no longo período seco.</p>
<p>O calendário da chuva no Ceará costuma ser dividido em três partes: a <b>pré-estação</b> (dezembro e janeiro), a <b>quadra chuvosa</b> (fevereiro a maio) e a <b>pós-estação</b> e o período seco (junho a novembro). O cearense chama a quadra chuvosa de “inverno”, mesmo que no calendário astronômico seja verão: inverno, para o sertanejo, é o tempo da chuva.</p>

<h4>Por que alguns anos são secos</h4>
<p>Se a ZCIT não desce o suficiente, ou desce por pouco tempo, chove pouco. Os climatologistas identificaram dois grandes fatores que influenciam isso <span class="tag consenso">consenso científico</span>:</p>
<ul>
<li><b><span class="g" data-t="elnino">El Niño</span></b>: o aquecimento anormal das águas do Pacífico tropical altera a circulação da atmosfera e costuma reduzir as chuvas no norte do Nordeste.</li>
<li><b>O <span class="g" data-t="dipolo">dipolo do Atlântico</span></b>: quando as águas do Atlântico tropical Norte estão mais quentes que as do Sul, a ZCIT tende a ficar mais ao norte e chove menos no Ceará. Quando o Atlântico Sul está mais quente, a tendência é de chuva melhor.</li>
</ul>
<p>É com esses dados que a <span class="g" data-t="funceme">Funceme</span> faz, todo mês de janeiro, o prognóstico de chuvas para a quadra chuvosa. O prognóstico fala em <b>probabilidades</b> (por exemplo, “45% de chance de chuva abaixo da média”), não em certezas.</p>

<div class="box analogia"><p>Pense na ZCIT como um caminhão-pipa que passa pela sua rua só uma vez por ano, numa data que muda. Em alguns anos ele para bastante tempo na sua porta; em outros, passa rápido ou fica na rua de cima. O El Niño e o dipolo do Atlântico são como o trânsito: não decidem sozinhos, mas mudam muito as chances de o caminhão chegar e demorar.</p></div>

<h4>As grandes secas da história</h4>
<p>As secas acompanham o Ceará desde que há registros escritos. As datas abaixo são as mais citadas pelos historiadores, mas as listas variam conforme a fonte e o critério usado <span class="tag forte">forte</span>:</p>
<ul class="tl">
<li><b>1777–1778</b>A chamada “seca dos três setes”, uma das primeiras com grande mortandade de gado registrada na capitania.</li>
<li><b>1790–1793</b>Seca longa, lembrada nas fontes como “seca grande”, que arruinou fazendas e charqueadas.</li>
<li><b>1877–1879</b>A Grande Seca. Fome, migração em massa para Fortaleza e para a Amazônia, epidemia de varíola. Tema da Trilha 2.</li>
<li><b>1915</b>Seca retratada em <i>O Quinze</i>. Primeiro campo de concentração de retirantes, em Fortaleza. Tema da Trilha 3.</li>
<li><b>1932</b>Nova seca e vários campos de concentração pelo estado.</li>
<li><b>1951–1953 e 1958</b>Secas dos anos 1950, com frentes de trabalho e nova onda de migração para o Sudeste.</li>
<li><b>1979–1983</b>Cinco anos seguidos de chuva abaixo da média e a última grande fome em massa ligada à seca, com saques em cidades do interior.</li>
<li><b>2012–2017</b>A seca mais longa registrada nos dados de chuva do estado. Em 2012 choveu só 363,8 mm, menos da metade da média. Os açudes chegaram a guardar perto de 7% da capacidade.</li>
</ul>

<div class="box fonte"><p>Os números de 2012 a 2017 vêm das séries da Funceme, divulgadas pela imprensa cearense: o ano de 2012 fechou com 363,8 mm, e só 1983 teve menos chuva, 359,7 mm. A média de 2012 a 2016 ficou em 516 mm por ano, contra 566 mm em 1979–1983 <span class="tag forte">forte</span>. Para as secas dos séculos XVIII e XIX não há medição de chuva: o que existe são relatos de autoridades, padres, viajantes e cronistas, que falam de gado morto, colheitas perdidas e migração. Por isso as datas antigas variam entre os autores.</p></div>

<h4>Seca natural, tragédia social</h4>
<p>Aqui está a ideia mais importante da aula. A seca de 2012–2017 foi mais longa e mais severa, em chuva, que a de 1979–1983. Mesmo assim, não houve a fome em massa dos anos 1980, nem as mortes aos milhares de 1877 ou 1915. Por quê?</p>
<p>Porque o que transforma a falta de chuva em catástrofe não é só o clima. É a <b>vulnerabilidade</b> das pessoas: quem tem terra e quem não tem, quem tem acesso a água guardada, se existe renda nos meses sem colheita, se há estradas, serviços de saúde e políticas públicas. Em 2012, o Ceará tinha adutoras, cisternas, programas de transferência de renda, previsão climática e uma rede de açudes que, mesmo quase vazios, seguraram o pior.</p>
<p>Os historiadores costumam separar duas coisas: a <b>seca climática</b>, um fenômeno natural, e a <b>seca como calamidade social</b>, produzida pela forma como a sociedade está organizada <span class="tag consenso">consenso</span>. Essa distinção ajuda a ler todas as grandes secas do curso.</p>

<div class="box historia"><p>Desde o século XIX, a seca foi também uma questão política. Elites do sertão aprenderam a usar as secas para conseguir verbas, empregos e obras em suas próprias terras. A crítica a esse uso ganhou o nome de <span class="g" data-t="industriaseca">“indústria da seca”</span>, popularizada pelo jornalista Antônio Callado no livro <i>Os Industriais da Seca e os “Galileus” de Pernambuco</i> (1960) <span class="tag forte">forte</span>. O tema volta com força na Trilha 3, quando estudarmos o DNOCS e os açudes.</p></div>

<div class="box cuidado"><p>Você talvez já tenha ouvido que D. Pedro II, diante da seca de 1877, teria dito que venderia “a última joia da Coroa” para salvar os cearenses. A frase é muito repetida, mas não se conhece registro confiável dela na época <span class="tag hipotese">tradição sem prova</span>. Trate como parte da memória popular, não como fato documentado. Na Trilha 2, veremos o que o governo imperial de fato fez.</p></div>

<h4>Do “combate à seca” à “convivência com o semiárido”</h4>
<p>Durante quase todo o século XX, a política oficial foi de <b>combate à seca</b>: construir açudes, perfurar poços, abrir frentes de trabalho emergenciais. A partir dos anos 1990, ganhou força outra abordagem, a de <span class="g" data-t="convivencia">convivência com o semiárido</span>, defendida por movimentos sociais e organizações como a Articulação Semiárido Brasileiro (ASA), criada em 1999. A ideia é que a seca não é um inimigo a ser vencido, mas uma característica do lugar. Em vez de esperar socorro a cada estiagem, guarda-se a água da chuva em cisternas, criam-se animais e plantas adaptados e preserva-se a caatinga.</p>
<p>As duas abordagens convivem até hoje: grandes obras, como o Castanhão e a transposição do São Francisco, ao lado de cisternas de placa em milhares de casas do sertão. Avaliar o peso de cada uma é tema da Trilha 4 <span class="tag interpretacao">debate atual</span>.</p>

<div class="box hoje"><p>Todo começo de ano, o Ceará acompanha o prognóstico da Funceme como quem acompanha um resultado decisivo. A expressão “ano bom de inverno” continua sendo, para muita gente no interior, sinônimo de ano bom de vida. O nível dos açudes, divulgado com frequência, é notícia de primeira página.</p></div>
`,

aula('t1-a3',{
objetivo:`<p>Ao final, você vai conhecer as principais <span class="g" data-t="bacia">bacias hidrográficas</span> do Ceará, entender o que é um <span class="g" data-t="intermitente">rio intermitente</span> e explicar como os rios e os caminhos do gado orientaram a ocupação colonial, a ponto de muitas cidades atuais estarem exatamente onde os vaqueiros paravam há três séculos.</p>`,
explicacao:`
<h4>O porquê: a água decide onde a gente mora</h4>
<p>Abra um mapa do Ceará e marque as cidades mais antigas do interior: Icó, Aracati, Quixeramobim, Sobral, Crato, Russas, Tauá. Agora marque os rios. Quase todas estão na beira de um rio ou perto de onde dois rios se encontram. Não é coincidência. Num lugar onde a água é escassa, ela decide onde as pessoas param, criam gado, fazem feiras e, com o tempo, fundam vilas.</p>

<h4>Rios que secam</h4>
<p>A maioria dos rios cearenses é <b>intermitente</b>, ou temporária: corre com força na quadra chuvosa, às vezes com enchentes violentas, e no resto do ano vira um leito de areia com poças. A água, porém, não desaparece de todo. Parte dela continua correndo por baixo da areia, e o sertanejo aprendeu a cavar “cacimbas” no leito seco para buscá-la.</p>
<p>O maior rio do estado, o <b>Jaguaribe</b>, ficou famoso como “o maior rio seco do mundo”. O nome vem do tupi e costuma ser traduzido como “rio das onças”. Sua bacia cobre quase metade do território cearense e se divide em cinco partes para fins de gestão: Alto, Médio e Baixo Jaguaribe, e as sub-bacias do <b>Salgado</b>, que drena o Cariri, e do <b>Banabuiú</b>, que corre do sertão central e deságua no Jaguaribe perto de Limoeiro do Norte. A foz fica perto de Aracati.</p>

<div class="box cuidado"><p><b>Quanto mede o Jaguaribe?</b> Depende de quem você consulta. Já foram publicados 610, 633, 652 e 680 km. Os livros didáticos diziam que ele nascia na serra da Joaninha, em Tauá. Em 2020, um estudo de pesquisadores da UECE e técnicos da Cogerh, publicado na revista <i>Caderno de Geografia</i>, localizou a nascente na Serra das Pipocas, na junção de Tauá, Pedra Branca e Independência, o que daria cerca de 680 km <span class="tag hipotese">medida em revisão</span>. A lição vale para o curso inteiro: um número muito repetido não é, por isso, um número certo. Pergunte sempre de onde ele vem.</p></div>

<h4>As outras bacias</h4>
<div class="scroll"><table class="tbl">
<tr><th>Rio / bacia</th><th>Região</th><th>Papel na história</th></tr>
<tr><td>Jaguaribe (com Salgado e Banabuiú)</td><td>Leste, centro e sul</td><td>Principal eixo da conquista do sertão e do gado; Aracati na foz, Icó no meio do caminho, Cariri nas cabeceiras do Salgado</td></tr>
<tr><td>Acaraú (cerca de 315 km)</td><td>Norte</td><td>Ribeira de fazendas de gado; Sobral nasce às suas margens e vira o grande centro do norte</td></tr>
<tr><td>Curu (cerca de 195 km)</td><td>Centro-norte</td><td>Vale de fazendas e, mais tarde, de agricultura irrigada; seu principal afluente é o Canindé</td></tr>
<tr><td>Coreaú</td><td>Noroeste</td><td>Liga o sertão do norte ao litoral de Camocim e Granja</td></tr>
<tr><td>Bacias Metropolitanas (Ceará, Cocó, Pacoti, Choró e outros)</td><td>Entorno de Fortaleza</td><td>A barra do rio Ceará foi o lugar dos primeiros fortes; hoje abastecem a capital, com ajuda de canais vindos do Jaguaribe</td></tr>
<tr><td>Poti e afluentes</td><td>Oeste (Crateús)</td><td>Correm para o Piauí, na bacia do Parnaíba: o sertão de Crateús olhava tanto para o Piauí quanto para o Ceará</td></tr>
</table></div>
<p class="caption">Principais rios e bacias do Ceará. Extensões aproximadas, segundo dados de gestão de recursos hídricos do estado.</p>

<h4>A ribeira: a unidade básica do sertão colonial</h4>
<p>Quando os criadores de gado começaram a ocupar o sertão cearense, no fim do século XVII, eles não se espalharam ao acaso. Subiram os rios. As terras ao longo de um rio, com seus pastos, poços e lagoas, eram chamadas de <span class="g" data-t="ribeira">ribeira</span>. Falava-se na ribeira do Jaguaribe, do Acaraú, do Banabuiú, do Quixeramobim. As <span class="g" data-t="sesmaria">sesmarias</span>, os grandes lotes de terra que a Coroa concedia, eram descritas a partir dos rios: tantas léguas rio acima, tantas de cada lado.</p>
<p>As doações de sesmarias se intensificaram nas duas últimas décadas do século XVII e na primeira metade do XVIII, justamente o tempo da Guerra dos Bárbaros, quando os povos indígenas do sertão resistiram à tomada de suas terras <span class="tag forte">forte</span>. Ocupar a ribeira significava expulsar ou submeter quem já vivia nela. Esse lado violento da história será tema dos módulos 2 e 5.</p>

<div class="box historia"><p>Capistrano de Abreu, em <i>Capítulos de História Colonial</i> (1907), descreveu duas grandes correntes de ocupação do sertão nordestino: os <b>“sertões de dentro”</b>, alcançados por criadores vindos da Bahia, subindo o rio São Francisco, e os <b>“sertões de fora”</b>, alcançados por quem vinha de Pernambuco e das capitanias do litoral norte <span class="tag interpretacao">clássico, ainda usado</span>. O Ceará recebeu as duas: gente de Pernambuco e da Paraíba subindo o Jaguaribe, e gente vinda do sul, pelos caminhos do São Francisco e do Piauí, chegando aos Inhamuns e ao Cariri.</p></div>

<h4>Os caminhos do gado</h4>
<p>O gado era uma mercadoria que andava sozinha. Os bois eram levados a pé, em boiadas conduzidas por vaqueiros, até as feiras e os centros consumidores da zona do açúcar, em Pernambuco e na Bahia. Para isso, formaram-se caminhos que seguiam os rios, onde havia água e pasto pelo trajeto. Os principais caminhos do Ceará colonial eram a <b>Estrada Geral do Jaguaribe</b>, que ligava o Aracati ao Icó, a <b>Estrada das Boiadas</b> e a <b>Estrada Nova das Boiadas</b>, todas convergindo para a ribeira do Jaguaribe <span class="tag forte">forte</span>.</p>
<p>Onde os caminhos se cruzavam e havia água garantida, surgiam pousos, depois povoados, depois vilas. <b>Icó</b> prosperou por ter água e por estar no cruzamento das rotas que ligavam o sertão ao litoral e a outras capitanias. <b>Aracati</b>, na foz do Jaguaribe, virou o porto do sertão: ali o gado era abatido e transformado em carne seca, nas oficinas de charque, e embarcado junto com o couro. No século XVIII, Aracati chegou a ser o centro mais rico e movimentado da capitania. Você estudará essa história em detalhe na Trilha 1, nível Avançado.</p>

<div class="box exemplo"><p><b>Siga o boi.</b> No século XVIII, um boi criado numa fazenda dos Inhamuns podia descer pelos caminhos do Jaguaribe até o Icó, seguir pela Estrada Geral até o Aracati, ser abatido numa oficina de carne seca e acabar num barco para o Recife, alimentando trabalhadores dos engenhos de açúcar. Cada parada desse trajeto virou cidade.</p></div>

<h4>Por que Fortaleza demorou a ser o centro</h4>
<p>Hoje parece óbvio que Fortaleza é o centro do Ceará. Mas, no período colonial, a vida econômica estava no sertão e nos caminhos do gado, com Aracati, Icó e, mais tarde, Sobral e Crato. Fortaleza nasceu ao redor de um forte, no litoral, e só foi elevada a vila em 1726. Só no século XIX, com o algodão, a ferrovia e o porto, ela se tornaria o grande centro do estado <span class="tag consenso">consenso</span>.</p>
<p>A costa também ajuda a explicar. Os ventos e as correntes da costa norte do Brasil empurram os barcos para oeste, o que tornava a navegação entre Pernambuco e o Maranhão difícil, sobretudo na volta. Por isso a Coroa portuguesa quis abrir um caminho por terra até o Maranhão, e o Ceará estava no meio. As primeiras expedições portuguesas, que você verá no módulo 3, tinham esse objetivo.</p>

<div class="box analogia"><p>Os rios do sertão funcionavam como as rodovias de hoje: as cidades nasciam nas suas margens assim como hoje surgem postos, restaurantes e bairros ao longo das BRs. E, como nas rodovias, os cruzamentos valiam mais. Icó era um grande “trevo” do sertão colonial.</p></div>

<h4>A nova geografia da água: os açudes</h4>
<p>A partir do fim do século XIX, o mapa da água no Ceará começou a ser redesenhado por mãos humanas. Depois da Grande Seca de 1877, o governo imperial mandou construir o açude do <b>Cedro</b>, em Quixadá, concluído só em 1906. No século XX, a açudagem virou a principal política contra a seca, com grandes barragens como o <b>Orós</b>, no Jaguaribe, inaugurado nos anos 1960, e o <b>Castanhão</b>, também no Jaguaribe, concluído no início dos anos 2000, um dos maiores reservatórios do país. Para construí-lo, a antiga cidade de Jaguaribara foi inundada e reconstruída em outro lugar <span class="tag consenso">consenso</span>.</p>
<p>Mais recentemente, canais e adutoras passaram a levar água de uma bacia para outra, e as águas da transposição do rio São Francisco chegaram ao Ceará em 2020, pelo Cariri <span class="tag forte">forte</span>. O “maior rio seco do mundo”, em boa parte do seu curso, virou um rio controlado por barragens.</p>

<div class="box conexao"><p>A política dos açudes é tema central da Trilha 3 (IOCS, DNOCS, “indústria da seca”) e da Trilha 4 (Castanhão, transposição e o futuro da água). Quando chegar lá, lembre-se desta aula: cada açude mudou não só a água, mas também a terra, o poder e quem foi obrigado a sair do lugar.</p></div>

<div class="box hoje"><p>A Cogerh, companhia estadual de gestão de recursos hídricos, organiza os comitês de bacia, onde agricultores, cidades, indústrias e órgãos públicos discutem quanto de água cada um vai usar quando os açudes estão baixos. É uma versão moderna de uma disputa antiga: quem tem direito à água no sertão.</p></div>

<div class="box fonte"><p>As informações sobre as rotas do gado e a formação das vilas vêm de estudos de geografia histórica e história colonial, como os publicados na revista <i>Mercator</i> e na <i>Geosul</i>, que retomam autores como Capistrano de Abreu e Raimundo Girão <span class="tag forte">forte</span>. As extensões dos rios variam conforme a fonte e o método de medição.</p></div>

objetivo:`<p>Ao final, você vai saber como a arqueologia estuda os povos que viveram no Ceará antes dos registros escritos, conhecer exemplos de sítios e de arte rupestre do estado e entender por que essa parte da história ainda é tão pouco conhecida e tão ameaçada.</p>`,
explicacao:`
<h4>O porquê: a história não começa com os portugueses</h4>
<p>Durante muito tempo, os livros de história do Ceará começavam em 1603, com a chegada de Pero Coelho. Tudo o que vinha antes era chamado de “pré-história”, como se fosse uma espécie de sala de espera. Essa visão mudou. Hoje se entende que os povos indígenas têm uma história própria, de milhares de anos, que a arqueologia ajuda a reconstruir. Sem ela, a chegada dos europeus parece a fundação de algo novo, quando na verdade foi a invasão de um território já habitado.</p>

<div class="box conceito"><p>A <b>arqueologia</b> estuda o passado humano pelos <b>vestígios materiais</b>: pedras lascadas e polidas, cerâmica, restos de fogueiras, conchas, ossos, pinturas e gravuras em rochas. Um <b>sítio arqueológico</b> é qualquer lugar onde esses vestígios aparecem. No Brasil, todos os sítios arqueológicos são bens da União, protegidos por lei federal: destruí-los é crime, mesmo em terreno particular.</p></div>

<h4>Quantos sítios há no Ceará</h4>
<p>Segundo o Iphan, o Ceará tem perto de 600 sítios arqueológicos cadastrados <span class="tag forte">dado de 2020</span>, e o número cresce a cada pesquisa. Eles estão em todas as paisagens que você estudou no módulo 1:</p>
<ul>
<li><b>No litoral</b>, nas dunas, há sítios com cerâmica, conchas e restos de fogueiras. As dunas da Sabiaguaba, em Fortaleza, guardam vários deles. Em Beberibe e Fortim, doze sítios foram resgatados durante a construção de um parque eólico.</li>
<li><b>Nas serras</b>, como a Ibiapaba e a Meruoca, há abrigos de pedra com pinturas. O sítio Casa de Pedra, em Ibiapina, e o Córrego da Onça, na Meruoca, são exemplos estudados recentemente.</li>
<li><b>No sertão</b>, há gravuras em lajedos e rochas na beira de rios e riachos, como a Pedra Ferrada, em Itapipoca, e a Pedra dos Pilões. O sertão de Crateús e Poranga tem dezenas de sítios.</li>
<li><b>No Cariri</b>, na Chapada do Araripe, a Fundação Casa Grande, de Nova Olinda, faz levantamentos há anos, e um sítio em Mauriti forneceu uma das primeiras datações arqueológicas do estado.</li>
</ul>

<h4>A arte rupestre</h4>
<p><b>Arte rupestre</b> quer dizer “arte sobre rocha”. Ela aparece de dois jeitos: <b>pinturas</b>, feitas com pigmentos minerais (ocre vermelho, amarelo, branco, preto), e <b>gravuras</b> ou petróglifos, feitas raspando ou picoteando a pedra. No Ceará há as duas. As gravuras são muito comuns em pedras perto da água, nos leitos de rios e riachos; muitas são formas geométricas, círculos, linhas e pontos, cujo significado não se conhece.</p>
<p>Os arqueólogos evitam “traduzir” esses desenhos. Eles podem ter sido marcas de território, registros de rituais, mapas, calendários ou algo que não imaginamos. O que se faz é registrar, comparar e agrupar os desenhos em <b>tradições</b> (conjuntos de estilos parecidos), para entender como diferentes grupos se espalharam pela região <span class="tag consenso">consenso metodológico</span>.</p>

<div class="box cuidado"><p>Por muito tempo, curiosos atribuíram as gravuras do Nordeste a fenícios, vikings ou outros povos de fora. Essas ideias não têm base nenhuma. Os autores da arte rupestre do Ceará foram os povos indígenas da região <span class="tag consenso">consenso</span>. A ideia de que “índios não poderiam ter feito isso” é um preconceito, não uma hipótese científica.</p></div>

<h4>Os pioneiros e o estado atual da pesquisa</h4>
<p>As gravuras chamaram atenção desde cedo. Em 1924, Carlos Studart Filho publicou na <i>Revista do Instituto do Ceará</i> um estudo sobre a Pedra Ferrada, em Itapipoca. Nos anos 1950, Thomaz Pompeu Sobrinho registrou sítios de arte rupestre na Ibiapaba, sobretudo em Viçosa do Ceará. Nos anos 1980, o Padre Lira publicou um levantamento dos sítios do centro-norte do estado.</p>
<p>Mesmo assim, os próprios arqueólogos reconhecem que a arqueologia do Ceará ainda está em estágio inicial em comparação com estados vizinhos, como o Piauí, onde fica a Serra da Capivara <span class="tag forte">forte</span>. Há poucas datações, e muitas pesquisas nasceram de licenciamento ambiental: quando uma obra vai ser feita, a lei exige verificar se há sítios no local. Isso gerou muitos achados, mas também significa que boa parte foi escavada às pressas e levada para fora do estado.</p>

<div class="box exemplo"><p>Os vestígios retirados das dunas da Sabiaguaba, em Fortaleza, foram enviados para a Universidade Federal de Pernambuco e, segundo reportagem do Diário do Nordeste, não tinham previsão de voltar ao Ceará. É um problema comum: o patrimônio arqueológico de um lugar acaba guardado longe das comunidades que vivem nele.</p></div>

<h4>O que a arqueologia permite dizer</h4>
<p>Com tudo isso, o que é possível afirmar com segurança?</p>
<ul>
<li>O território do Ceará foi ocupado por grupos humanos durante milhares de anos antes de 1500 <span class="tag consenso">consenso</span>. As datas mais antigas ainda são poucas e debatidas.</li>
<li>Havia grupos diferentes, com tecnologias diferentes: alguns produziam cerâmica, outros não; uns viviam mais no litoral, outros nos sertões e serras <span class="tag forte">forte</span>.</li>
<li>Esses grupos se moviam conforme as estações, aproveitando o mar, as lagoas, as serras úmidas e os rios na época da chuva. O ambiente do módulo 1 explica muito desse movimento <span class="tag forte">forte</span>.</li>
<li>A ligação entre os grupos antigos estudados pela arqueologia e os povos que os portugueses encontraram em 1600 ainda é, em grande parte, uma pergunta aberta <span class="tag hipotese">em pesquisa</span>.</li>
</ul>

<div class="box analogia"><p>Estudar esse passado é como montar um quebra-cabeça de mil peças tendo só cinquenta, espalhadas por vários cômodos, algumas guardadas na casa do vizinho. Dá para ver partes da imagem. Não dá para fingir que se vê a imagem inteira.</p></div>

<div class="box hoje"><p>Muitos sítios estão em terras particulares, perto de roças e pastos, e são danificados por pichações, extração de pedra, obras e até pela curiosidade de visitantes que molham as pinturas para “realçar” as cores. Para os povos indígenas do Ceará atual, vários desses lugares são parte da memória de seus antepassados, e a proteção deles é também uma pauta política.</p></div>

<div class="box conexao"><p>Na Trilha 4, ao estudar os povos indígenas hoje, você vai ver como a arqueologia e a memória dos lugares entram nas disputas por reconhecimento de terras.</p></div>
`,

aula('t1-a5',{
objetivo:`<p>Ao final, você vai entender a divisão colonial entre “tupis” e “tapuias”, saber o que ela revela e o que ela esconde, e reconhecer como os portugueses usaram essa divisão para fazer alianças e justificar guerras.</p>`,
explicacao:`
<h4>O porquê: os nomes que os colonizadores deram</h4>
<p>Quase tudo o que se escreveu sobre os indígenas do Ceará nos séculos XVII e XVIII foi escrito por europeus: soldados, missionários, governadores. Eles classificavam os povos de acordo com o que lhes interessava. A classificação mais importante, e mais repetida até hoje, é a divisão entre <b>tupis</b> e <b>tapuias</b>. Entender essa divisão é aprender a ler as fontes coloniais com olho crítico.</p>

<h4>Quem eram os tupis</h4>
<p>Os povos de língua tupi ocupavam grande parte do litoral brasileiro quando os europeus chegaram. Falavam línguas muito parecidas entre si, praticavam agricultura de mandioca, viviam em aldeias e tinham guerras rituais entre grupos. Como os portugueses conheceram primeiro esses povos, aprenderam sua língua, que os jesuítas transformaram na chamada <b>língua geral</b>, usada na colonização de boa parte do Brasil.</p>
<p>No Ceará, os principais povos tupis eram os <b>Potiguara</b>, no litoral, e os <b>Tabajara</b>, que ocupavam sobretudo a Serra da Ibiapaba <span class="tag forte">forte</span>. Muitos nomes de lugares do Ceará vêm do tupi: Jaguaribe, Acaraú, Itapipoca, Pacatuba, Maranguape, Baturité, Ibiapaba, Aquiraz.</p>

<h4>Quem eram os “tapuias”</h4>
<p>“Tapuia” não era o nome de um povo. Era uma palavra que os tupis usavam para os grupos que não falavam tupi, e que os portugueses adotaram com sentido de “selvagem”, “bárbaro”, “inimigo” <span class="tag consenso">consenso</span>. Sob esse rótulo único foram colocados dezenas de povos muito diferentes entre si, com línguas sem parentesco, modos de vida diversos e rivalidades próprias.</p>
<p>No Ceará, entre os chamados “tapuias”, estavam os <b>Tremembé</b>, do litoral oeste, os <b>Kariri</b>, dos sertões e do sul, e os grupos <b>Tarairiú</b>, como os Paiacu e os Janduí, nas ribeiras do leste e do Rio Grande do Norte. A próxima aula apresenta cada um deles.</p>

<div class="box conceito"><p>A dupla <b>tupi/tapuia</b> mistura duas coisas: uma diferença real de línguas e culturas, e um julgamento colonial. O “tupi” era visto como o indígena que podia ser aliado, catequizado e aldeado. O “tapuia” era o indígena do sertão, visto como inimigo a ser vencido. Ao ler “tapuia” num documento antigo, pergunte sempre: quem escreveu, contra quem, e para quê?</p></div>

<h4>Alianças e guerras: a divisão como arma</h4>
<p>Os portugueses não chegaram a um território unido. Os povos indígenas tinham suas próprias guerras e alianças, e os europeus aprenderam a usá-las. No litoral cearense, os Potiguara, liderados por chefes como Jacaúna e seu irmão Poti, que depois seria batizado Antônio Felipe Camarão, aliaram-se aos portugueses e lutaram contra os Tabajara e outros grupos <span class="tag forte">forte</span>. Os Tabajara da Ibiapaba, por sua vez, foram aliados dos franceses no início do século XVII.</p>
<p>Esse jogo de alianças não era passividade. Cada povo tinha seus objetivos: ganhar armas de ferro, vencer rivais antigos, proteger suas terras. Mas, no longo prazo, quase todos perderam. Os aliados viraram moradores de aldeamentos controlados por missionários e autoridades; os inimigos foram mortos, escravizados ou expulsos.</p>

<div class="box historia"><p>Entre o fim do século XVII e o começo do XVIII, a expansão das fazendas de gado pelo sertão provocou a chamada <b>Guerra dos Bárbaros</b>, uma série de conflitos entre colonos e povos “tapuias” do sertão nordestino. A própria palavra “bárbaros” já mostra o ponto de vista de quem nomeou a guerra. O historiador Pedro Puntoni, em livro de 2002, mostrou que se tratou de uma longa guerra de conquista, com massacres e escravização em massa <span class="tag forte">forte</span>. Você estudará esse conflito no nível Intermediário.</p></div>

<div class="box cuidado"><p>É comum ler que os tupis eram “mais civilizados” e os tapuias “mais atrasados”. Essa hierarquia é colonial. Os dois grupos tinham sociedades complexas, adaptadas a ambientes diferentes. O que os portugueses chamavam de “atraso” muitas vezes era só um modo de vida que não servia aos seus planos, como a mobilidade de povos que caçavam e coletavam pelo sertão conforme as estações.</p></div>

<h4>Como sabemos o que sabemos</h4>
<p>As fontes sobre esses povos são quase todas escritas por europeus: relatos de expedições, cartas de jesuítas, documentos de guerra, pedidos de sesmarias. Algumas trazem informações preciosas, como gramáticas e catecismos em línguas indígenas preparados por missionários. A língua Kariri, por exemplo, foi registrada por jesuítas no fim do século XVII. Mas todas olham os indígenas de fora, e quase sempre com interesse em convertê-los, usá-los como trabalhadores ou justificar guerras contra eles.</p>
<p>Por isso, historiadores de hoje cruzam essas fontes com a arqueologia, com a memória oral dos povos indígenas atuais e com estudos de línguas e de nomes de lugares <span class="tag consenso">consenso metodológico</span>.</p>

<div class="box analogia"><p>Imagine que daqui a trezentos anos alguém tentasse entender todos os torcedores de futebol do Ceará lendo apenas as notas oficiais de um único clube. Saberia muito sobre os aliados desse clube e quase nada de justo sobre os rivais. As fontes coloniais sobre os “tapuias” são mais ou menos assim.</p></div>

<div class="box hoje"><p>A palavra “tapuia” foi retomada com orgulho por alguns povos indígenas do Ceará atual, como os Tapuia-Kariri, de São Benedito, e os Tubiba-Tapuia. Um termo criado para desqualificar virou parte da afirmação de uma identidade.</p></div>
`,

aula('t1-a6',{
objetivo:`<p>Ao final, você vai conhecer os principais povos indígenas que viviam no Ceará na época da conquista (Potiguara, Tabajara, Tremembé, Kariri e Tarairiú), saber onde viviam e como reagiram à colonização, e entender por que o Ceará tem hoje mais de 56 mil pessoas indígenas, depois de quase dois séculos em que se dizia que os índios do estado tinham “desaparecido”.</p>`,
explicacao:`
<h4>O porquê: dar nome a quem foi apagado</h4>
<p>Nas aulas anteriores você viu como os colonizadores juntaram povos diferentes sob rótulos gerais. Agora é hora de olhar para alguns desses povos com mais atenção. O mapa abaixo é uma simplificação: os territórios mudavam, os povos se moviam e as fontes são incompletas. Mas ajuda a ver que o Ceará era um mosaico.</p>

<div class="scroll"><table class="tbl">
<tr><th>Povo</th><th>Onde vivia</th><th>Língua</th><th>Na conquista</th></tr>
<tr><td>Potiguara</td><td>Litoral, da Paraíba ao Ceará</td><td>Tupi</td><td>Aliados dos portugueses no Ceará (Jacaúna, Poti/Camarão)</td></tr>
<tr><td>Tabajara</td><td>Serra da Ibiapaba</td><td>Tupi</td><td>Aliados dos franceses; atacados por Pero Coelho; depois aldeados pelos jesuítas</td></tr>
<tr><td>Tremembé</td><td>Litoral oeste, entre o Ceará e o Maranhão</td><td>Língua própria, pouco registrada</td><td>Resistiram muito tempo; aldeados em Almofala (Itarema)</td></tr>
<tr><td>Kariri</td><td>Sertões e sul, inclusive o Cariri</td><td>Família Kariri (registrada por missionários)</td><td>Guerras no sertão e aldeamentos missionários</td></tr>
<tr><td>Tarairiú (Paiacu, Janduí e outros)</td><td>Ribeiras do leste e do Rio Grande do Norte</td><td>Língua própria, pouco registrada</td><td>Centro da resistência na Guerra dos Bárbaros</td></tr>
</table></div>
<p class="caption">Povos indígenas principais do Ceará no século XVII, segundo as fontes coloniais. Simplificação: havia muitos outros grupos.</p>

<h4>Potiguara e Tabajara: os povos tupis</h4>
<p>Os <b>Potiguara</b> eram um dos maiores povos do litoral nordestino. No Ceará, tiveram papel central nas primeiras décadas da colonização, como aliados dos portugueses. Os <b>Tabajara</b> ocupavam a Serra da Ibiapaba, uma posição estratégica entre o Ceará e o Maranhão, e foram aliados dos franceses que comerciavam na região. A expedição de Pero Coelho, em 1603–1604, lutou contra eles e seu chefe, Mel Redondo. Mais tarde, os jesuítas montaram na Ibiapaba uma das maiores missões do Nordeste, que deu origem a Viçosa do Ceará <span class="tag forte">forte</span>.</p>

<h4>Tremembé: o povo do mar e das dunas</h4>
<p>Os <b>Tremembé</b> viviam no litoral oeste, entre dunas, lagoas e mangues, da costa do Ceará até o Maranhão. Eram conhecidos como excelentes nadadores e pescadores. Falavam uma língua própria, da qual quase nada foi registrado. Foram reunidos num aldeamento em Almofala, hoje no município de Itarema. A igreja de Almofala, do século XVIII, ficou soterrada pelas dunas por décadas no século XX e foi depois desenterrada <span class="tag forte">forte</span>.</p>
<p>Os Tremembé são conhecidos também pelo <b>torém</b>, uma dança e ritual cantado em roda, que se tornou um dos símbolos da cultura indígena do Ceará e da luta do povo por reconhecimento.</p>

<h4>Kariri: o povo que deu nome a uma região</h4>
<p>Os <b>Kariri</b> (ou Cariri) ocupavam vastas áreas dos sertões nordestinos, do São Francisco ao Ceará. A região do Cariri cearense leva o nome deles. Sua língua foi registrada por missionários jesuítas no fim do século XVII, em gramática e catecismo, o que faz dela uma das poucas línguas “tapuias” com documentação razoável <span class="tag forte">forte</span>. Com a chegada das fazendas de gado e das missões, os Kariri foram em parte mortos, em parte reunidos em aldeamentos e em parte misturados à população sertaneja.</p>

<h4>Tarairiú: o centro da resistência no sertão</h4>
<p>Os povos chamados pelos estudiosos de <b>Tarairiú</b>, como os Janduí e os Paiacu, viviam nas ribeiras do Jaguaribe, do Apodi e do Açu, entre o Ceará e o Rio Grande do Norte. Eram povos móveis, que acompanhavam as estações. Quando as fazendas de gado avançaram sobre suas terras e fontes de água, eles resistiram. Foram o núcleo dos conflitos chamados de Guerra dos Bárbaros, no fim do século XVII. Contra eles foram enviados terços de paulistas, os chamados bandeirantes, e houve massacres de grande escala <span class="tag forte">forte</span>.</p>

<div class="box cuidado"><p><b>“Os índios do Ceará foram extintos”?</b> No século XIX, autoridades e escritores passaram a afirmar que já não havia índios no Ceará. Em 1863, o governo provincial chegou a declarar extintos os aldeamentos indígenas da província, o que abriu caminho para a tomada de suas terras <span class="tag forte">forte</span>. Mas as pessoas não desapareceram. Muitas passaram a esconder sua identidade para fugir do preconceito e da violência, e foram registradas como “caboclos” ou simplesmente como pobres do campo. A “extinção” foi uma decisão política e um apagamento, não um fato demográfico.</p></div>

<h4>A volta: os povos indígenas no Ceará de hoje</h4>
<p>A partir dos anos 1970 e 1980, com apoio de setores da Igreja, de pesquisadores e de movimentos sociais, comunidades que guardavam sua memória indígena começaram a se afirmar publicamente. Os primeiros foram os <b>Tapeba</b>, em Caucaia, os <b>Tremembé</b>, em Itarema, os <b>Pitaguary</b>, em Maracanaú e Pacatuba, e os <b>Jenipapo-Kanindé</b>, em Aquiraz. Em 1999, o território dos Jenipapo-Kanindé foi delimitado, com 1.734 hectares.</p>
<p>Hoje, o governo estadual e o movimento indígena falam em pelo menos 15 povos no Ceará, entre eles Anacé, Gavião, Jenipapo-Kanindé, Kalabaça, Kanindé, Kariri, Pitaguary, Potiguara, Tabajara, Tapeba, Tapuia-Kariri, Tremembé, Tubiba-Tapuia e Tupinambá. O Censo de 2022 contou <b>56.353 pessoas indígenas</b> no estado, quase o triplo de 2010. Os povos mais numerosos eram Tapeba (11.189), Tremembé (6.350) e Pitaguary (6.247) <span class="tag consenso">dado do IBGE</span>.</p>

<div class="box fonte"><p>O IBGE alerta que a comparação entre os Censos de 2010 e 2022 deve ser feita com cuidado: em 2022 mudou a forma de perguntar e de localizar as comunidades indígenas. Parte do crescimento reflete mais pessoas se declarando indígenas, e não só nascimentos. Isso também é história: a autodeclaração cresceu depois de campanhas como “Não sou pardo, sou indígena”, de 2021.</p></div>

<div class="box hoje"><p>A principal luta dos povos indígenas do Ceará continua sendo a terra. Em 2023, o estado tinha apenas duas terras indígenas homologadas, e dezenas de reivindicações esperavam regularização. Em 2023, o governo estadual criou a Secretaria dos Povos Indígenas do Ceará, comandada por lideranças indígenas.</p></div>

<div class="box conexao"><p>Na Trilha 4, o módulo “Povos e comunidades tradicionais hoje” retoma essa história: as demarcações, os conflitos com empreendimentos em Caucaia e no litoral e o debate sobre identidade e autodeclaração.</p></div>
`,

objetivo:`<p>Ao final, você vai entender o sistema de capitanias hereditárias, saber por que a capitania do Ceará, doada em 1535, ficou quase setenta anos sem ocupação portuguesa e explicar por que, no começo do século XVII, a Coroa passou a ter pressa em controlar essa terra.</p>`,
explicacao:`
<h4>O porquê: uma terra no papel</h4>
<p>Em 1535 o Ceará “passou a existir” para Portugal, mas só no papel. Durante décadas, quem mandava de fato no território eram os povos indígenas, e quem frequentava o litoral eram comerciantes franceses. Entender esse vazio de poder português ajuda a explicar por que a conquista, quando veio, foi tão tardia e tão violenta.</p>

<h4>As capitanias hereditárias</h4>
<p>Nos anos 1530, a Coroa portuguesa não tinha dinheiro nem gente para ocupar todo o litoral do Brasil. A solução foi dividir a costa em grandes faixas, as <b>capitanias hereditárias</b>, e entregá-las a particulares, os <b>donatários</b>. O donatário recebia poderes amplos, mas tinha de pagar, ele mesmo, a ocupação: trazer colonos, fundar vilas, defender a terra. Em troca, ficava com rendas e podia distribuir sesmarias.</p>
<p>A capitania que corresponderia ao Ceará foi doada em 1535 a <b>Antônio Cardoso de Barros</b> <span class="tag forte">forte</span>. Ele nunca veio tomar posse. Anos depois, foi nomeado provedor-mor da Fazenda no governo-geral da Bahia, e morreu em 1556, no mesmo naufrágio que levou à morte do primeiro bispo do Brasil, D. Pero Fernandes Sardinha, no litoral de Alagoas <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>A maior parte das capitanias hereditárias fracassou. Faltava capital, as distâncias eram enormes e, sobretudo, as terras eram ocupadas por povos indígenas que resistiam. Só Pernambuco e São Vicente prosperaram de fato. Por isso, em 1549, a Coroa criou o <b>governo-geral</b>, com sede em Salvador, para centralizar a colonização <span class="tag consenso">consenso</span>.</p></div>

<h4>Por que ninguém veio</h4>
<p>O Ceará reunia todas as dificuldades: litoral com poucos portos abrigados, ventos e correntes que tornavam a volta para Pernambuco difícil, falta de pau-brasil em quantidade comercial, clima seco que não favorecia a cana-de-açúcar, e povos indígenas numerosos e organizados. Para quem pensava em lucro rápido, não havia atrativo <span class="tag forte">forte</span>.</p>

<h4>Os franceses na costa</h4>
<p>Enquanto Portugal não ocupava, outros aproveitavam. Comerciantes franceses frequentavam o litoral norte do Brasil, do Rio Grande do Norte ao Maranhão, trocando ferramentas de metal, tecidos e miçangas por produtos da terra com os indígenas. Fontes do início do século XVII mencionam comércio de algodão, pimenta, papagaios, macacos e madeiras. Na Serra da Ibiapaba, os franceses mantinham relações próximas com os Tabajara <span class="tag forte">forte</span>.</p>
<p>No começo do século XVII, os franceses foram além do comércio: preparavam uma colônia no Maranhão, a chamada França Equinocial, que fundou São Luís em 1612. Para Portugal, isso acendeu um alarme. Se os franceses ficassem no Maranhão, todo o litoral norte estaria ameaçado.</p>

<div class="box historia"><p>Entre 1580 e 1640, Portugal esteve sob os reis da Espanha, no período chamado de <b>União Ibérica</b>. Os reis Filipes estavam em guerra com a França e com as Províncias Unidas (os holandeses). Por isso, a defesa do litoral norte do Brasil virou prioridade de Estado: era preciso fechar a costa aos inimigos da monarquia <span class="tag consenso">consenso</span>.</p></div>

<h4>O Ceará como “tampão” e passagem</h4>
<p>Nesse contexto, o Ceará ganhou valor estratégico. Ele era a terra entre o Rio Grande do Norte, já conquistado pelos portugueses em 1598 com o Forte dos Reis Magos, e o Maranhão, cobiçado pelos franceses. Controlar o Ceará significava ter um caminho por terra e pontos de apoio para atacar o Maranhão, e impedir que os franceses se espalhassem para o leste <span class="tag forte">forte</span>.</p>
<p>A ocupação do Ceará, portanto, não nasceu de um projeto econômico, mas de uma <b>necessidade militar</b>. Os primeiros portugueses que chegaram não eram colonos com família e enxada: eram soldados, capitães e missionários, acompanhados de muitos indígenas aliados.</p>

<div class="box analogia"><p>Pense num terreno baldio entre a sua casa e a de um vizinho com quem você está brigado. Enquanto ninguém ligava, o terreno ficou abandonado. Quando o vizinho começou a construir do outro lado, você correu para cercá-lo, não porque quisesse plantar ali, mas para não deixar o outro chegar mais perto. Foi mais ou menos o papel do Ceará no início do século XVII.</p></div>

<div class="box cuidado"><p>Dizer que o Ceará era “terra vazia” antes de 1603 é repetir o olhar do colonizador. Estava vazio de portugueses, não de gente. A expressão correta é: território indígena, não ocupado pela Coroa.</p></div>

<div class="box hoje"><p>O nome “Siará” ou “Ceará” aparece em documentos já no século XVI e XVII. Sua origem é discutida: há explicações a partir do tupi ligadas ao canto de uma ave (a jandaia) ou a outros sentidos, mas nenhuma é consenso entre os especialistas <span class="tag hipotese">debate</span>. Desconfie de quem apresenta uma única tradução como certa.</p></div>
`,
