aula('t2-a14',{
objetivo:`<p>Ao final, você vai entender o peso das famílias e da parentela na política cearense do século XIX, o papel dos padres-políticos e o funcionamento do clientelismo.</p>`,
explicacao:`
<h4>O porquê: a política como negócio de família</h4>
<p>No Ceará provincial, os grandes nomes da política pertenciam a poucos clãs. Casamentos, compadrios e heranças decidiam alianças tanto quanto ideias.</p>

<h4>Os clãs</h4>
<p>Famílias como os <b>Alencar</b>, os <b>Paula Pessoa</b>, os <b>Fernandes Vieira</b> e os <b>Pompeu</b> ocuparam posições importantes na política cearense do Império: deputados, senadores, presidentes de província <span class="tag forte">forte</span>. O chefe da família era ao mesmo tempo dono da terra, diretor da economia da propriedade e titular do poder político.</p>

<h4>Os padres na política</h4>
<p>Muitos políticos cearenses do Império eram padres. José Martiniano de Alencar era padre; o senador <b>Tomás Pompeu de Sousa Brasil</b>, o Senador Pompeu, também era sacerdote e bacharel em Direito, além de autor de estudos sobre o Ceará e as secas <span class="tag forte">forte</span>. A Igreja dava formação, prestígio e redes de contato.</p>

<h4>Clientelismo</h4>
<p>O <b>clientelismo</b> é a troca de favores entre um “patrão” poderoso e “clientes” que dependem dele: emprego público, proteção contra o recrutamento, um pedaço de terra, ajuda na seca, em troca de votos, lealdade e serviços. Era a engrenagem da política imperial <span class="tag consenso">consenso</span>.</p>

<div class="box exemplo"><p>Quando o Senador Pompeu morreu, em 1877, seu genro, Antônio Pinto Nogueira Accioly, assumiu o controle do Partido Liberal no Ceará. Accioly se tornaria o grande oligarca da Primeira República, tema da Trilha 3 <span class="tag forte">forte</span>. É um exemplo perfeito de como o poder passava pela família.</p></div>

<div class="box conexao"><p>A oligarquia Accioly, que dominou o Ceará de 1896 a 1912, é a continuação direta das redes familiares do Império. Veja a Trilha 3, módulo 1.</p></div>
`,

  e:['Correto.','Não.','Não.','Não.']},

<li>${lnk('https://www.institutodoceara.org.br/revista/Rev-apresentacao/RevPorAno/2008/02-Art_SenadodoImperio.pdf','Senado do Império: o senador Pompeu e o Ceará')} (2008).</li>

aula('t2-a15',{
objetivo:`<p>Ao final, você vai entender como eram as eleições no Império, quem podia votar, como funcionavam as fraudes e o que mudou com a Lei Saraiva de 1881.</p>`,
explicacao:`
<h4>O porquê: votar no Império</h4>
<p>O Brasil imperial tinha eleições regulares, o que era raro no mundo da época. Mas eram eleições muito diferentes das de hoje.</p>

<h4>Quem votava</h4>
<p>Pela Constituição de 1824, as eleições eram em dois graus: os <b>votantes</b>, homens livres acima de certa idade e com renda mínima, escolhiam os <b>eleitores</b>, que tinham renda maior e escolhiam deputados e senadores. Mulheres e escravizados não votavam. Libertos podiam ser votantes, mas não eleitores. Até 1881, analfabetos podiam votar, desde que tivessem a renda exigida <span class="tag consenso">consenso</span>.</p>

<h4>Como eram as eleições</h4>
<p>As eleições aconteciam nas igrejas, sob controle das mesas eleitorais, formadas pelos chefes locais. Eram comuns a violência, as listas falsas, a intimidação e a chamada “eleição a bico de pena”, em que as atas eram simplesmente escritas com o resultado desejado <span class="tag forte">forte</span>. Estudos sobre o Ceará de 1846 a 1860 mostram como o processo eleitoral servia para confirmar o poder de quem já mandava.</p>

<h4>A Lei Saraiva (1881)</h4>
<p>Em 1881, a Lei Saraiva instituiu a <b>eleição direta</b> e passou a exigir que o eleitor soubesse ler e escrever. O resultado foi uma redução drástica do eleitorado: num país majoritariamente analfabeto, a maioria dos pobres perdeu o direito ao voto <span class="tag consenso">consenso</span>. No Ceará, onde o Censo de 1872 registrou apenas cerca de 79 mil pessoas alfabetizadas, o efeito foi enorme.</p>

<div class="box conceito"><p>A Lei Saraiva mostra que reformas apresentadas como “moralizadoras” podem excluir. Ela diminuiu algumas fraudes, mas tirou o voto de quem mais precisava de voz.</p></div>

<div class="box hoje"><p>O voto dos analfabetos só voltou no Brasil com a Emenda Constitucional de 1985, depois de mais de cem anos.</p></div>
`,
quiz:[
 {q:'Como eram as eleições pela Constituição de 1824?',
  o:['Diretas e universais','Em dois graus: votantes escolhiam eleitores, que escolhiam deputados e senadores','Só para mulheres','Por sorteio'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'O que era a “eleição a bico de pena”?',
  o:['Eleição feita por correio','Atas escritas com o resultado desejado, sem eleição real','Voto secreto','Eleição em cartório'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'O que a Lei Saraiva (1881) mudou?',
  o:['Deu voto às mulheres','Instituiu a eleição direta e exigiu alfabetização, reduzindo muito o eleitorado','Aboliu a escravidão','Criou a República'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Quantas pessoas sabiam ler e escrever no Ceará em 1872, segundo o Censo?',
  o:['Cerca de 79 mil','Cerca de 700 mil','Todos','Ninguém'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Quando os analfabetos voltaram a votar no Brasil?',
  o:['1889','1932','1985','2002'],c:2,
  e:['Não.','O voto feminino é de 1932.','Correto.','Não.']}
],
exercicio:`<p><b>Exclusão e reforma.</b> Escreva um parágrafo discutindo se a Lei Saraiva foi um avanço ou um retrocesso. Use pelo menos dois argumentos de cada lado antes de concluir.</p>`,
fontes:`<ul>
<li>Bruno Cordeiro Nojosa de Freitas, ${lnk('https://repositorio.ufc.br/ri/bitstream/riufc/6133/1/2011-DIS-BCNFREITAS.pdf','A exaltação dos eleitos (Ceará, 1846–1860)')} (UFC, 2011).</li>
<li>O Povo, ${lnk('https://www.opovo.com.br/noticias/ceara/2022/08/11/amp/ha-150-anos-ceara-tinha-apenas-79-mil-pessoas-que-sabiam-ler-e-escrever.html','Há 150 anos, Ceará tinha apenas 79 mil pessoas que sabiam ler e escrever')} (2022).</li>
<li>José Murilo de Carvalho, <i>Cidadania no Brasil: o longo caminho</i> (2001).</li>
</ul>`
});

aula('t2-a16',{
objetivo:`<p>Ao final, você vai entender por que o algodão cearense viveu um grande boom nos anos 1860 e como esse boom se ligou à Revolução Industrial inglesa e à Guerra Civil americana.</p>`,
explicacao:`
<h4>O porquê: uma guerra distante mudou o Ceará</h4>
<p>Entre 1861 e 1865, os Estados Unidos viveram a Guerra de Secessão. O Sul americano, maior produtor mundial de algodão, teve seus portos bloqueados. As fábricas inglesas precisavam de algodão de outro lugar. O Ceará estava pronto para vender.</p>

<h4>Antes do boom</h4>
<p>O algodão já era exportado pelo Ceará desde o fim do século XVIII, como você viu na Trilha 1. No início do século XIX, a exportação cresceu, e Fortaleza passou a ser o canal de escoamento para a Europa <span class="tag forte">forte</span>.</p>

<h4>O boom dos anos 1860</h4>
<p>Com a guerra nos Estados Unidos, o preço do algodão disparou no mercado mundial. No Ceará, plantou-se algodão em toda parte: no sertão, nas serras, em grandes e pequenas propriedades. As exportações pelo porto de Fortaleza cresceram muito, e a cidade se transformou no grande empório comercial da província <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>O algodão tinha uma vantagem no semiárido: é uma planta resistente à seca, e podia ser cultivado em consórcio com o milho e o feijão, e com o gado pastando nos restos da colheita. Isso deu origem ao chamado <b>binômio gado-algodão</b>, base da economia sertaneja até meados do século XX <span class="tag consenso">consenso</span>.</p></div>

<div class="box analogia"><p>É como um pequeno produtor de soja que, de repente, vê o preço triplicar porque o maior exportador do mundo entrou em guerra. Todo mundo planta, todo mundo lucra, e poucos se preparam para quando a guerra acabar.</p></div>

<div class="box hoje"><p>O algodão quase desapareceu do Ceará nos anos 1980, atacado pela praga do bicudo e pela concorrência. Hoje há tentativas de retomar a produção, inclusive de algodão orgânico e colorido.</p></div>
`,

  o:['A abolição','A Guerra de Secessão nos EUA, que tirou o algodão americano do mercado','A seca de 1877','A chegada dos holandeses'],c:1,

  e:['Não.','Correto.','Não.','Não.']},

  o:['Crato','Fortaleza','Icó','Aracati'],c:1,

],

<li>George Henrique de Moura Cunha, ${lnk('https://revistas.unifacs.br/index.php/rde/article/download/6850/4298','O algodão na economia da província do Ceará')}.</li>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/negocios/fortaleza-300-anos-como-a-cidade-se-tornou-a-maior-economia-do-nordeste-1.3756068','Fortaleza 300 anos: como a cidade se tornou a maior economia do Nordeste')} (2026).</li>
<li>${lnk('https://revistas.ufg.br/bgg/article/download/44549/22017/187092','Artigo sobre a indústria têxtil no Ceará')} (Boletim Goiano de Geografia).</li>

aula('t2-a17',{
objetivo:`<p>Ao final, você vai saber que mudanças o boom do algodão trouxe para o campo e para Fortaleza: novos agentes econômicos, melhorias urbanas, instituições culturais e a primeira fábrica de tecidos.</p>`,
explicacao:`
<h4>O porquê: o dinheiro muda a cidade</h4>
<p>O algodão trouxe dinheiro, e o dinheiro trouxe obras, lojas, instituições e novos costumes. Fortaleza, antes “um montão de areia”, começou a se ver como cidade moderna.</p>

<h4>No campo</h4>
<p>A expansão do algodão atraiu pequenos produtores e mudou as relações de trabalho. Muitos lavradores livres plantavam algodão em terras alheias, em regimes de parceria ou meação, entregando parte da colheita ao dono da terra. Comerciantes e “bolandeiras” (máquinas de descaroçar algodão) se espalharam pelo interior <span class="tag forte">forte</span>.</p>

<h4>Em Fortaleza</h4>
<p>A segunda metade do século XIX trouxe a Fortaleza uma série de novidades <span class="tag forte">forte</span>:</p>
<ul class="tl">
<li><b>1845</b>Fundação do Liceu do Ceará, principal escola secundária pública.</li>
<li><b>1866</b>Iluminação pública a gás.</li>
<li><b>1867</b>Criação da Biblioteca Provincial.</li>
<li><b>1873</b>Inauguração do primeiro trecho da Estrada de Ferro de Baturité.</li>
<li><b>1883</b>Começa a funcionar a Fábrica Progresso, primeira fábrica de tecidos do Ceará, ligada à família Pompeu.</li>
</ul>

<div class="box conceito"><p>As elites de Fortaleza queriam uma cidade “civilizada”, inspirada em Paris e Londres: ruas alinhadas, praças, lojas de produtos importados, clubes. Historiadores chamam esse projeto de <b>“processo civilizador”</b> ou modernização urbana. Ele trouxe melhorias, mas também excluiu: os pobres e retirantes eram vistos como problema a ser afastado do centro.</p></div>

<div class="box hoje"><p>O prédio do antigo Liceu, a Praça do Ferreira e os sobrados do centro de Fortaleza guardam marcas desse período de prosperidade.</p></div>
`,

  e:['Não.','Correto.','Não.','Não.']},

<li>${lnk('https://revistas.ufg.br/bgg/article/download/44549/22017/187092','Artigo sobre a indústria têxtil no Ceará e a Fábrica Progresso')} (Boletim Goiano de Geografia).</li>
<li>Gleudson Passos Cardoso, ${lnk('https://anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548856593_6694c959d005a205364d9501a877429f.pdf','“Terra de Ninguém”: escritores cearenses e o processo civilizador')} (ANPUH, 2011).</li>
<li>Artur Bruno e Airton de Farias, ${lnk('https://www.al.ce.gov.br/publicacoes-inesp/downloads/pelo-id/1243','Fortaleza: uma breve história')} (2011).</li>

aula('t2-a18',{
objetivo:`<p>Ao final, você vai entender por que o boom do algodão terminou, como a recuperação americana e a seca de 1877 afetaram a economia cearense e o que ficou desse período.</p>`,
explicacao:`
<h4>O porquê: todo boom acaba</h4>
<p>Quando a Guerra de Secessão terminou, em 1865, o algodão dos Estados Unidos voltou aos poucos ao mercado. Os preços caíram. E, em 1877, veio a maior seca da história do Ceará.</p>

<h4>A queda dos preços</h4>
<p>Com a volta do algodão americano, os compradores ingleses passaram a pagar menos. Produtores que tinham se endividado para plantar mais ficaram em dificuldade. A economia cearense continuou exportando algodão, mas sem a euforia dos anos 1860 <span class="tag forte">forte</span>.</p>

<h4>A seca de 1877</h4>
<p>A Grande Seca de 1877–1879, tema do nível Avançado, destruiu lavouras e rebanhos, matou centenas de milhares de pessoas no Norte do Império e provocou a maior migração da história da província. A economia levou anos para se recuperar <span class="tag consenso">consenso</span>.</p>

<h4>O que ficou</h4>
<ul>
<li>Fortaleza consolidada como centro econômico e político do Ceará.</li>
<li>O binômio gado-algodão como base do sertão por quase um século.</li>
<li>Uma rede de comerciantes e exportadores ligados ao mercado internacional.</li>
<li>A primeira indústria têxtil.</li>
<li>A dependência de um produto de exportação sujeito a preços externos e ao clima.</li>
</ul>

<div class="box conceito"><p>Economias baseadas em um único produto de exportação (monocultura de exportação) são vulneráveis: dependem de preços definidos lá fora e, no caso do Ceará, também da chuva. Essa vulnerabilidade marcou a história econômica do estado.</p></div>

<div class="box conexao"><p>O módulo 7 mostra como a seca de 1877 transformou Fortaleza, e a Trilha 4 discute como o Ceará tentou diversificar sua economia com indústria e turismo.</p></div>
`,

  e:['Correto.','Não.','Não.','Não.']},
 {q:'Que desastre atingiu a economia cearense em 1877?',
  o:['Um terremoto','A Grande Seca','Uma guerra civil','Uma invasão estrangeira'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Qual destas heranças NÃO veio do ciclo do algodão?',
  o:['Fortaleza como centro econômico','O binômio gado-algodão','A primeira indústria têxtil','As oficinas de carne seca do Aracati'],c:3,
  e:['Veio.','Veio.','Veio.','Correto: são do século XVIII.']},
 {q:'Por que economias de um só produto de exportação são vulneráveis?',
  o:['Porque dependem de preços externos e, no Ceará, também do clima','Porque não pagam impostos','Porque não têm comércio','Porque são proibidas'],c:0,

],

fontes:`<ul>
<li>George Henrique de Moura Cunha, ${lnk('https://revistas.unifacs.br/index.php/rde/article/download/6850/4298','O algodão na economia da província do Ceará')}.</li>
<li>Celso Furtado, <i>Formação Econômica do Brasil</i> (1959).</li>

projeto('t2-i',{html:`
<p>Você vai fazer uma <b>genealogia política de uma família do Império</b> no Ceará (Alencar, Pompeu, Paula Pessoa, Fernandes Vieira ou outra da sua região).</p>
<h4>O que entregar</h4>
<ol>
<li><b>Árvore genealógica</b> simplificada com pelo menos três gerações e os cargos ocupados.</li>
<li><b>Linha do tempo</b> dos principais acontecimentos políticos em que a família esteve envolvida.</li>
<li><b>Análise</b>: como a família usou casamentos, cargos, terra e Igreja para manter poder? Ela atravessou a passagem para a República?</li>
<li><b>Fontes</b>: pelo menos quatro, como biografias da Câmara ou do Senado, artigos acadêmicos, reportagens e a Revista do Instituto do Ceará.</li>
</ol>
<h4>Como avaliar</h4>

aula('t2-a19',{
objetivo:`<p>Ao final, você vai conhecer o que aconteceu na Grande Seca de 1877–1879: a falta de chuva, a fome, a migração para Fortaleza, os números da tragédia e as revoltas de retirantes.</p>`,
explicacao:`
<h4>O porquê: a maior tragédia do Ceará</h4>
<p>Calcula-se que a Grande Seca tenha matado cerca de 500 mil pessoas nas províncias do Norte do Império, de Alagoas ao Piauí <span class="tag forte">estimativa</span>. Em números absolutos, foi a maior tragédia causada por uma estiagem no Brasil.</p>

<h4>O dia de São José</h4>
<p>No Ceará, o dia de São José, 19 de março, é tradicionalmente o marco da esperança de chuva. Em 1877, o dia passou sem chuva, e os sertanejos anteviram a desgraça. As colheitas se perderam, o gado morreu, e a fome se espalhou pelo sertão <span class="tag forte">forte</span>.</p>

<h4>Fortaleza invadida pela fome</h4>
<p>Sem comida no interior, os sertanejos caminharam para o litoral, sobretudo para Fortaleza, onde esperavam socorro. A cidade, que tinha entre 25 e 42 mil habitantes conforme a fonte, passou a abrigar mais de 100 mil retirantes. Rodolfo Teófilo escreveu que, em dezembro de 1878, Fortaleza tinha 160 mil pessoas, das quais 120 mil eram retirantes <span class="tag forte">forte</span>.</p>
<p>Os retirantes foram reunidos em <span class="g" data-t="abarracamento">abarracamentos</span>, alojamentos precários na periferia, onde recebiam comida em troca de trabalho em obras públicas. A fome, a falta de higiene e a aglomeração criaram o ambiente perfeito para epidemias.</p>

<h4>Revoltas</h4>
<p>A falta de socorros e os maus-tratos provocaram revoltas. A maior delas, em 20 de agosto de 1878, reuniu quase dez mil retirantes que atacaram os armazéns de carne e farinha <span class="tag forte">forte</span>. Os saques e as multidões famintas apavoravam as elites, que pediam mais controle.</p>

<div class="box conceito"><p>A seca de 1877 foi também um <b>escândalo político</b>. Houve denúncias de desvio de verbas dos socorros, comerciantes que lucraram com a fome e até pedido de investigação parlamentar, como registra o arquivo do Senado <span class="tag forte">forte</span>. A ideia de “indústria da seca” tem raízes aqui.</p></div>

<div class="box cuidado"><p>As cifras da seca de 1877 variam muito conforme a fonte: população de Fortaleza, número de retirantes, número de mortos. Não havia censos regulares nem registro de todos os óbitos. Use os números como ordens de grandeza, sempre citando a fonte.</p></div>
`,

  o:['5 mil','50 mil','Cerca de 500 mil (estimativa)','5 milhões'],c:2,
  e:['Muito abaixo.','Abaixo.','Correto, como ordem de grandeza.','Muito acima.']},
 {q:'Por que o dia 19 de março é importante no Ceará?',

  o:['Quartéis do Exército','Alojamentos precários onde os retirantes eram reunidos e controlados','Hotéis','Igrejas'],c:1,

  o:['A abolição','Uma grande revolta de retirantes que atacou armazéns de comida','A inauguração da ferrovia','A chegada da chuva'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Por que os números da seca de 1877 variam?',
  o:['Porque foram inventados','Porque não havia censos regulares nem registro de todos os óbitos','Porque a seca não aconteceu','Porque os jornais não existiam'],c:1,
  e:['Não.','Correto.','Aconteceu.','Existiam.']}
],
exercicio:`<p><b>Ler A Fome.</b> Leia um capítulo de <i>A Fome</i>, de Rodolfo Teófilo (domínio público). Anote três cenas descritas. O que o romance acrescenta aos números?</p>`,
fontes:`<ul>
<li>Senado Federal, ${lnk('https://www12.senado.leg.br/noticias/especiais/arquivo-s/500-mil-mortes-doenca-fome-desvio-de-verbas-e-pedido-de-cpi-o-retrato-da-grande-seca-do-imperio','O retrato da Grande Seca do Império')}.</li>

<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/ceara/secas-migracoes-e-campos-de-concentracao-como-fortaleza-cresceu-entre-epocas-de-estiagem-e-chuvas-1.3643668','Secas, migrações e campos de concentração: como Fortaleza cresceu')}.</li>

aula('t2-a20',{
objetivo:`<p>Ao final, você vai conhecer a epidemia de varíola de 1878 em Fortaleza, o “Dia dos Mil Mortos” e o trabalho de Rodolfo Teófilo na vacinação.</p>`,
explicacao:`
<h4>O porquê: a fome e a peste</h4>
<p>A fome enfraquece o corpo; a aglomeração espalha as doenças. Em 1878, a varíola encontrou em Fortaleza milhares de pessoas famintas e amontoadas.</p>

<h4>A epidemia</h4>
<p>A varíola chegou ao Ceará vinda de outras províncias e se espalhou rapidamente entre os retirantes. Em novembro de 1878, morreram 9.844 pessoas em Fortaleza; em dezembro, 14.491 só de varíola <span class="tag forte">forte</span>. O historiador Sebastião Ponte estima que a doença matou pelo menos 60 mil dos cerca de 100 mil retirantes que chegaram à capital.</p>

<h4>O Dia dos Mil Mortos</h4>
<p>Em <b>10 de dezembro de 1878</b>, o cemitério da Lagoa Funda, no atual bairro Jacarecanga, recebeu <b>1.004 cadáveres</b>. Foram contratados cinquenta coveiros, e mesmo assim cerca de 230 corpos ficaram para o dia seguinte. A data ficou conhecida como o <b>Dia dos Mil Mortos</b>, o dia mais trágico da história de Fortaleza <span class="tag forte">forte</span>.</p>

<h4>Rodolfo Teófilo</h4>
<p>Rodolfo Marcos Teófilo nasceu em Salvador, em 1853, filho de um médico cearense, e viveu em Fortaleza, onde dizia ser “cearense porque quero”. Farmacêutico e escritor, testemunhou a seca e a epidemia. Anos depois, diante da omissão das autoridades, passou a produzir a vacina contra a varíola e a vacinar a população por conta própria, de casa em casa. Seu trabalho é associado ao controle da varíola em Fortaleza no início do século XX <span class="tag forte">forte</span>. Escreveu romances como <i>A Fome</i> (1890) e <i>Os Brilhantes</i> (1895) e livros sobre a seca e a varíola.</p>

<div class="box conceito"><p>Rodolfo Teófilo concluiu que o problema da varíola no Ceará era <b>político</b>, e não apenas médico: era a má gestão, a ganância e o descaso que deixavam a saúde pública abandonada. É uma ideia muito atual.</p></div>

<div class="box hoje"><p>Em 2020, durante a pandemia de covid-19, jornais e historiadores cearenses relembraram o Dia dos Mil Mortos e a figura de Rodolfo Teófilo. Um bairro e muitas instituições de Fortaleza levam seu nome.</p></div>
`,

  o:['100','1.004','10.000','14.491'],c:1,
  e:['Não.','Correto.','Não.','Foi o total de dezembro.']},
 {q:'Quantas mortes por varíola Fortaleza registrou em dezembro de 1878?',

exercicio:`<p><b>Ontem e hoje.</b> Compare a epidemia de varíola de 1878 com uma epidemia recente. O que se repete (medo, desigualdade, ação ou omissão do governo)? O que mudou?</p>`,
fontes:`<ul>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/ceara/em-um-unico-dia-fortaleza-ja-registrou-mais-de-mil-mortos-pela-variola-1.3716543','Em um único dia, Fortaleza já registrou mais de mil mortos pela varíola')}.</li>
<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/opiniao/2020/04/16/sebastiao-ponte--epidemia-matou-mil-pessoas-em-fortaleza.html','Sebastião Ponte: epidemia matou mil pessoas em Fortaleza')} (2020).</li>
<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/reportagem/2026/05/23/grandes-secas-grandes-numeros.html','Grandes secas, grandes números')} (2026).</li>
<li>${lnk('https://repositorio.ufc.br/bitstream/riufc/40117/3/2018_capliv_gmaalmeida.pdf','A seca em Os Brilhantes de Rodolfo Teófilo')} (UFC, 2018).</li>

aula('t2-a21',{
objetivo:`<p>Ao final, você vai entender a migração de cearenses para a Amazônia durante e depois da seca de 1877, como ela foi incentivada pelas autoridades e o que os migrantes encontraram nos seringais.</p>`,
explicacao:`
<h4>O porquê: a diáspora cearense</h4>
<p>A seca de 1877 empurrou dezenas de milhares de cearenses para fora da província. Muitos foram para a Amazônia, onde a borracha começava a crescer. Começava ali uma longa história de migração que marcaria o Ceará e a Amazônia.</p>

<h4>Passagens pagas</h4>
<p>Para aliviar as tensões em Fortaleza, as autoridades cearenses concederam passagens de navio, estimulando a migração em massa para outras províncias. O Piauí, o Maranhão, o Pará e o Amazonas receberam a maior parte desse fluxo <span class="tag forte">forte</span>. Segundo um historiador amazonense, em março de 1879 já tinham entrado em Manaus mais de seis mil retirantes cearenses.</p>

<h4>O que encontraram</h4>
<p>No início, a expectativa não era necessariamente a extração de borracha: muitos foram para colônias agrícolas. Mas as elites amazônicas passaram a direcionar os migrantes para os seringais distantes, onde o trabalho era duro, as doenças, frequentes, e o sistema de aviamento prendia os seringueiros em dívidas com os patrões <span class="tag forte">forte</span>.</p>

<div class="box cuidado"><p>A migração para a Amazônia não começou em 1877. Pesquisas mostram cearenses migrando para a Amazônia desde meados do século XIX, por escolha própria, como comerciantes e trabalhadores. A seca de 1877 intensificou um movimento que já existia <span class="tag forte">forte</span>. Ver os migrantes só como “vítimas empurradas pela seca” apaga suas decisões e estratégias.</p></div>

<div class="box conceito"><p>Os migrantes também carregavam classificações raciais. Estudos mostram que a imagem do “cearense” na Amazônia misturava preconceito de origem e de cor, e que entre os retirantes havia muitas pessoas negras, cuja presença foi invisibilizada <span class="tag forte">forte</span>.</p></div>

<div class="box conexao"><p>A migração para a Amazônia voltou com força na Segunda Guerra, com os “soldados da borracha” (Trilha 3). E o Acre, que se tornou brasileiro no início do século XX, teve grande presença de cearenses.</p></div>
`,
quiz:[
 {q:'Como as autoridades estimularam a saída de retirantes?',
  o:['Pagando passagens de navio','Fechando as estradas','Proibindo a migração','Construindo cidades novas'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Quais províncias receberam a maior parte dos migrantes cearenses?',
  o:['São Paulo e Rio','Piauí, Maranhão, Pará e Amazonas','Rio Grande do Sul','Bahia e Sergipe'],c:1,
  e:['Não nessa época.','Correto.','Não.','Não.']},
 {q:'O que era o sistema de aviamento?',
  o:['Um tipo de avião','Um sistema que prendia os seringueiros em dívidas com os patrões','Uma escola','Um imposto'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'A migração do Ceará para a Amazônia começou em 1877?',
  o:['Sim, só a partir daí','Não, já existia desde meados do século XIX; a seca a intensificou','Só no século XX','Nunca aconteceu'],c:1,
  e:['Não.','Correto.','Não.','Aconteceu.']},
 {q:'O que estudos recentes mostram sobre a cor dos retirantes?',
  o:['Que eram todos brancos','Que havia muitas pessoas negras, cuja presença foi invisibilizada','Que eram todos indígenas','Que eram todos estrangeiros'],c:1,
  e:['Não.','Correto.','Não.','Não.']}
],
exercicio:`<p><b>Família migrante.</b> Pergunte na sua família ou vizinhança se alguém teve parentes que foram para a Amazônia (Pará, Amazonas, Acre). Anote quando, por quê e o que aconteceu. É uma fonte oral valiosa.</p>`,
fontes:`<ul>
<li>Edson Holanda Lima Barboza, ${lnk('https://www.scielo.br/j/rbh/a/HHtgr7H83cgfjWqdbbwQ67k/?lang=pt','Retirantes cearenses na província do Amazonas (1877–1879)')} (RBH, 2015).</li>
<li>${lnk('https://revistas.pucsp.br/index.php/revph/article/download/25806/20807/79641','Da diáspora cearense: classificações raciais e alianças')} (Projeto História, 2016).</li>
<li>${lnk('https://core.ac.uk/download/511861066.pdf','Nem sina, nem acaso: migrações entre o Ceará e a Amazônia (1847–1877)')}.</li>
<li>Antônio Alexandre Isidio Cardoso, ${lnk('https://revistas.uece.br/index.php/embornal/article/download/3094/2611/10796','Trajetórias migrantes Ceará-Amazônia (1852–1877)')} (Embornal).</li>
</ul>`
});

aula('t2-a22',{
objetivo:`<p>Ao final, você vai conhecer a história da Estrada de Ferro de Baturité: sua origem, seu traçado e seu papel na economia e na seca.</p>`,
explicacao:`
<h4>O porquê: o trem e o algodão</h4>
<p>No século XIX, ferrovia era sinônimo de progresso. No Ceará, a primeira linha nasceu para levar a produção do Maciço de Baturité e do sertão até o porto de Fortaleza.</p>

<h4>A origem</h4>
<p>A Estrada de Ferro de Baturité começou como uma companhia cearense, a Companhia Cearense da Via Férrea de Baturité. O projeto previa ligar Fortaleza a Baturité, passando por Arronches (Parangaba), Pacatuba, Acarape e Maranguape, áreas consideradas celeiros agrícolas. O primeiro trecho, de Fortaleza a Arronches, foi inaugurado em 1873 <span class="tag forte">forte</span>.</p>

<h4>Da empresa ao Estado</h4>
<p>As obras avançaram devagar e pararam por falta de recursos. Em 1878, no meio da seca, o governo imperial encampou a ferrovia e retomou a construção, agora como frente de trabalho para os retirantes. Com o tempo, a linha seguiu pelo sertão central e chegou ao Crato, no sopé do Araripe, já no século XX <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Historiadores dizem que a ferrovia ajudou a “inventar” o Ceará moderno: ligou o interior à capital, fez de Fortaleza o centro de tudo e, ironicamente, se tornou também “o principal meio de transporte da fome” nas secas seguintes, levando retirantes para a capital <span class="tag interpretacao">interpretação</span>.</p></div>

<div class="box hoje"><p>O traçado da antiga Estrada de Ferro de Baturité é usado hoje, em parte, pelo metrô de Fortaleza (Linha Sul). A Estação João Felipe, no centro, é patrimônio histórico.</p></div>
`,
quiz:[
 {q:'Qual foi o primeiro trecho da Estrada de Ferro de Baturité?',
  o:['Fortaleza–Arronches, 1873','Fortaleza–Crato, 1850','Sobral–Camocim, 1900','Aracati–Icó, 1799'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Por que o governo encampou a ferrovia em 1878?',

aula('t2-a23',{
objetivo:`<p>Ao final, você vai entender como as obras públicas foram usadas como socorro e controle dos retirantes na seca de 1877, como era o trabalho nelas e como os trabalhadores resistiram.</p>`,
explicacao:`
<h4>O porquê: trabalho em troca de comida</h4>
<p>Na seca de 1877, o governo decidiu que os retirantes não deveriam receber esmola sem trabalhar. Surgiram as <span class="g" data-t="frentetrabalho">frentes de trabalho</span>, que se repetiriam em todas as secas do século XX.</p>

<h4>As obras</h4>
<p>As grandes obras da seca de 1877 foram as estradas de ferro de Baturité e de Sobral, os açudes de Quixadá (o Cedro) e de Acarape, e os portos de Camocim e Acaraú <span class="tag forte">forte</span>. O prolongamento da Estrada de Ferro de Baturité, iniciado em 1878, chegou a ocupar perto de trinta mil retirantes <span class="tag forte">forte</span>. As ferrovias de Sobral e de Baturité foram construídas em quase toda a sua extensão por retirantes.</p>

<h4>Como era o trabalho</h4>
<p>Os retirantes ocupavam os postos mais baixos: carregavam dormentes e trilhos, quebravam pedras, empurravam carros de mão, socavam terra. A paga era pequena, muitas vezes em comida. Doenças como a varíola atingiam os acampamentos <span class="tag forte">forte</span>.</p>

<h4>Resistência</h4>
<p>Os trabalhadores não aceitaram tudo calados. Houve conflitos com engenheiros e feitores, fugas, reclamações e greves. Em 1888, numa nova seca, os operários do prolongamento da Estrada de Ferro de Baturité fizeram uma greve na cidade de Baturité, que um historiador chamou de “revolução dos retirantes” <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>As obras tinham duplo sentido: eram <b>socorro</b>, porque davam comida a quem passava fome, e <b>controle</b>, porque mantinham os retirantes longe da capital e sob vigilância. Esse duplo sentido vai aparecer de novo nos campos de concentração de 1915 e 1932 (Trilha 3).</p></div>

<div class="box hoje"><p>O Album da Estrada de Ferro de Baturité, de 1880, com 34 fotografias das obras, é uma das primeiras coleções de fotos da seca no Brasil. Ele foi feito para celebrar a obra, mas hoje é lido como registro do sofrimento dos trabalhadores.</p></div>
`,
quiz:[
 {q:'Qual destas NÃO foi obra da seca de 1877?',
  o:['Estrada de Ferro de Baturité','Açude do Cedro, em Quixadá','Porto de Camocim','Açude Castanhão'],c:3,
  e:['Foi.','Foi.','Foi.','Correto: é do início do século XXI.']},
 {q:'Quantos retirantes chegou a ocupar o prolongamento da Estrada de Ferro de Baturité?',
  o:['Cerca de 300','Perto de 30 mil','3 milhões','Nenhum'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Qual o duplo sentido das frentes de trabalho?',
  o:['Lucro e diversão','Socorro e controle','Educação e lazer','Guerra e paz'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'O que aconteceu em 1888 em Baturité?',
  o:['A abolição','Uma greve dos operários retirantes da ferrovia','A chegada do trem','Uma enchente'],c:1,
  e:['Foi nacional, em maio.','Correto.','Já tinha chegado.','Não.']},
 {q:'Como o Album da Estrada de Ferro de Baturité (1880) é lido hoje?',
  o:['Como propaganda sem valor','Como registro do sofrimento dos trabalhadores, apesar de feito para celebrar a obra','Como obra de ficção','Como mapa'],c:1,
  e:['Tem muito valor.','Correto.','Não.','Não.']}
],
exercicio:`<p><b>Ler uma fotografia.</b> Procure imagens do Album da Estrada de Ferro de Baturité (1880). Escolha uma foto e descreva: quem aparece, o que está fazendo, quem não aparece, e para que a foto foi feita.</p>`,
fontes:`<ul>
<li>${lnk('https://anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548856701_337dab5840cfc5d0991d0aaae364158e.pdf','Retirantes e o trabalho nas obras públicas')} (ANPUH).</li>
<li>Tyrone Cândido, ${lnk('https://repositorio.ufc.br/ri/bitstream/riufc/42509/1/2013_eve_tapcandido.pdf','sobre o prolongamento com perto de 30 mil retirantes')} (UFC, 2013).</li>
<li>Tyrone Cândido, ${lnk('https://periodicos.ufsc.br/index.php/mundosdotrabalho/article/download/74739/44831/284853','Uma “revolução” dos retirantes: a greve de 1888')} (Mundos do Trabalho).</li>
<li>Tyrone Cândido, ${lnk('https://revistas.uece.br/index.php/centurias/article/download/11496/10365/47736','A ótica da seca: o Album da EFB (1880)')}.</li>
</ul>`
});

aula('t2-a24',{
objetivo:`<p>Ao final, você vai conhecer a história do porto de Fortaleza no século XIX, seus problemas, os trabalhadores do porto e seu papel no comércio do algodão.</p>`,
explicacao:`
<h4>O porquê: um porto difícil</h4>
<p>Fortaleza virou o centro comercial do Ceará, mas tinha um porto ruim: mar aberto, sem abrigo natural, com bancos de areia. Navios fundeavam ao largo, e tudo era levado à praia em pequenos barcos.</p>

<h4>Catraieiros e estivadores</h4>
<p>O trabalho de carregar e descarregar navios era feito por <b>catraieiros</b> (que conduziam as catraias, pequenas embarcações), jangadeiros e estivadores. Eram trabalhadores pobres, muitos negros e mestiços, com um conhecimento precioso do mar <span class="tag forte">forte</span>. Esse conhecimento lhes dava poder: sem eles, nada entrava nem saía. Você verá na próxima trilha de módulos como os jangadeiros usaram esse poder contra a escravidão.</p>

<h4>Tentativas de melhoria</h4>
<p>Ao longo da segunda metade do século XIX, engenheiros ingleses e americanos fizeram projetos para melhorar o porto, com quebra-mares e obras que esbarravam no avanço da areia. Uma empresa inglesa, a Ceará Harbour Corporation, foi contratada para as obras no fim do século <span class="tag forte">forte</span>. Os resultados foram limitados, e a questão do porto só seria resolvida com o porto do Mucuripe, no século XX.</p>

<div class="box conexao"><p>Os trabalhadores do porto são os protagonistas do módulo 11: a greve dos jangadeiros de 1881, liderada por Francisco José do Nascimento, o Dragão do Mar, recusou-se a embarcar escravizados vendidos para o Sul.</p></div>

<div class="box hoje"><p>O porto do Mucuripe e, desde os anos 2000, o porto do Pecém, em São Gonçalo do Amarante, são os principais portos do Ceará. A antiga área portuária do centro de Fortaleza, como a Praia de Iracema e o Poço da Draga, guarda memórias desse passado.</p></div>
`,
quiz:[
 {q:'Qual era o principal problema do porto de Fortaleza no século XIX?',
  o:['Excesso de navios','Mar aberto, sem abrigo natural, com bancos de areia','Gelo','Falta de mar'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Quem fazia o trabalho de levar cargas entre navios e praia?',
  o:['Engenheiros ingleses','Catraieiros, jangadeiros e estivadores','Soldados','Padres'],c:1,
  e:['Projetavam obras.','Correto.','Não.','Não.']},
 {q:'De onde vinha o poder dos trabalhadores do porto?',
  o:['De serem donos dos navios','De seu conhecimento do mar: sem eles, nada entrava nem saía','De cargos políticos','De serem ricos'],c:1,
  e:['Não eram.','Correto.','Não.','Eram pobres.']},
 {q:'Que empresa inglesa foi contratada para obras no porto no fim do século?',
  o:['Ceará Harbour Corporation','East India Company','WIC','Fábrica Progresso'],c:0,
  e:['Correto.','Não.','É holandesa e do século XVII.','É têxtil.']},
 {q:'Quais são hoje os principais portos do Ceará?',
  o:['Aracati e Icó','Mucuripe e Pecém','Camocim e Crato','Barra do Ceará e Messejana'],c:1,
  e:['Não.','Correto.','Não.','Não.']}
],
exercicio:`<p><b>Trabalhadores do mar.</b> Pesquise sobre os jangadeiros do Ceará hoje (Mucuripe, Prainha, Canoa Quebrada). Que desafios enfrentam? O que mudou desde o século XIX?</p>`,
fontes:`<ul>
<li>Maciel da Costa Cavalcante, ${lnk('https://repositorio.ufc.br/bitstream/riufc/75342/3/2023_dis_mccavalcante.pdf','O antigo porto de Fortaleza: catraieiros e operários da Ceará Harbour Corporation (1875–1900)')} (UFC, 2023).</li>
<li>${lnk('https://pantheon.ufrj.br/bitstream/11422/29255/1/LCFran%c3%a7a.pdf','Catraieiros contra o tráfico interprovincial no Ceará e no Amazonas')} (UFRJ).</li>
</ul>`
});

aula('t2-a25',{
objetivo:`<p>Ao final, você vai entender como Fortaleza se tornou a capital de fato do Ceará no século XIX, superando Aracati, Icó e Sobral.</p>`,
explicacao:`
<h4>O porquê: a vitória de Fortaleza</h4>
<p>No começo do século XIX, Fortaleza era a sede administrativa, mas não a cidade mais rica. No fim do século, era incontestavelmente o centro do Ceará. Como isso aconteceu?</p>

<h4>Os fatores</h4>
<ul>
<li><b>Administração</b>: desde 1799, Fortaleza concentrava governo, tropas e Fazenda.</li>
<li><b>Algodão</b>: o porto de Fortaleza tornou-se o canal de exportação do “ouro branco”.</li>
<li><b>Ferrovia</b>: a Estrada de Ferro de Baturité ligou o interior à capital, desviando o comércio de outros portos.</li>
<li><b>Secas</b>: cada grande seca levava milhares de pessoas para Fortaleza.</li>
<li><b>Instituições</b>: Liceu, Biblioteca, Seminário, Santa Casa, jornais, associações.</li>
</ul>
<p>Na virada do século XIX para o XX, Fortaleza crescia muito e, no fim da década de 1910, era a sétima cidade mais populosa do Brasil <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Geógrafos chamam esse processo de <b>macrocefalia urbana</b>: uma capital que cresce muito mais que as outras cidades e concentra quase tudo. O Ceará tem uma das redes urbanas mais concentradas do Brasil, e isso começou no século XIX.</p></div>

<div class="box hoje"><p>A Região Metropolitana de Fortaleza concentra hoje cerca de 45% da população do Ceará e a maior parte da economia.</p></div>
`,
quiz:[
 {q:'Qual destes fatores ajudou Fortaleza a superar outras cidades?',
  o:['A ferrovia que ligou o interior à capital','A descoberta de ouro','A chegada dos holandeses','A independência do Cariri'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Em que posição Fortaleza estava entre as cidades brasileiras no fim da década de 1910?',
  o:['Primeira','Sétima','Vigésima','Centésima'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'O que é macrocefalia urbana?',
  o:['Uma doença','Uma capital que cresce muito mais que as outras cidades e concentra quase tudo','Um tipo de prédio','Um bairro'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Como as secas contribuíram para o crescimento de Fortaleza?',
  o:['Afastando as pessoas','Levando milhares de retirantes para a capital','Destruindo a cidade','Não contribuíram'],c:1,
  e:['Não.','Correto.','Não.','Contribuíram.']},
 {q:'Que porcentagem aproximada da população do Ceará vive hoje na Região Metropolitana de Fortaleza?',
  o:['5%','Cerca de 45%','90%','100%'],c:1,
  e:['Não.','Correto, aproximadamente.','Não.','Não.']}
],
exercicio:`<p><b>Por que a capital?</b> Escreva um parágrafo comparando Fortaleza e Aracati em 1800 e em 1900. O que mudou em cada uma?</p>`,
fontes:`<ul>
<li>Artur Bruno e Airton de Farias, ${lnk('https://www.al.ce.gov.br/publicacoes-inesp/downloads/pelo-id/1243','Fortaleza: uma breve história')} (2011).</li>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/negocios/fortaleza-300-anos-como-a-cidade-se-tornou-a-maior-economia-do-nordeste-1.3756068','Fortaleza 300 anos: como a cidade se tornou a maior economia do Nordeste')} (2026).</li>
</ul>`

aula('t2-a26',{
objetivo:`<p>Ao final, você vai entender os planos urbanos de Silva Paulet e Adolfo Herbster, o traçado em xadrez e os boulevards de Fortaleza, e como esses planos também produziram segregação.</p>`,
explicacao:`
<h4>O porquê: a cidade desenhada com régua</h4>
<p>Quem anda pelo centro de Fortaleza percebe que as ruas se cruzam em ângulo reto, como num tabuleiro de xadrez. Isso não aconteceu por acaso: é resultado de planos do século XIX.</p>

<h4>Silva Paulet</h4>
<p>O engenheiro Antônio José da Silva Paulet fez duas plantas de Fortaleza, em 1813 e 1818, e introduziu o traçado em xadrez para organizar a vila, cujas ruas tinham crescido de forma irregular. O modelo vinha de Portugal, que adotara o traçado ortogonal na reconstrução de Lisboa depois do terremoto de 1755 <span class="tag forte">forte</span>.</p>

<h4>Adolfo Herbster</h4>
<p>Adolfo Herbster, arquiteto pernambucano, foi contratado pela Câmara Municipal e fez várias plantas de Fortaleza: a “Planta Exacta da Capital do Ceará” (1859), um plano de expansão (1863) e a “Planta da Cidade da Fortaleza e Subúrbios” (1875). Inspirado nas reformas de Haussmann em Paris, projetou em 1875 um cinturão de largas avenidas, os <span class="g" data-t="boulevard">boulevards</span>, para “aformosear”, higienizar e delimitar o centro da cidade <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Os planos de Paulet e Herbster deram ordem e beleza ao centro, mas também desenharam uma <b>fronteira</b>: dentro dos boulevards, a cidade “civilizada” das elites; fora, os bairros pobres, os retirantes e os trabalhadores. Por isso há quem diga que a desigualdade de Fortaleza foi “desenhada com régua e esquadro” <span class="tag interpretacao">interpretação</span>.</p></div>

<div class="box hoje"><p>As avenidas Duque de Caxias, Imperador e Dom Manuel, que contornam o centro de Fortaleza, seguem em boa parte o traçado dos boulevards planejados por Herbster.</p></div>
`,
quiz:[
 {q:'Quem introduziu o traçado em xadrez em Fortaleza?',
  o:['Matias Beck','Silva Paulet','José de Alencar','Dragão do Mar'],c:1,
  e:['Não.','Correto, nas plantas de 1813 e 1818.','Não.','Não.']},
 {q:'De onde veio o modelo do traçado ortogonal?',
  o:['Da reconstrução de Lisboa depois do terremoto de 1755','De Nova York','De Tóquio','De Roma antiga apenas'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Em que se inspirou Adolfo Herbster?',
  o:['Nas reformas de Haussmann em Paris','Nas aldeias indígenas','Nas cidades holandesas','Em Brasília'],c:0,
  e:['Correto.','Não.','Não.','Brasília é muito posterior.']},
 {q:'O que eram os boulevards de Herbster?',
  o:['Praças','Um cinturão de avenidas largas em volta do centro','Pontes','Igrejas'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Que crítica se faz aos planos do século XIX?',
  o:['Que eram feios','Que também desenharam uma fronteira entre a cidade das elites e os bairros pobres','Que não foram feitos','Que eram holandeses'],c:1,
  e:['Não é a crítica principal.','Correto.','Foram feitos.','Não.']}
],
exercicio:`<p><b>Mapa e desigualdade.</b> No Google Maps, observe o centro de Fortaleza e os bairros em volta. Onde o traçado em xadrez é regular e onde ele se desfaz? O que isso sugere sobre o planejamento da cidade?</p>`,
fontes:`<ul>
<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/reportagem/2026/05/16/paulet-e-herbster-a-desigualdade-desenhada-com-regua-e-esquadro.html','Paulet e Herbster: a desigualdade desenhada com régua e esquadro')} (2026).</li>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/ceara/formato-xadrez-das-ruas-de-fortaleza-foi-pensado-por-arruador-cargo-que-existiu-ha-mais-de-200-anos-1.3390138','Formato xadrez das ruas de Fortaleza foi pensado por arruador')} (2023).</li>
<li>${lnk('https://cti.ufpel.edu.br/siepe/arquivos/2014/SA_00493.pdf','Análise dos planos de Silva Paulet (1818) e Adolfo Herbster (1875)')} (UFPel, 2014).</li>
</ul>`
});

aula('t2-a27',{
objetivo:`<p>Ao final, você vai conhecer a vida cultural das elites de Fortaleza no fim do século XIX e a outra face da cidade: o controle e a exclusão dos pobres.</p>`,
explicacao:`
<h4>O porquê: duas Fortalezas</h4>
<p>No fim do século XIX, havia duas Fortalezas na mesma cidade: a das elites, com cafés, clubes, jornais e passeios; e a dos pobres, dos retirantes, dos trabalhadores do porto e das lavadeiras.</p>

<h4>A Fortaleza das elites</h4>
<p>As elites queriam viver como em Paris. Frequentavam o Passeio Público, que tinha diferentes níveis para diferentes classes sociais; liam jornais e revistas; criavam associações literárias e científicas, como o Instituto do Ceará (1887). Lojas vendiam produtos importados da Europa <span class="tag forte">forte</span>.</p>

<h4>A outra Fortaleza</h4>
<p>Os pobres viviam em casas de taipa e palha nos arredores, nos areais, perto das praias. Códigos de posturas municipais proibiam construções de palha no centro, regulavam o comportamento nas ruas e tentavam afastar mendigos, retirantes e “vadios”. Historiadores mostram como as reformas urbanas vieram acompanhadas de <b>controle social</b> <span class="tag forte">forte</span>.</p>

<div class="box exemplo"><p>Segundo relatos da época e estudos sobre a cidade, no Passeio Público do fim do século XIX os três planos (ou avenidas) eram frequentados por grupos sociais diferentes: o primeiro pela elite, os outros por camadas mais populares. Um mesmo espaço público reproduzia as hierarquias da cidade.</p></div>

<div class="box conexao"><p>A Padaria Espiritual (1892), movimento literário irreverente que zombava dessa elite afrancesada, é tema da Trilha 3, nível Especialista.</p></div>

<div class="box hoje"><p>A tensão entre a cidade “planejada” e a cidade real, informal, continua em Fortaleza, uma das capitais mais desiguais do Brasil (Trilha 4).</p></div>
`,
quiz:[
 {q:'Que modelo de cidade as elites de Fortaleza buscavam?',
  o:['Paris e as capitais europeias','Aldeias indígenas','Cidades holandesas do século XVII','Cidades do sertão'],c:0,

aula('t2-a28',{
objetivo:`<p>Ao final, você vai saber quantos eram os escravizados no Ceará do século XIX, onde viviam, em que trabalhavam e como se compunha a população negra livre e escravizada.</p>`,
explicacao:`
<h4>O porquê: números e pessoas</h4>
<p>Uma das razões dadas para a abolição precoce do Ceará é que ali havia “poucos escravos”. Os números ajudam a entender, mas é preciso cuidado para não transformar pessoas em estatística.</p>

<h4>Quantos eram</h4>
<p>O Censo de 1872, o primeiro do Império, registrou no Ceará pouco mais de 30 mil escravizados, numa população total de mais de 700 mil pessoas <span class="tag forte">ordem de grandeza</span>. A proporção de cativos nunca passou de cerca de 20% da população e, na época da abolição, em 1884, era inferior a 4% <span class="tag forte">forte</span>.</p>
<p>Ao mesmo tempo, a população negra e mestiça livre era muito grande. Em levantamentos do início do século, pretos, mulatos e pardos somavam mais da metade da população, e a proporção continuou alta ao longo do século.</p>

<h4>Onde e em quê</h4>
<p>Os escravizados viviam em todo o Ceará: nas fazendas de gado do sertão, nos engenhos de rapadura do Cariri, nos sítios das serras de Baturité e da Meruoca, no serviço doméstico em Fortaleza, Sobral, Aracati e Icó, e como escravos de ganho nas cidades. Pesquisas sobre o Cariri mostram muitas famílias escravizadas em pequenas propriedades <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>A escravidão no Ceará era, em grande parte, de <b>pequenos e médios proprietários</b>, que tinham poucos escravizados cada um. Isso não a tornava “branda”: a violência, a separação de famílias e a possibilidade de venda estavam sempre presentes.</p></div>

<div class="box cuidado"><p>A ideia de que a escravidão no Ceará era “suave” é um mito. Era menos numerosa, mas não menos violenta. Processos criminais, anúncios de fugas e relatos de castigos mostram a realidade da escravidão também aqui.</p></div>
`,

aula('t2-a29',{
objetivo:`<p>Ao final, você vai entender o que foi o tráfico interprovincial de escravizados, por que ele se intensificou com a seca de 1877 e como ele esvaziou a escravidão no Ceará.</p>`,
explicacao:`
<h4>O porquê: o Sul comprava, o Norte vendia</h4>
<p>Depois que o tráfico de africanos foi proibido, em 1850, as fazendas de café do Rio de Janeiro e de São Paulo continuaram precisando de trabalhadores escravizados. A solução foi comprá-los de outras províncias. Começava o tráfico interprovincial.</p>

<h4>Como funcionava</h4>
<p>Comerciantes compravam escravizados no Norte e no Nordeste, onde os preços eram menores, e os revendiam no Sudeste cafeeiro. Os cativos eram embarcados nos portos, como o de Fortaleza, e levados de navio para o Rio de Janeiro. Famílias eram separadas, pessoas eram arrancadas das comunidades onde tinham nascido <span class="tag consenso">consenso</span>.</p>

<h4>A seca acelera</h4>
<p>A seca de 1877–1879 arruinou muitos proprietários cearenses, que venderam seus escravizados para sobreviver. Os preços caíram e as vendas para o Sul aumentaram muito <span class="tag forte">forte</span>. Um jornal abolicionista de 1881 escreveu que, desde a seca, os sertões tinham ficado “desertos”.</p>

<div class="box conceito"><p>O tráfico interprovincial teve um efeito paradoxal: ao reduzir o número de escravizados no Ceará, tornou a escravidão menos importante para a economia local e facilitou a abolição. Mas cada número a menos era uma pessoa vendida para longe <span class="tag forte">forte</span>.</p></div>

<h4>Impostos e resistência</h4>
<p>Algumas províncias criaram impostos sobre a saída de escravizados para conter o tráfico. E os próprios escravizados resistiram: fugiram, buscaram rotas para o Norte e a Amazônia, misturaram-se aos retirantes e aos libertos. Historiadores estudam essas “rotas de resistência” ao tráfico <span class="tag forte">forte</span>.</p>

<div class="box conexao"><p>Foi justamente o embarque de escravizados vendidos para o Sul, no porto de Fortaleza, que os jangadeiros se recusaram a fazer em 1881. O tráfico interprovincial é o pano de fundo da greve do Dragão do Mar (módulo 11).</p></div>
`,

aula('t2-a30',{
objetivo:`<p>Ao final, você vai conhecer as formas de resistência dos escravizados no Ceará (fugas, quilombos, compra de alforria, ações na Justiça) e o papel dos libertos na luta pela liberdade.</p>`,
explicacao:`
<h4>O porquê: a liberdade não foi só concedida</h4>
<p>A abolição costuma ser contada como obra de abolicionistas brancos e de leis. Mas os escravizados lutaram por sua liberdade de muitas formas, muito antes de 1884.</p>

<h4>Formas de resistência</h4>
<ul>
<li><b>Fugas</b>: anúncios em jornais mostram fugas constantes, inclusive para outras províncias e para a Amazônia.</li>
<li><b>Quilombos</b>: comunidades de fugidos se formaram em serras e áreas isoladas. Muitas comunidades quilombolas atuais do Ceará têm origem nesse período.</li>
<li><b>Alforria</b>: escravizados juntavam dinheiro, com trabalho extra e ajuda de parentes, para comprar a liberdade. A Lei do Ventre Livre (1871) reconheceu o direito ao pecúlio, a poupança do escravizado para a compra da alforria.</li>
<li><b>Justiça</b>: ações de liberdade nos tribunais, com base em leis e em irregularidades na escravização.</li>
</ul>

<h4>Libertos organizados</h4>
<p>Libertos tiveram papel central. <b>José Luís Napoleão</b>, nascido em Icó e escravizado ao nascer, comprou a própria liberdade, depois a da mãe e das irmãs, e fundou o Clube dos Libertos, dedicado a financiar alforrias. Ele foi um dos primeiros líderes da greve dos jangadeiros de 1881 <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Historiadores falam em <b>protagonismo negro</b> na abolição: escravizados e libertos não esperaram a liberdade, lutaram por ela. Reconhecer isso muda o lugar de onde se conta a história.</p></div>

<div class="box hoje"><p>O Ceará tem dezenas de comunidades quilombolas reconhecidas pela Fundação Palmares, em vários municípios, como Tururu e Horizonte. O Censo de 2022 foi o primeiro a contar a população quilombola do Brasil.</p></div>
`,

  e:['Não.','Correto.','Não.','Não.']},
 {q:'Quem foi José Luís Napoleão?',
  o:['Um imperador francês','Um liberto nascido em Icó que comprou a própria liberdade e a da família e liderou a greve de 1881','Um presidente da província','Um padre'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'O que eram os quilombos?',
  o:['Fazendas de café','Comunidades formadas por escravizados fugidos','Igrejas','Quartéis'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'O que significa “protagonismo negro” na abolição?',
  o:['Que os negros não participaram','Que escravizados e libertos lutaram ativamente por sua liberdade','Que só a princesa Isabel agiu','Que a abolição foi só uma lei'],c:1,

aula('t2-a31',{
objetivo:`<p>Ao final, você vai conhecer as sociedades abolicionistas do Ceará, como a Sociedade Cearense Libertadora e as Cearenses Libertadoras, e entender como atuavam.</p>`,
explicacao:`
<h4>O porquê: a abolição organizada</h4>
<p>No começo dos anos 1880, o abolicionismo cresceu no Brasil inteiro. No Ceará, ele ganhou força especial, com associações que reuniam comerciantes, jornalistas, professores, mulheres e libertos.</p>

<h4>A Sociedade Cearense Libertadora (1880)</h4>
<p>Fundada em 1880, a <b>Sociedade Cearense Libertadora</b> foi a mais conhecida associação abolicionista da província. Seu presidente, <b>João Cordeiro</b>, ficou famoso pelo juramento radical de “matar ou morrer” pela causa. A sociedade publicava o jornal <i>Libertador</i>, organizava festas, comprava alforrias e pressionava proprietários <span class="tag forte">forte</span>. Na memória oficial, seus doze primeiros membros foram chamados de “doze apóstolos”.</p>

<h4>As Cearenses Libertadoras (1882)</h4>
<p>Em 1882, um grupo de 22 mulheres, a maioria de famílias tradicionais, fundou a <b>Sociedade das Cearenses Libertadoras</b>, uma das primeiras associações abolicionistas do Brasil formada e dirigida apenas por mulheres. A presidente era <b>Maria Tomásia Figueira Lima</b>, nascida em Sobral em 1826; entre as integrantes estava a professora <b>Elvira Pinho</b>. As Libertadoras escreviam em jornais, faziam discursos, arrecadavam dinheiro e percorriam o interior <span class="tag forte">forte</span>. A sociedade foi instalada solenemente em janeiro de 1883, com a presença de José do Patrocínio.</p>

<div class="box conceito"><p>As sociedades abolicionistas eram, em sua maioria, de pessoas letradas e de classe média ou alta. Elas tiveram papel importante na propaganda e na pressão política. Mas, como você verá na próxima aula, a ação decisiva começou no porto, entre trabalhadores negros e pobres.</p></div>

<div class="box hoje"><p>O papel das mulheres na abolição cearense foi por muito tempo esquecido. Em 2026, estudantes de uma escola pública de Graça, no interior do Ceará, apresentaram na Universidade de Lisboa uma pesquisa sobre as Libertadoras Cearenses, mostrando que essa história está sendo redescoberta.</p></div>
`,

aula('t2-a32',{
objetivo:`<p>Ao final, você vai conhecer a greve dos jangadeiros de 1881, que fechou o porto de Fortaleza ao embarque de escravizados, e a figura de Francisco José do Nascimento, o Dragão do Mar, ao lado de José Luís Napoleão e Tia Simoa.</p>`,
explicacao:`
<h4>O porquê: o mar disse não</h4>
<p>Para embarcar os escravizados vendidos ao Sul, era preciso levá-los da praia até os navios em jangadas e botes. Se os jangadeiros se recusassem, o tráfico parava. Foi o que aconteceu em 1881.</p>

<h4>Janeiro de 1881</h4>
<p>Nos dias 27, 30 e 31 de janeiro de 1881, os jangadeiros, catraieiros e estivadores do porto de Fortaleza se recusaram a embarcar escravizados para os navios que os levariam a outras províncias <span class="tag forte">forte</span>. À frente da primeira paralisação estava <b>José Luís Napoleão</b>, liberto, chefe da capatazia dos jangadeiros, com o apoio de cerca de mil pessoas, e participação de mulheres negras como <b>Tia Simoa</b> <span class="tag forte">forte</span>. O grito “No porto do Ceará não se embarcam mais escravos” tornou-se símbolo do movimento.</p>

<h4>Agosto de 1881 e o Dragão do Mar</h4>
<p>Em 30 de agosto de 1881, houve uma segunda paralisação, liderada por <b>Francisco José do Nascimento</b>, o Chico da Matilde, nascido em Canoa Quebrada (Aracati), prático-mor da Capitania dos Portos. Por seu papel, perdeu o cargo, mas ganhou fama nacional e o apelido de <b>Dragão do Mar</b> <span class="tag forte">forte</span>. Em 1884, foi ao Rio de Janeiro com uma jangada, como atração de manifestações abolicionistas.</p>

<div class="box conceito"><p>A greve dos jangadeiros foi uma <b>ação de trabalhadores negros e pobres</b>, que usaram seu poder sobre o porto para bloquear o tráfico. Historiadores recentes insistem que a iniciativa partiu da orla, e não dos salões das sociedades abolicionistas, que depois ocuparam o centro da narrativa <span class="tag interpretacao">interpretação em destaque na historiografia atual</span>.</p></div>

<div class="box cuidado"><p>A memória oficial concentrou tudo no Dragão do Mar, transformado em herói único. Ele foi importante, mas não estava sozinho: Napoleão liderou a primeira greve, e muitas pessoas anônimas, homens e mulheres, sustentaram o movimento. Heróis individuais costumam esconder ações coletivas.</p></div>

<div class="box hoje"><p>O Centro Dragão do Mar de Arte e Cultura, em Fortaleza, inaugurado em 1999, homenageia o jangadeiro. A memória de Napoleão e Tia Simoa vem sendo recuperada por pesquisadores e pelo movimento negro.</p></div>
`,

  e:['Não.','Correto.','Não.','Não.']},

aula('t2-a33',{
objetivo:`<p>Ao final, você vai conhecer a sequência que levou à abolição no Ceará: Acarape em 1º de janeiro de 1883, Fortaleza em maio de 1883 e a província em 25 de março de 1884.</p>`,
explicacao:`
<h4>O porquê: libertar município por município</h4>
<p>Depois da greve de 1881, a estratégia dos abolicionistas foi libertar territórios, um a um, pressionando proprietários a conceder alforrias. A ideia, trazida por José do Patrocínio, era criar “territórios livres”.</p>

<h4>José do Patrocínio no Ceará</h4>
<p>No fim de 1882, o jornalista carioca <b>José do Patrocínio</b>, homem negro, filho de uma escravizada e maior tribuno abolicionista do Império, chegou a Fortaleza. Ele ajudou a organizar a campanha de libertação de municípios, percorreu o interior ao lado do Dragão do Mar e espalhou pelo país a imagem do Ceará como exemplo <span class="tag forte">forte</span>.</p>

<h4>A cronologia da liberdade</h4>
<ul class="tl">
<li><b>1º de janeiro de 1883</b>A vila de Acarape, hoje Redenção, declara livres todos os escravizados de seu território, com a entrega de 116 cartas de alforria em frente à igreja matriz. É considerada o primeiro território livre do Brasil.</li>
<li><b>24 de maio de 1883</b>A capital, Fortaleza, é declarada livre.</li>
<li><b>1883–1884</b>Outros municípios seguem o exemplo, com campanhas de alforria.</li>
<li><b>25 de março de 1884</b>O presidente da província, o baiano Manuel Sátiro de Oliveira Dias, declara extinta a escravidão em todo o Ceará, quatro anos antes da Lei Áurea.</li>
</ul>

<div class="box conceito"><p>A abolição cearense de 1884 foi uma <b>declaração provincial</b>, feita por meio de alforrias e da pressão social, já que a escravidão continuava legal no Império. Ela teve enorme repercussão: foi noticiada no <i>Times</i> de Londres, celebrada em Paris e reconhecida por Joaquim Nabuco como acontecimento decisivo da causa abolicionista <span class="tag forte">forte</span>.</p></div>

<div class="box hoje"><p>O 25 de março é a <b>Data Magna do Ceará</b>, feriado estadual instituído em 2011. A cidade de Redenção abriga a Unilab, universidade federal voltada à integração com países africanos de língua portuguesa, criada em 2010, numa escolha carregada de simbolismo.</p></div>
`,

aula('t2-a34',{
objetivo:`<p>Ao final, você vai saber explicar por que o Ceará aboliu a escravidão antes do resto do Brasil, combinando fatores econômicos, sociais e políticos.</p>`,
explicacao:`
<h4>O porquê: uma pergunta com várias respostas</h4>
<p>Por que o Ceará, e não outra província, foi a primeira a abolir? Não há uma única resposta. Os historiadores combinam vários fatores.</p>

<h4>Os fatores</h4>
<ul>
<li><b>Poucos escravizados</b>: a proporção de cativos era pequena e caiu ainda mais com o tráfico interprovincial e a seca. A economia já dependia sobretudo de trabalho livre.</li>
<li><b>A seca de 1877</b>: arruinou proprietários, acelerou as vendas e mudou a paisagem social.</li>
<li><b>A ação dos trabalhadores do porto</b>: a greve de 1881 fechou a principal rota de saída do tráfico.</li>
<li><b>Organização abolicionista</b>: sociedades, imprensa, mulheres e libertos fizeram pressão constante.</li>
<li><b>Conjuntura nacional</b>: o movimento abolicionista crescia no país e o Ceará virou vitrine.</li>
</ul>

<div class="box conceito"><p>Nenhum fator sozinho explica. A combinação de uma escravidão já enfraquecida economicamente com uma mobilização social forte, incluindo a ação direta de trabalhadores negros, é o que torna o caso cearense especial <span class="tag consenso">consenso na historiografia</span>.</p></div>

<div class="box cuidado"><p>Duas explicações simplificadas devem ser evitadas: a de que “o Ceará aboliu porque era mais generoso” e a de que “aboliu só porque não tinha escravos”. A primeira ignora os interesses econômicos; a segunda ignora a luta de quem fez a abolição acontecer.</p></div>
`,
quiz:[
 {q:'Qual destes fatores ajudou a abolição precoce no Ceará?',
  o:['A pequena proporção de escravizados, reduzida pelo tráfico e pela seca','A chegada do café','A invasão holandesa','A Guerra do Paraguai sozinha'],c:0,
  e:['Correto.','Não.','Não.','Não sozinha.']},
 {q:'Qual foi o papel da greve de 1881?',
  o:['Nenhum','Fechar a principal rota de saída do tráfico, no porto','Aumentar o tráfico','Libertar o Rio de Janeiro'],c:1,
  e:['Teve papel.','Correto.','Não.','Não.']},
 {q:'Qual explicação deve ser evitada?',
  o:['A que combina vários fatores','“O Ceará aboliu porque era mais generoso”','A que inclui a ação dos jangadeiros','A que inclui a seca'],c:1,
  e:['É a melhor.','Correto: ignora interesses econômicos.','Não.','Não.']},
 {q:'Por que é simplificação dizer que “o Ceará aboliu só porque não tinha escravos”?',

  e:['Não.','Correto.','Não houve.','Não.']}
],
exercicio:`<p><b>Hierarquia de causas.</b> Ordene os cinco fatores da aula do mais ao menos importante, na sua opinião, e justifique cada posição em uma frase.</p>`,

<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/ceara/entenda-os-mitos-sobre-a-abolicao-no-ceara-que-libertou-escravizados-4-anos-antes-do-brasil-1.3510703','Entenda os mitos sobre a abolição no Ceará')} (2024).</li>
<li>Angela Alonso, <i>Flores, Votos e Balas</i> (2015).</li>
<li>${lnk('https://revistas.pucsp.br/index.php/revph/article/download/7996/5872/19495','Tráfico interprovincial, escravidão e seca no Ceará')}.</li>

aula('t2-a35',{
objetivo:`<p>Ao final, você vai entender o que aconteceu com os libertos depois de 1884: trabalho, terra, preconceito e a continuidade da exploração.</p>`,
explicacao:`
<h4>O porquê: liberdade sem terra</h4>
<p>A abolição acabou com a propriedade de pessoas, mas não deu aos libertos terra, educação ou indenização. O que veio depois?</p>

<h4>Trabalho</h4>
<p>Muitos libertos continuaram trabalhando para seus antigos senhores, muitas vezes sem remuneração ou em condições muito parecidas com a escravidão <span class="tag forte">forte</span>. Outros migraram para Fortaleza, para outras regiões ou para a Amazônia, juntando-se aos pobres livres.</p>

<h4>Fugitivos de outras províncias</h4>
<p>Escravizados de outras províncias fugiram para o Ceará acreditando que ali seriam livres. Muitos foram caçados e devolvidos a seus donos, porque a escravidão continuava legal no resto do Império até 1888 <span class="tag forte">forte</span>.</p>

<h4>Preconceito e apagamento</h4>
<p>Depois da abolição, os libertos e a população negra passaram a ser alvo de discursos que os acusavam de “não querer trabalhar” e de serem “vadios”. Ao mesmo tempo, consolidou-se a ideia de que “no Ceará não há negros”. O historiador Eurípedes Funes resumiu esse processo dizendo que a abolição na “Terra da Luz” apagou as luzes sobre os negros <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Historiadores chamam de <b>pós-abolição</b> o estudo do que aconteceu com os libertos e seus descendentes depois do fim da escravidão. No Ceará, esse campo cresceu muito desde os anos 2000, revelando trajetórias de trabalho, religiosidade, organização e luta.</p></div>

<div class="box hoje"><p>A desigualdade racial no Ceará e no Brasil tem raízes na forma como a abolição foi feita: sem terra, sem reparação, com preconceito. É um tema central do debate público atual.</p></div>
`,

 {q:'O que muitos libertos fizeram depois de 1884?',
  o:['Receberam terras do governo','Continuaram trabalhando para antigos senhores, muitas vezes sem remuneração, ou migraram','Viraram fazendeiros ricos','Foram para a Europa'],c:1,

 {q:'O que acontecia com escravizados que fugiam para o Ceará depois de 1884?',

  e:['Não.','Correto.','Não.','Não.']},
 {q:'O que Eurípedes Funes quis dizer com “apagou as luzes sobre os negros”?',
  o:['Que faltou energia elétrica','Que a abolição foi seguida do apagamento da presença negra na memória do Ceará','Que os negros saíram do Ceará','Que a abolição não aconteceu'],c:1,
  e:['Não.','Correto.','Não.','Aconteceu.']},
 {q:'O que é o “pós-abolição” como campo de estudo?',
  o:['O estudo do que aconteceu com libertos e descendentes depois do fim da escravidão','O estudo da Lei Áurea apenas','O estudo dos holandeses','O estudo das secas'],c:0,

aula('t2-a36',{
objetivo:`<p>Ao final, você vai entender como a memória da abolição foi construída no Ceará (o título de “Terra da Luz”, os monumentos, os heróis) e como ela é disputada hoje.</p>`,
explicacao:`
<h4>O porquê: de quem é a luz?</h4>
<p>“Terra da Luz” é um dos apelidos mais conhecidos do Ceará. Muita gente acha que se refere ao sol forte. Na verdade, foi dado por José do Patrocínio por causa da abolição. Mas a pergunta que historiadores fazem hoje é: quem acendeu essa luz?</p>

<h4>A origem do título</h4>
<p>José do Patrocínio chamou o Ceará de “Terra da Luz” pelo pioneirismo na abolição. Em outras ocasiões, usou também a expressão “berço da liberdade” <span class="tag forte">forte</span>. O título correu o país e virou parte da identidade cearense.</p>

<h4>A memória oficial</h4>
<p>A narrativa consagrada, fixada por historiadores como Raimundo Girão, deu o protagonismo às sociedades abolicionistas, a figuras como João Cordeiro e ao Dragão do Mar, transformado em herói. Os escravizados e libertos aparecem, nessa versão, mais como “ajudados” do que como agentes <span class="tag interpretacao">crítica atual</span>.</p>

<h4>A memória disputada</h4>
<p>Desde os anos 2000, pesquisadores, o movimento negro e jornalistas passaram a contar outra versão, em que a insurreição começou na orla, com trabalhadores negros como Napoleão e Tia Simoa, e em que a luz da liberdade “surgiu do mar”, e não dos salões. Há também quem lembre que, para os libertos, a “luz” prometida não chegou plenamente <span class="tag interpretacao">debate atual</span>.</p>

<div class="box conceito"><p>A memória é um <b>campo de disputa</b>: quem é lembrado, quem é esquecido, que datas viram feriado, que nomes viram rua. Estudar a história da memória é tão importante quanto estudar os fatos.</p></div>

<div class="box cuidado"><p>Criticar a memória oficial não significa negar o mérito dos abolicionistas brancos. Significa ampliar a história para incluir quem foi apagado. As duas coisas podem coexistir.</p></div>

<div class="box hoje"><p>Museus como o Museu do Ceará, o Centro Dragão do Mar e o Memorial em Redenção apresentam versões diferentes da abolição. Comparar essas narrativas é um bom exercício de história pública.</p></div>
`,

aula('t3-a1',{
objetivo:`<p>Ao final, você vai entender como a Proclamação da República chegou ao Ceará e o que mudou (e o que não mudou) na política do estado.</p>`,
explicacao:`
<h4>O porquê: mudança no topo, continuidade embaixo</h4>
<p>Em 15 de novembro de 1889, a monarquia caiu no Rio de Janeiro. No Ceará, a notícia chegou por telégrafo e foi recebida com mais surpresa do que entusiasmo. A República trouxe novas instituições, mas o poder continuou com as mesmas famílias.</p>

<h4>O que mudou</h4>
<ul>
<li>A província virou <b>estado</b>, com mais autonomia: os presidentes do estado (o nome dos governadores na época) passaram a ser eleitos, e não nomeados pelo Rio.</li>
<li>Separação entre Igreja e Estado: casamento civil, registro civil, cemitérios públicos.</li>
<li>Fim do voto censitário, mas manutenção da exclusão dos analfabetos e das mulheres.</li>
</ul>

<h4>O que não mudou</h4>
<p>A estrutura de poder baseada na terra, nas famílias e no clientelismo continuou. Os primeiros anos foram instáveis, com governos militares e disputas entre grupos. A estabilidade só veio com um acordo entre o governo federal e as elites estaduais: a <b>política dos governadores</b>, criada pelo presidente Campos Sales (1898–1902) <span class="tag consenso">consenso</span>.</p>

<div class="box conceito"><p>Na <b>política dos governadores</b>, o presidente da República apoiava o grupo que dominava cada estado e, em troca, esse grupo garantia a eleição de deputados e senadores fiéis ao governo federal. Nos municípios, os coronéis garantiam os votos ao governo estadual. Era uma pirâmide de favores, de cima a baixo.</p></div>

<div class="box hoje"><p>A expressão “voto de cabresto”, que designa o voto controlado por um chefe local, nasceu nesse período e ainda é usada para falar de compra e controle de votos.</p></div>
`,

aula('t3-a2',{
objetivo:`<p>Ao final, você vai conhecer Antônio Pinto Nogueira Accioly e o funcionamento da oligarquia que dominou o Ceará de 1896 a 1912.</p>`,
explicacao:`
<h4>O porquê: dezesseis anos de um só grupo</h4>
<p>De 1896 a 1912, o Ceará foi governado por Nogueira Accioly ou por aliados escolhidos por ele. Foi o período mais longo de domínio de um único grupo na história republicana do estado até então.</p>

<h4>Quem era Accioly</h4>
<p>Antônio Pinto Nogueira Accioly ascendeu na política como genro do Senador Pompeu. Quando o sogro morreu, em 1877, assumiu o controle do Partido Liberal no Ceará. Na República, tornou-se o chefe da política estadual. Governou o Ceará em três mandatos entre 1896 e 1912 <span class="tag forte">forte</span>. Era apelidado pelos adversários de “Babaquara”.</p>

<h4>Como funcionava a oligarquia</h4>
<ul>
<li><b>Fraude eleitoral</b> e controle das mesas eleitorais.</li>
<li><b>Nepotismo</b>: filhos e parentes em cargos públicos, alguns com mais de um emprego vitalício, segundo críticos da época como Rodolfo Teófilo.</li>
<li><b>Repressão</b>: uma polícia usada contra adversários e contra trabalhadores pobres, como os vendedores ambulantes de Fortaleza, perseguidos entre 1904 e 1907.</li>
<li><b>Alianças com coronéis</b> do interior, inclusive com o Padre Cícero, que lhe garantia os votos do Cariri.</li>
</ul>

<div class="box exemplo"><p>Na articulação com o governo federal, Accioly conseguiu que a sede da Inspetoria de Obras Contra as Secas, criada em 1909 e embrião do DNOCS, fosse instalada em Fortaleza <span class="tag forte">forte</span>. É um exemplo de como o poder oligárquico também trazia recursos para o estado, usados como moeda política.</p></div>

<div class="box hoje"><p>Só Accioly e Tasso Jereissati governaram o Ceará em três ocasiões. A comparação entre os “grandes ciclos” da política cearense (Accioly, os coronéis, Tasso, os Ferreira Gomes) é tema frequente do debate público.</p></div>
`,

aula('t3-a3',{
objetivo:`<p>Ao final, você vai entender como a oligarquia Accioly caiu em janeiro de 1912: a política das salvações, a oposição urbana, a passeata das crianças e a revolta que se seguiu.</p>`,
explicacao:`
<h4>O porquê: a cidade contra o oligarca</h4>
<p>Em janeiro de 1912, Fortaleza viveu três dias de revolta que derrubaram o homem mais poderoso do Ceará. Foi uma das maiores mobilizações urbanas da história da cidade.</p>

<h4>A política das salvações</h4>
<p>O presidente Hermes da Fonseca (1910–1914) usou a chamada <span class="g" data-t="salvacoes">política das salvações</span> para derrubar oligarquias estaduais que tinham apoiado seu adversário, Rui Barbosa. No Ceará, a oposição a Accioly lançou como candidato o coronel do Exército <b>Marcos Franco Rabelo</b> <span class="tag forte">forte</span>.</p>

<h4>A oposição urbana</h4>
<p>A campanha contra Accioly mobilizou setores urbanos de Fortaleza: estudantes, caixeiros (empregados do comércio), comerciantes, jornalistas, pequenos funcionários e trabalhadores pobres, como os vendedores ambulantes perseguidos pela polícia <span class="tag forte">forte</span>.</p>

<h4>A passeata das crianças</h4>
<p>Em 21 de janeiro de 1912, foi promovida uma passeata em apoio a Franco Rabelo formada basicamente por crianças, entre a praça Marquês de Herval (atual Praça José de Alencar) e a Praça do Ferreira. A cavalaria avançou contra a manifestação. Houve correria e crianças pisoteadas. Os relatos são imprecisos: conta-se que crianças teriam morrido, e houve algumas dezenas de feridos <span class="tag forte">forte</span>.</p>

<h4>A queda</h4>
<p>A repressão provocou a revolta da cidade. Durante três dias, houve combates e depredação de prédios públicos. Accioly renunciou e deixou o Ceará com a família, para não mais voltar. A foto do seu embarque é uma das imagens mais conhecidas da história política do estado <span class="tag forte">forte</span>. Franco Rabelo foi eleito e assumiu em julho de 1912.</p>

<div class="box conceito"><p>A queda de Accioly juntou duas forças: a pressão do governo federal e a mobilização popular urbana. Historiadores debatem o peso de cada uma. Também lembram que a vitória da oposição urbana durou pouco: dois anos depois, uma aliança de coronéis com Juazeiro derrubaria Franco Rabelo.</p></div>

<div class="box conexao"><p>Rodolfo Teófilo, o mesmo da varíola de 1878, escreveu um livro sobre a queda de Accioly, um testemunho de quem participou da oposição.</p></div>
`,

aula('t3-a4',{
objetivo:`<p>Ao final, você vai conhecer o “milagre” de 1889 em Juazeiro, a figura da beata Maria de Araújo e o conflito que se abriu entre o Padre Cícero e a Igreja.</p>`,
explicacao:`
<h4>O porquê: um acontecimento que fundou uma cidade</h4>
<p>Juazeiro era um povoado de pouco mais de 2 mil pessoas, pertencente ao Crato. Em poucas décadas, tornou-se uma das maiores cidades do interior do Nordeste. Tudo começou numa madrugada de março de 1889.</p>

<h4>O “milagre”</h4>
<p>Em 1º de março de 1889, na capela de Nossa Senhora das Dores, depois de uma noite de vigília em que se pedia chuva para o sertão, o Padre Cícero Romão Batista deu a comunhão a um grupo de beatas. Na boca de <b>Maria Magdalena do Espírito Santo de Araújo</b>, a beata Maria de Araújo, a hóstia teria se transformado em sangue. O fenômeno se repetiu muitas vezes nos meses e anos seguintes. O sangue era recolhido em panos, guardados pelo padre e venerados pelos fiéis <span class="tag forte">forte</span>.</p>

<h4>Quem era Maria de Araújo</h4>
<p>Maria de Araújo (1862–1914) era uma mulher pobre, negra e analfabeta, que vivia em Juazeiro sob a orientação do Padre Cícero. A memória do “milagre” ficou centrada no padre, e ela foi durante muito tempo relegada a papel secundário. Só a partir dos anos 1980 pesquisadores passaram a resgatar sua importância <span class="tag forte">forte</span>.</p>

<h4>O conflito com a Igreja</h4>
<p>Uma primeira investigação diocesana concluiu que o fenômeno era sobrenatural. Mas o bispo do Ceará, D. Joaquim José Vieira, ordenou um segundo inquérito, que chegou a conclusão oposta. A Igreja, inclusive em Roma, condenou o “milagre” e o culto ao sangue. Padre Cícero foi proibido de pregar, confessar e celebrar missas. Ele viajou a Roma em 1898 para se defender, mas a punição continuou <span class="tag forte">forte</span>.</p>

<div class="box cuidado"><p>Como historiadores, não nos cabe decidir se houve ou não milagre. Essa é uma questão de fé. O que a história estuda são os <b>efeitos</b>: as romarias, o conflito com a Igreja, o crescimento de Juazeiro, o poder político que nasceu dali. Também estuda por que a memória privilegiou o padre e apagou a beata.</p></div>

<div class="box hoje"><p>Em Juazeiro do Norte, uma lei municipal determina que o retrato da beata Maria de Araújo seja colocado ao lado do de Padre Cícero nas repartições públicas, e há uma estátua em sua homenagem. Seus restos mortais desapareceram do túmulo, o que a tornou conhecida como “a mulher sem túmulo”.</p></div>
`,

  e:['Correto.','É a Proclamação da República.','É a Sedição.','É a morte do Padre Cícero.']},
 {q:'Na boca de quem a hóstia teria se transformado em sangue?',

aula('t3-a5',{
objetivo:`<p>Ao final, você vai entender como Juazeiro cresceu de povoado a cidade com as romarias, a chegada de migrantes e a rivalidade com o Crato, até a emancipação em 1911.</p>`,
explicacao:`
<h4>O porquê: a “Nova Jerusalém” do sertão</h4>
<p>Depois do “milagre”, milhares de pessoas passaram a ir a Juazeiro. Muitas ficaram. O povoado virou um polo religioso, econômico e político, e entrou em choque com o Crato, a cidade-mãe.</p>

<h4>As romarias</h4>
<p>A primeira grande procissão para venerar os panos com sangue é considerada a primeira <span class="g" data-t="romaria">romaria</span> a Juazeiro. Com o tempo, romeiros vinham de todo o Nordeste: de Alagoas, Pernambuco, Paraíba, Rio Grande do Norte. Muitos se instalavam no lugar, atraídos pela fé e pela proteção do Padre Cícero <span class="tag forte">forte</span>.</p>

<h4>Uma cidade de migrantes</h4>
<p>Padre Cícero orientava os recém-chegados a trabalhar: em roças, no artesanato, no comércio. Juazeiro tornou-se um centro de produção artesanal (redes, objetos de palha, imagens religiosas, ourivesaria) e de comércio. A cidade crescia com gente pobre que encontrava ali trabalho e sentido.</p>

<h4>A rivalidade com o Crato</h4>
<p>O Crato, cidade antiga, sede de elites tradicionais, via com desconfiança o crescimento do povoado de romeiros. A rivalidade entre Crato e Juazeiro, que tem raízes nesse período, atravessou o século XX <span class="tag forte">forte</span>.</p>

<h4>A emancipação (1911)</h4>
<p>Em 1911, com o apoio de Accioly, Juazeiro foi emancipado do Crato e se tornou município, com o nome oficial de Juazeiro do Norte. O Padre Cícero foi seu primeiro prefeito <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Juazeiro mostra como a religião popular podia ter efeitos econômicos e políticos enormes. A fé atraiu gente; a gente trouxe trabalho e votos; os votos deram poder ao padre. Della Cava, em <i>Milagre em Joaseiro</i>, mostrou como religião e política se misturaram nesse processo.</p></div>

<div class="box hoje"><p>Juazeiro do Norte é hoje uma das maiores cidades do interior do Nordeste e recebe cerca de dois milhões de romeiros por ano, sobretudo nas romarias de setembro (Nossa Senhora das Dores), de Finados e de fevereiro (Candeias).</p></div>
`,
