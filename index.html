  o:['Uma festa de inauguração','Um levante indígena atingiu fazendas e a vila, e moradores fugiram para o forte','Um terremoto','A chegada dos holandeses'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Quem instalou a vila de Fortaleza em 1726?',
  o:['Martim Soares Moreno','Matias Beck','O capitão-mor Manuel Francês','Bernardo Manuel de Vasconcelos'],c:2,
  e:['Viveu um século antes.','Era holandês, de 1649.','Correto.','Foi o primeiro governador em 1799.']},
 {q:'O que fazia parte da instalação de uma vila?',
  o:['Construir uma ferrovia','Reunir moradores, eleger a câmara e erguer o pelourinho','Fundar uma universidade','Declarar independência'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Como Bernardo Manuel de Vasconcelos descreveu Fortaleza em 1799?',
  o:['Uma cidade rica','“Um montão de areia”','A capital do Nordeste','Uma vila indígena'],c:1,
  e:['Não.','Correto.','Não.','Não.']},

aula('t1-a27',{
objetivo:`<p>Ao final, você vai entender como funcionava o poder local no Ceará colonial: as câmaras municipais, os capitães-mores, as milícias e a elite de proprietários que dominava esses cargos.</p>`,
explicacao:`
<h4>O porquê: quem mandava de verdade</h4>
<p>O rei estava a meses de distância. O governador de Pernambuco, a semanas. Quem mandava no dia a dia do Ceará eram as autoridades locais, quase sempre ligadas aos grandes proprietários.</p>

<h4>O capitão-mor</h4>
<p>O <b>capitão-mor</b> era a principal autoridade da capitania subordinada. Comandava o forte e as tropas, mas estava sob as ordens do governador de Pernambuco. Muitas vezes entrava em conflito com as câmaras, com os ouvidores (juízes da Coroa) e com o próprio governador. Os documentos do Arquivo Histórico Ultramarino estão cheios de queixas de capitães-mores contra governadores e vice-versa <span class="tag forte">forte</span>.</p>

<h4>A câmara municipal</h4>
<p>Cada vila tinha uma <b>câmara</b>, com vereadores e juízes ordinários eleitos entre os “homens bons”, isto é, os proprietários de prestígio. A câmara cuidava de impostos locais, obras, abastecimento, fiscalização do comércio, justiça de primeira instância. Era o principal espaço de poder das elites locais <span class="tag consenso">consenso</span>.</p>

<h4>As milícias e as patentes</h4>
<p>Os grandes proprietários recebiam <b>patentes militares</b> nas milícias e ordenanças: capitão, sargento-mor, coronel. As patentes davam prestígio e poder de mando sobre os homens livres da região, que podiam ser convocados. É daí que vem o título de “coronel”, que no século XIX e XX virou sinônimo de chefe político do interior <span class="tag consenso">consenso</span>.</p>

<div class="box conceito"><p>No Ceará colonial, <b>terra, gado, patente e cargo</b> andavam juntos. Quem tinha sesmaria tinha gado; quem tinha gado tinha prestígio; quem tinha prestígio recebia patente e era eleito para a câmara. Esse circuito é a base do poder oligárquico que você verá nas Trilhas 2 e 3.</p></div>

<div class="box conexao"><p>As vilas de índios tinham suas próprias câmaras, com vereadores indígenas, como você viu no módulo 6. Comparar as duas é um bom exercício sobre quem podia participar do poder local.</p></div>

<div class="box hoje"><p>As câmaras municipais de hoje são herdeiras diretas das câmaras coloniais. E a palavra “coronel” ainda é usada no Ceará para falar de chefes políticos tradicionais do interior.</p></div>
`,
quiz:[
 {q:'A quem o capitão-mor do Ceará estava subordinado?',
  o:['À câmara de Aquiraz','Ao governador de Pernambuco','Aos jesuítas','A ninguém'],c:1,
  e:['Não.','Correto, até 1799.','Não.','Estava subordinado.']},
 {q:'Quem podia ser eleito para a câmara municipal?',
  o:['Qualquer morador','Os “homens bons”, proprietários de prestígio','Só indígenas','Só padres'],c:1,
  e:['Não.','Correto.','Só nas vilas de índios havia vereadores indígenas.','Não.']},
 {q:'De onde vem o uso de “coronel” para chefes políticos?',
  o:['Do Exército republicano','Das patentes das milícias dadas a grandes proprietários desde a colônia','Dos holandeses','Da Igreja'],c:1,
  e:['A origem é anterior.','Correto.','Não.','Não.']},
 {q:'O que a câmara municipal fazia?',
  o:['Declarava guerra a outros países','Cuidava de impostos locais, obras, abastecimento, fiscalização e justiça de primeira instância','Nomeava o rei','Controlava as missões'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Qual destas cadeias resume o poder no sertão colonial?',
  o:['Escola, diploma, emprego','Terra, gado, patente e cargo','Fábrica, salário, sindicato','Igreja, seminário, bispado'],c:1,
  e:['Não.','Correto.','Não.','Não.']}
],
exercicio:`<p><b>Poder ontem e hoje.</b> Compare a câmara colonial com a câmara municipal da sua cidade hoje. Quem pode votar? Quem pode ser eleito? Que funções se parecem? Faça uma tabela com duas colunas.</p>`,
fontes:`<ul>
<li>${lnk('https://www.uece.br/poslawp/wp-content/uploads/sites/53/2012/11/CE-Colonial.pdf','Catálogo de documentos do Ceará no Arquivo Histórico Ultramarino')}.</li>
<li>${lnk('https://www.periodicos.ufam.edu.br/index.php/Canoa_do_Tempo/article/download/8961/7564','Artigo sobre capitães-mores das capitanias subordinadas a Pernambuco')} (Canoa do Tempo, UFAM).</li>
<li>Barão de Studart, <i>Datas e Factos para a História do Ceará</i>.</li>
</ul>`
});

aula('t1-a28',{
objetivo:`<p>Ao final, você vai entender o que significava para o Ceará ser uma capitania subordinada a Pernambuco: na administração, na justiça e, sobretudo, no comércio.</p>`,
explicacao:`
<h4>O porquê: um Ceará sem voz própria</h4>
<p>Até 1799, decisões importantes sobre o Ceará eram tomadas no Recife. Os cearenses não podiam comerciar diretamente com Portugal, e muitas questões de justiça e de governo dependiam de autoridades de fora. Entender essa dependência ajuda a entender por que a autonomia de 1799 foi tão celebrada.</p>

<h4>Desde quando?</h4>
<p>As fontes divergem sobre a data exata em que o Ceará passou à jurisdição de Pernambuco. Alguns autores falam em 1656, logo depois da saída dos holandeses; outros, em 1680, quando a capitania foi separada do Estado do Maranhão <span class="tag hipotese">datas divergentes</span>. O certo é que, durante quase todo o século XVIII, o Ceará foi uma capitania subalterna a Pernambuco.</p>

<h4>O que a subordinação significava</h4>
<ul>
<li><b>Governo</b>: o capitão-mor do Ceará respondia ao governador de Pernambuco, e havia frequentes conflitos de autoridade.</li>
<li><b>Justiça</b>: por longo tempo, os casos mais importantes eram julgados por ouvidores de fora, de Pernambuco ou da Paraíba. Só no século XVIII o Ceará ganhou ouvidoria própria.</li>
<li><b>Comércio</b>: o Ceará não podia comerciar diretamente com Portugal. Tudo passava pelo Recife, onde comerciantes controlavam preços, crédito e impostos <span class="tag forte">forte</span>.</li>
</ul>

<div class="box analogia"><p>Imagine uma pequena loja que só pode comprar e vender por meio de um atacadista da cidade vizinha. O atacadista decide o preço da compra e da venda e fica com boa parte do lucro. Era mais ou menos a situação dos produtores cearenses em relação aos comerciantes do Recife.</p></div>

<div class="box hoje"><p>A rivalidade entre Ceará e Pernambuco, que às vezes aparece no futebol e no humor, tem raízes antigas. Mas também há laços profundos: famílias, rotas e comércio ligaram os dois estados por séculos.</p></div>
`,

fontes:`<ul>

aula('t1-a29',{
objetivo:`<p>Ao final, você vai saber como e por que o Ceará se tornou capitania autônoma em 17 de janeiro de 1799, quem foi seu primeiro governador e o que mudou com a separação.</p>`,
explicacao:`
<h4>O porquê: o nascimento político do Ceará</h4>
<p>O 17 de janeiro é o <b>Dia do Ceará</b>, instituído por lei estadual em 2004. Ele lembra a carta régia de 17 de janeiro de 1799, pela qual a rainha D. Maria I separou o Ceará de Pernambuco <span class="tag consenso">consenso</span>.</p>

<h4>Por que 1799?</h4>
<ul>
<li><b>Crescimento</b>: no fim do século XVIII, a população e a economia da capitania tinham crescido.</li>
<li><b>Algodão</b>: a exportação de algodão para a Inglaterra criava riqueza e interesse em comerciar diretamente.</li>
<li><b>Reforma administrativa</b>: a Coroa reorganizava as capitanias do Norte no fim do século XVIII, buscando arrecadar mais e controlar melhor.</li>
</ul>
<p>Os historiadores destacam a disputa entre as elites do Ceará e de Pernambuco pela riqueza do algodão como um motor da separação <span class="tag forte">forte</span>.</p>

<h4>O primeiro governador</h4>
<p>Oito meses depois da carta régia, em setembro de 1799, chegou ao Ceará o primeiro governador da capitania autônoma, <b>Bernardo Manuel de Vasconcelos</b>, chefe de esquadra da Marinha, que governou até 1802. Com ele foi criada a Junta da Fazenda, responsável pela arrecadação <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>A autonomia de 1799 foi administrativa, não independência. O Ceará continuou parte do Império português, sob o mesmo rei. O que mudou é que passou a ter governador próprio, finanças próprias e, aos poucos, comércio direto com Portugal.</p></div>

<div class="box cuidado"><p>A frase “a emancipação do Ceará foi decisão de uma mulher” aparece em reportagens e livros. É verdade que a carta foi assinada em nome de D. Maria I. Mas, em 1799, quem governava de fato era seu filho, o príncipe regente D. João, porque a rainha estava afastada por doença mental desde 1792 <span class="tag consenso">consenso</span>. A decisão foi do governo português, não de uma escolha pessoal da rainha.</p></div>

<div class="box hoje"><p>A Avenida Bernardo Manuel, em Fortaleza, homenageia o primeiro governador. O Dia do Ceará é celebrado oficialmente em Aquiraz, a primeira sede da capitania.</p></div>
`,

aula('t1-a30',{
objetivo:`<p>Ao final, você vai conseguir descrever Fortaleza no fim do século XVIII e começo do XIX: tamanho, economia, aparência e o que mudou com a autonomia, até a elevação a cidade em 1823.</p>`,
explicacao:`
<h4>O porquê: a capital improvável</h4>
<p>Em 1799, Fortaleza era a sede da capitania, mas não era a cidade mais rica. Aracati e Icó tinham mais comércio. Como essa vila de areia virou a capital de fato?</p>

<h4>Um retrato</h4>
<p>No fim do século XVIII, Fortaleza tinha poucas ruas de areia, casas térreas, a fortaleza, a igreja matriz e algumas outras igrejas, como a do Rosário, ligada à irmandade dos pretos. O porto era ruim, sem abrigo natural, e os navios fundeavam longe da praia <span class="tag forte">forte</span>. O governador Bernardo Manuel de Vasconcelos chamou a vila de “um montão de areia”.</p>

<h4>O que a autonomia mudou</h4>
<p>Com governador próprio e Junta da Fazenda, Fortaleza passou a concentrar a administração, as tropas e a arrecadação. Os governadores seguintes investiram em obras e planos. No início do século XIX, o engenheiro Antônio José da Silva Paulet desenhou um plano para a vila, com ruas em traçado regular, e uma carta da capitania <span class="tag forte">forte</span>.</p>

<h4>De vila a cidade</h4>
<p>Em <b>17 de março de 1823</b>, já no Brasil independente, Fortaleza foi elevada à categoria de cidade <span class="tag forte">forte</span>. Mas sua grande transformação viria depois, com o algodão, a ferrovia de Baturité e o porto, na segunda metade do século XIX.</p>

<div class="box conexao"><p>A Trilha 2, no módulo “Fortaleza no século XIX”, retoma essa história, com o plano de Adolfo Herbster e o traçado em xadrez que ainda organiza o centro da cidade.</p></div>

<div class="box hoje"><p>O traçado regular das ruas do centro de Fortaleza tem origem nos planos do início do século XIX. A Igreja do Rosário, no centro, é uma das mais antigas da cidade.</p></div>
`,
quiz:[
 {q:'Como era Fortaleza no fim do século XVIII?',
  o:['A cidade mais rica do Nordeste','Uma vila pequena, de ruas de areia, com porto ruim','Uma cidade industrial','Uma aldeia indígena sem portugueses'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'O que a autonomia de 1799 trouxe para Fortaleza?',
  o:['Nada','A concentração da administração, das tropas e da arrecadação','A ferrovia','A universidade'],c:1,
  e:['Trouxe mudanças.','Correto.','É posterior.','Muito posterior.']},
 {q:'Quem desenhou um plano urbano para Fortaleza no início do século XIX?',
  o:['Matias Beck','Silva Paulet','Adolfo Herbster','José de Alencar'],c:1,
  e:['Não.','Correto.','Herbster é da segunda metade do século XIX.','Não.']},
 {q:'Quando Fortaleza foi elevada a cidade?',
  o:['1726','1799','1823','1889'],c:2,
  e:['Vila.','Autonomia da capitania.','Correto.','Não.']},

  e:['Não.','Correto.','Não.','Muito posterior.']}
],
exercicio:`<p><b>Antes e depois.</b> Procure a planta de Fortaleza de Silva Paulet (1818) e um mapa atual do centro. Identifique três ruas ou lugares que existem nos dois. Escreva o que mudou e o que permaneceu.</p>`,
fontes:`<ul>
<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/politica/2023/03/17/ha-200-anos-fortaleza-era-transformada-de-vila-em-cidade.html','Há 200 anos Fortaleza era transformada de vila em cidade')} (2023).</li>
<li>O Povo, ${lnk('https://mais.opovo.com.br/reportagens-especiais/fortaleza-300-anos-biografia-rupturas/2026/05/01/terceira-ruptura-a-ficcao-geopolitica-de-manuel-frances.html','Terceira ruptura')} (2026).</li>
</ul>`

aula('t1-a31',{
objetivo:`<p>Ao final, você vai entender como os indígenas foram escravizados no Ceará colonial, as formas legais e ilegais dessa escravização e as leis que tentaram limitá-la, como a de 1755.</p>`,
explicacao:`
<h4>O porquê: a primeira escravidão do Ceará</h4>
<p>Antes de chegarem os primeiros africanos escravizados em número significativo, a mão de obra escravizada do Ceará era indígena. Você já viu Pero Coelho escravizando Tabajara e os terços paulistas capturando cativos na Guerra dos Bárbaros. Esta aula organiza esse tema.</p>

<h4>As formas de escravização</h4>
<ul>
<li><b>Guerra justa</b>: cativos de guerras declaradas legítimas podiam ser escravizados.</li>
<li><b>Resgate</b>: indígenas prisioneiros de outros grupos podiam ser “resgatados” (comprados) e escravizados por um período, supostamente para salvá-los da morte.</li>
<li><b>Ilegalidade pura</b>: captura de grupos em paz, como os Paiacu aldeados em 1699, disfarçada de guerra justa.</li>
</ul>
<p>Os cativos eram vendidos para fazendas do Ceará, de Pernambuco e da Bahia, ou usados como trabalhadores nas próprias fazendas dos captores <span class="tag forte">forte</span>.</p>

<h4>A legislação</h4>
<p>As leis portuguesas sobre a liberdade indígena mudaram muitas vezes, ora proibindo, ora permitindo exceções. Em <b>1755</b>, uma lei do governo de Pombal declarou a liberdade dos indígenas, e o Diretório (1757) organizou as vilas de índios <span class="tag consenso">consenso</span>. Na prática, formas de trabalho compulsório continuaram, e a escravização ilegal persistiu em áreas de fronteira.</p>

<div class="box conceito"><p>A escravidão indígena não acabou de uma vez: foi sendo substituída por formas de <b>trabalho forçado</b> dentro dos aldeamentos e das vilas de índios, e por relações de dependência nas fazendas. A fronteira entre livre e escravo, para os indígenas, foi muitas vezes difusa.</p></div>

<div class="box hoje"><p>A memória da escravização indígena é pouco lembrada no Ceará. Os povos indígenas atuais têm reivindicado que ela faça parte das narrativas oficiais e escolares sobre a história do estado.</p></div>
`,

 {q:'Que lei de 1755 declarou a liberdade dos indígenas?',

fontes:`<ul>

aula('t1-a32',{
objetivo:`<p>Ao final, você vai saber como chegaram os africanos escravizados ao Ceará, onde trabalhavam, quantos eram em relação à população, e por que a ideia de que “no Ceará não tem negros” é falsa.</p>`,
explicacao:`
<h4>O porquê: desmontar um mito</h4>
<p>A frase “no Ceará não tem negros” circulou por muito tempo. O historiador Eurípedes Funes mostrou que ela tem efeitos graves: apaga a presença africana e afrodescendente na formação do estado <span class="tag forte">forte</span>. Esta aula reúne o que as pesquisas mostram.</p>

<h4>Como chegavam</h4>
<p>Os africanos escravizados não chegavam ao Ceará diretamente da África em navios negreiros, como em Pernambuco ou na Bahia. Vinham, em sua maioria, comprados nos mercados do <b>Recife</b> e de outros portos, por terra ou em barcos de cabotagem <span class="tag forte">forte</span>.</p>

<h4>Onde trabalhavam</h4>
<ul>
<li>Nas <b>fazendas de gado</b>, como vaqueiros, ajudantes e na roça.</li>
<li>Nas <b>oficinas de carne seca</b> do Aracati e do litoral.</li>
<li>No <b>serviço doméstico</b> nas casas de fazendeiros e comerciantes.</li>
<li>Nos <b>engenhos de rapadura</b> do Cariri e nas lavouras das serras.</li>
<li>Como <b>escravos de ganho</b> nas vilas, vendendo produtos ou serviços.</li>
</ul>

<h4>Quantos eram</h4>
<p>A população escravizada do Ceará nunca foi tão grande quanto a das áreas de açúcar. Estima-se que os cativos nunca tenham passado de cerca de 20% da população e, na abolição de 1884, eram menos de 4% <span class="tag forte">forte</span>. Mas a <b>população negra e mestiça</b>, livre e escravizada, era muito maior: em levantamentos de 1804, pretos, mulatos e pardos somavam cerca de 55% da população da capitania <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>É preciso separar duas coisas: o número de <b>escravizados</b> e o número de <b>negros e afrodescendentes</b>. O Ceará teve proporcionalmente poucos escravizados, mas uma grande população negra e parda livre. O mito confunde as duas coisas, como se “negro” fosse sinônimo de “escravo”.</p></div>

<h4>Negros livres e libertos</h4>
<p>Pesquisas sobre o sertão do Acaraú mostram negros livres e libertos que se tornaram proprietários de terras, gado e até de escravizados, os chamados “negros de cabedais” <span class="tag forte">forte</span>. Isso não diminui a violência da escravidão, mas mostra que a sociedade colonial era mais complexa do que a imagem de “só senhores brancos e escravos negros”.</p>

<div class="box hoje"><p>O Ceará tem dezenas de comunidades quilombolas reconhecidas e a maioria da população se declara parda ou preta. A Trilha 4 trata dos quilombos no Ceará de hoje.</p></div>
`,
quiz:[
 {q:'Como chegavam a maior parte dos africanos escravizados ao Ceará?',
  o:['Diretamente da África em navios negreiros','Comprados nos mercados do Recife e de outros portos','Por avião','Vindos do Peru'],c:1,
  e:['Não era a regra no Ceará.','Correto.','Não.','Não.']},
 {q:'Qual destas NÃO era uma atividade de escravizados no Ceará colonial?',
  o:['Fazendas de gado','Oficinas de carne seca','Engenhos de rapadura','Mineração de ouro em larga escala'],c:3,
  e:['Era.','Era.','Era.','Correto: não havia mineração de ouro relevante no Ceará.']},
 {q:'Em 1804, que parte da população era formada por pretos, mulatos e pardos?',
  o:['Cerca de 5%','Cerca de 55%','Cerca de 90%','Nenhuma'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Qual é o erro central do mito “no Ceará não tem negros”?',
  o:['Confundir “negro” com “escravo” e apagar a grande população negra e parda livre','Exagerar o número de indígenas','Esquecer os holandeses','Nenhum, o mito é verdadeiro'],c:0,
  e:['Correto.','Não.','Não.','É falso.']},
 {q:'O que eram os “negros de cabedais”?',
  o:['Escravizados de ganho','Negros livres e libertos que acumularam terras, gado e bens','Soldados','Padres'],c:1,
  e:['Não.','Correto.','Não.','Não.']}
],
exercicio:`<p><b>Dados e mitos.</b> Pesquise no Censo 2022 do IBGE a proporção de pessoas pretas e pardas no Ceará. Compare com os 55% de 1804. Escreva um parágrafo explicando por que o mito “no Ceará não tem negros” não se sustenta.</p>`,
fontes:`<ul>
<li>Eurípedes Funes, ${lnk('https://digibug.ugr.es/bitstream/handle/10481/43051/GA%2032-1-02%20Funes_Ferreira.pdf?sequence=6','artigo sobre negros no Ceará')} (cativos abaixo de 20%; menos de 4% em 1884).</li>
<li>Rosilene Aires e Francisco Amaro Gomes de Alencar, ${lnk('https://periodicos.ufc.br/eu/article/view/89461/243785','O ebó do povo negro nas encruzilhadas sertanejas cearenses')} (UFC, 2022): 55% em 1804.</li>
<li>${lnk('https://repositorio.ufc.br/ri/bitstream/riufc/14819/1/2015_tese_rnrsouza.pdf','Tese sobre negros livres e libertos de cabedais no sertão do Acaraú')} (UFC, 2015).</li>
<li>Jofre Teófilo Vieira, ${lnk('https://antigo.bn.gov.br/sites/default/files/documentos/producao/pesquisa/2014//jofre_teofilo_vieira_trab_revisado_0.pdf','Entre a escravidão e a liberdade: os africanos livres no Ceará')} (Biblioteca Nacional, 2014).</li>
</ul>`
});

aula('t1-a33',{
objetivo:`<p>Ao final, você vai entender como a sociedade colonial classificava as pessoas por cor e origem (branco, pardo, mulato, cabra, caboclo, mameluco), como essas categorias criavam hierarquias e como as pessoas negociavam dentro delas.</p>`,
explicacao:`
<h4>O porquê: as palavras da hierarquia</h4>
<p>Nos documentos coloniais, as pessoas quase sempre aparecem com uma classificação de cor ou origem. Essas palavras não eram neutras: determinavam quem podia ocupar cargos, entrar em irmandades, casar com quem, e como seria tratado pela justiça.</p>

<h4>As categorias</h4>
<div class="scroll"><table class="tbl">
<tr><th>Termo</th><th>Uso aproximado na época</th></tr>
<tr><td>Branco</td><td>Pessoa de origem europeia, ou assim reconhecida</td></tr>
<tr><td>Preto / crioulo</td><td>Africano (preto) ou negro nascido no Brasil (crioulo)</td></tr>
<tr><td>Pardo / mulato</td><td>Pessoa de origem africana e europeia</td></tr>
<tr><td>Cabra</td><td>Termo usado no Nordeste para mestiços, geralmente de origem africana e indígena, muitas vezes pejorativo</td></tr>
<tr><td>Caboclo / mameluco</td><td>Pessoa de origem indígena e europeia, ou indígena “misturado”</td></tr>
</table></div>
<p class="caption">Os sentidos variavam conforme o lugar, a época e quem escrevia.</p>

<div class="box conceito"><p>As categorias de cor eram <b>sociais</b>, não só físicas. Uma mesma pessoa podia ser registrada como “pardo” num documento e “branco” em outro, conforme sua riqueza, sua posição ou quem fazia o registro. Os historiadores chamam isso de <b>mobilidade nas classificações</b> <span class="tag forte">forte</span>.</p></div>

<h4>Hierarquia e negociação</h4>
<p>Cargos de prestígio, ordens religiosas e certas irmandades exigiam “pureza de sangue”, excluindo descendentes de africanos, judeus e indígenas. Mas as pessoas negociavam: pardos formavam suas próprias irmandades, milícias de pardos e pretos tinham oficiais negros, e famílias enriquecidas conseguiam “branquear” sua classificação com o tempo.</p>
<p>As irmandades de Nossa Senhora do Rosário dos Pretos, presentes em várias vilas do Ceará, foram espaços de sociabilidade, ajuda mútua e devoção da população negra, livre e escravizada <span class="tag forte">forte</span>.</p>

<div class="box cuidado"><p>Não use as categorias coloniais como se fossem descrições neutras. Ao citar um documento que chama alguém de “cabra” ou “caboclo”, explique o termo e o contexto. Muitas dessas palavras carregavam desprezo.</p></div>

<div class="box hoje"><p>O IBGE usa hoje as categorias branca, preta, parda, amarela e indígena, por autodeclaração. O debate sobre essas categorias, e sobre quem se declara o quê, continua, como você viu na aula sobre os povos indígenas.</p></div>
`,
quiz:[
 {q:'As categorias de cor na colônia eram:',
  o:['Apenas descrições físicas objetivas','Classificações sociais, que podiam mudar conforme riqueza, posição e quem registrava','Proibidas','Iguais às do IBGE hoje'],c:1,
  e:['Não eram só físicas.','Correto.','Eram usadas em toda parte.','Eram diferentes.']},
 {q:'O que era a exigência de “pureza de sangue”?',
  o:['Um exame médico','Uma regra que excluía descendentes de africanos, judeus e indígenas de cargos e instituições de prestígio','Uma regra de alimentação','Uma lei indígena'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'O que eram as irmandades do Rosário dos Pretos?',

aula('t1-a34',{
objetivo:`<p>Ao final, você vai saber que tipos de fontes existem sobre o Ceará colonial, onde estão guardadas, e quais vozes estão ausentes ou quase ausentes nesses documentos.</p>`,
explicacao:`
<h4>O porquê: não há história sem fontes</h4>
<p>Tudo o que você estudou nesta trilha vem de algum lugar: uma carta, um mapa, um pedido de terra, uma escavação. Saber de onde vêm as informações é o que separa a história do palpite.</p>

<h4>Os principais tipos de fontes</h4>
<ul>
<li><b>Documentos administrativos</b>: cartas de capitães-mores e governadores, ordens régias, consultas do Conselho Ultramarino. Muitos estão no Arquivo Histórico Ultramarino, em Lisboa, e foram digitalizados pelo Projeto Resgate.</li>
<li><b>Cartas de sesmaria</b>: pedidos e concessões de terra, hoje em bancos de dados como a plataforma SILB.</li>
<li><b>Registros paroquiais</b>: batismos, casamentos e óbitos, guardados pelas dioceses e em parte digitalizados.</li>
<li><b>Inventários e testamentos</b>: listas de bens de quem morria, no Arquivo Público do Estado do Ceará e em cartórios.</li>
<li><b>Relatos de missionários e viajantes</b>: como a <i>Relação</i> de Luís Figueira e o diário de Matias Beck.</li>
<li><b>Mapas e plantas</b>: como as de Manuel Francês e Silva Paulet.</li>
<li><b>Vestígios arqueológicos</b>: sítios indígenas, ruínas de fortes e casas.</li>
</ul>

<div class="box conceito"><p>Toda fonte tem um <b>autor</b>, um <b>objetivo</b> e um <b>público</b>. Uma carta de capitão-mor pedindo soldados tende a exagerar os perigos; um pedido de sesmaria tende a exagerar os serviços prestados; um relato missionário tende a valorizar as conversões. Ler uma fonte é perguntar sempre: quem escreveu, para quem e para quê?</p></div>

<h4>As vozes ausentes</h4>
<p>Quase todas essas fontes foram produzidas por homens portugueses ou luso-brasileiros, letrados, ligados ao poder. Os indígenas, os africanos e seus descendentes, as mulheres e os pobres aparecem, mas quase sempre pela voz de outros. Uma das tarefas da pesquisa atual é procurar essas vozes nas brechas: depoimentos em processos, petições de câmaras indígenas, memória oral, arqueologia <span class="tag consenso">consenso metodológico</span>.</p>

<div class="box hoje"><p>O Arquivo Público do Estado do Ceará, o Instituto do Ceará e o Núcleo de Documentação Cultural da UFC são lugares onde você pode consultar documentos. Muitos já estão online.</p></div>
`,

aula('t1-a35',{
objetivo:`<p>Ao final, você vai conhecer os historiadores que construíram a narrativa tradicional da história do Ceará, como Capistrano de Abreu, o Barão de Studart e Raimundo Girão, e o papel do Instituto do Ceará.</p>`,
explicacao:`
<h4>O porquê: a história da história</h4>
<p>As datas, os heróis e os marcos que você encontra nos livros didáticos foram escolhidos por historiadores de outras épocas. Conhecê-los ajuda a entender por que certas coisas foram lembradas e outras esquecidas.</p>

<h4>Capistrano de Abreu (1853–1927)</h4>
<p>Nascido em Maranguape, Capistrano de Abreu é considerado um dos maiores historiadores brasileiros. Em <i>Capítulos de História Colonial</i> (1907), deu ao sertão e ao gado um lugar central na formação do Brasil, numa época em que se olhava quase só para o litoral e o açúcar. Também estudou línguas indígenas. Sua obra influenciou gerações <span class="tag consenso">consenso</span>.</p>

<h4>O Instituto do Ceará (1887)</h4>
<p>Fundado em 1887, o Instituto do Ceará reuniu intelectuais dedicados à história, à geografia e à antropologia do estado. Sua revista, publicada desde então, é uma das fontes mais importantes para quem estuda o Ceará: publicou documentos, traduções (como do diário de Matias Beck) e estudos <span class="tag consenso">consenso</span>.</p>

<h4>O Barão de Studart (1856–1938)</h4>
<p>Guilherme Studart, médico e historiador, foi um grande colecionador e editor de documentos. Obras como <i>Datas e Factos para a História do Ceará</i> e as coletâneas de documentos sobre Martim Soares Moreno tornaram acessíveis fontes que estavam espalhadas em arquivos. Ele também organizou as comemorações do Tricentenário, em 1903, que celebraram Pero Coelho <span class="tag forte">forte</span>.</p>

<h4>Raimundo Girão</h4>
<p>Raimundo Girão escreveu a <i>Pequena História do Ceará</i> (1953), a síntese mais lida por décadas, além de estudos sobre Fortaleza e a economia cearense. Sua obra organizou a narrativa tradicional, com marcos como 1603, 1612, 1726 e 1799.</p>

<div class="box conceito"><p>A historiografia tradicional fez um trabalho enorme de reunir fontes e organizar datas. Mas tinha limites de seu tempo: tratava os indígenas como “obstáculo” ou como povo “extinto”, quase não falava dos africanos e das mulheres, e celebrava conquistadores como fundadores. A próxima aula mostra como isso mudou.</p></div>

<div class="box hoje"><p>O Instituto do Ceará continua funcionando, e sua revista está digitalizada no site da instituição, com acesso gratuito a mais de um século de publicações.</p></div>
`,
quiz:[
 {q:'Qual foi uma contribuição central de Capistrano de Abreu?',
  o:['Escrever Iracema','Dar ao sertão e ao gado lugar central na formação do Brasil','Fundar Fortaleza','Descobrir a prata do Ceará'],c:1,
  e:['Foi José de Alencar.','Correto.','Não.','Não.']},
 {q:'Quando foi fundado o Instituto do Ceará?',
  o:['1799','1887','1930','1964'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Qual foi o grande trabalho do Barão de Studart?',
  o:['Reunir e publicar documentos sobre a história do Ceará','Comandar tropas','Escrever romances','Fundar o Crato'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Qual destes é um limite da historiografia tradicional?',
  o:['Reunir muitas fontes','Tratar os indígenas como obstáculo ou extintos e celebrar conquistadores','Organizar datas','Escrever em português'],c:1,
  e:['É qualidade.','Correto.','É qualidade.','Não é limite.']},
 {q:'A Pequena História do Ceará é de:',
  o:['Capistrano de Abreu','Raimundo Girão','José de Alencar','Rachel de Queiroz'],c:1,
  e:['Não.','Correto.','Não.','Não.']}
],
exercicio:`<p><b>Ler um clássico.</b> Leia um trecho do capítulo sobre o sertão em <i>Capítulos de História Colonial</i> (Domínio Público). Anote duas ideias que continuam válidas e uma que hoje seria criticada.</p>`,
fontes:`<ul>
<li>Capistrano de Abreu, <i>Capítulos de História Colonial</i> (1907).</li>
<li>${lnk('https://www.uece.br/eventos/semanadehistoriadafeclesc/anais/trabalhos_completos/245-18839-29052016-140628.pdf','Trabalho sobre o Tricentenário de 1903')} (UECE, 2016).</li>
<li>Instituto do Ceará, ${lnk('https://www.institutodoceara.org.br','site e revista')}.</li>
</ul>`

aula('t1-a36',{
objetivo:`<p>Ao final, você vai conhecer as principais renovações da pesquisa sobre o Ceará colonial nas últimas décadas: a nova história indígena, a história da escravidão e da população negra, a história ambiental e a crítica às “fundações”.</p>`,
explicacao:`
<h4>O porquê: a história continua sendo escrita</h4>
<p>Muito do que você aprendeu nesta trilha não estava nos livros didáticos de trinta anos atrás. Novas perguntas, novas fontes e novos pesquisadores mudaram a forma de contar a história do Ceará.</p>

<h4>A nova história indígena</h4>
<p>A partir dos anos 1990, trabalhos como os de Pedro Puntoni, Manuela Carneiro da Cunha, João Pacheco de Oliveira e muitos pesquisadores das universidades cearenses passaram a ver os indígenas como sujeitos da história: com política própria, estratégias e continuidade até hoje. O conceito de “extinção” foi substituído pelo de apagamento, e a ressurgência dos povos indígenas do Nordeste virou tema de pesquisa <span class="tag consenso">consenso</span>.</p>

<h4>Escravidão e população negra</h4>
<p>Pesquisas de Eurípedes Funes, Pedro Alberto de Oliveira Silva e de uma nova geração da UFC, UECE e UVA mostraram a presença negra no Ceará, desmontando o mito de que “aqui não tem negros” e revelando trajetórias de escravizados, libertos e negros livres <span class="tag consenso">consenso</span>.</p>

<h4>História ambiental</h4>
<p>As secas passaram a ser estudadas não só como fatalidade natural, mas como fenômenos em que clima, sociedade e política se cruzam. A história ambiental também estuda a transformação da caatinga, dos rios e do litoral pela ocupação humana <span class="tag forte">forte</span>.</p>

<h4>A crítica às “fundações”</h4>
<p>Historiadores atuais questionam a busca por um “fundador” e um “dia zero” para o Ceará ou para Fortaleza, como você viu nas aulas sobre Martim Soares Moreno e Matias Beck. A preferência é por entender processos longos, com muitos atores.</p>

<div class="box conceito"><p>O livro <i>Uma Nova História do Ceará</i> (2000), organizado por Simone de Souza, é um marco dessa renovação: reuniu pesquisadores que reviram a narrativa tradicional com novos temas e novas fontes <span class="tag forte">forte</span>.</p></div>

<div class="box cuidado"><p>Renovar não significa jogar fora a historiografia tradicional. Os documentos que Studart reuniu e as datas que Girão organizou continuam úteis. O que muda são as perguntas e o lugar que se dá a cada grupo na história.</p></div>

<div class="box conexao"><p>As Trilhas 2, 3 e 4 usam essa mesma postura: fatos com fonte, debates explicados e espaço para quem quase não aparecia nos livros.</p></div>
`,
quiz:[
 {q:'O que mudou na forma de estudar os indígenas a partir dos anos 1990?',
  o:['Passaram a ser vistos como sujeitos da história, com política própria e continuidade até hoje','Passaram a ser ignorados','Passaram a ser tratados como extintos','Nada mudou'],c:0,
  e:['Correto.','Não.','Foi o contrário.','Mudou muito.']},
 {q:'Que mito as pesquisas sobre escravidão no Ceará desmontaram?',
  o:['Que houve seca','Que “no Ceará não tem negros”','Que houve holandeses','Que Fortaleza existe'],c:1,
  e:['Não.','Correto.','Não.','Não.']},

  o:['Só a quantidade de chuva','O cruzamento entre clima, sociedade e política','Só a fauna','Só os açudes'],c:1,
  e:['Não só.','Correto.','Não só.','Não só.']},
 {q:'Qual livro é um marco da renovação historiográfica do Ceará?',
  o:['Iracema','Uma Nova História do Ceará (2000)','Os Sertões','O Quinze'],c:1,

  e:['Não.','Correto.','Não.','Não.']}
],

<p>Você vai escrever uma <b>resenha crítica de uma fonte colonial</b> sobre o Ceará.</p>

<li><b>Escolha a fonte</b>: um documento do Projeto Resgate, uma carta de sesmaria, um trecho da <i>Relação</i> de Luís Figueira, do diário de Matias Beck, de um relatório de governador, ou outra fonte primária.</li>

<li><b>Análise</b>: o que o documento diz; o que ele quer; o que ele esconde ou não diz; que vozes estão ausentes.</li>
<li><b>Cruzamento</b>: compare com pelo menos uma outra fonte ou estudo sobre o mesmo tema.</li>
<li><b>Conclusão</b>: o que essa fonte permite afirmar com segurança, e o que não permite.</li>
</ol>

aula('t2-a1',{
objetivo:`<p>Ao final, você vai entender o que foi a Revolução Pernambucana de 1817, como ela chegou ao Crato e por que a república cratense durou apenas oito dias.</p>`,
explicacao:`
<h4>O porquê: o primeiro grito republicano no Ceará</h4>
<p>Mais de setenta anos antes da Proclamação da República, o Crato declarou-se livre de Portugal. O episódio foi curto, mas abriu um ciclo de lutas que atravessa a Independência e a Confederação do Equador.</p>

<h4>A Revolução Pernambucana</h4>
<p>Em março de 1817, uma revolta no Recife derrubou o governador e instalou um governo provisório republicano. Os motivos incluíam a carga de impostos para sustentar a corte portuguesa, que estava no Rio de Janeiro desde 1808, a crise do açúcar e do algodão, e a influência de ideias liberais e iluministas, difundidas entre outros pelo Seminário de Olinda <span class="tag consenso">consenso</span>. O governo revolucionário enviou emissários às capitanias vizinhas.</p>

<h4>O Crato, 3 de maio de 1817</h4>
<p>O emissário enviado ao Cariri foi <b>José Martiniano de Alencar</b>, seminarista de Olinda, nascido no Crato (no povoado de Barbalha) em 1794. Em 3 de maio de 1817, depois da missa na matriz do Crato, ele subiu ao púlpito e proclamou a independência e a república. Contou com o apoio da mãe, <b>Bárbara de Alencar</b>, do irmão <b>Tristão Gonçalves</b> e do vigário local. Dois dias depois, seguiu para a vila de Jardim para espalhar o movimento <span class="tag forte">forte</span>.</p>

<h4>Oito dias</h4>
<p>A reação foi rápida. Proprietários fiéis à Coroa, como o capitão-mor Leandro Bezerra Monteiro e José Pereira Filgueiras, reuniram forças e, em 11 de maio, o movimento foi desfeito, aparentemente sem combate significativo <span class="tag forte">forte</span>. Os líderes foram presos. Em Pernambuco, a revolução também foi esmagada pelas tropas do rei poucas semanas depois.</p>

<div class="box conceito"><p>A república do Crato não foi um levante popular de massa. Foi um movimento de uma parte da elite local, ligada aos Alencar, com ideias liberais e interesses próprios, em disputa com outras famílias poderosas que ficaram ao lado do rei. Entender as revoltas do século XIX exige olhar para essas <b>rivalidades entre famílias</b>, além das ideias.</p></div>

<div class="box cuidado"><p>Há fontes que dizem que o movimento foi derrotado por Leandro Bezerra Monteiro, e outras que destacam José Pereira Filgueiras. Ambos aparecem na repressão. Curiosamente, Filgueiras mudaria de lado depois e lutaria ao lado dos Alencar na Independência e em 1824. As lealdades eram fluidas.</p></div>

<div class="box hoje"><p>O Crato tinha uma Praça 3 de Maio em homenagem aos republicanos de 1817; ela foi rebatizada, e o povo a chama de Praça de São Vicente. A memória de 1817 continua disputada.</p></div>
`,

aula('t2-a2',{
objetivo:`<p>Ao final, você vai conhecer a trajetória de Bárbara de Alencar e de sua família, entender por que ela é chamada de primeira presa política do Brasil e refletir sobre como sua memória foi construída.</p>`,
explicacao:`
<h4>O porquê: uma mulher no centro da política</h4>
<p>Num tempo em que as mulheres eram excluídas da vida pública, Bárbara de Alencar foi presa por razões políticas e se tornou símbolo. Sua história também mostra o peso das famílias na política cearense.</p>

<h4>Quem foi</h4>
<p>Bárbara Pereira de Alencar nasceu em Pernambuco, em 1760, e viveu no Cariri cearense. Viúva cedo, administrou propriedades e mandou os filhos estudarem no Seminário de Olinda, onde entraram em contato com as ideias liberais. Era mãe de José Martiniano e Tristão Gonçalves e avó do escritor José de Alencar <span class="tag forte">forte</span>.</p>

<h4>A prisão</h4>
<p>Depois da derrota de 1817, Bárbara foi presa, aos 57 anos, com os filhos. Ficou presa em Fortaleza, numa cela da antiga fortaleza, depois no Recife e em Salvador. Ao todo, passou cerca de três anos presa, até a anistia de 1821 <span class="tag forte">forte</span>. Por isso é frequentemente chamada de <b>primeira presa política do Brasil</b>.</p>

<div class="box cuidado"><p>O título de “primeira presa política do Brasil” é muito repetido, mas difícil de provar: outras mulheres podem ter sido presas por motivos políticos antes, sem registro conhecido. O que se pode dizer com segurança é que ela é um dos primeiros e mais importantes casos documentados <span class="tag hipotese">título debatido</span>. Pesquisadores também falam da “invenção” de Bárbara de Alencar: a construção de sua imagem heroica ao longo do século XX.</p></div>

<h4>A família Alencar</h4>
<p>Os Alencar estiveram em quase todos os grandes acontecimentos políticos do Ceará do século XIX:</p>
<ul>
<li><b>José Martiniano de Alencar</b> (1794–1860): padre, deputado, senador e presidente da província do Ceará; pai do escritor José de Alencar.</li>
<li><b>Tristão Gonçalves de Alencar Araripe</b>: líder da Confederação do Equador no Ceará, morto em 1824.</li>
<li><b>José de Alencar</b> (1829–1877): romancista, autor de <i>Iracema</i> e <i>O Guarani</i>.</li>
</ul>

<div class="box hoje"><p>Bárbara de Alencar inspirou a canção “Passeio Público”, de Ednardo, e dá nome a ruas, escolas e ao Centro Administrativo do Governo do Ceará.</p></div>
`,
quiz:[
 {q:'Bárbara de Alencar era avó de qual escritor?',
  o:['Rachel de Queiroz','José de Alencar','Rodolfo Teófilo','Capistrano de Abreu'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Por quanto tempo, aproximadamente, Bárbara ficou presa?',
  o:['Oito dias','Cerca de três anos','Vinte anos','Não foi presa'],c:1,
  e:['Foi o tempo da república do Crato.','Correto.','Não.','Foi presa.']},
 {q:'Onde Bárbara estudou os filhos que trouxeram as ideias liberais?',
  o:['Em Coimbra','No Seminário de Olinda','Em Paris','No Rio de Janeiro'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Sobre o título de “primeira presa política do Brasil”, o mais correto é:',
  o:['É comprovado sem dúvida','É muito repetido, mas difícil de provar; ela é um dos primeiros casos documentados','É falso porque ela não foi presa','Foi dado pelo rei'],c:1,
  e:['Não há como provar que ninguém foi antes.','Correto.','Foi presa.','Não.']},
 {q:'Tristão Gonçalves foi:',
  o:['Líder da Confederação do Equador no Ceará','Governador holandês','Abolicionista de 1884','Romancista'],c:0,
  e:['Correto.','Não.','Não.','Não.']}
],
exercicio:`<p><b>Heroína construída.</b> Pesquise como Bárbara de Alencar aparece hoje (nomes de ruas, monumentos, canções, livros). Escreva um parágrafo sobre o que é fato documentado e o que é construção da memória.</p>`,
fontes:`<ul>
<li>O Povo, ${lnk('https://www.opovo.com.br/vidaearte/2023/04/25/barbara-de-alencar-conheca-a-primeira-presa-politica-brasileira.html','Bárbara de Alencar: conheça a primeira presa política brasileira')} (2023).</li>
<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/vidaearte/2019/05/02/historias-de-dona-barbara.html','Histórias de Dona Bárbara')} (2019).</li>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/politica/o-protagonismo-historico-de-barbara-de-alencar-no-ceara-1.2072237','O protagonismo histórico de Bárbara de Alencar no Ceará')}.</li>
<li>${lnk('https://www.sescsp.org.br/wp-content/uploads/2022/12/CPF15_dossie6.pdf','Bárbara de Alencar e a violência política de gênero')} (Sesc SP, 2022).</li>
</ul>`
});

aula('t2-a3',{
objetivo:`<p>Ao final, você vai entender como foi a repressão a 1817, o que aconteceu com os presos e como a memória da revolução foi lembrada e esquecida ao longo do tempo.</p>`,
explicacao:`
<h4>O porquê: o que fica depois da derrota</h4>
<p>Revoltas derrotadas costumam ser apagadas pelos vencedores. Mas 1817 deixou marcas: presos, perseguidos, e uma geração que voltaria à luta poucos anos depois.</p>

<h4>A repressão</h4>
<p>Em Pernambuco, líderes da revolução foram executados. No Ceará, os Alencar e outros participantes foram presos e levados a Fortaleza, ao Recife e à Bahia, onde ficaram em prisões precárias. Bens foram confiscados <span class="tag forte">forte</span>. Em 1821, com a Revolução do Porto em Portugal e as mudanças políticas que ela trouxe, os presos foram anistiados.</p>

<h4>Da prisão à Independência</h4>
<p>Os anistiados voltaram à política quase imediatamente. José Martiniano de Alencar foi eleito deputado às Cortes de Lisboa em 1821. Tristão Gonçalves e o próprio José Pereira Filgueiras, que antes tinha ajudado a derrotar 1817, lutaram juntos nas guerras da Independência no Piauí e no Maranhão, em 1822–1823 <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>A sequência 1817, 1822 e 1824 forma um <b>ciclo</b>: as mesmas pessoas, as mesmas famílias e as mesmas ideias aparecem em todos os três momentos. Entender 1817 é preparar o terreno para a Confederação do Equador.</p></div>

<h4>Memória</h4>
<p>Durante o Império, 1817 foi lembrado com cuidado, porque era uma revolta republicana contra a monarquia. Com a República, em 1889, os revolucionários foram resgatados como precursores. Em 2017, no bicentenário, houve eventos, livros e debates no Crato e em Fortaleza.</p>

<div class="box hoje"><p>A cela onde Bárbara de Alencar teria ficado presa, na antiga fortaleza de Nossa Senhora da Assunção, hoje área da 10ª Região Militar, é mostrada a visitantes em ocasiões especiais.</p></div>
`,
quiz:[
 {q:'O que aconteceu com os presos de 1817 em 1821?',
  o:['Foram executados','Foram anistiados','Foram exilados para a África','Foram nomeados governadores'],c:1,
  e:['Não no Ceará.','Correto.','Não.','Não.']},
 {q:'Para onde José Martiniano de Alencar foi eleito em 1821?',
  o:['Para as Cortes de Lisboa','Para a presidência da República','Para o Senado holandês','Para a câmara do Crato'],c:0,
  e:['Correto.','Não havia república.','Não.','Não.']},
 {q:'O que forma o “ciclo” de lutas do início do século XIX?',
  o:['1817, 1822 e 1824','1612, 1649 e 1726','1877, 1915 e 1932','1964, 1985 e 1988'],c:0,
  e:['Correto.','Não.','São secas.','Não.']},
 {q:'Como 1817 foi lembrado durante o Império?',
  o:['Com muitas festas oficiais','Com cuidado, por ser revolta republicana contra a monarquia','Como feriado nacional','Como vitória do rei'],c:1,
  e:['Não.','Correto.','Não.','Os vencedores celebravam a derrota da revolta.']},
 {q:'José Pereira Filgueiras é exemplo de:',
  o:['Lealdade fixa a um lado','Lealdades fluidas: reprimiu 1817 e depois lutou ao lado dos Alencar','Indígena aldeado','Comerciante holandês'],c:1,
  e:['Não.','Correto.','Não.','Não.']}
],
exercicio:`<p><b>Linha do tempo de uma família.</b> Monte uma linha do tempo da família Alencar de 1760 (nascimento de Bárbara) a 1877 (morte de José de Alencar), com pelo menos oito marcos.</p>`,
fontes:`<ul>
<li>Câmara dos Deputados, ${lnk('https://www2.camara.leg.br/a-camara/conheca/presidentes/old_textobiografia/jose_alencar_pai.html','biografia de José Martiniano de Alencar')}.</li>
<li>Evaldo Cabral de Mello, <i>A Outra Independência</i> (2004).</li>
<li>${lnk('https://www.revista.ueg.br/index.php/revistahistoria/article/download/9153/7033/35507','Artigo sobre José Martiniano de Alencar e o levante de 1817')} (Revista de História da UEG).</li>
</ul>`
});

aula('t2-a4',{
objetivo:`<p>Ao final, você vai entender a situação política do Ceará entre 1821 e 1823, dividido entre as Cortes de Lisboa e o governo de D. Pedro no Rio de Janeiro.</p>`,
explicacao:`
<h4>O porquê: escolher um lado</h4>
<p>Em 1821, Portugal exigia a volta do rei D. João VI e queria reduzir a autonomia do Brasil. Ao mesmo tempo, o príncipe D. Pedro ficava no Rio. As províncias tiveram de escolher: obedecer a Lisboa ou ao Rio? No Ceará, a escolha foi disputada.</p>

<h4>As Cortes e as juntas</h4>
<p>A Revolução do Porto (1820) criou em Portugal as <b>Cortes</b>, uma assembleia constituinte. As províncias do Brasil elegeram deputados e formaram <b>juntas de governo</b> locais. No Ceará, José Martiniano de Alencar foi um dos deputados enviados a Lisboa <span class="tag forte">forte</span>.</p>
<p>Com o tempo, ficou claro que as Cortes queriam recolonizar o Brasil, devolvendo o poder a Lisboa. Isso empurrou muitos grupos para o lado de D. Pedro, que proclamou a Independência em 7 de setembro de 1822 <span class="tag consenso">consenso</span>.</p>

<h4>O Ceará adere</h4>
<p>A adesão do Ceará ao Império de D. Pedro não foi automática. Houve disputas entre grupos ligados a Portugal, sobretudo comerciantes e militares portugueses, e grupos “brasileiros”, como os Alencar e Filgueiras. No fim de 1822 e começo de 1823, o Ceará aderiu à Independência, e o interior, com tropas do Cariri e do Icó, teve papel decisivo <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>A palavra “brasileiro”, em 1822, não tinha o sentido de hoje. Muitos nascidos no Brasil se viam como portugueses da América. A identidade nacional brasileira foi se formando justamente nessas lutas, e não estava pronta antes delas.</p></div>

<div class="box hoje"><p>Em 17 de março de 1823, Fortaleza foi elevada a cidade, já no Brasil independente. A coincidência com o fim das lutas da Independência no Norte não é por acaso: o novo Império reorganizava a administração.</p></div>
`,
quiz:[
 {q:'O que eram as Cortes de Lisboa?',
  o:['Um tribunal holandês','Uma assembleia constituinte criada em Portugal pela Revolução do Porto','A corte de D. Pedro','Um seminário'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Por que muitos grupos no Brasil passaram para o lado de D. Pedro?',
  o:['Porque as Cortes queriam recolonizar o Brasil','Porque D. Pedro prometeu abolir a escravidão','Porque Lisboa ofereceu terras','Porque o papa mandou'],c:0,
  e:['Correto.','Não prometeu.','Não.','Não.']},
 {q:'Quem resistia à adesão ao Império no Ceará?',
  o:['Indígenas aldeados apenas','Sobretudo comerciantes e militares ligados a Portugal','Os Alencar','Os jangadeiros'],c:1,
  e:['Não é a resposta principal.','Correto.','Os Alencar apoiaram a Independência.','Não.']},
 {q:'Em 1822, ser “brasileiro”:',
  o:['Já tinha o sentido nacional de hoje','Ainda estava em formação; muitos se viam como portugueses da América','Era proibido','Significava ser indígena'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Quando Fortaleza foi elevada a cidade?',
  o:['1799','1823','1889','1726'],c:1,
  e:['Não.','Correto.','Não.','Foi elevada a vila.']}
],

fontes:`<ul>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/ceara/nordeste-independente-ha-200-anos-ceara-lutava-pela-emancipacao-do-dominio-portugues-1.3553460','Nordeste independente: há 200 anos o Ceará lutava pela emancipação')}.</li>
<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/politica/2023/03/17/ha-200-anos-fortaleza-era-transformada-de-vila-em-cidade.html','Há 200 anos Fortaleza era transformada de vila em cidade')} (2023).</li>
</ul>`

aula('t2-a5',{
objetivo:`<p>Ao final, você vai conhecer a participação de tropas cearenses nas guerras da Independência no Piauí e no Maranhão, incluindo a Batalha do Jenipapo, e entender quem eram os combatentes.</p>`,
explicacao:`
<h4>O porquê: a Independência teve guerra</h4>
<p>No Piauí, no Maranhão, no Pará e na Bahia, tropas fiéis a Portugal resistiram à Independência. Foi preciso lutar. O Ceará, vizinho do Piauí, mandou homens para essa guerra.</p>

<h4>A campanha do Piauí</h4>
<p>No Piauí, o comandante português João José da Cunha Fidié tentou manter a província ao lado de Lisboa. Forças do Piauí, do Ceará e de outras províncias se mobilizaram contra ele. Em 13 de março de 1823, na <b>Batalha do Jenipapo</b>, perto de Campo Maior, no Piauí, uma tropa improvisada de sertanejos, muitos deles vaqueiros e lavradores, enfrentou as forças de Fidié. Os independentistas tiveram muitas baixas, mas a batalha enfraqueceu o comandante português, que acabou se rendendo no Maranhão <span class="tag forte">forte</span>.</p>

<h4>Os cearenses na guerra</h4>
<p>Tropas cearenses lideradas por José Pereira Filgueiras e Tristão Gonçalves marcharam para o Piauí e o Maranhão em 1823 <span class="tag forte">forte</span>. Entre os combatentes havia proprietários, vaqueiros, indígenas das antigas vilas e homens pobres recrutados à força. Pesquisas recentes mostram a participação indígena nesses conflitos, com expectativas próprias, como a defesa das terras das vilas <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Os soldados pobres e indígenas das guerras da Independência raramente aparecem nos livros. Mas foram eles que morreram em maior número. A história “de cima”, dos comandantes, precisa ser completada pela história “de baixo”, dos combatentes anônimos.</p></div>

<div class="box hoje"><p>O Monumento aos Heróis do Jenipapo, em Campo Maior (PI), homenageia os combatentes. No Ceará, a participação cearense é menos lembrada, mas está nos documentos e nas pesquisas recentes.</p></div>
`,
quiz:[
 {q:'Onde ocorreu a Batalha do Jenipapo?',
  o:['No Crato','Perto de Campo Maior, no Piauí','Em Fortaleza','Em Salvador'],c:1,
  e:['Não.','Correto.','Não.','Não.']},

aula('t2-a6',{
objetivo:`<p>Ao final, você vai saber avaliar quem ganhou e quem perdeu com a Independência no Ceará: proprietários, comerciantes, escravizados, indígenas e pobres livres.</p>`,
explicacao:`
<h4>O porquê: Independência para quem?</h4>
<p>A Independência mudou o país de dono político, mas manteve a monarquia, a escravidão e a grande propriedade. Para entender o que ela significou no Ceará, é preciso perguntar: o que mudou, e para quem?</p>

<h4>Quem ganhou</h4>
<ul>
<li><b>Proprietários e elites locais</b> nascidos no Brasil, que ganharam espaço nos cargos, nas câmaras e na nova Assembleia.</li>
<li><b>Comerciantes</b> que passaram a negociar diretamente com a Inglaterra, sem intermediários portugueses.</li>
</ul>

<h4>Quem perdeu ou não ganhou</h4>
<ul>
<li><b>Comerciantes e militares portugueses</b>, que perderam poder e muitas vezes foram hostilizados.</li>
<li><b>Escravizados</b>: a escravidão continuou, e só terminaria no Ceará em 1884.</li>
<li><b>Indígenas</b>: as vilas de índios continuaram sob pressão, até serem declaradas extintas em 1863.</li>
<li><b>Pobres livres</b>: continuaram sujeitos ao recrutamento forçado, à violência e à falta de terra.</li>
</ul>

<div class="box conceito"><p>A Constituição de 1824, outorgada por D. Pedro I, criou um <b>voto censitário</b>: só podia votar e ser votado quem tinha uma renda mínima. A maior parte da população ficou fora da política formal <span class="tag consenso">consenso</span>. Ela também concentrou poder no imperador, por meio do Poder Moderador, o que foi um dos estopins da Confederação do Equador.</p></div>

<div class="box cuidado"><p>Não é preciso concluir que a Independência “não mudou nada”. Mudou muito para as elites e criou um Estado nacional. O ponto é que essas mudanças não chegaram igualmente a todos.</p></div>
`,
quiz:[
 {q:'O que continuou depois da Independência?',
  o:['A escravidão e a grande propriedade','O domínio português','O Diretório','O governo holandês'],c:0,
  e:['Correto.','Não.','Foi abolido em 1798.','Não.']},
 {q:'O que era o voto censitário?',
  o:['Voto para todos','Voto apenas de quem tinha renda mínima','Voto das mulheres','Voto secreto universal'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Quem ganhou espaço com a Independência no Ceará?',
  o:['Militares portugueses','Proprietários e elites locais nascidas no Brasil','Escravizados','Indígenas aldeados'],c:1,
  e:['Perderam.','Correto.','Não.','Não.']},
 {q:'O que era o Poder Moderador?',
  o:['Um poder do imperador acima dos outros poderes, criado pela Constituição de 1824','A Assembleia do Ceará','Um tribunal indígena','A Igreja'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Qual conclusão é mais equilibrada sobre a Independência?',
  o:['Não mudou nada','Mudou muito para as elites e criou um Estado nacional, mas as mudanças não chegaram igualmente a todos','Libertou todos','Foi só um acordo de família sem efeitos'],c:1,
  e:['Exagero.','Correto.','Não.','Exagero.']}
],
exercicio:`<p><b>Quadro de ganhos e perdas.</b> Monte uma tabela com cinco grupos sociais do Ceará em 1824 e, para cada um, escreva o que mudou com a Independência.</p>`,
fontes:`<ul>
<li>Lilia Schwarcz e Heloisa Starling, <i>Brasil: uma biografia</i> (2015).</li>
<li>Evaldo Cabral de Mello, <i>A Outra Independência</i> (2004).</li>
</ul>`
});

aula('t2-a7',{
objetivo:`<p>Ao final, você vai entender as causas da Confederação do Equador, por que o Ceará aderiu e como Quixeramobim proclamou uma república em janeiro de 1824.</p>`,
explicacao:`
<h4>O porquê: contra um imperador autoritário</h4>
<p>Em 1823, D. Pedro I fechou a Assembleia Constituinte. Em 1824, impôs uma Constituição que concentrava poder nas suas mãos. Para as elites liberais do Norte, que tinham lutado pela Independência, isso era uma traição.</p>

<h4>As causas</h4>
<ul>
<li><b>Autoritarismo</b>: o fechamento da Constituinte e a Constituição outorgada, com o Poder Moderador.</li>
<li><b>Centralização</b>: o Rio de Janeiro nomeava os presidentes das províncias e concentrava recursos.</li>
<li><b>Impostos</b> e crise econômica no Norte.</li>
<li><b>Federalismo</b>: o desejo de autonomia provincial, herdado de 1817.</li>
</ul>

<h4>Quixeramobim, 9 de janeiro de 1824</h4>
<p>Antes mesmo de Pernambuco proclamar a Confederação, em 9 de janeiro de 1824, na câmara da vila de Campo Maior (hoje Quixeramobim), o padre <b>Gonçalo Inácio de Loiola Albuquerque e Melo</b> declarou decaída a dinastia dos Bragança e proclamou a república <span class="tag forte">forte</span>. Esse padre, nascido em Riacho dos Guimarães (atual Groaíras), adotaria o nome de <b>Padre Mororó</b>, numa moda entre os revolucionários de adotar nomes de plantas e lugares do Brasil como sinal de nacionalismo.</p>

<h4>A Confederação</h4>
<p>Em julho de 1824, Manuel de Carvalho Pais de Andrade proclamou no Recife a <b>Confederação do Equador</b>, convidando as províncias do Norte a formar uma república federativa. O Ceará aderiu. Em agosto, um Grande Conselho em Fortaleza instalou o governo revolucionário, com <b>Tristão Gonçalves</b> na presidência e Padre Mororó como secretário <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>A Confederação do Equador defendia a república e a federação, mas não a abolição da escravidão nem a reforma agrária. Era um movimento das elites liberais, com participação popular, sobretudo de soldados, indígenas e pobres livres, que tinham suas próprias expectativas.</p></div>

<div class="box hoje"><p>Quixeramobim se orgulha de ter sido uma das primeiras vilas do Brasil a proclamar a república, em 1824. Em 2024, o bicentenário foi lembrado com eventos e publicações.</p></div>
`,
quiz:[
 {q:'Qual foi uma causa central da Confederação do Equador?',
  o:['A abolição da escravidão','O autoritarismo de D. Pedro I, com o fechamento da Constituinte e a Constituição outorgada','A invasão holandesa','A seca de 1877'],c:1,
  e:['Não estava no programa.','Correto.','Não.','Posterior.']},
 {q:'Onde e quando uma vila cearense proclamou a república antes da Confederação?',
  o:['Crato, 1817','Campo Maior (Quixeramobim), 9 de janeiro de 1824','Fortaleza, 1889','Icó, 1850'],c:1,
  e:['Foi em outro contexto.','Correto.','Não.','Não.']},
 {q:'Quem presidiu o governo revolucionário no Ceará?',
  o:['Padre Mororó','Tristão Gonçalves','José de Alencar','Pinto Madeira'],c:1,
  e:['Foi secretário.','Correto.','Não.','Foi adversário.']},
 {q:'Por que o padre Gonçalo Inácio adotou o nome Mororó?',
  o:['Por apelido de infância','Por uma moda nacionalista de adotar nomes de plantas e lugares do Brasil','Por ordem do bispo','Porque era indígena'],c:1,
  e:['Não.','Correto. Mororó é uma árvore.','Não.','Não.']},
 {q:'A Confederação do Equador defendia:',
  o:['Monarquia absoluta','República e federação, mas não a abolição','Abolição imediata e reforma agrária','Volta a Portugal'],c:1,

],
exercicio:`<p><b>Nomes da liberdade.</b> Pesquise os nomes nacionalistas adotados por revolucionários de 1817 e 1824 (como Mororó). Liste três e explique o significado de cada um.</p>`,
fontes:`<ul>
<li>O Povo, ${lnk('https://www.opovo.com.br/noticias/politica/2024/01/09/o-dia-em-que-quixeramobim-proclamou-a-republica-200-anos-atras.html','O dia em que Quixeramobim proclamou a república, 200 anos atrás')} (2024).</li>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/ceara/nordeste-independente-ha-200-anos-ceara-lutava-pela-emancipacao-do-dominio-portugues-1.3553460','Nordeste independente')}.</li>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/ceara/de-revolucionario-a-nome-de-rua-quem-foi-padre-mororo-fuzilado-em-praca-do-ceara-ha-quase-200-anos-1.3553783','Quem foi Padre Mororó')}.</li>
</ul>`

aula('t2-a8',{
objetivo:`<p>Ao final, você vai conhecer o governo de Tristão Gonçalves no Ceará confederado, a guerra contra as forças imperiais e a morte de Tristão em outubro de 1824.</p>`,
explicacao:`
<h4>O porquê: 54 dias de república</h4>
<p>No Ceará, a Confederação do Equador durou cerca de 54 dias. Nesse tempo, houve governo, jornal, guerra interna e, por fim, derrota.</p>

<h4>O governo e o jornal</h4>
<p>O governo de Tristão Gonçalves organizou tropas e tentou controlar a província. Em abril de 1824, sob direção do Padre Mororó, saiu o <i>Diário do Governo do Ceará</i>, considerado o primeiro periódico impresso na província <span class="tag forte">forte</span>.</p>

<h4>A guerra civil</h4>
<p>Nem todo o Ceará apoiou a Confederação. Vilas e chefes locais ficaram ao lado do imperador, e houve combates, saques e incêndios de vilas. Ao mesmo tempo, a esquadra imperial comandada pelo almirante inglês Lord Cochrane chegou ao litoral, depois de derrotar os confederados no Recife <span class="tag forte">forte</span>.</p>

<h4>A morte de Tristão</h4>
<p>Cochrane ofereceu anistia a Tristão Gonçalves se ele se rendesse. Tristão recusou. No fim de outubro de 1824, foi morto em combate às margens do rio Jaguaribe, no lugar chamado Santa Rosa <span class="tag forte">forte</span>. Seu substituto, Félix de Azevedo e Sá, passou para o lado imperial e mandou destruir a documentação da Confederação. Por isso, quase não restaram documentos escritos pelos próprios confederados <span class="tag forte">forte</span>.</p>

<div class="box fonte"><p>A destruição dos papéis da Confederação é um exemplo de como o poder decide o que fica para a história. Muito do que sabemos vem dos processos da repressão, isto é, de documentos produzidos pelos vencedores para condenar os vencidos.</p></div>

<div class="box hoje"><p>O monumento a Tristão Gonçalves que existia em Jaguaribara ficou sob as águas quando a cidade antiga foi inundada pelo açude Castanhão. Um cruzamento no centro de Fortaleza reúne as ruas Tristão Gonçalves e José Martiniano de Alencar.</p></div>
`,
quiz:[
 {q:'Quanto tempo durou a Confederação do Equador no Ceará?',
  o:['Cerca de 54 dias','Oito dias','Dois anos','Dez anos'],c:0,
  e:['Correto.','Foi 1817.','Não.','Não.']},
 {q:'Qual foi considerado o primeiro periódico impresso na província?',
  o:['O Libertador','O Diário do Governo do Ceará, dirigido por Padre Mororó','O Povo','A Fortaleza'],c:1,
  e:['É dos anos 1880.','Correto.','É do século XX.','Não.']},
 {q:'Quem comandava a esquadra imperial?',
  o:['Lord Cochrane','Matias Beck','Fidié','Duque de Caxias'],c:0,
  e:['Correto.','Não.','Não.','Não estava ali.']},
 {q:'Onde morreu Tristão Gonçalves?',
  o:['Em Fortaleza, fuzilado','Em combate, às margens do Jaguaribe, em Santa Rosa','No Rio de Janeiro','Em Lisboa'],c:1,
  e:['Foram outros.','Correto.','Não.','Não.']},
 {q:'Por que restaram poucos documentos dos confederados?',
  o:['Porque não sabiam escrever','Porque o substituto de Tristão, ao mudar de lado, mandou destruir a documentação','Por causa de um incêndio natural','Porque foram levados para Portugal'],c:1,
  e:['Sabiam.','Correto.','Não.','Não.']}
],
exercicio:`<p><b>Os papéis queimados.</b> Escreva um parágrafo sobre como a destruição de documentos afeta o que sabemos da Confederação. Que outras fontes um historiador pode usar?</p>`,
fontes:`<ul>
<li>O Povo, ${lnk('https://mais.opovo.com.br/reportagens-especiais/confederacao-do-equador-200-anos/2024/01/11/a-derrota-da-confederacao-e-a-execucao-dos-martires.html','A derrota da Confederação e a execução dos mártires')} (2024).</li>
<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/politica/2024/01/10/os-200-anos-da-confederacao-do-equador-que-tentou-fazer-do-nordeste-um-pais-independente.html','Os 200 anos da Confederação do Equador')} (2024).</li>
<li>Inesp/Assembleia Legislativa, ${lnk('https://www.al.ce.gov.br/publicacoes-inesp/downloads/pelo-id/102','publicação do bicentenário')} (2024).</li>
</ul>`
});

aula('t2-a9',{
objetivo:`<p>Ao final, você vai saber como foram os julgamentos e fuzilamentos de 1825 em Fortaleza, quem foram os mártires e como a memória da Confederação foi construída na Praça dos Mártires.</p>`,
explicacao:`
<h4>O porquê: a punição exemplar</h4>
<p>O governo imperial quis dar um exemplo. Em 1825, cinco líderes da Confederação foram executados em Fortaleza. O lugar das execuções virou, décadas depois, um símbolo.</p>

<h4>Os julgamentos</h4>
<p>Uma comissão militar julgou os presos. Em 25 de abril de 1825, Padre Mororó e João de Andrade Pessoa Anta foram condenados à morte na forca. A sentença foi convertida em fuzilamento; segundo a tradição, por falta de quem aceitasse ser carrasco <span class="tag hipotese">motivo debatido</span>.</p>

<h4>Os cinco mártires</h4>
<ul class="tl">
<li><b>30 de abril de 1825</b>Fuzilamento de Padre Mororó e de Pessoa Anta.</li>
<li><b>16 de maio de 1825</b>Fuzilamento de Luiz Inácio de Azevedo, o “Bolão”, preso em Santa Rosa.</li>
<li><b>28 de maio de 1825</b>Fuzilamento de Feliciano José da Silva, o “Carapinima”.</li>
<li><b>1825</b>Fuzilamento de Francisco Ibiapina.</li>
</ul>
<p>Todos foram executados no antigo Campo da Pólvora, em Fortaleza <span class="tag forte">forte</span>.</p>

<h4>A Praça dos Mártires</h4>
<p>Em 11 de janeiro de 1879, a Câmara Municipal de Fortaleza deu ao local o nome de <b>Praça dos Mártires</b>, em homenagem aos executados. Hoje, a praça é mais conhecida como <b>Passeio Público</b>, e é tombada nas esferas municipal, estadual e federal <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Mártires não nascem prontos: são construídos pela memória. Durante o Império, homenagear revolucionários republicanos era delicado. A homenagem de 1879, a dez anos da República, mostra como o clima político tinha mudado.</p></div>

<div class="box hoje"><p>Em 2025, o bicentenário das execuções foi lembrado em Fortaleza, e tramita no Congresso um projeto de lei para criar o Dia Nacional dos Mártires da Confederação do Equador. O baobá do Passeio Público, plantado muito depois, não testemunhou as execuções, mas virou símbolo do lugar.</p></div>
`,
quiz:[
 {q:'Por que a sentença de forca de Mororó foi convertida em fuzilamento?',
  o:['Por pedido do papa','Porque não havia carrasco disposto a executá-la','Porque ele fugiu','Por ordem de Tristão'],c:1,
  e:['Não.','Correto, segundo a tradição; o motivo exato é debatido.','Não fugiu.','Tristão já tinha morrido.']},
 {q:'Onde os mártires foram executados?',
  o:['No Crato','No antigo Campo da Pólvora, em Fortaleza, hoje Passeio Público','No Recife','Em Quixeramobim'],c:1,
  e:['Não.','Correto.','Não.','Não.']},
 {q:'Quando o local recebeu o nome de Praça dos Mártires?',
  o:['1825','1879','1889','1950'],c:1,
  e:['Não.','Correto: 11 de janeiro de 1879.','Não.','Não.']},
 {q:'Qual destes NÃO foi um dos cinco mártires de 1825?',
  o:['Padre Mororó','Pessoa Anta','Carapinima','Tristão Gonçalves'],c:3,
  e:['Foi.','Foi.','Foi.','Correto: Tristão morreu em combate em 1824.']},
 {q:'O que a homenagem de 1879 mostra?',
  o:['Que nada mudou desde 1825','Que o clima político mudou, permitindo homenagear republicanos','Que o imperador ordenou a homenagem','Que a praça foi construída em 1879'],c:1,
  e:['Não.','Correto.','Não.','Não.']}
],
exercicio:`<p><b>Visita à praça.</b> Visite o Passeio Público (ou veja fotos) e procure os marcos aos mártires. Escreva um texto para uma placa explicativa de até 100 palavras.</p>`,
fontes:`<ul>
<li>O Povo, ${lnk('https://mais.opovo.com.br/jornal/politica/2025/05/03/confederacao-do-equador-execucao-dos-martires-no-ceara-completa-200-anos.html','Execução dos mártires no Ceará completa 200 anos')} (2025).</li>
<li>Diário do Nordeste, ${lnk('https://diariodonordeste.verdesmares.com.br/ceara/de-revolucionario-a-nome-de-rua-quem-foi-padre-mororo-fuzilado-em-praca-do-ceara-ha-quase-200-anos-1.3553783','De revolucionário a nome de rua: quem foi Padre Mororó')}.</li>
<li>O Povo, ${lnk('https://www.opovo.com.br/noticias/fortaleza/2025/02/24/passeio-publico-e-tambem-a-praca-dos-martires-voce-sabe-por-que.html','Passeio Público é também a Praça dos Mártires')} (2025).</li>
<li>Senado Federal, ${lnk('https://legis.senado.leg.br/escriba-servicosweb/reuniao/pdf/14561','audiência sobre o PL 3.535/2025')}.</li>
</ul>`

projeto('t2-b',{html:`
<p>Você vai montar um <b>dossiê de fontes sobre um episódio do século XIX</b>: 1817 no Crato, a adesão do Ceará à Independência ou a Confederação do Equador.</p>
<h4>O que entregar</h4>
<ol>
<li><b>Resumo do episódio</b> em uma página.</li>
<li><b>Cinco fontes</b>, de tipos diferentes: um documento de época (se possível), uma reportagem, um artigo acadêmico, um monumento ou lugar de memória, e uma obra artística (canção, romance, filme).</li>

aula('t2-a10',{
objetivo:`<p>Ao final, você vai entender o que foi o período regencial (1831–1840), por que foi tão instável e como o Ceará viveu esses anos.</p>`,
explicacao:`
<h4>O porquê: um país sem imperador adulto</h4>
<p>Em abril de 1831, D. Pedro I abdicou e voltou a Portugal, deixando o filho, D. Pedro II, com cinco anos. Até a maioridade do novo imperador, o país foi governado por regentes. Foram anos de disputa sobre quanto poder as províncias deveriam ter.</p>

<h4>A Regência</h4>
<p>O período regencial (1831–1840) foi marcado por revoltas em várias províncias: a Cabanagem no Pará, a Balaiada no Maranhão, a Sabinada na Bahia, a Farroupilha no Rio Grande do Sul, entre outras. O Ato Adicional de 1834 deu mais autonomia às províncias, criando as <b>Assembleias Legislativas Provinciais</b> <span class="tag consenso">consenso</span>.</p>

<h4>O Ceará na Regência</h4>
<p>No Ceará, a Regência foi um tempo de reorganização das elites. Os liberais ligados aos Alencar ganharam força: José Martiniano de Alencar foi presidente da província entre 1834 e 1837 e promoveu obras e reformas <span class="tag forte">forte</span>. Ao mesmo tempo, grupos fiéis a D. Pedro I e adversários dos liberais resistiram, e a disputa ganhou forma armada no Cariri.</p>

<div class="box conceito"><p>As grandes perguntas da Regência eram: o Brasil deveria ser <b>centralizado</b>, com poder no Rio de Janeiro, ou <b>descentralizado</b>, com mais poder para as províncias? E quem deveria mandar nas províncias? No Ceará, essas perguntas se misturavam com rivalidades antigas entre famílias e vilas.</p></div>

<div class="box hoje"><p>A Assembleia Legislativa do Ceará tem origem na Assembleia Provincial criada pelo Ato Adicional de 1834.</p></div>
`,

aula('t2-a11',{
objetivo:`<p>Ao final, você vai conhecer a revolta de Pinto Madeira (1831–1832): quem era o líder, o que queria, quem eram os combatentes do “exército de cabras” e como terminou.</p>`,
explicacao:`
<h4>O porquê: uma revolta pela volta do imperador</h4>
<p>Nem todas as revoltas do século XIX foram liberais ou republicanas. No Cariri, um chefe local se levantou para defender a volta de D. Pedro I. É a chamada revolta de Pinto Madeira.</p>

<h4>Quem era Pinto Madeira</h4>
<p><b>Joaquim Pinto Madeira</b> (1783–1834) era um proprietário e coronel de milícias da vila do Jardim, no Cariri. Em 1824, ajudou a combater a Confederação do Equador e, como recompensa, foi promovido e nomeado comandante geral das armas do Crato e do Jardim <span class="tag forte">forte</span>. Era, portanto, inimigo dos liberais do Crato, ligados aos Alencar.</p>

<h4>A revolta</h4>
<p>Depois da abdicação de D. Pedro I, Pinto Madeira perdeu poder. No fim de 1831 e em janeiro de 1832, levantou-se em armas, com um grupo de seguidores, defendendo a restauração do ex-imperador. A revolta opôs as vilas do Jardim, de maioria monarquista, e do Crato, de maioria liberal, em combates sangrentos, e alcançou também áreas de Pernambuco <span class="tag forte">forte</span>.</p>
<p>Tropas do governo foram enviadas ao Cariri, e a revolta foi derrotada em 1832. Pinto Madeira se entregou, foi preso e, depois de um processo cercado de irregularidades, foi condenado pelo assassinato de um adversário e fuzilado no Crato em 28 de novembro de 1834 <span class="tag forte">forte</span>.</p>

<div class="box conceito"><p>Os seguidores de Pinto Madeira foram chamados pelos adversários de <b>“exército de cabras”</b>. Pesquisas recentes mostram que “cabra”, termo depreciativo para mestiços pobres, virou ali uma categoria usada pelo governo para classificar e perseguir os rebeldes. É um exemplo de como palavras de cor e classe serviam para controlar populações <span class="tag forte">forte</span>.</p></div>

<div class="box cuidado"><p>É tentador ver Pinto Madeira como “vilão” e os liberais como “heróis”. Os dois lados eram grupos de elite disputando poder, com violência e com seguidores pobres arrastados para o conflito. A revolta também tinha aspectos religiosos e sociais, como mostram estudos sobre o misticismo no movimento.</p></div>
`,

  o:['A república','A volta de D. Pedro I ao trono','A abolição','A independência do Cariri'],c:1,
  e:['Era contra os republicanos.','Correto: era um movimento restauracionista.','Não.','Não.']},
 {q:'Onde ficava a base de Pinto Madeira?',
  o:['Fortaleza','Vila do Jardim, no Cariri','Sobral','Aracati'],c:1,

  o:['Uma tropa de animais','O nome depreciativo dado aos seguidores pobres e mestiços de Pinto Madeira','Um batalhão imperial','Uma tropa indígena aliada dos liberais'],c:1,

],
exercicio:`<p><b>Dois lados de uma revolta.</b> Escreva duas notícias imaginárias sobre a revolta de 1832: uma para um jornal liberal do Crato e outra para um panfleto dos partidários de Pinto Madeira.</p>`,
fontes:`<ul>
<li>Ana Sara Cortez Irffi, ${lnk('https://dialnet.unirioja.es/descarga/articulo/7186262.pdf','Pinto Madeira e seu “exército de cabras”')}.</li>

<li>${lnk('https://repositorio.ufc.br/bitstream/riufc/48860/1/2016_resumo_eve_raaraujo.pdf','Resumo sobre a execução de Pinto Madeira em 1834')} (UFC, 2016).</li>
<li>${lnk('https://historiaehistoriografia.ufc.br/wp-content/uploads/2024/03/Resistencia-e-burocracia-Uma-analise-das-documentacoes-referentes-a-Revolta-do-Pinto-Madeira-Cariri-1831-1832-Leticia-Camurca.pdf','Resistência e burocracia: documentos sobre a revolta de Pinto Madeira')} (UFC).</li>

aula('t2-a12',{
objetivo:`<p>Ao final, você vai entender por que a violência era tão presente na política do sertão no século XIX, como o Estado imperial tentou impor a ordem e o papel do recrutamento forçado.</p>`,
explicacao:`
<h4>O porquê: política com armas</h4>
<p>No sertão do século XIX, eleições, disputas de terra e rixas de família se resolviam muitas vezes à bala. Entender essa violência ajuda a explicar o cangaço e o coronelismo que virão na Trilha 3.</p>

<h4>As raízes da violência</h4>
<ul>
<li><b>Estado distante</b>: juízes, polícia e tropas eram poucos e ficavam nas vilas maiores.</li>
<li><b>Poder privado</b>: grandes proprietários tinham homens armados (capangas, agregados) e usavam a Guarda Nacional como instrumento próprio.</li>
<li><b>Honra e vingança</b>: rixas entre famílias passavam de geração em geração.</li>
<li><b>Disputa por terra e água</b>, agravada nas secas.</li>
</ul>

<h4>A Guarda Nacional</h4>
<p>Criada em 1831, a <b>Guarda Nacional</b> era uma força formada por cidadãos com renda, comandada por oficiais escolhidos entre os proprietários. Na prática, os coronéis da Guarda Nacional eram os chefes políticos locais. Daí vem o título de “coronel” que dará nome ao coronelismo <span class="tag consenso">consenso</span>.</p>

<h4>O recrutamento forçado</h4>
<p>O Exército e a Marinha completavam suas tropas com o recrutamento forçado de homens pobres livres, sem proteção de um patrão. Era uma ameaça constante para os pobres e um instrumento de poder para os chefes locais, que podiam livrar seus protegidos e entregar seus inimigos <span class="tag forte">forte</span>.</p>

<div class="box conexao"><p>Esses elementos (Estado distante, poder privado armado, honra, recrutamento) são o terreno onde nascem o coronelismo e o cangaço, estudados no nível Intermediário da Trilha 3.</p></div>

<div class="box cuidado"><p>Isso não quer dizer que o sertanejo fosse “violento por natureza”. A violência tinha causas sociais e políticas: era o modo de funcionamento de um sistema de poder.</p></div>
`,
quiz:[
 {q:'Qual destas NÃO é raiz da violência política no sertão do século XIX?',
  o:['Estado distante','Poder privado armado','Rixas de família','Excesso de polícia nas vilas'],c:3,
  e:['É.','É.','É.','Correto: o problema era a falta de presença do Estado.']},
 {q:'O que era a Guarda Nacional?',
  o:['Uma força formada por cidadãos com renda, comandada por proprietários','O exército holandês','Uma força indígena','A polícia republicana'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'De onde vem o título de “coronel” dos chefes políticos?',
  o:['Das patentes da Guarda Nacional (e antes das milícias)','Do Exército republicano','De títulos de nobreza','Da Igreja'],c:0,
  e:['Correto.','Não.','Não.','Não.']},
 {q:'Quem era alvo do recrutamento forçado?',
  o:['Filhos de fazendeiros','Homens pobres livres sem proteção de um patrão','Padres','Mulheres'],c:1,
  e:['Eram protegidos.','Correto.','Não.','Não.']},
 {q:'Qual afirmação é mais correta?',
  o:['O sertanejo era violento por natureza','A violência tinha causas sociais e políticas ligadas ao sistema de poder','Não havia violência no sertão','A violência foi trazida pelos holandeses'],c:1,
  e:['É preconceito.','Correto.','Não.','Não.']}
],
exercicio:`<p><b>Raízes do coronelismo.</b> Escreva um parágrafo explicando como a Guarda Nacional e o recrutamento forçado davam poder aos chefes locais.</p>`,
fontes:`<ul>
<li>${lnk('https://historiar.uvanet.br/index.php/1/article/download/215/pdf/701','Artigo sobre famílias senhoriais e partidos no Império')} (Revista Historiar, UVA).</li>
<li>Victor Nunes Leal, <i>Coronelismo, Enxada e Voto</i> (1949).</li>
</ul>`

aula('t2-a13',{
objetivo:`<p>Ao final, você vai saber como funcionavam os partidos liberal e conservador no Ceará do Segundo Reinado e por que as diferenças entre eles eram, muitas vezes, mais de grupo do que de ideias.</p>`,
explicacao:`
<h4>O porquê: dois partidos, muitas famílias</h4>
<p>Uma frase atribuída ao político pernambucano Holanda Cavalcanti dizia que nada se parecia mais com um conservador do que um liberal no poder. A frase é exagerada, mas resume bem a política imperial.</p>

<h4>Os dois partidos</h4>
<p>No plano nacional, os <b>conservadores</b> defendiam a centralização e a ordem; os <b>liberais</b>, mais autonomia provincial e reformas. No Ceará, os dois partidos existiam, mas eram atravessados por divisões internas e alianças familiares. Historiadores falam da “plasticidade” das fronteiras entre eles <span class="tag forte">forte</span>. Nos anos 1830, os grupos tinham apelidos, como “chimangos” e “caranguejos”.</p>

<h4>O sistema de rodízio</h4>
<p>O imperador, com o Poder Moderador, escolhia o gabinete. Quando um partido subia no Rio, o presidente da província era trocado, os cargos eram redistribuídos e as eleições seguintes quase sempre davam vitória ao partido do governo. Esse rodízio era controlado de cima <span class="tag consenso">consenso</span>.</p>

<div class="box conceito"><p>O presidente da província era <b>nomeado</b> pelo governo imperial, e não eleito. Muitos nem eram cearenses e ficavam pouco tempo. O poder real na província dependia de acordos entre esse presidente e as famílias locais.</p></div>

<div class="box hoje"><p>A ideia de que os partidos são parecidos e servem a grupos, e não a programas, é uma crítica comum também hoje. Conhecer o Império ajuda a ver as raízes históricas desse debate.</p></div>
`,
